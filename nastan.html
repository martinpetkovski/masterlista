    <script>
        // ==================== SETTINGS MENU ====================
        (function() {
            const settingsBtn = document.getElementById('settings-btn');
            if (!settingsBtn) return;
            const svcDefs = {
                spotify: { name: 'Spotify', icon: 'fab fa-spotify', color: '#1DB954' },
                youtube: { name: 'YouTube', icon: 'fab fa-youtube', color: '#FF0000' },
                youtubeMusic: { name: 'YouTube Music', icon: 'fab fa-youtube', color: '#FF0000' },
                appleMusic: { name: 'Apple Music', icon: 'fab fa-apple', color: '#fc3c44' },
                deezer: { name: 'Deezer', icon: 'fas fa-headphones', color: '#A238FF' },
                tidal: { name: 'Tidal', icon: 'fas fa-water', color: '#000000' },
                amazonMusic: { name: 'Amazon Music', icon: 'fab fa-amazon', color: '#FF9900' },
                soundcloud: { name: 'SoundCloud', icon: 'fab fa-soundcloud', color: '#ff7700' },
                bandcamp: { name: 'Bandcamp', icon: 'fab fa-bandcamp', color: '#1da0c3' }
            };
            const overlay = document.createElement('div');
            overlay.id = 'settings-overlay';
            overlay.className = 'settings-overlay';
            const currentService = localStorage.getItem('mmm-preferred-service');
            const isDark = document.documentElement.classList.contains('dark-mode');
            overlay.innerHTML = `
                <div class="settings-panel">
                    <h3><i class="fas fa-gear"></i> Поставки</h3>
                    <div class="settings-section">
                        <div class="settings-section-title">Тема</div>
                        <div class="settings-theme-toggle">
                            <button class="settings-theme-btn ${!isDark ? 'active' : ''}" data-theme="light"><i class="fas fa-sun"></i> Светла</button>
                            <button class="settings-theme-btn ${isDark ? 'active' : ''}" data-theme="dark"><i class="fas fa-moon"></i> Темна</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Стриминг сервис</div>
                        <div class="settings-service-options">
                            <button class="settings-service-btn no-pref ${!currentService ? 'active' : ''}" data-service=""><i class="fas fa-question"></i> Секогаш прашувај</button>
                            ${Object.entries(svcDefs).map(([id, svc]) => `<button class="settings-service-btn ${id === currentService ? 'active' : ''}" data-service="${id}" style="--svc-color: ${svc.color}"><i class="${svc.icon}"></i> ${svc.name}</button>`).join('')}
                        </div>
                    </div>
                    <div class="settings-section settings-tour-section">
                        <button class="settings-tour-btn" id="settings-start-tour"><i class="fas fa-route"></i> Тура на сајтот</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('visible'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const ov = document.getElementById('settings-overlay'); if (ov) ov.classList.remove('visible'); } });
            overlay.querySelectorAll('.settings-theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dark = btn.dataset.theme === 'dark';
                    document.body.classList.toggle('dark-mode', dark);
                    document.documentElement.classList.toggle('dark-mode', dark);
                    document.documentElement.style.backgroundColor = dark ? '#111318' : '';
                    localStorage.setItem('mmm-dark-mode', dark);
                    overlay.querySelectorAll('.settings-theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            overlay.querySelectorAll('.settings-service-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const serviceId = btn.dataset.service;
                    if (serviceId) { localStorage.setItem('mmm-preferred-service', serviceId); }
                    else { localStorage.removeItem('mmm-preferred-service'); }
                    overlay.querySelectorAll('.settings-service-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            const tourBtnEl = overlay.querySelector('#settings-start-tour');
            if (tourBtnEl) { tourBtnEl.addEventListener('click', () => { overlay.classList.remove('visible'); if (typeof window.startGlobalTour === 'function') window.startGlobalTour(); }); }
            settingsBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark-mode');
                overlay.querySelectorAll('.settings-theme-btn').forEach(btn => { btn.classList.toggle('active', (btn.dataset.theme === 'dark') === isDark); });
                const currentSvc = localStorage.getItem('mmm-preferred-service');
                overlay.querySelectorAll('.settings-service-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.service === (currentSvc || '')); });
                overlay.classList.add('visible');
            });
        })();

        // ==================== NAV MENU ====================
        (function() {
            var trigger = document.querySelector('.site-nav-trigger');
            var menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            trigger.addEventListener('click', function(e) {
                e.preventDefault();
                menu.classList.toggle('active');
            });
            document.addEventListener('click', function(e) {
                if (!trigger.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('active');
            });
        })();

        // ==================== HELPERS ====================
        var MK_MONTHS = ['Јануари','Февруари','Март','Април','Мај','Јуни','Јули','Август','Септември','Октомври','Ноември','Декември'];
        var MK_MONTHS_SHORT = ['Јан','Фев','Мар','Апр','Мај','Јун','Јул','Авг','Сеп','Окт','Ное','Дек'];
        var MK_DAYS = ['Недела','Понеделник','Вторник','Среда','Четврток','Петок','Сабота'];

        var cyrMap = {
            'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g',
            'Д':'D','д':'d','Ѓ':'Gj','ѓ':'gj','Е':'E','е':'e','Ж':'Zh','ж':'zh',
            'З':'Z','з':'z','Ѕ':'Dz','ѕ':'dz','И':'I','и':'i','Ј':'J','ј':'j',
            'К':'K','к':'k','Л':'L','л':'l','Љ':'Lj','љ':'lj','М':'M','м':'m',
            'Н':'N','н':'n','Њ':'Nj','њ':'nj','О':'O','о':'o','П':'P','п':'p',
            'Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','Ќ':'Kj','ќ':'kj',
            'У':'U','у':'u','Ф':'F','ф':'f','Х':'H','х':'h','Ц':'C','ц':'c',
            'Ч':'Ch','ч':'ch','Џ':'Dz','џ':'dz','Ш':'Sh','ш':'sh'
        };
        function transliterate(t) { return t.split('').map(function(c) { return cyrMap[c] || c; }).join(''); }
        function artistSlug(name) { return transliterate(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
        function artistPageUrl(name) {
            var slug = encodeURIComponent(artistSlug(name));
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'artist.html?a=' + slug;
            return '/' + slug;
        }

        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escA(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function parseDate(str) {
            var p = str.split('-');
            return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
        }

        function daysUntil(dateStr) {
            var today = new Date(); today.setHours(0,0,0,0);
            var d = parseDate(dateStr); d.setHours(0,0,0,0);
            return Math.round((d - today) / 86400000);
        }

        function countdownInfo(dateStr) {
            var diff = daysUntil(dateStr);
            if (diff === 0) return { text: 'ДЕНЕС!', cls: 'today-cd' };
            if (diff === 1) return { text: 'утре', cls: 'soon' };
            if (diff > 1 && diff <= 7) return { text: 'за ' + diff + ' дена', cls: 'soon' };
            if (diff > 7 && diff <= 30) return { text: 'за ' + diff + ' дена', cls: 'later' };
            if (diff > 30) {
                var m = Math.floor(diff / 30);
                return { text: 'за ~' + m + ' мес.', cls: 'later' };
            }
            if (diff < 0) {
                var ago = Math.abs(diff);
                if (ago === 1) return { text: 'вчера', cls: 'passed' };
                if (ago <= 30) return { text: 'пред ' + ago + ' дена', cls: 'passed' };
                var mo = Math.floor(ago / 30);
                return { text: 'пред ~' + mo + ' мес.', cls: 'passed' };
            }
            return { text: '', cls: '' };
        }

        // ==================== ARTIST THUMBNAILS ====================
        var chartDataCache = null;
        function loadChartData() {
            return fetch('/chart-data.json?v=' + Date.now())
                .then(function(r) { return r.ok ? r.json() : { releases: [] }; })
                .then(function(d) { chartDataCache = d; })
                .catch(function() { chartDataCache = { releases: [] }; });
        }
        function getArtistThumb(artistName) {
            if (!chartDataCache || !chartDataCache.releases || !artistName) return null;
            var lower = artistName.toLowerCase().trim();
            var release = chartDataCache.releases.find(function(r) {
                return r.bandName && r.bandName.toLowerCase().trim() === lower;
            });
            return release ? (release.artistImage || release.thumbnail || null) : null;
        }

        // ==================== RENDER ====================
        function renderError() {
            document.getElementById('event-content').innerHTML =
                '<div class="event-error">' +
                    '<i class="fas fa-calendar-xmark"></i>' +
                    '<h2>Настанот не е пронајден</h2>' +
                    '<p>Обидете се повторно или вратете се на листата на настани.</p>' +
                    '<a href="/nastani"><i class="fas fa-arrow-left"></i> Сите Настани</a>' +
                '</div>';
        }

        function renderEvent(evt) {
            var d = parseDate(evt.date);
            var cd = countdownInfo(evt.date);
            var artists = evt.artists || evt.bands || [];
            var isPast = daysUntil(evt.date) < 0;

            // Update SEO meta
            var title = evt.title + ' | Македонска Музичка Мастер Листа';
            document.getElementById('page-title').textContent = title;
            document.getElementById('event-page-title').textContent = 'Настан';
            var desc = evt.title + ' — ' + d.getDate() + ' ' + MK_MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + evt.place;
            try {
                document.getElementById('meta-title').content = title;
                document.getElementById('meta-description').content = desc;
                document.getElementById('og-title').content = title;
                document.getElementById('og-description').content = desc;
                var cleanEventUrl = 'https://toplista.mk/nastan/' + encodeURIComponent(evt.id);
                document.getElementById('canonical-url').href = cleanEventUrl;
                document.getElementById('og-url').content = cleanEventUrl;
            } catch(e) {}

            var html = '';

            // Header
            html += '<div class="event-header">';
            html += '<div class="event-icon"><i class="fas fa-calendar-day"></i></div>';
            html += '<div class="event-name">' + esc(evt.title) + '</div>';
            if (cd.text) {
                html += '<div class="event-countdown-hero ' + cd.cls + '">' + cd.text + '</div>';
            }
            html += '<div class="event-date-hero"><i class="fas fa-clock"></i> ' +
                MK_DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MK_MONTHS[d.getMonth()] + ' ' + d.getFullYear() +
                (evt.time ? ' · ' + esc(evt.time) : '') + '</div>';
            html += '</div>';

            // Artists section
            if (artists.length) {
                html += '<h3 class="section-title"><i class="fas fa-music"></i> Артисти</h3>';
                html += '<div class="info-list">';
                for (var i = 0; i < artists.length; i++) {
                    var thumb = getArtistThumb(artists[i]);
                    html += '<a href="' + escA(artistPageUrl(artists[i])) + '" class="artist-link-card">';
                    if (thumb) {
                        html += '<img src="' + escA(thumb) + '" alt="" class="artist-link-thumb" loading="lazy" decoding="async">';
                    } else {
                        html += '<i class="fas fa-music"></i>';
                    }
                    html += '<span>' + esc(artists[i]) + '</span>';
                    html += '<i class="fas fa-chevron-right info-card-arrow"></i>';
                    html += '</a>';
                }
                html += '</div>';
            }

            // Details section
            html += '<h3 class="section-title" style="margin-top:1.5rem"><i class="fas fa-info-circle"></i> Детали</h3>';
            html += '<div class="info-list">';

            // Place
            html += '<div class="info-card">';
            html += '<div class="info-card-icon"><i class="fas fa-location-dot"></i></div>';
            html += '<div class="info-card-text"><div class="info-card-label">Место</div><div class="info-card-value">' + esc(evt.place) + '</div></div>';
            html += '</div>';

            // Date
            html += '<div class="info-card">';
            html += '<div class="info-card-icon"><i class="fas fa-calendar"></i></div>';
            html += '<div class="info-card-text"><div class="info-card-label">Датум</div><div class="info-card-value">' +
                MK_DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MK_MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</div></div>';
            html += '</div>';

            // Time
            if (evt.time) {
                html += '<div class="info-card">';
                html += '<div class="info-card-icon"><i class="fas fa-clock"></i></div>';
                html += '<div class="info-card-text"><div class="info-card-label">Време</div><div class="info-card-value">' + esc(evt.time) + '</div></div>';
                html += '</div>';
            }

            // External link
            if (evt.link) {
                html += '<a href="' + escA(evt.link) + '" target="_blank" rel="noopener" class="info-card">';
                html += '<div class="info-card-icon"><i class="fas fa-arrow-up-right-from-square"></i></div>';
                html += '<div class="info-card-text"><div class="info-card-label">Линк</div><div class="info-card-value" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(evt.link) + '</div></div>';
                html += '<i class="fas fa-chevron-right info-card-arrow"></i>';
                html += '</a>';
            }

            html += '</div>'; // .info-list

            // Tickets section
            if (evt.tickets && evt.tickets.length) {
                html += '<h3 class="section-title" style="margin-top:1.5rem"><i class="fas fa-ticket"></i> Карти</h3>';
                html += '<div class="info-list">';
                for (var t = 0; t < evt.tickets.length; t++) {
                    var tk = evt.tickets[t];
                    html += '<div class="ticket-card">';
                    html += '<div class="ticket-card-icon"><i class="fas fa-ticket"></i></div>';
                    html += '<div class="ticket-card-info"><div class="ticket-card-label">' + esc(tk.label) + '</div><div class="ticket-card-price">' + esc(tk.price) + '</div></div>';
                    html += '</div>';
                }
                html += '</div>';
            }

            // Footer
            html += '<div class="event-footer">';
            html += '<a href="/"><img src="/logo.png" alt="Македонска Музичка Мастер Листа" class="mmm-logo-svg" width="28" height="28"></a>';
            html += '</div>';

            document.getElementById('event-content').innerHTML = html;
        }

        // ==================== INIT ====================
        (function() {
            var params = new URLSearchParams(window.location.search);
            var eventId = params.get('id');
            if (!eventId) {
                renderError();
                return;
            }
            // Restore clean URL if redirected via 404.html
            var cleanPath = sessionStorage.getItem('eventCleanPath');
            if (cleanPath) {
                sessionStorage.removeItem('eventCleanPath');
                var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
                if (!isLocal) history.replaceState(null, '', cleanPath);
            }
            Promise.all([
                fetch('/events.json').then(function(r) { return r.json(); }),
                loadChartData()
            ])
                .then(function(results) {
                    var data = results[0];
                    var events = data.events || data || [];
                    var found = null;
                    for (var i = 0; i < events.length; i++) {
                        if (events[i].id === eventId) { found = events[i]; break; }
                    }
                    if (found) renderEvent(found);
                    else renderError();
                })
                .catch(function() { renderError(); });
        })();
    </script>
</body>
</html>
