    <style>
        /* ==================== PAGE LAYOUT ==================== */
        body.curators-page {
            height: auto !important;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden !important;
            overflow-y: auto !important;
        }

        body.curators-page main {
            height: auto !important;
            overflow: visible !important;
            flex: 1;
        }

        .curators-container {
            max-width: 100%;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ==================== PAGE HEADER ==================== */
        .curators-page-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1.25rem;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .curators-page-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary, #1a1a2e);
            margin: 0;
        }

        body.dark-mode .curators-page-header h2 {
            color: #e8e8f0;
        }

        /* ==================== SEARCH (chart-filter-bar style) ==================== */
        .curators-page .chart-filter-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0;
        }
        body.dark-mode .curators-page .chart-filter-bar {
            background: var(--bg-secondary);
            border-bottom-color: var(--border-color);
        }
        .curators-page .curators-search-wrap {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex: 1;
            min-width: 200px;
            position: relative;
            min-height: 36px;
            padding: 0.2rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            cursor: text;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .curators-page .curators-search-wrap:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(29,155,240,0.12);
        }
        body.dark-mode .curators-page .curators-search-wrap {
            background: var(--bg-secondary);
            border-color: var(--border-color);
        }
        body.dark-mode .curators-page .curators-search-wrap:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(29,155,240,0.2);
        }
        .curators-page .curators-search-wrap i {
            color: var(--text-muted);
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .curators-page #curators-search {
            flex: 1;
            min-width: 100px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            padding: 0.2rem 0;
            height: 30px;
        }
        .curators-page #curators-search::placeholder {
            color: var(--text-muted);
        }

        /* ==================== GRID ==================== */
        .curators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
            grid-auto-rows: 1fr;
            max-width: 100%;
            gap: 0.75rem;
        }

        /* ==================== CARD ==================== */
        .custos-card {
            background: var(--bg-primary, #fff);
            border-radius: 0;
            padding: 1.5rem;
            border: 1px solid var(--border-color, #dfe1e5);
            transition: box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-sizing: border-box;
            min-height: 440px;
            /* Slide-in + unblur on load */
            opacity: 0;
            transform: translateX(-30px);
            filter: blur(6px);
            animation: custosCardReveal 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .custos-card:nth-child(1) { animation-delay: 0.05s; }
        .custos-card:nth-child(2) { animation-delay: 0.1s; }
        .custos-card:nth-child(3) { animation-delay: 0.15s; }
        .custos-card:nth-child(4) { animation-delay: 0.2s; }
        .custos-card:nth-child(5) { animation-delay: 0.25s; }
        .custos-card:nth-child(6) { animation-delay: 0.3s; }
        .custos-card:nth-child(7) { animation-delay: 0.35s; }
        .custos-card:nth-child(8) { animation-delay: 0.4s; }
        .custos-card:nth-child(n+9) { animation-delay: 0.45s; }

        @keyframes custosCardReveal {
            from { opacity: 0; transform: translateX(-30px); filter: blur(6px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }

        .custos-card:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .custos-card.hidden {
            display: none;
        }

        body.dark-mode .custos-card {
            background: var(--bg-secondary, #191c22);
            border-color: var(--border-color, #2a2e36);
        }

        body.dark-mode .custos-card:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }

        /* Card header */
        .custos-header {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .custos-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-secondary, #f6f7f9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .custos-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .custos-avatar i {
            font-size: 1.5rem;
            color: var(--accent-blue, #4a7fa5);
        }

        body.dark-mode .custos-avatar {
            background: var(--bg-hover, #22262e);
        }

        body.dark-mode .custos-avatar i {
            color: var(--accent-blue);
        }

        .custos-info {
            flex: 1;
            min-width: 0;
        }

        .custos-name-row {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
            margin: 0 0 0.2rem;
        }

        .custos-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary, #1a1a2e);
            margin: 0;
            text-decoration: none;
        }

        .custos-name:hover {
            text-decoration: underline;
        }

        body.dark-mode .custos-name {
            color: #e8e8f0;
        }

        .custos-relevance {
            font-size: 0.82rem;
            color: var(--text-secondary, #555b64);
            line-height: 1.35;
        }

        .custos-relevance a {
            color: var(--accent-blue, #4a7fa5);
            text-decoration: none;
            font-weight: 500;
        }

        .custos-relevance a:hover {
            text-decoration: underline;
        }

        .custos-relevance .sep {
            margin: 0 0.25em;
            opacity: 0.5;
        }

        body.dark-mode .custos-relevance {
            color: var(--text-muted);
        }

        body.dark-mode .custos-relevance a {
            color: var(--accent-blue);
        }

        /* Social links – inline next to name */
        .custos-socials {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .custos-socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-secondary, #f6f7f9);
            color: var(--text-secondary, #555b64);
            font-size: 0.75rem;
            transition: background 0.15s, color 0.15s;
            text-decoration: none;
        }

        .custos-socials a:hover {
            background: var(--accent-blue, #4a7fa5);
            color: #fff;
        }

        body.dark-mode .custos-socials a {
            background: var(--bg-hover, #22262e);
            color: var(--text-muted);
        }

        body.dark-mode .custos-socials a:hover {
            background: var(--accent-blue);
            color: #fff;
        }

        /* Playlist tabs */
        .custos-playlist-tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .custos-playlist-tab {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.7rem;
            border-radius: 0;
            border: 1px solid var(--border-color, #dfe1e5);
            background: var(--bg-primary, #fff);
            color: var(--text-secondary, #555b64);
            font-size: 0.78rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            user-select: none;
            margin-left: -1px;
        }

        .custos-playlist-tab:first-child {
            margin-left: 0;
        }

        .custos-playlist-tab:hover {
            background: var(--bg-hover, #eceef1);
            color: var(--text-primary);
        }

        .custos-playlist-tab.active {
            background: var(--text-primary, #1a1d21);
            color: var(--bg-primary, #fff);
            border-color: var(--text-primary, #1a1d21);
        }

        .custos-playlist-tab i {
            font-size: 0.85rem;
        }

        .custos-playlist-tab.spotify i { color: #1DB954; }
        .custos-playlist-tab.youtube i { color: #FF0000; }
        .custos-playlist-tab.apple i { color: #FA243C; }
        .custos-playlist-tab.tidal i { color: #000; }
        .custos-playlist-tab.deezer i { color: #A238FF; }
        .custos-playlist-tab.soundcloud i { color: #FF5500; }
        .custos-playlist-tab.default i { color: var(--accent-blue, #4a7fa5); }

        .custos-playlist-tab.active i { color: var(--bg-primary, #fff); }

        body.dark-mode .custos-playlist-tab {
            background: var(--bg-hover, #22262e);
            border-color: var(--border-color, #2a2e36);
            color: var(--text-secondary);
        }

        body.dark-mode .custos-playlist-tab:hover {
            background: #2a2e36;
            color: var(--text-primary);
        }

        body.dark-mode .custos-playlist-tab.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }

        body.dark-mode .custos-playlist-tab.tidal i { color: #fff; }
        body.dark-mode .custos-playlist-tab.active i { color: #fff; }

        .custos-playlist-panel {
            display: none;
        }

        .custos-playlist-panel.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .tracklist-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        /* Playlist body wrapper – fills remaining card space */
        .custos-playlist-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0.5rem;
            min-height: 0;
        }

        /* ==================== TRACKLIST ==================== */
        .tracklist-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.15s;
        }

        .tracklist-header:hover {
            opacity: 0.8;
        }

        .tracklist-cover {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .tracklist-info {
            flex: 1;
            min-width: 0;
        }

        .tracklist-title {
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--text-primary, #1a1a2e);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark-mode .tracklist-title {
            color: #e8e8f0;
        }

        .tracklist-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tracklist-play-all {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border-radius: 0;
            border: none;
            background: #1DB954;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
            flex-shrink: 0;
            text-decoration: none;
        }

        .tracklist-play-all:hover {
            background: #1ed760;
        }

        .tracklist-play-all i {
            font-size: 0.72rem;
        }

        .tracklist-service-deezer .tracklist-play-all { background: #A238FF; }
        .tracklist-service-deezer .tracklist-play-all:hover { background: #b355ff; }
        .tracklist-service-youtube .tracklist-play-all { background: #FF0000; }
        .tracklist-service-youtube .tracklist-play-all:hover { background: #ff3333; }
        .tracklist-service-apple .tracklist-play-all { background: #FA243C; }
        .tracklist-service-apple .tracklist-play-all:hover { background: #fc4a5f; }
        .tracklist-service-tidal .tracklist-play-all { background: #000; }
        .tracklist-service-tidal .tracklist-play-all:hover { background: #222; }
        body.dark-mode .tracklist-service-tidal .tracklist-play-all { background: #fff; color: #000; }

        .tracklist-list {
            list-style: none;
            margin: 0;
            padding: 0;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-radius: 0;
        }

        body.dark-mode .tracklist-list {
            border-color: var(--border-color, #2a2e36);
        }

        .tracklist-list::-webkit-scrollbar {
            width: 4px;
        }

        .tracklist-list::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 2px;
        }

        body.dark-mode .tracklist-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
        }

        .tracklist-see-more {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.6rem 0.75rem;
            margin-top: 0.15rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-blue, #4a7fa5);
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .tracklist-see-more:hover {
            background: var(--bg-hover, #eceef1);
            color: var(--text-primary);
        }

        body.dark-mode .tracklist-see-more {
            color: var(--accent-blue);
            border-top-color: var(--border-color);
        }

        body.dark-mode .tracklist-see-more:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.6rem;
            transition: background 0.15s;
            cursor: pointer;
        }

        .track-item:last-child {
            border-bottom: none;
        }

        .track-item:hover {
            background: var(--bg-hover, #eceef1);
        }

        body.dark-mode .track-item {
            border-bottom-color: var(--border-color, #2a2e36);
        }

        body.dark-mode .track-item:hover {
            background: var(--bg-hover);
        }

        .track-num {
            font-size: 0.72rem;
            color: var(--text-muted);
            width: 22px;
            text-align: center;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .track-art {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg-hover, #eceef1);
        }

        body.dark-mode .track-art {
            background: var(--bg-hover, #22262e);
        }

        .track-details {
            flex: 1;
            min-width: 0;
        }

        .track-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary, #1a1a2e);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark-mode .track-name {
            color: #e8e8f0;
        }

        .track-name a {
            color: inherit;
            text-decoration: none;
        }

        .track-name a:hover {
            text-decoration: underline;
        }

        .track-artist {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-duration {
            font-size: 0.72rem;
            color: var(--text-muted);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .track-play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .track-play-btn:hover {
            background: var(--bg-hover, #eceef1);
            color: var(--accent-blue, #4a7fa5);
        }

        body.dark-mode .track-play-btn:hover {
            background: var(--bg-hover);
        }

        /* ==================== VIEW TOGGLE (header) ==================== */
        .tracklist-view-toggle {
            display: none;
        }

        /* ==================== COMPACT VIEW (page-level) ==================== */
        body.curators-compact .tracklist-wrapper .track-num { display: none; }
        body.curators-compact .tracklist-wrapper .track-art { width: 28px; height: 28px; border-radius: 3px; }
        body.curators-compact .tracklist-wrapper .track-details { flex-direction: row; display: flex; align-items: baseline; gap: 0.3rem; }
        body.curators-compact .tracklist-wrapper .track-name { font-size: 0.78rem; font-weight: 600; }
        body.curators-compact .tracklist-wrapper .track-artist { font-size: 0.78rem; flex-shrink: 1; }
        body.curators-compact .tracklist-wrapper .track-artist::before { content: '\2014\00a0'; }
        body.curators-compact .tracklist-wrapper .track-item { padding: 0.3rem 0.6rem; gap: 0.45rem; }
        body.curators-compact .tracklist-wrapper .track-play-btn { width: 24px; height: 24px; font-size: 0.6rem; }
        body.curators-compact .tracklist-wrapper .track-duration { font-size: 0.68rem; }

        /* Playlist open link (compact, at bottom) */
        .custos-playlist-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-secondary, #f6f7f9);
            border-radius: 0;
            text-decoration: none;
            color: var(--text-primary, #1a1a2e);
            transition: background 0.15s, border-color 0.15s;
            font-size: 0.8rem;
            margin-top: 0.35rem;
            flex-shrink: 0;
        }

        .custos-playlist-link:hover {
            background: var(--bg-hover, #eceef1);
            border-color: var(--accent-blue, #4a7fa5);

    <script>
        // Settings menu + nav menu from common.js
        initSettingsMenu();

        // ==================== SEARCH TOGGLE (mobile) ====================
        (function setupSearchToggle() {
            var btn = document.getElementById('search-toggle-btn');
            var controls = document.getElementById('controls-bar');
            var icon = btn ? btn.querySelector('i') : null;
            var searchInput = document.getElementById('curators-search');

            if (!btn || !controls) return;

            btn.addEventListener('click', function() {
                var isVisible = controls.classList.toggle('visible');
                if (icon) icon.className = 'fas ' + (isVisible ? 'fa-times' : 'fa-search');
                if (isVisible) {
                    setTimeout(function() { searchInput.focus(); }, 50);
                } else if (searchInput && searchInput.value) {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                }
            });

            // Always visible on desktop
            if (window.innerWidth > 600) {
                controls.classList.add('visible');
            }
        })();

        // ==================== COMPACT TOGGLE ====================
        function initCompactToggle() {
            const btn = document.getElementById('curators-compact-toggle');
            if (!btn) return;
            const saved = JSON.parse(localStorage.getItem('mmm-curators-compact') || 'true');
            document.body.classList.toggle('curators-compact', saved);
            btn.innerHTML = saved ? '<i class="fas fa-expand-alt"></i>' : '<i class="fas fa-compress-alt"></i>';
            btn.title = saved ? 'Проширен приказ' : 'Компактен приказ';
            btn.addEventListener('click', () => {
                const isCompact = document.body.classList.toggle('curators-compact');
                btn.innerHTML = isCompact ? '<i class="fas fa-expand-alt"></i>' : '<i class="fas fa-compress-alt"></i>';
                btn.title = isCompact ? 'Проширен приказ' : 'Компактен приказ';
                localStorage.setItem('mmm-curators-compact', JSON.stringify(isCompact));
            });
        }
        initCompactToggle();

        // ==================== AUTO-DETECT HELPERS ====================

        /** Detect social/link service from URL and return icon class + label */
        function detectLinkInfo(url) {
            const u = url.toLowerCase();
            if (u.includes('instagram.com'))   return { icon: 'fab fa-instagram',    label: 'Instagram',     service: 'instagram' };
            if (u.includes('twitter.com') || u.includes('x.com'))
                                               return { icon: 'fab fa-x-twitter',    label: 'X / Twitter',   service: 'twitter' };
            if (u.includes('facebook.com'))     return { icon: 'fab fa-facebook-f',   label: 'Facebook',      service: 'facebook' };
            if (u.includes('tiktok.com'))       return { icon: 'fab fa-tiktok',       label: 'TikTok',        service: 'tiktok' };
            if (u.includes('music.youtube.com'))return { icon: 'fab fa-youtube',      label: 'YouTube Music', service: 'youtube' };
            if (u.includes('youtube.com') || u.includes('youtu.be'))
                                               return { icon: 'fab fa-youtube',       label: 'YouTube',       service: 'youtube' };
            if (u.includes('open.spotify.com')) return { icon: 'fab fa-spotify',      label: 'Spotify',       service: 'spotify' };
            if (u.includes('bandcamp.com'))     return { icon: 'fab fa-bandcamp',     label: 'Bandcamp',      service: 'bandcamp' };
            if (u.includes('soundcloud.com'))   return { icon: 'fab fa-soundcloud',   label: 'SoundCloud',    service: 'soundcloud' };
            if (u.includes('music.apple.com'))  return { icon: 'fab fa-apple',        label: 'Apple Music',   service: 'apple' };
            if (u.includes('tidal.com'))        return { icon: 'fas fa-water',        label: 'Tidal',         service: 'tidal' };
            if (u.includes('deezer.com'))       return { icon: 'fab fa-deezer',       label: 'Deezer',        service: 'deezer' };
            if (u.includes('discord.gg') || u.includes('discord.com'))
                                               return { icon: 'fab fa-discord',       label: 'Discord',       service: 'discord' };
            if (u.includes('linkedin.com'))     return { icon: 'fab fa-linkedin-in',  label: 'LinkedIn',      service: 'linkedin' };
            if (u.includes('linktr.ee'))        return { icon: 'fas fa-link',         label: 'Linktree',      service: 'linktree' };
            return { icon: 'fas fa-globe', label: 'Линк', service: 'default' };
        }

        /** Build a compact link for opening the playlist on its native service */
        function buildPlaylistLink(url) {
            const info = detectLinkInfo(url);
            const cls = info.service;
            return `<a href="${escAttr(url)}" class="custos-playlist-link" target="_blank" rel="noopener">
                <span class="pl-icon ${cls}"><i class="${info.icon}"></i></span>
                <span class="pl-text">Отвори плејлиста</span>
                <span class="pl-arrow"><i class="fas fa-arrow-up-right-from-square"></i></span>
            </a>`;
        }

        // ==================== SERVICE PREFERENCE & OPEN ON SERVICE ====================
        const serviceDefinitions = {
            spotify:      { name: 'Spotify',       icon: 'fab fa-spotify',        color: '#1DB954' },
            youtube:      { name: 'YouTube',        icon: 'fab fa-youtube',        color: '#FF0000' },
            youtubeMusic: { name: 'YouTube Music',  icon: 'fab fa-youtube',        color: '#FF0000' },
            appleMusic:   { name: 'Apple Music',    icon: 'fab fa-apple',          color: '#FA2D48' },
            deezer:       { name: 'Deezer',         icon: 'fas fa-headphones',     color: '#A238FF' },
            tidal:        { name: 'Tidal',          icon: 'fas fa-water',          color: '#000000' },
            amazonMusic:  { name: 'Amazon Music',   icon: 'fab fa-amazon',         color: '#00A8E1' },
            soundcloud:   { name: 'SoundCloud',     icon: 'fab fa-soundcloud',     color: '#FF5500' },
            bandcamp:     { name: 'Bandcamp',       icon: 'fab fa-bandcamp',       color: '#629AA9' }
        };
        function getPreferredService() { return localStorage.getItem('mmm-preferred-service'); }
        function setPreferredService(s) { localStorage.setItem('mmm-preferred-service', s); }

        function buildSearchUrl(serviceId, artist, title) {
            const query = `${artist} ${title}`;
            const encoded = encodeURIComponent(query);
            const plusEncoded = query.replace(/\s+/g, '+');
            const searchUrls = {
                youtube: `https://www.youtube.com/results?search_query=${plusEncoded}`,
                youtubeMusic: `https://music.youtube.com/search?q=${encoded}`,
                appleMusic: `https://music.apple.com/search?term=${encoded}`,
                deezer: `https://www.deezer.com/search/${encoded}`,
                tidal: `https://listen.tidal.com/search?q=${encoded}`,
                amazonMusic: `https://music.amazon.com/search/${encoded}`,
                soundcloud: `https://soundcloud.com/search?q=${encoded}`,
                bandcamp: `https://bandcamp.com/search?q=${encoded}`
            };
            return searchUrls[serviceId] || null;
        }

        function openOnPreferredService(releaseUrl, title, artistName) {
            if (!releaseUrl) return;
            const overlay = document.createElement('div');
            overlay.className = 'service-chooser-overlay';
            const pref = getPreferredService();
            
            let linksHtml = '';
            for (const [key, svc] of Object.entries(serviceDefinitions)) {
                const badge = key === pref ? '<span class="pref-badge">★</span>' : '';
                let url;
                if (key === 'spotify' && releaseUrl) {
                    url = releaseUrl;
                } else {
                    url = buildSearchUrl(key, artistName || '', title || '');
                }
                if (!url) continue;
                linksHtml += `<a href="${url}" target="_blank" rel="noopener" data-service="${key}"><i class="${svc.icon}" style="color:${svc.color}"></i>${svc.name}${badge}</a>`;
            }
            
            overlay.innerHTML = `<div class="service-chooser-dialog">
                <div class="service-chooser-header">
                    <div class="service-chooser-header-text">
                        <div class="service-chooser-artist">${artistName ? escHtml(artistName) : ''}</div>
                        <div class="service-chooser-song">${title ? escHtml(title) : 'Отвори во сервис'}</div>
                    </div>
                </div>
                <div class="service-chooser-links">${linksHtml}</div>
                <div class="service-chooser-footer">
                    <button class="chooser-cancel">Откажи</button>
                    <button class="chooser-set-default">Постави стандарден</button>
                </div>
            </div>`;
            
            document.body.appendChild(overlay);
            overlay.querySelector('.chooser-cancel').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            overlay.querySelector('.chooser-set-default').addEventListener('click', () => {
                overlay.remove();
                showServicePreferencePicker();
            });
            overlay.querySelectorAll('.service-chooser-links a').forEach(a => {
                a.addEventListener('click', () => overlay.remove());
            });
        }

        function showServicePreferencePicker() {
            const ov = document.getElementById('settings-overlay');
            if (ov) ov.classList.add('visible');
        }

        // cyrillicToLatinMap + transliterateCyrillicToLatin from common.js
        const cyrillicToLatinShorthandMap = {
            'А': 'A', 'а': 'a', 'Б': 'B', 'б': 'b', 'В': 'V', 'в': 'v', 'Г': 'G', 'г': 'g',
            'Д': 'D', 'д': 'd', 'Ѓ': 'G', 'ѓ': 'g', 'Е': 'E', 'е': 'e', 'Ж': 'Z', 'ж': 'z',
            'З': 'Z', 'з': 'z', 'Ѕ': 'D', 'ѕ': 'd', 'И': 'I', 'и': 'i', 'Ј': 'J', 'ј': 'j',
            'К': 'K', 'к': 'k', 'Л': 'L', 'л': 'l', 'Љ': 'L', 'љ': 'l', 'М': 'M', 'м': 'm',
            'Н': 'N', 'н': 'n', 'Њ': 'N', 'њ': 'n', 'О': 'O', 'о': 'o', 'П': 'P', 'п': 'p',
            'Р': 'R', 'р': 'r', 'С': 'S', 'с': 's', 'Т': 'T', 'т': 't', 'Ќ': 'K', 'ќ': 'k',
            'У': 'U', 'у': 'u', 'Ф': 'F', 'ф': 'f', 'Х': 'H', 'х': 'h', 'Ц': 'C', 'ц': 'c',
            'Ч': 'C', 'ч': 'c', 'Џ': 'D', 'џ': 'd', 'Ш': 'S', 'ш': 's'
        };
        function transliterateCyrToLatShort(text) {
            return text.split('').map(ch => cyrillicToLatinShorthandMap[ch] || ch).join('');
        }

        // ==================== BAND NAME LOOKUP ====================
        let bandNameSet = new Set();
        // Pre-built lookup: lowercased latin variants -> original band name
        let bandNameLookup = new Map();

        async function loadBandNames() {
            try {
                const resp = await fetch('bands.json');
                const data = await resp.json();
                const bands = data.muzickaMasterLista || [];
                bands.forEach(b => {
                    if (!b.name) return;
                    bandNameSet.add(b.name);
                    const lower = b.name.toLowerCase();
                    const latinFull = transliterateCyrillicToLatin(b.name).toLowerCase();
                    const latinShort = transliterateCyrToLatShort(b.name).toLowerCase();
                    bandNameLookup.set(lower, b.name);
                    if (!bandNameLookup.has(latinFull)) bandNameLookup.set(latinFull, b.name);
                    if (!bandNameLookup.has(latinShort)) bandNameLookup.set(latinShort, b.name);
                });
            } catch (err) {
                console.warn('Failed to load bands.json for relevance linking:', err);
            }
        }

        /** Find a band name match using Cyrillic + Latin transliteration (case-insensitive) */
        function findBandMatch(text) {
            if (!text) return null;
            const lower = text.toLowerCase();
            // Direct match (original or Cyrillic)
            if (bandNameLookup.has(lower)) return bandNameLookup.get(lower);
            // Try transliterating the input text
            const latinFull = transliterateCyrillicToLatin(text).toLowerCase();
            if (bandNameLookup.has(latinFull)) return bandNameLookup.get(latinFull);
            const latinShort = transliterateCyrToLatShort(text).toLowerCase();
            if (bandNameLookup.has(latinShort)) return bandNameLookup.get(latinShort);
            return null;
        }

        function renderArtistName(artist) {
            if (!artist) return '';
            // Split by common separators: feat., ft., &, x, ,
            const parts = artist.split(/\s*(?:feat\.?|ft\.?|&|,|\sx\s)\s*/i);
            const separators = artist.match(/\s*(?:feat\.?|ft\.?|&|,|\sx\s)\s*/gi) || [];
            let result = '';
            parts.forEach((part, i) => {
                const trimmed = part.trim();
                const match = findBandMatch(trimmed);
                if (match) {
                    result += `<a href="/artist.html?name=${encodeURIComponent(match)}" style="color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;">${escHtml(trimmed)}</a>`;
                } else {
                    result += escHtml(trimmed);
                }
                if (i < separators.length) result += escHtml(separators[i]);
            });
            return result;
        }

        function renderRelevance(items) {
            if (!items || items.length === 0) return '';
            // Flatten: split each item by commas to handle "Artist1 (role), Artist2 (role)" in a single string
            const flatItems = [];
            items.forEach(item => {
                // Split by comma but keep parenthesized content with its preceding name
                const subItems = item.split(/,(?![^(]*\))/g).map(s => s.trim()).filter(Boolean);
                flatItems.push(...subItems);
            });
            const parts = flatItems.map(item => {
                const nameOnly = item.replace(/\s*\([^)]*\)/g, '').trim();
                const extra = item.slice(nameOnly.length).trim();
                const match = findBandMatch(nameOnly);
                if (match) {
                    const href = '/artist.html?name=' + encodeURIComponent(match);
                    return `<a href="${href}">${escHtml(match)}</a>${extra ? ' <span style="opacity:.65">' + escHtml(extra) + '</span>' : ''}`;
                }
                return escHtml(item);
            });
            return parts.join('<span class="sep">·</span>');
        }

        // ==================== TRACKLIST DATA ====================
        let tracklistData = null;

        async function loadTracklistData() {
            try {
                const resp = await fetch('curators-tracklists.json');
                if (resp.ok) {
                    tracklistData = await resp.json();
                }
            } catch (err) {
                // Tracklist data not available – fall back to embeds
            }

        /** Find tracklist data for a given curator name and playlist URL */
        function findTracklist(curatorName, playlistUrl) {
            if (!tracklistData?.curators?.[curatorName]) return null;
            const curatorData = tracklistData.curators[curatorName];
            if (!curatorData.playlists) return null;
            // Match by URL (normalized)
            const normalizeUrl = u => u.replace(/[?#].*$/, '').replace(/\/$/, '').toLowerCase();
            const targetNorm = normalizeUrl(playlistUrl);
            return curatorData.playlists.find(p => normalizeUrl(p.url).includes(targetNorm.split('/').pop()));
        }

        /** Render a tracklist for a playlist (maxTracks limits visible tracks on browse page) */
        function renderTracklist(playlist, playlistUrl, curatorName, maxTracks) {
            if (!playlist || !playlist.tracks || playlist.tracks.length === 0) return null;

            const service = playlist.service || 'default';
            const allTracks = playlist.tracks;
            const limited = maxTracks && allTracks.length > maxTracks;
            const visibleTracks = limited ? allTracks.slice(0, maxTracks) : allTracks;

            const trackItems = visibleTracks.map((t, i) => {
                const hasUrl = !!t.trackUrl;
                const playBtnTitle = hasUrl ? 'Отвори во сервис' : '';

                return `<li class="track-item" data-track-index="${i}" data-track-url="${escAttr(t.trackUrl || '')}">
                    <span class="track-num">${i + 1}</span>
                    ${t.image ? `<img class="track-art" src="${t.image}" alt="" loading="lazy">` : ''}
                    <div class="track-details">
                        <div class="track-name">${escHtml(t.title)}</div>
                        <div class="track-artist">${renderArtistName(t.artist || '')}</div>
                    </div>
                    <span class="track-duration">${t.duration || ''}</span>
                    <button class="track-play-btn" data-track-id="${escAttr(t.trackId || i.toString())}" data-track-index="${i}" title="${playBtnTitle}">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                </li>`;
            }).join('');

            const serviceInfo = detectLinkInfo(playlistUrl);
            const trackCount = allTracks.length;
            const totalMs = allTracks.reduce((s, t) => s + (t.durationMs || 0), 0);
            const totalMin = Math.round(totalMs / 60000);
            const metaText = `${trackCount} песни` + (totalMin > 0 ? ` · ${totalMin} мин.` : '');

            const remaining = allTracks.length - visibleTracks.length;
            const seeMoreHtml = limited && curatorName
                ? `<a class="tracklist-see-more" href="/kustos/${curatorSlug(curatorName)}"><i class="fas fa-list"></i> Прикажи ги сите ${trackCount} песни</a>`
                : '';

            return `<div class="tracklist-wrapper tracklist-service-${service}" data-curator-playlist>
                <a class="tracklist-header" href="${escAttr(playlistUrl)}" target="_blank" rel="noopener">
                    ${playlist.image ? `<img class="tracklist-cover" src="${playlist.image}" alt="" loading="lazy">` : ''}
                    <div class="tracklist-info">
                        <div class="tracklist-title">${escHtml(playlist.name || serviceInfo.label + ' Playlist')}</div>
                        <div class="tracklist-meta">${metaText}</div>
                    </div>
                </a>
                <ul class="tracklist-list">${trackItems}</ul>
                ${seeMoreHtml}
                ${buildPlaylistLink(playlistUrl)}
            </div>`;
        }

        // escHtml from common.js
        function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        /** Create curator slug from name (transliterated latin, no spaces) */
        function curatorSlug(name) {
            return transliterateCyrillicToLatin(name)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // ==================== RENDER ====================
        async function loadCurators() {
            const loadingEl   = document.getElementById('curators-loading');
            const gridEl      = document.getElementById('curators-grid');
            const emptyEl     = document.getElementById('curators-empty');
            const noResultsEl = document.getElementById('curators-no-results');

            // Load band names and tracklist data in parallel
            await Promise.all([loadBandNames(), loadTracklistData()]);

            try {
                const resp = await fetch('curators.json');
                const data = await resp.json();
                const curators = data.curators || [];

                loadingEl.style.display = 'none';

                if (curators.length === 0) {
                    emptyEl.style.display = 'block';
                    return;
                }

                gridEl.style.display = '';
                gridEl.innerHTML = curators.map(c => renderCard(c)).join('');

                // Tab switching for multi-playlist cards
                initPlaylistTabs(gridEl);

                // Tracklist play/interaction handlers
                initTracklistHandlers(gridEl);

                // Search
                initSearch(curators);
            } catch (err) {
                console.error('Failed to load curators.json:', err);
                loadingEl.style.display = 'none';
                emptyEl.style.display = 'block';
            }
        }

        const WORKER_BASE = 'https://muzichka-master-lista.martinpetkovski.workers.dev';

        /** Get Instagram profile pic URL via Cloudflare Worker proxy */
        function getInstagramPic(links) {
            if (!links) return null;
            for (const url of links) {
                const m = url.match(/instagram\.com\/([a-zA-Z0-9_.]+)/);
                if (m && m[1]) {
                    return `${WORKER_BASE}/ig-pic/${m[1]}`;
                }
            }
            return null;
        }

        function renderCard(c) {
            // Avatar
            const igPic = getInstagramPic(c.links);
            const fallbackImg = c.image || null;
            const primarySrc = igPic || fallbackImg;

            let avatarInner;
            if (primarySrc) {
                let onerror;
                if (igPic && fallbackImg) {
                    const escaped = fallbackImg.replace(/'/g, "\\'");
                    onerror = "this.onerror=function(){this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';};this.src='" + escaped + "';";
                } else {
                    onerror = "this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';";
                }
                avatarInner = `<img src="${primarySrc}" alt="${c.name}" loading="lazy" referrerpolicy="no-referrer" onerror="${onerror}">`;
            } else {
                avatarInner = `<i class="fas fa-user"></i>`;
            }

            // Relevance
            const relevanceHtml = renderRelevance(c.relevance);

            // Social links
            const links = c.links || [];
            const socialLinks = links
                .map(url => {
                    const info = detectLinkInfo(url);
                    return `<a href="${url}" target="_blank" rel="noopener" title="${info.label}"><i class="${info.icon}"></i></a>`;
                })
                .join('');

            // Playlists
            const playlistUrls = c.playlists || (c.playlist ? [c.playlist] : []);
            let playlistHtml = '';

            if (playlistUrls.length === 1) {
                const url = playlistUrls[0];
                const tl = findTracklist(c.name, url);
                if (tl && tl.tracks && tl.tracks.length > 0) {
                    playlistHtml = `<div class="custos-playlist-body">${renderTracklist(tl, url, c.name, 5)}</div>`;
                } else {
                    playlistHtml = buildPlaylistLink(url);
                }
            } else if (playlistUrls.length > 1) {
                const cardId = 'pl-' + Math.random().toString(36).slice(2, 8);
                let tabs = '<div class="custos-playlist-tabs">';
                let panels = '';
                playlistUrls.forEach((url, i) => {
                    const info = detectLinkInfo(url);
                    const cls = info.service;
                    const activeClass = i === 0 ? ' active' : '';
                    tabs += `<button class="custos-playlist-tab ${cls}${activeClass}" data-tab-group="${cardId}" data-tab-index="${i}"><i class="${info.icon}"></i> ${info.label}</button>`;

                    const tl = findTracklist(c.name, url);
                    let panelContent;
                    if (tl && tl.tracks && tl.tracks.length > 0) {
                        panelContent = renderTracklist(tl, url, c.name, 20);
                    } else {
                        panelContent = buildPlaylistLink(url);
                    }
                    panels += `<div class="custos-playlist-panel${activeClass}" data-tab-group="${cardId}" data-panel-index="${i}">${panelContent}</div>`;
                });
                tabs += '</div>';
                playlistHtml = `<div class="custos-playlist-body">${tabs}${panels}</div>`;
            }

            // Curator profile link
            const curatorLink = '/kustos/' + curatorSlug(c.name);

            // searchable data attribute – include original + Latin transliterations for Cyrillic-insensitive search
            const rawParts = [c.name, ...(c.relevance || [])];
            const searchText = rawParts.concat(
                rawParts.map(p => transliterateCyrillicToLatin(p)),
                rawParts.map(p => transliterateCyrToLatShort(p))
            ).join(' ').toLowerCase();

            return `
                <div class="custos-card" data-search="${searchText.replace(/"/g, '&quot;')}">
                    <div class="custos-header">
                        <div class="custos-avatar">${avatarInner}</div>
                        <div class="custos-info">
                            <div class="custos-name-row">
                                <a class="custos-name" href="${curatorLink}">${c.name}</a>
                                ${socialLinks ? `<div class="custos-socials">${socialLinks}</div>` : ''}
                            </div>
                            ${relevanceHtml ? `<div class="custos-relevance">${relevanceHtml}</div>` : ''}
                        </div>
                    </div>
                    ${playlistHtml}
                </div>`;
        }

        // ==================== PLAYLIST TABS ====================
        function initPlaylistTabs(container) {
            container.addEventListener('click', (e) => {
                const tab = e.target.closest('.custos-playlist-tab');
                if (!tab) return;
                const group = tab.dataset.tabGroup;
                const index = tab.dataset.tabIndex;

                container.querySelectorAll(`.custos-playlist-tab[data-tab-group="${group}"]`).forEach(t => t.classList.remove('active'));
                container.querySelectorAll(`.custos-playlist-panel[data-tab-group="${group}"]`).forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                const panel = container.querySelector(`.custos-playlist-panel[data-tab-group="${group}"][data-panel-index="${index}"]`);
                if (panel) panel.classList.add('active');
            });
        }

        // ==================== TRACKLIST HANDLERS ====================
        function initTracklistHandlers(container) {
            container.addEventListener('click', (e) => {
                // Individual track play button
                const playBtn = e.target.closest('.track-play-btn');
                if (playBtn) {
                    e.preventDefault();
                    const trackItem = playBtn.closest('.track-item');
                    const trackUrl = trackItem?.dataset.trackUrl;
                    const nameEl = trackItem?.querySelector('.track-name');
                    const artistEl = trackItem?.querySelector('.track-artist');
                    const title = nameEl?.textContent || '';
                    const artistName = artistEl?.textContent || '';
                    if (trackUrl) openOnPreferredService(trackUrl, title, artistName);
                    return;
                }

                // Clicking on a track row opens it on preferred service
                const trackItem = e.target.closest('.track-item');
                if (trackItem && !e.target.closest('a')) {
                    e.preventDefault();
                    const trackUrl = trackItem.dataset.trackUrl;
                    const nameEl = trackItem.querySelector('.track-name');
                    const artistEl = trackItem.querySelector('.track-artist');
                    const title = nameEl?.textContent || '';
                    const artistName = artistEl?.textContent || '';
                    if (trackUrl) openOnPreferredService(trackUrl, title, artistName);
                    return;
                }
            });
        }

        // ==================== SEARCH ====================
        function initSearch() {
            const searchInput = document.getElementById('curators-search');
            const gridEl      = document.getElementById('curators-grid');
            const noResultsEl = document.getElementById('curators-no-results');
            if (!searchInput) return;

            searchInput.addEventListener('input', () => {
                const raw = searchInput.value.trim();
                const q = raw.toLowerCase();
                // Also transliterate the query so typing in Latin matches Cyrillic names and vice-versa
                const qLatinFull = transliterateCyrillicToLatin(raw).toLowerCase();
                const qLatinShort = transliterateCyrToLatShort(raw).toLowerCase();
                const cards = gridEl.querySelectorAll('.custos-card');
                let visible = 0;

                cards.forEach(card => {
                    const text = card.getAttribute('data-search') || '';
                    const match = !q || text.includes(q) || text.includes(qLatinFull) || text.includes(qLatinShort);
                    card.classList.toggle('hidden', !match);
                    if (match) visible++;
                });

                noResultsEl.style.display = (visible === 0 && q) ? 'block' : 'none';
            });
        }

        // ==================== INIT ====================
        loadCurators();
    </script>
</body>
</html>
