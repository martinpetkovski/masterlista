name = "toplista-og-meta"
main = "src/og-worker.js"
compatibility_date = "2024-01-01"

# Deploy as a route on toplista.mk so it intercepts crawler requests.
# The worker passes non-crawler traffic straight through to the origin (GitHub Pages).
#
# To use routes, the domain must be proxied through Cloudflare (orange cloud in DNS).

[env.production]
routes = [
  { pattern = "toplista.mk/*", zone_id = "a1cd032f9d3b8024f397804a309a1f78" },
  { pattern = "www.toplista.mk/*", zone_id = "a1cd032f9d3b8024f397804a309a1f78" }
]
