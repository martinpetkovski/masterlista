        .profile-contribution-main { min-width: 0; display: grid; gap: 0.4rem; }

<body class="compact profile-page">
    <header id="site-header" data-active="/contributions" data-title="Профил"></header>
    <script src="/scripts/site/load-header.js"></script>

    <main>
        <div class="profile-shell">
            <div id="profile-loading" class="profile-loading"><i class="fas fa-spinner fa-spin"></i><span>Се вчитува профил...</span></div>
            <div id="profile-error" class="profile-error" style="display:none">Профилот не може да се вчита.</div>
            <section id="profile-content" style="display:none">
                <div class="profile-card" id="profile-card"></div>
                <div class="profile-panel">
                    <h3><i class="fas fa-code-merge"></i><span id="profile-list-title" data-i18n="profile.contributions">Придонеси</span></h3>
                    <div id="profile-list" class="profile-list"></div>
                    <div id="profile-empty" class="profile-empty" style="display:none">Нема придонеси за овој профил.</div>
                </div>
            </section>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            var OWNER = 'martinpetkovski';
            var REPO = 'masterlista';
            var CURRENT_SYSTEM_LOGINS = { toplistamk: true };
            var LEGACY_SYSTEM_LOGINS = { martinpetkovski: true, toplistamk: true };
            var SYSTEM_CONTRIBUTOR_CUTOFF = Date.parse('2026-05-10T00:00:00.000Z');
            var METADATA_MARKER = 'MMM_CONTRIBUTION_METADATA';
            var EMAIL_RE = /([A-Z0-9._%+-]{1,64})@([A-Z0-9.-]+\.[A-Z]{2,})/ig;
            var PAGE_LIMIT = 200;
            var STATIC_CONTRIBUTIONS_FILE = 'data/dynamic/generated/contributions.json';

            function localText(key, fallback) {
                if (typeof t !== 'function') return fallback;
                var value = t(key);
                return value === key ? fallback : value;
            }

            function safeHtml(value) {
                if (typeof escHtml === 'function') return escHtml(value);
                return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
                    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
                });
            }

            function maskEmails(value) {
                return String(value || '').replace(EMAIL_RE, function(_, local, domain) {
                    return local.slice(0, Math.min(2, local.length)) + '***@' + domain.slice(0, Math.min(2, domain.length)) + '***';
                });
            }

            function contributionSubmittedAt(pr, metadata) {
                return metadata && metadata.createdAt || pr.created_at || pr.updated_at || pr.merged_at || '';
            }

            function isBeforeSystemCutoff(value) {
                var timestamp = Date.parse(value || '');
                return Number.isFinite(timestamp) && Number.isFinite(SYSTEM_CONTRIBUTOR_CUTOFF) && timestamp < SYSTEM_CONTRIBUTOR_CUTOFF;
            }

            function isSystem(login, submittedAt) {
                var normalized = String(login || '').toLowerCase();
                if (!normalized) return false;
                if (CURRENT_SYSTEM_LOGINS[normalized]) return true;
                return isBeforeSystemCutoff(submittedAt) && !!LEGACY_SYSTEM_LOGINS[normalized];
            }

            function getProfileUser() {
                var params = new URLSearchParams(window.location.search || '');
                var user = params.get('user') || params.get('login') || '';
                if (!user && location.pathname.indexOf('/profile/') === 0) {
                    user = decodeURIComponent(location.pathname.substring('/profile/'.length).replace(/\/$/, ''));
                }
                return String(user || '').trim();
            }

            function staticContributionsUrl() {
                var path = location.protocol === 'file:' ? STATIC_CONTRIBUTIONS_FILE : '/' + STATIC_CONTRIBUTIONS_FILE;
                return path + '?t=' + Date.now();
            }

            async function loadStaticContributions() {
                var resp = await fetch(staticContributionsUrl());
                if (!resp.ok) throw new Error('Static contributions snapshot unavailable: ' + resp.status);
                var snapshot = await resp.json();
                if (!snapshot || !Array.isArray(snapshot.records) || !Array.isArray(snapshot.leaderboard)) {
                    throw new Error('Static contributions snapshot is invalid.');
                }
                return snapshot;
            }

            function workerBase() {
                var base = window.MMMAuth && typeof window.MMMAuth.getEndpoint === 'function'
                    ? window.MMMAuth.getEndpoint()
                    : (localStorage.getItem('mmm_pr_endpoint') || 'https://muzichka-master-lista.deeeeelay.workers.dev');
                return base.replace(/\/+$/, '');
            }

            function workerUrl(offset) {
                return workerBase() + '/contributions?limit=' + PAGE_LIMIT + '&pending_limit=0&offset=' + offset;
            }

            function extractContributionMetadata(body) {
                if (!body || typeof body !== 'string') return null;
                var re = new RegExp('<!--\\s*' + METADATA_MARKER + '\\s*([\\s\\S]*?)\\s*-->', 'm');
                var match = body.match(re);
                if (!match || !match[1]) return null;
                try {
                    var parsed = JSON.parse(match[1]);
                    if (parsed && parsed.source === 'site' && parsed.submitter && parsed.submitter.login) return parsed;
                } catch (_) {}
                return null;
            }

            function publicUser(user) {
                user = user || {};
                return {
                    id: user.id || null,
                    login: user.login || '',
                    name: user.name || '',
                    avatar_url: user.avatar_url || '',
                    html_url: user.html_url || (user.login ? 'https://github.com/' + user.login : '')
                };
            }

            function buildRecord(pr, status) {
                var metadata = extractContributionMetadata(pr.body || '');
                var submitter = metadata && metadata.submitter && metadata.submitter.login ? metadata.submitter : publicUser(pr.user);
                if (!submitter || !submitter.login) return null;
                var stats = contributionStats(pr, metadata);
                var contributionCount = status === 'pending' ? 0 : stats.lineChanges;
                var submittedAt = contributionSubmittedAt(pr, metadata);
                var community = isSystem(submitter.login, submittedAt);
                return {
                    prNumber: pr.number,
                    prUrl: pr.html_url,
                    title: pr.title,
                    mergedAt: pr.merged_at || '',
                    createdAt: pr.created_at,
                    submittedAt: submittedAt,
                    updatedAt: pr.updated_at,
                    additions: stats.additions,
                    deletions: stats.deletions,
                    lineChanges: stats.lineChanges,
                    contributionCount: status === 'pending' ? 0 : contributionCount,
                    contributionScore: contributionCount,
                    submitter: submitter,
                    system: community,
                    community: community,
                    status: status,
                    source: metadata ? 'site' : 'github',
                    files: metadata && Array.isArray(metadata.files) ? metadata.files : [],
                    baseBranch: pr.base && pr.base.ref || ''
                };
            }

            function toNonNegativeInteger(value) {
                var number = Number(value);
                if (!Number.isFinite(number) || number < 0) return 0;
                return Math.floor(number);
            }

            function contributionStats(pr, metadata) {
                var additions = toNonNegativeInteger(pr && pr.additions || metadata && metadata.additions);
                var deletions = toNonNegativeInteger(pr && pr.deletions || metadata && metadata.deletions);
                var lineChanges = additions + deletions;
                if (!lineChanges) lineChanges = toNonNegativeInteger(metadata && (metadata.lineChanges || metadata.contributionScore));
                if (!lineChanges) lineChanges = Number(metadata && metadata.contributionCount || 1) || 1;
                return { additions: additions, deletions: deletions, lineChanges: lineChanges };
            }

            async function loadPulls(state, maxPages) {
                var records = [];
                for (var page = 1; page <= maxPages; page++) {
                    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/pulls?state=' + state + '&sort=updated&direction=desc&per_page=100&page=' + page;
                    var resp = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
                    if (!resp.ok) throw new Error(await resp.text());
                    var prs = await resp.json();
                    if (!Array.isArray(prs) || !prs.length) break;
                    prs.forEach(function(pr) {
                        if (state === 'closed' && !pr.merged_at) return;
                        var record = buildRecord(pr, state === 'open' ? 'pending' : 'merged');
                        if (record) records.push(record);
                    });
                    if (prs.length < 100) break;
                }
                return records;
            }

            function aggregate(records, base) {
                var byUser = {};
                records.forEach(function(record) {
                    if (!record.submitter || !record.submitter.login) return;
                    var community = isCommunityRecord(record);
                    var login = community ? 'community' : record.submitter.login;
                    if (!byUser[login]) {
                        byUser[login] = {
                            login: login,
                            id: community ? null : record.submitter.id,
                            name: community ? localText('contributions.community', localText('contributions.system', 'Community')) : (record.submitter.name || ''),
                            avatar_url: community ? '/images/logo.png' : (record.submitter.avatar_url || ''),
                            html_url: community ? '' : (record.submitter.html_url || ('https://github.com/' + login)),
                            contributions: 0,
                            lineChanges: 0,
                            lastContributionAt: null,
                            system: community,
                            community: community
                        };
                    }
                    byUser[login].contributions += Number(record.contributionCount || 0);
                    byUser[login].lineChanges += Number(record.lineChanges != null ? record.lineChanges : record.contributionCount || 0);
                    if (!byUser[login].lastContributionAt || String(record.mergedAt || '') > String(byUser[login].lastContributionAt || '')) {
                        byUser[login].lastContributionAt = record.mergedAt;
                    }
                });
                var rank = 1;
                var leaderboard = Object.keys(byUser).map(function(login) { return byUser[login]; })
                    .sort(function(a, b) { return (b.contributions - a.contributions) || String(a.login).localeCompare(String(b.login)); })
                    .map(function(entry) {
                        entry.rank = isCommunityEntry(entry) ? null : rank++;
                        return entry;
                    });
                var totalLineChanges = records.reduce(function(sum, record) { return sum + Number(record.contributionCount || 0); }, 0);
                return Object.assign({}, base || {}, {
                    scoreMode: 'line_changes',
                    leaderboard: leaderboard,
                    totalContributors: leaderboard.filter(function(entry) { return !isCommunityEntry(entry); }).length,
                    totalContributions: totalLineChanges,
                    totalLineChanges: totalLineChanges,
                    records: records
                });
            }

            async function loadFromWorker() {
                var offset = 0;
                var allRecords = [];
                var first = null;
                while (true) {
                    var resp = await fetch(workerUrl(offset));
                    if (!resp.ok) throw new Error(await resp.text());
                    var chunk = await resp.json();
                    if (!first) first = chunk;
                    var records = Array.isArray(chunk.records) ? chunk.records : [];
                    allRecords = allRecords.concat(records);
                    offset += Number(chunk.limit || PAGE_LIMIT) || PAGE_LIMIT;
                    if (!records.length || offset >= Number(chunk.totalRecords || allRecords.length)) break;
                }
                return aggregate(allRecords, first || {});
            }

            async function loadFromGitHub() {
                var records = await loadPulls('closed', 10);
                records.sort(function(a, b) { return String(b.mergedAt || '').localeCompare(String(a.mergedAt || '')); });
                return aggregate(records, { generatedAt: new Date().toISOString() });
            }

            function displayName(user) {
                return maskEmails((user && (user.name || user.login)) || 'GitHub');
            }

            function displayLogin(login) {
                return maskEmails(login || '');
            }

            function displayTitle(title) {
                return maskEmails(title || '');
            }

            function contributionFileLabel(filePath) {
                var normalized = String(filePath || '').replace(/\\/g, '/').trim();
                if (!normalized) return '';
                var baseName = normalized.split('/').pop().toLowerCase();
                if (baseName === 'bands.json') return localText('common.masterList', localText('drafts.masterList', 'Artists'));
                if (baseName === 'events.json') return localText('drafts.events', 'Events');
                if (baseName === 'releases.json') return localText('nav.releases', 'Releases');
                if (baseName === 'curators.json') return localText('nav.curators', 'Curators');
                if (baseName === 'articles.json' || baseName === 'articles-filtered.json') return localText('nav.news', 'News');
                if (baseName === 'interviews.json' || baseName === 'interviews-filtered.json') return localText('nav.interviews', 'Interviews');
                if (baseName === 'radio-stations.json') return localText('nav.radio', 'Radio');
                var stem = baseName.replace(/\.(json|md|txt)$/i, '').replace(/[-_]+/g, ' ').trim();
                return stem ? stem.replace(/\b[a-z]/g, function(match) { return match.toUpperCase(); }) : normalized;
            }

            function formatDate(value) {
                if (!value) return '';
                try {
                    var lang = typeof getLanguage === 'function' ? getLanguage() : 'mk';
                    return new Intl.DateTimeFormat(lang, { dateStyle: 'medium' }).format(new Date(value));
                } catch (_) {
                    return String(value).slice(0, 10);
                }
            }

            function isCommunityRecord(record) {
                return !!(record && (record.community || record.system));
            }

            function isCommunityEntry(entry) {
                return !!(entry && (entry.community || entry.system));
            }

            function isCommunityProfileName(value) {
                var normalized = String(value || '').toLowerCase();
                return normalized === 'community' || normalized === 'system';
            }

            function matchesProfile(record, requestedUser) {
                if (!requestedUser) return false;
                if (isCommunityProfileName(requestedUser)) return isCommunityRecord(record);
                return !isCommunityRecord(record) && record.submitter && String(record.submitter.login || '').toLowerCase() === requestedUser.toLowerCase();
            }

            function renderContribution(record) {
                var files = (record.files || []).map(function(file) { return '<span class="profile-file"><i class="fas fa-file-lines"></i>' + safeHtml(contributionFileLabel(file)) + '</span>'; }).join('');
                var community = isCommunityRecord(record);
                var scoreValue = Number(record.contributionCount || record.lineChanges || 0);
                var pointsLabel = localText('contributions.lineChanges', localText('contributions.total', 'Points'));
                var communityIcon = community ? '<i class="profile-kind-icon fas fa-people-group" aria-hidden="true"></i>' : '';
                return '<article class="profile-contribution' + (community ? ' community-entry' : '') + '">' +
                    '<div class="profile-contribution-main">' +
                        '<a class="profile-contribution-title" href="' + safeHtml(record.prUrl) + '" target="_blank" rel="noopener">' + communityIcon + '<i class="fas fa-code-merge"></i><span>#' + record.prNumber + ' ' + safeHtml(displayTitle(record.title)) + '</span></a>' +
                        '<div class="profile-meta"><span><i class="fas fa-calendar-day"></i>' + safeHtml(formatDate(record.mergedAt || record.updatedAt || record.createdAt)) + '</span></div>' +
                    '</div>' +
                    '<div class="profile-score"><strong>' + Number(scoreValue || 0).toLocaleString() + '</strong><span title="' + safeHtml(pointsLabel) + '" aria-label="' + safeHtml(pointsLabel) + '"><i class="fas fa-star"></i></span></div>' +
                    (files ? '<div class="profile-files">' + files + '</div>' : '') +
                '</article>';
            }

            function render(data, requestedUser) {
                var isSystemProfile = isCommunityProfileName(requestedUser);
                var records = (data.records || []).filter(function(record) { return matchesProfile(record, requestedUser); });
                var entry = (data.leaderboard || []).find(function(item) {
                    return isSystemProfile ? isCommunityEntry(item) : String(item.login || '').toLowerCase() === requestedUser.toLowerCase();
                });
                var firstUser = records[0] && records[0].submitter || {};
                var name = isSystemProfile ? localText('contributions.community', localText('contributions.system', 'Community')) : displayName(entry || firstUser || { login: requestedUser });
                var login = isSystemProfile ? 'community' : (entry && entry.login || firstUser.login || requestedUser);
                var avatar = isSystemProfile ? '/images/logo.png' : (entry && entry.avatar_url || firstUser.avatar_url || '/images/logo.png');
                var total = records.reduce(function(sum, record) { return sum + Number(record.contributionCount || 0); }, 0);
                var hasRank = !isSystemProfile && entry && entry.rank;
                var rank = hasRank ? ('#' + entry.rank) : '—';
                var pointsLabel = localText('contributions.lineChanges', localText('contributions.total', 'Points'));
                var profileType = localText('pages.profile', 'Profile');
                var rankLabel = hasRank ? localText('contributions.leaderboard', 'Leaderboard') : localText('contributions.notRanked', 'Not ranked');

                document.title = name + ' | ТопЛиста.мк';
                var header = document.getElementById('site-header');
                if (header) header.setAttribute('data-title', name);
                var h1 = header && header.querySelector('h1');
                if (h1) h1.textContent = name;

                document.getElementById('profile-card').innerHTML =
                    '<img class="profile-avatar" src="' + safeHtml(avatar) + '" alt="" loading="lazy">' +
                    '<div class="profile-title"><div class="profile-heading-line">' +
                        '<div class="profile-identity"><span class="profile-kicker"><i class="' + (isSystemProfile ? 'fas fa-people-group' : 'fas fa-user') + '"></i>' + safeHtml(profileType) + '</span><h2>' + safeHtml(name) + '</h2><span class="profile-handle">@' + safeHtml(displayLogin(login)) + '</span></div>' +
                        '<div class="profile-scoreboard" aria-label="' + safeHtml(pointsLabel + ' / ' + rankLabel) + '">' +
                            '<div class="profile-chart-stat profile-chart-stat--points"><strong class="profile-chart-value">' + Number(total || 0).toLocaleString() + '</strong><span class="profile-chart-label"><i class="fas fa-star"></i>' + safeHtml(pointsLabel) + '</span></div>' +
                            '<div class="profile-chart-stat profile-chart-stat--rank"><strong class="profile-chart-value">' + safeHtml(rank) + '</strong><span class="profile-chart-label"><i class="fas fa-ranking-star"></i>' + safeHtml(rankLabel) + '</span></div>' +
                        '</div>' +
                    '</div></div>';
                document.getElementById('profile-list-title').textContent = localText('profile.contributions', 'Contributions');
                document.getElementById('profile-empty').style.display = records.length ? 'none' : 'block';
                document.getElementById('profile-list').innerHTML = records.map(renderContribution).join('');
            }

            async function load() {
                var requestedUser = getProfileUser();
                var loading = document.getElementById('profile-loading');
                var error = document.getElementById('profile-error');
                var content = document.getElementById('profile-content');
                if (!requestedUser) {
                    loading.style.display = 'none';
                    error.style.display = '';
                    error.textContent = 'Недостасува корисник.';
                    return;
                }
                try {
                    var data;
                    try {
                        data = await loadStaticContributions();
                    } catch (_) {
                        try {
                            data = await loadFromWorker();
                        } catch (_) {
                            data = await loadFromGitHub();
                        }
                    }
                    render(data, requestedUser);
                    loading.style.display = 'none';
                    content.style.display = '';
                } catch (err) {
                    console.error('Failed to load profile:', err);
                    loading.style.display = 'none';
                    error.style.display = '';
                }
            }

            if (typeof onLanguageChange === 'function') onLanguageChange(function() { load(); });
            load();
        })();
    </script>
</body>
</html>
