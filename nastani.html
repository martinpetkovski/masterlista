    <style>
    /* === Events-specific overrides === */

    /* Masked date/time input wrapper */
    .masked-input-wrap {
        position: relative;
        display: block;
    }
    .masked-input-wrap input {
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        background: transparent;
        position: relative;
        z-index: 1;
        caret-color: var(--text-primary);
        color: var(--text-primary);
    }
    .masked-input-wrap .mask-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        padding: 0.45rem 0.6rem;
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        font-size: 0.8rem;
        pointer-events: none;
        z-index: 2;
    }
    .masked-input-wrap .mask-overlay .filled { visibility: hidden; }
    .masked-input-wrap .mask-overlay .placeholder { color: var(--text-muted); opacity: 0.45; }
    .masked-input-wrap .mask-overlay .separator {
        color: var(--text-muted);
        opacity: 0.5;
        visibility: hidden;
    }
    .masked-input-wrap input.mask-invalid {
        color: #ef4444 !important;
    }

    /* Artist tags */
    .nastani-page .artist-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        padding: 0.08rem 0.35rem;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        text-decoration: none;
        transition: border-color 0.15s, background 0.15s;
        cursor: pointer;
    }
    .nastani-page .artist-tag:hover {
        border-color: var(--accent-blue);
        background: rgba(34, 92, 228, 0.06);
    }
    .nastani-page .artist-tag i {
        font-size: 0.5rem;
        color: var(--accent-purple, var(--accent-blue));
    }

    /* Ticket tags */
    .nastani-page .ticket-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        background: rgba(34, 92, 228, 0.06);
        border: 1px solid rgba(34, 92, 228, 0.15);
        padding: 0.08rem 0.35rem;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 600;
        color: var(--accent-blue);
        white-space: nowrap;
    }
    .nastani-page .ticket-tag i { font-size: 0.5rem; }

    /* Countdown badge */
    .nastani-page .countdown-badge {
        display: inline-block;
        font-size: 0.55rem;
        font-weight: 700;
        padding: 0.06rem 0.35rem;
        border-radius: 999px;
        white-space: nowrap;
        vertical-align: middle;
    }
    .nastani-page .countdown-badge.today-cd {
        background: rgba(34, 197, 94, 0.15);
        color: #16a34a;
        border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .nastani-page .countdown-badge.soon {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .nastani-page .countdown-badge.later {
        background: rgba(34, 92, 228, 0.08);
        color: var(--accent-blue);
        border: 1px solid rgba(34, 92, 228, 0.15);
    }
    .nastani-page .countdown-badge.passed {
        background: rgba(139, 146, 154, 0.06);
        color: var(--text-muted);
        border: 1px solid var(--border-color);
    }

    /* Scrollable cells */
    .nastani-page .cell-scroll {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 0.15rem;
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
        position: relative;
        -webkit-mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
        mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
    }
    .nastani-page .cell-scroll::-webkit-scrollbar { display: none; }

    /* Link button */
    .nastani-page .event-link-btn {
        color: var(--accent-blue);
        font-size: 0.72rem;
        text-decoration: none;
        transition: opacity 0.15s;
    }
    .nastani-page .event-link-btn:hover { opacity: 0.7; }

    /* Search wrap (matching site-wide style) */
    .nastani-page .events-search-wrap {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex: 1;
        min-width: 200px;
        position: relative;
        min-height: 36px;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        cursor: text;
        transition: border-color 0.15s, box-shadow 0.15s;
        margin-left: 0.75rem;
    }
    .nastani-page .events-search-wrap:focus-within {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(29,155,240,0.12);
    }
    body.dark-mode .nastani-page .events-search-wrap {
        background: var(--bg-secondary);
        border-color: var(--border-color);
    }
    body.dark-mode .nastani-page .events-search-wrap:focus-within {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(29,155,240,0.2);
    }
    .nastani-page .events-search-wrap i {
        color: var(--text-muted);
        font-size: 0.8rem;
        flex-shrink: 0;
    }
    .nastani-page #search-events {
        flex: 1;
        min-width: 100px;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 0.82rem;
        font-family: 'Inter', sans-serif;
        padding: 0.2rem 0;
        height: 30px;
    }
    .nastani-page #search-events::placeholder { color: var(--text-muted); }
    /* Filter bar (same as charts.html) */
    .nastani-page .chart-filter-bar {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 0.5rem 1rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        align-items: center;
        gap: 0;
    }
    body.dark-mode .nastani-page .chart-filter-bar {
        background: var(--bg-secondary);
        border-bottom-color: var(--border-color);
    }
    .nastani-page .filter-presets {
        display: flex;
        align-items: center;
        gap: 0;
        flex-shrink: 0;
    }
    .nastani-page .filter-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 0.65rem;
        font-size: 0.7rem;
        font-weight: 500;
        border: 1px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
    }
    .nastani-page .filter-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
    }
    .nastani-page .filter-btn.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: var(--bg-primary);
    }
    .nastani-page .filter-btn i { font-size: 0.65rem; }
    body.dark-mode .nastani-page .filter-btn {
        background: var(--bg-hover);
        border-color: var(--border-color);
        color: var(--text-secondary);
    }
    body.dark-mode .nastani-page .filter-btn:hover {
        background: #2a2e36;
        color: var(--text-primary);
    }
    body.dark-mode .nastani-page .filter-btn.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: var(--bg-primary);
    }
    .nastani-page .preset-btn {
        border-radius: 0;
        font-family: 'Montserrat', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-weight: 600;
        font-size: 0.72rem;
        padding: 0.3rem 0.85rem;
        height: 32px;
        margin-left: -1px;
    }
    .nastani-page .preset-btn:first-child { margin-left: 0; }
    .nastani-page .preset-btn:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
        z-index: 1;
    }
    .nastani-page .preset-btn.active {
        border-color: #000;
        background: #000;
        color: #fff;
        z-index: 2;
    }
    body.dark-mode .nastani-page .preset-btn.active {
        border-color: #fff;
        background: #fff;
        color: #000;
    }
    body.dark-mode .nastani-page .artist-tag {
        background: var(--bg-primary);
    }

    /* Autocomplete for artist input in modal */
    .nastani-page .artist-ac-wrapper {
        position: relative;
    }
    .nastani-page .artist-ac-list {
        position: absolute;
        left: 0; right: 0; top: 100%;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        max-height: 180px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        display: none;
    }
    .nastani-page .artist-ac-list.open { display: block; }
    .nastani-page .artist-ac-item {
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
        color: var(--text-primary);
        cursor: pointer;
        transition: background 0.1s;
    }
    .nastani-page .artist-ac-item:hover,
    .nastani-page .artist-ac-item.hl {
        background: var(--bg-hover);
    }
    .nastani-page .artist-ac-item .ac-city {
        font-size: 0.62rem;
        color: var(--text-muted);
        margin-left: 0.3rem;
    }
    body.dark-mode .nastani-page .artist-ac-list {
        background: var(--bg-secondary);
        border-color: var(--border-color);
    }

    .nastani-page .event-artists-shell { position: relative; }
    .nastani-page .event-artists-shell .token-entry-input { min-width: 88px; }
    .nastani-page .artist-entries-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .nastani-page .artist-token-chip {
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-teal));
        color: #fff;
        border: none;
    }
    .nastani-page .entry-remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.78rem; padding: 0.2rem; }
    .nastani-page .ticket-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .ticket-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .ticket-entry-row input { flex: 1; }
    .nastani-page .link-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .link-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .link-entry-row input { flex: 1; }

    .nastani-page .add-entry-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--site-button-fg, #fff);
        background: var(--site-button-bg, #000);
        border: 2px solid var(--site-button-border, #000);
        border-radius: 0;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        margin-top: 0.25rem;
        line-height: 1;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: filter 0.12s ease, box-shadow 0.12s ease, background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nastani-page .add-entry-btn::before,
    .nastani-page #save-event-btn::before,
    .nastani-page .delete-event-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
        transform: translateX(-100%);
        pointer-events: none;
        z-index: 0;
    }
    body.dark-mode .nastani-page .add-entry-btn::before,
    body.dark-mode .nastani-page #save-event-btn::before,
    body.dark-mode .nastani-page .delete-event-btn::before {
        background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.12) 50%, transparent 100%);
    }
    .nastani-page .add-entry-btn > *,
    .nastani-page #save-event-btn > *,
    .nastani-page .delete-event-btn > * {
        position: relative;
        z-index: 1;
    }
    .nastani-page .add-entry-btn:hover {
        filter: brightness(1.15);
    }

    .nastani-page .add-entry-btn.button-positive,
    .nastani-page #save-event-btn.button-positive {
        background: var(--site-button-positive-bg, #16a34a);
        border-color: var(--site-button-positive-border, #16a34a);
        color: var(--site-button-positive-fg, #fff);
    }

    .nastani-page .delete-event-btn.button-danger {
        background: var(--site-button-danger-bg, #dc2626);
        border-color: var(--site-button-danger-border, #dc2626);
        color: var(--site-button-danger-fg, #fff);
    }
    .nastani-page .add-entry-btn:hover::before,
    .nastani-page #save-event-btn:hover::before,
    .nastani-page .delete-event-btn:hover::before {
        animation: btnSweep 0.4s ease-out forwards;
    }

    .nastani-page .delete-event-btn {
        display: none;
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.5rem;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        border: 2px solid rgba(239, 68, 68, 0.75);
        border-radius: 0;
        background: rgba(239, 68, 68, 0.06);
        color: #ef4444;
        cursor: pointer;
        line-height: 1;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: background 0.15s;
    }
    .nastani-page .delete-event-btn:hover { background: rgba(239, 68, 68, 0.12); }

    /* Notification */
    .nastani-notification {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-primary);
        z-index: 2000;
        max-width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        animation: notifIn 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: opacity 0.3s ease;
    }
    .nastani-notification.success { border-color: #22c55e; }
    .nastani-notification.success i { color: #22c55e; }
    .nastani-notification.error { border-color: #ef4444; }
    .nastani-notification.error i { color: #ef4444; }
    .nastani-notification.info { border-color: var(--accent-blue); }
    .nastani-notification.info i { color: var(--accent-blue); }
    @keyframes notifIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    body.dark-mode .nastani-notification { background: var(--bg-secondary); }

    .nastani-page #save-event-btn {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--site-button-fg, #fff);
        background: var(--site-button-bg, #000);
        border: 2px solid var(--site-button-border, #000);
        border-radius: 0;
        cursor: pointer;
        line-height: 1;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: filter 0.12s ease, box-shadow 0.12s ease, background var(--transition), color var(--transition), border-color var(--transition);
    }
    .nastani-page #save-event-btn:hover { filter: brightness(1.15); }
    .nastani-page #save-event-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== TIMELINE LAYOUT ===== */
    .nastani-page .timeline-container {
        position: relative;
        padding: 0;
    }
    /* SVG timeline line */
    .nastani-page .tl-svg-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    /* Empty state */
    .nastani-page .tl-empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        position: relative;
        z-index: 2;
    }

    /* Month header */
    .nastani-page .tl-month-header {
        display: flex;
        align-items: center;
        padding: 0.15rem 0.5rem 0.15rem 0;
        position: relative;
        z-index: 2;
        border-top: none;
        background-color: #000;
        color: #fff;
    }
    body.dark-mode .nastani-page .tl-month-header {
        background-color: #fff;
        color: #000;
    }

    .nastani-page .tl-month-date-col {
        width: 44px;
        flex-shrink: 0;
    }
    .nastani-page .tl-month-node {
        width: 20px;
        flex-shrink: 0;
    }
    .nastani-page .tl-month-content {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        min-width: 0;
        padding-left: 0.3rem;
    }
    .nastani-page .tl-month-label {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        white-space: nowrap;
        color: inherit;
    }

    /* Today marker */
    .nastani-page .tl-today-marker {
        display: flex;
        align-items: center;
        padding: 0.5rem 0.5rem 0.5rem 0;
        position: relative;
        z-index: 3;
        background: #e53935;
    }

    .nastani-page .tl-today-date-col {
        display: none;
    }
    .nastani-page .tl-today-node {
        width: 20px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        position: relative;
        z-index: 2;
        margin-left: 0.35rem;
    }
    .nastani-page .tl-today-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35), 0 0 14px rgba(255, 255, 255, 0.45);
        animation: todayPulse 1.4s ease-in-out infinite;
    }
    body.dark-mode .nastani-page .tl-today-dot {
        background: #fff;
        border-color: #fff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35), 0 0 14px rgba(255, 255, 255, 0.45);
    }
    @keyframes todayPulse {
        0%, 100% { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35), 0 0 14px rgba(255, 255, 255, 0.45); transform: scale(1); }
        50% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.18), 0 0 24px rgba(255, 255, 255, 0.55); transform: scale(1.15); }
    }
    .nastani-page .tl-today-content {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        min-width: 0;
        padding-left: 0.4rem;
    }
    .nastani-page .tl-today-label {
        background: transparent;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.7rem;

    <div id="nastani-notifications"></div>

    <script>
    (function() {
        'use strict';

        var EVENTS_JSON_URL = 'events.json';
        var BANDS_JSON_URL = 'bands.json';
        var PR_ENDPOINT = 'https://muzichka-master-lista.deeeeelay.workers.dev';
        var EVENTS_FILE_PATH = 'events.json';

        var MK_MONTHS = t('months.short');

        // Cyrillic transliteration, slug, URL from common.js
        var transliterate = transliterateCyrillicToLatin;
        var artistSlug = generateArtistSlug;
        var artistUrl = getArtistPageUrl;

        var allEvents = [];
        var masterArtists = [];
        var currentFilter = 'all';
        var searchQuery = '';
        var editingEventId = null;

        // Settings menu + nav menu from common.js
        initSettingsMenu();
        initNavMenu();

        // ==================== SEARCH TOGGLE ====================
        (function() {
            var btn = document.getElementById('search-toggle-btn');
            var controls = document.getElementById('controls-bar');
            var searchInput = document.getElementById('search-events');
            if (!btn || !controls) return;
            btn.addEventListener('click', function() {
                var isVisible = controls.classList.toggle('visible');
                btn.innerHTML = '<i class="fas ' + (isVisible ? 'fa-times' : 'fa-search') + '"></i>';
                if (isVisible) {
                    searchInput.focus();
                } else {
                    // Clear search when hiding
                    if (searchInput.value) {
                        searchInput.value = '';
                        searchQuery = '';
                        renderTable();
                    }
                }
            });
        })();



        // ==================== HELPERS ====================
        function getToday() { var d = new Date(); d.setHours(0,0,0,0); return d; }
        function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
        function daysUntil(s) { return Math.ceil((parseDate(s) - getToday()) / 86400000); }

        function getDayName(dateStr) {
            var days = t('days.long');
            var p = dateStr.split('-');
            var d = new Date(+p[0], +p[1]-1, +p[2]);
            return days[d.getDay()];
        }

        function countdownText(dateStr) {
            var d = daysUntil(dateStr);
            var day = getDayName(dateStr);
            if (d === 0) return { text: t('events.today'), cls: 'today-cd' };
            if (d === 1) return { text: t('events.tomorrow').replace('{0}', day), cls: 'soon' };
            if (d > 1 && d <= 7) return { text: t('events.inDays').replace('{0}', d).replace('{1}', day), cls: 'soon' };
            if (d > 7 && d <= 30) return { text: t('events.inDays').replace('{0}', d).replace('{1}', day), cls: 'later' };
            if (d > 30) { var m = Math.floor(d / 30); return { text: m === 1 ? t('events.inMonth') : t('events.inMonths').replace('{0}', m), cls: 'later' }; }
            if (d === -1) return { text: t('events.yesterday'), cls: 'passed' };
            if (d < -1 && d >= -30) return { text: t('events.daysAgo').replace('{0}', Math.abs(d)), cls: 'passed' };
            if (d < -30) { var mo = Math.floor(Math.abs(d) / 30); return { text: mo === 1 ? t('events.monthAgoSingle') : t('events.monthsAgo').replace('{0}', mo), cls: 'passed' }; }
            return { text: '', cls: '' };
        }

        function esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
        function escA(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function buildLocalEventEditorUrl(eventId) {
            if (eventId) return 'nastan.html?id=' + encodeURIComponent(eventId) + '&editor=1';
            return 'nastan.html?editor=1&new=1';
        }

        /** Normalize event links: supports legacy .link (string) and new .links (array of {label,url}) */
        function getEventLinks(evt) {
            if (evt.links && Array.isArray(evt.links) && evt.links.length) return evt.links;
            if (evt.link) return [{ label: '', url: evt.link }];
            return [];
        }

        function generateId(title, date) {
            var slug = title.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
            return 'evt-' + date.replace(/-/g, '') + '-' + (slug || 'event') + '-' + Math.random().toString(36).slice(2, 6);
        }

        // ==================== NOTIFICATION ====================
        function notify(msg, type) {
            type = type || 'info';
            var c = document.getElementById('nastani-notifications');
            var el = document.createElement('div');
            el.className = 'nastani-notification ' + type;
            var ic = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            el.innerHTML = '<i class="fas ' + (ic[type]||ic.info) + '"></i> ' + msg;
            c.appendChild(el);
            setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 4000);
        }

        // ==================== LOAD DATA ====================
        var originalEventsJSON = null; // keep original for diff comparison

        async function loadData() {
            var loadingBar = document.getElementById('loading-bar');
            loadingBar.classList.add('active');
            try {
                var [evtRes, bandsRes] = await Promise.all([
                    fetch(EVENTS_JSON_URL + '?v=' + Date.now()),
                    fetch(BANDS_JSON_URL + '?v=' + Date.now())
                ]);
                if (!evtRes.ok) throw new Error('events load fail');
                var evtData = await evtRes.json();
                allEvents = evtData.events || [];
                originalEventsJSON = JSON.stringify(allEvents);

                if (bandsRes.ok) {
                    var bandsData = await bandsRes.json();
                    var rawBands = bandsData.muzickaMasterLista || [];
                    registerArtistNames(rawBands);
                    masterArtists = rawBands.map(function(b) {
                        return { name: b.name, city: b.city || '', image: (b.image || '').replace(/&amp;/g, '&') };
                    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
                }

                // Overlay draft bands so newly-added artists are immediately selectable
                _refreshMasterArtistsFromDrafts();

                // Restore any pending event drafts from localStorage
                if (window.MMMDrafts) {
                    var draft = window.MMMDrafts.load('events.json');
                    if (draft && draft.events && Array.isArray(draft.events)) {
                        allEvents = draft.events;
                        notify(t('events.unsavedChanges'), 'info');
                    }
                }

                updateStats();
                renderTable();
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('events-timeline').innerHTML =
                    '<div class="tl-empty"><i class="fas fa-exclamation-triangle" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i> ' + t('events.loadError') + '</div>';
            } finally {
                loadingBar.classList.remove('active');
            }
        }

        /**
         * Merge draft bands into masterArtists so that bands added/edited
         * via the master list are immediately available in the artist autocomplete.
         */
        function _refreshMasterArtistsFromDrafts() {
            if (!window.MMMDrafts) return;
            var draft = window.MMMDrafts.load('bands.json');
            if (draft && draft.muzickaMasterLista && Array.isArray(draft.muzickaMasterLista)) {
                masterArtists = draft.muzickaMasterLista.map(function(b) {
                    return { name: b.name, city: b.city || '', image: (b.image || '').replace(/&amp;/g, '&') };
                }).sort(function(a, b) { return a.name.localeCompare(b.name); });
            }
        }

        // Listen for draft discard events (from the floating bar)
        window.addEventListener('mmm-drafts-discarded', function() {
            // Reload original data
            if (originalEventsJSON) {
                allEvents = JSON.parse(originalEventsJSON);
                updateStats();
                renderTable();
            }
            // Revert artist list to server baseline
            _refreshMasterArtistsFromDrafts();
        });

        // Listen for successful draft submission
        window.addEventListener('mmm-drafts-submitted', function() {
            // The submitted data becomes the new baseline
            originalEventsJSON = JSON.stringify(allEvents);
        });

        // When drafts change in another tab (cross-page sync),
        // refresh the artist autocomplete list immediately.
        window.addEventListener('mmm-drafts-changed', function() {
            _refreshMasterArtistsFromDrafts();
        });

        function updateStats() {
            var today = getToday(), up = 0, pa = 0;
            allEvents.forEach(function(e) { if (parseDate(e.date) >= today) up++; else pa++; });
            document.getElementById('stat-total').textContent = allEvents.length;
            document.getElementById('stat-upcoming').textContent = up;
            document.getElementById('stat-past').textContent = pa;
        }

        // ==================== RENDER TIMELINE ====================
        var MK_MONTHS_FULL = t('months.full');
        var MK_DAYS_SHORT = t('days.short');

        function renderTable() {
            var container = document.getElementById('events-timeline');
            var today = getToday();
            var q = searchQuery.toLowerCase();

            var filtered = allEvents.filter(function(e) {
                if (currentFilter === 'upcoming' && parseDate(e.date) < today) return false;
                if (currentFilter === 'past' && parseDate(e.date) >= today) return false;
                if (q) {
                    var artists = (e.artists || e.bands || []).join(' ').toLowerCase();
                    var hay = (e.title + ' ' + e.place + ' ' + artists).toLowerCase();
                    if (hay.indexOf(q) === -1) return false;
                }
                return true;
            });

            // Sort: farthest future at top, farthest past at bottom
            filtered.sort(function(a, b) {
                return parseDate(b.date) - parseDate(a.date);
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="tl-empty">' +
                    '<i class="fas fa-calendar-xmark" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i>' +
                    (q ? t('events.noSearchResults').replace('{0}', esc(q)) : t('events.noEvents')) + '</div>';
                return;
            }

            var html = '';
            var todayInserted = false;
            var todayZoneOpen = false;
            var lastMonth = '';
            var lastDateStr = '';
            var dateGroupIdx = -1;

            // Direction indicator at top
            if (currentFilter !== 'past') {
                html += '<div class="tl-direction"><span class="tl-direction-label"><i class="fas fa-arrow-up"></i> ' + t('events.upcoming') + '</span></div>';
            }

            for (var i = 0; i < filtered.length; i++) {
                var evt = filtered[i];
                var evtDate = parseDate(evt.date);
                var isPast = evtDate < today;
                var isToday = daysUntil(evt.date) === 0;

                // Open today zone before first today event, with marker as header
                if (isToday && !todayZoneOpen && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                    todayZoneOpen = true;
                    todayInserted = true;
                    html += '<div class="tl-today-zone">';
                    html += '<div class="tl-today-marker" id="tl-today">' +
                        '<div class="tl-today-date-col"></div>' +
                        '<div class="tl-today-node"><div class="tl-today-dot"></div></div>' +
                        '<div class="tl-today-content">' +
                        '<span class="tl-today-label"> ' + t('events.today') + '</span>' +
                        '<div class="tl-today-line"></div>' +
                        '</div></div>';
                }

                // Insert today marker at boundary when no today events exist
                if (!todayInserted && isPast && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                    todayInserted = true;
                    if (!todayZoneOpen) {
                        todayZoneOpen = true;
                        html += '<div class="tl-today-zone">';
                        html += '<div class="tl-today-marker" id="tl-today">' +
                            '<div class="tl-today-date-col"></div>' +
                            '<div class="tl-today-node"><div class="tl-today-dot"></div></div>' +
                            '<div class="tl-today-content">' +
                            '<span class="tl-today-label"> ' + t('events.today') + '</span>' +
                            '<div class="tl-today-line"></div>' +
                            '</div></div>';
                    }
                }
                if (todayZoneOpen && !isToday) {
                    html += '</div>';
                    todayZoneOpen = false;
                    lastDateStr = '';
                }

                // Month header
                var monthKey = evtDate.getFullYear() + '-' + evtDate.getMonth();
                if (monthKey !== lastMonth) {
                    lastMonth = monthKey;
                    html += '<div class="tl-month-header">' +
                        '<div class="tl-month-date-col"></div>' +
                        '<div class="tl-month-node"></div>' +
                        '<div class="tl-month-content">' +
                        '<span class="tl-month-label">' + MK_MONTHS_FULL[evtDate.getMonth()] + ' ' + evtDate.getFullYear() + '</span>' +
                        '</div></div>';
                    lastDateStr = '';
                }

                var cd = countdownText(evt.date);
                var artists = evt.artists || evt.bands || [];
                var isTomorrow = daysUntil(evt.date) === 1;
                var itemCls = isPast ? 'past-event' : (isToday ? 'today-event' : (isTomorrow ? 'tomorrow-event' : ''));

                var dateStr = evt.date;
                var showDate = (dateStr !== lastDateStr);
                if (showDate) dateGroupIdx++;
                lastDateStr = dateStr;
                if (dateGroupIdx % 2 === 0) itemCls += ' date-group-even';

                var dayNum = String(evtDate.getDate()).padStart(2, '0');
                var weekday = MK_DAYS_SHORT[evtDate.getDay()];

                html += '<div class="tl-item ' + itemCls + '" data-id="' + escA(evt.id) + '">';

                // Date column
                html += '<div class="tl-date-col' + (showDate ? '' : ' hidden-date') + '">';
                html += '<div class="tl-day">' + dayNum + '</div>';
                html += '<div class="tl-weekday">' + weekday + '</div>';
                html += '</div>';

                // Node column (spacing for SVG line + chevrons)
                html += '<div class="tl-node-col"></div>';

                // Content — single row with columns
                html += '<div class="tl-content">';

                // Time
                html += '<span class="tl-time">' + esc(evt.time) + '</span>';

                // Artist icons — between time and name
                html += '<div class="tl-artist-icons">';
                for (var ai = 0; ai < artists.length; ai++) {
                    var artImg = '';
                    for (var mi = 0; mi < masterArtists.length; mi++) {
                        if (masterArtists[mi].name === artists[ai]) { artImg = masterArtists[mi].image; break; }
                    }
                    html += '<a href="' + escA(artistUrl(artists[ai])) + '" class="tl-artist-link" onclick="event.stopPropagation()" title="' + escA(artists[ai]) + '">';
                    if (artImg) {
                        html += '<img class="tl-artist-icon" src="' + escA(artImg) + '" alt="' + escA(artists[ai]) + '" loading="lazy" onerror="this.onerror=null;this.src=ARTIST_FALLBACK_IMG">';
                    } else {
                        var _n = artists[ai].trim();
                        // Build 2-letter initials from word boundaries
                        var _words = _n.split(/[\s\-&,]+/).filter(function(w){return w.length>0;});
                        var _init;
                        if (_words.length >= 2) {
                            _init = _words[0].charAt(0).toUpperCase() + _words[1].charAt(0).toUpperCase();
                        } else {
                            _init = _n.substring(0, 2).toUpperCase();
                        }
                        // Pick from curated palette
                        var _palette = [
                            ['#e74c3c','#c0392b'], ['#e67e22','#d35400'], ['#f1c40f','#e6a700'],
                            ['#2ecc71','#27ae60'], ['#1abc9c','#16a085'], ['#3498db','#2980b9'],
                            ['#9b59b6','#8e44ad'], ['#e84393','#d63384'], ['#fd79a8','#e17055'],
                            ['#00cec9','#0984e3'], ['#6c5ce7','#a29bfe'], ['#fdcb6e','#e17055']
                        ];
                        var _h = 0; for (var _ci = 0; _ci < _n.length; _ci++) _h = ((_h << 5) - _h + _n.charCodeAt(_ci)) | 0;
                        var _pi = ((_h % _palette.length) + _palette.length) % _palette.length;
                        var _c = _palette[_pi];
                        html += '<span class="tl-artist-icon-placeholder" style="background:linear-gradient(145deg,' + _c[0] + ',' + _c[1] + ')">' + esc(_init) + '</span>';
                    }
                    html += '<span class="tl-artist-name-tip">' + esc(localizeText(artists[ai])) + '</span>';
                    html += '</a>';
                }
                html += '</div>';

                // Name + countdown
                html += '<div class="tl-name-cell">';
                html += '<span class="tl-title">' + esc(localizeText(evt.title)) + '</span>';
                if (cd.text && !isToday) html += '<span class="countdown-badge ' + cd.cls + '">' + cd.text + '</span>';
                html += '</div>';

                // Place
                html += '<div class="tl-place">';
                if (evt.place) {
                    var mapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(evt.place);
                    html += '<a href="' + escA(mapsUrl) + '" target="_blank" rel="noopener" class="tl-place-link" onclick="event.stopPropagation()" title="' + escA(localizeText(evt.place)) + '"><i class="fas fa-location-dot"></i> ' + esc(localizeText(evt.place)) + '</a>';
                }
                html += '</div>';

                // Artists
                html += '<div class="tl-artists-cell">';
                if (artists.length) {
                    html += '<div class="cell-scroll">';
                    for (var a = 0; a < artists.length; a++) {
                        html += '<a href="' + escA(artistUrl(artists[a])) + '" class="artist-tag" onclick="event.stopPropagation()" title="' + escA(localizeText(artists[a])) + '"><i class="fas fa-music"></i> ' + esc(localizeText(artists[a])) + '</a>';
                    }
                    html += '</div>';
                }
                html += '</div>';

                // Tickets
                html += '<div class="tl-tickets-cell">';
                if (evt.tickets && evt.tickets.length) {
                    html += '<div class="cell-scroll">';
                    for (var ti = 0; ti < evt.tickets.length; ti++) {
                        var tk = evt.tickets[ti];
                        html += '<span class="ticket-tag"><i class="fas fa-ticket"></i> ' + esc(localizeText(tk.label)) + ': ' + esc(tk.price) + '</span>';
                    }
                    html += '</div>';
                }
                html += '</div>';

                // Link
                html += '<div class="tl-link-cell">';
                var evtLinks = getEventLinks(evt);
                if (evtLinks.length === 1) {
                    html += '<a href="' + escA(evtLinks[0].url) + '" target="_blank" rel="noopener" class="event-link-btn" onclick="event.stopPropagation()" title="' + escA(evtLinks[0].label || evtLinks[0].url) + '"><i class="fas fa-arrow-up-right-from-square"></i></a>';
                } else if (evtLinks.length > 1) {
                    html += '<span class="event-link-btn" style="cursor:pointer" title="' + t('events.linksCount').replace('{0}', evtLinks.length) + '">';
                    html += '<i class="fas fa-arrow-up-right-from-square"></i><sup style="font-size:0.55rem;margin-left:1px">' + evtLinks.length + '</sup>';
                    html += '</span>';
                }
                html += '</div>';

                // Edit action
                html += '<div class="tl-actions-cell">';
                html += '<button class="edit-btn" data-id="' + escA(evt.id) + '" title="' + escA(t('events.editBtn')) + '" onclick="event.stopPropagation()"><i class="fas fa-pen"></i></button>';
                html += '</div>';

                // Mobile badges (hidden on desktop)
                html += '<div class="tl-mobile-badges">';
                if (evt.place) {
                    var mapsUrl2 = 'https://www.google.com/maps/search/' + encodeURIComponent(evt.place);
                    html += '<a href="' + escA(mapsUrl2) + '" target="_blank" rel="noopener" class="tl-mobile-badge place-badge" onclick="event.stopPropagation()" title="' + escA(localizeText(evt.place)) + '"><i class="fas fa-location-dot"></i> ' + esc(localizeText(evt.place)) + '</a>';
                }
                if (evt.tickets && evt.tickets.length) {
                    for (var tki = 0; tki < evt.tickets.length; tki++) {
                        var tkm = evt.tickets[tki];
                        html += '<span class="tl-mobile-badge price-badge"><i class="fas fa-ticket"></i> ' + esc(localizeText(tkm.label)) + ': ' + esc(tkm.price) + '</span>';
                    }
                }
                html += '</div>';

                html += '</div>'; // tl-content
                html += '</div>'; // tl-item
            }

            // If all upcoming, insert today marker at end
            if (!todayInserted && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                // If zone not open yet (no today events), open it to wrap just the marker
                if (!todayZoneOpen) { todayZoneOpen = true; html += '<div class="tl-today-zone">'; }
                html += '<div class="tl-today-marker" id="tl-today">' +
                    '<div class="tl-today-date-col"></div>' +
                    '<div class="tl-today-node"><div class="tl-today-dot"></div></div>' +
                    '<div class="tl-today-content">' +
                    '<span class="tl-today-label"><i class="fas fa-location-dot"></i> ' + t('events.today') + '</span>' +
                    '<div class="tl-today-line"></div>' +
                    '</div></div>';
            }
            // Close today zone if still open
            if (todayZoneOpen) {
                html += '</div>';
                todayZoneOpen = false;
            }

            // Direction indicator at bottom
            if (currentFilter !== 'upcoming') {
                html += '<div class="tl-direction"><span class="tl-direction-label"><i class="fas fa-arrow-down"></i> ' + t('events.past') + '</span></div>';
            }

            container.innerHTML = html;

            // Draw SVG timeline line + start animation
            requestAnimationFrame(function() {
                drawTimelineSVG(0);
                startTimelineAnim();
            });

            // Scroll to today
            scrollToToday();

            // Bind edit buttons
            container.querySelectorAll('.edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.location.href = buildLocalEventEditorUrl(btn.dataset.id);
                });
            });

            // Item click to open event page
            container.querySelectorAll('.tl-item[data-id]').forEach(function(item) {
                item.addEventListener('click', function() {
                    var eid = encodeURIComponent(item.dataset.id);
                    window.location.href = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'nastan.html?id=' + eid : '/nastan/' + eid;
                });
            });
        }

        // ==================== SVG TIMELINE LINE ====================
        var _tlAnimFrame = 0;
        var _tlPhase = 0;
        var _tlLastTime = 0;
        var _tlAnimRunning = false;

        function drawTimelineSVG(phase) {
            if (typeof phase !== 'number') phase = _tlPhase;
            var container = document.getElementById('events-timeline');
            var old = container.querySelector('.tl-svg-line');
            if (old) old.remove();

            var h = container.scrollHeight;
            if (h < 20) return;

            // Center x: date(44) + half-node(10) = 54 desktop; mobile: date(28)+half-node(7)=35
            var isMobile = window.innerWidth <= 600;
            var cx = isMobile ? 35 : 54;

            // Wavy line params — phase animates over time
            var amp = 4.5;
            var freq = 0.038;
            var timelineColor = '#000';

            // Helper: get x position on wavy line at a given y with animated phase
            function wavyX(y) { return cx + Math.sin(y * freq + phase) * amp; }
            // Helper: get normalized tangent vector (dx, dy) at a given y (pointing downward along path)
            function wavyTangent(y) {
                var dx = wavyX(y + 1.5) - wavyX(y - 1.5);
                var dy = 3;
                var len = Math.sqrt(dx * dx + dy * dy);
                return { x: dx / len, y: dy / len };
            }

            // Find today marker position (use getBoundingClientRect to avoid offsetParent issues)
            var todayMarker = document.getElementById('tl-today');
            var todayFrac = null;
            if (todayMarker) {
                var cRect = container.getBoundingClientRect();
                var tRect = todayMarker.getBoundingClientRect();
                var todayY = (tRect.top - cRect.top) + tRect.height / 2;
                todayFrac = todayY / h;
            }

            // Collect row centers for chevrons
            var items = container.querySelectorAll('.tl-item');
            var rowCenters = [];
            for (var ri = 0; ri < items.length; ri++) {
                var item = items[ri];
                var ry = item.offsetTop + item.offsetHeight / 2;
                var isPast = item.classList.contains('past-event');
                var isToday = item.classList.contains('today-event');
                rowCenters.push({ y: ry, past: isPast, today: isToday });
            }

            var ns = 'http://www.w3.org/2000/svg';
            var w = container.offsetWidth || container.clientWidth || 200;
            var svg = document.createElementNS(ns, 'svg');
            svg.classList.add('tl-svg-line');
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);
            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

            // Gradient definition
            var defs = document.createElementNS(ns, 'defs');

            var grad = document.createElementNS(ns, 'linearGradient');
            grad.id = 'tlGrad';
            grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
            grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');

            function addStop(offset, color, opacity) {
                var s = document.createElementNS(ns, 'stop');
                s.setAttribute('offset', offset);
                s.setAttribute('stop-color', color);
                s.setAttribute('stop-opacity', opacity);
                grad.appendChild(s);
            }

            if (todayFrac !== null) {
                var tp = (todayFrac * 100);
                addStop('0%', timelineColor, '0.35');
                addStop(Math.max(0, tp - 3) + '%', timelineColor, '0.55');
                addStop(tp + '%', timelineColor, '1');
                addStop(Math.min(100, tp + 3) + '%', timelineColor, '0.25');
                addStop('100%', timelineColor, '0.08');
            } else {
                addStop('0%', timelineColor, '0.35');
                addStop('100%', timelineColor, '0.12');
            }

            defs.appendChild(grad);

            // Glow filter for today region
            var filter = document.createElementNS(ns, 'filter');
            filter.id = 'tlGlow';
            filter.setAttribute('x', '-50%'); filter.setAttribute('y', '-2%');
            filter.setAttribute('width', '200%'); filter.setAttribute('height', '104%');
            var blur = document.createElementNS(ns, 'feGaussianBlur');
            blur.setAttribute('stdDeviation', '3');
            blur.setAttribute('result', 'glow');
            filter.appendChild(blur);
            var merge = document.createElementNS(ns, 'feMerge');
            var mn1 = document.createElementNS(ns, 'feMergeNode');
            mn1.setAttribute('in', 'glow');
            var mn2 = document.createElementNS(ns, 'feMergeNode');
            mn2.setAttribute('in', 'SourceGraphic');
            merge.appendChild(mn1); merge.appendChild(mn2);
            filter.appendChild(merge);
            defs.appendChild(filter);

            var arrowFilter = document.createElementNS(ns, 'filter');
            arrowFilter.id = 'tlArrowGlow';
            arrowFilter.setAttribute('x', '-120%');
            arrowFilter.setAttribute('y', '-120%');
            arrowFilter.setAttribute('width', '340%');
            arrowFilter.setAttribute('height', '340%');
            var arrowShadow = document.createElementNS(ns, 'feDropShadow');
            arrowShadow.setAttribute('dx', '0');
            arrowShadow.setAttribute('dy', '0');
            arrowShadow.setAttribute('stdDeviation', isMobile ? '0.9' : '1.2');
            arrowShadow.setAttribute('flood-color', '#fff');
            arrowShadow.setAttribute('flood-opacity', '0.95');
            arrowFilter.appendChild(arrowShadow);
            defs.appendChild(arrowFilter);

            // Mask: line fades to invisible at today, scales up away from it
            if (todayFrac !== null) {
                var lineMask = document.createElementNS(ns, 'mask');
                lineMask.id = 'tlLineMask';
                lineMask.setAttribute('maskUnits', 'userSpaceOnUse');
                lineMask.setAttribute('x', '0');
                lineMask.setAttribute('y', '0');
                lineMask.setAttribute('width', w);
                lineMask.setAttribute('height', h);
                var maskGrad = document.createElementNS(ns, 'linearGradient');
                maskGrad.id = 'tlMaskGrad';
                maskGrad.setAttribute('x1', '0'); maskGrad.setAttribute('y1', '0');
                maskGrad.setAttribute('x2', '0'); maskGrad.setAttribute('y2', '1');
                var tp2 = todayFrac * 100;
                var fadeZone = 4 + Math.sin(phase * 2.5) * 1.5;
                function addMaskStop(off, op) {
                    var ms = document.createElementNS(ns, 'stop');
                    ms.setAttribute('offset', off);
                    ms.setAttribute('stop-color', 'white');
                    ms.setAttribute('stop-opacity', String(op));
                    maskGrad.appendChild(ms);
                }
                addMaskStop('0%', 1);
                addMaskStop(Math.max(0, tp2 - fadeZone - 6) + '%', 1);
                addMaskStop(Math.max(0, tp2 - fadeZone) + '%', 0.15);
                addMaskStop(tp2 + '%', 0);
                addMaskStop(Math.min(100, tp2 + fadeZone) + '%', 0.15);
                addMaskStop(Math.min(100, tp2 + fadeZone + 6) + '%', 1);
                addMaskStop('100%', 1);
                defs.appendChild(maskGrad);
                var maskRect = document.createElementNS(ns, 'rect');
                maskRect.setAttribute('x', '0');
                maskRect.setAttribute('y', '0');
                maskRect.setAttribute('width', w);
                maskRect.setAttribute('height', h);
                maskRect.setAttribute('fill', 'url(#tlMaskGrad)');
                lineMask.appendChild(maskRect);
                defs.appendChild(lineMask);
            }

            svg.appendChild(defs);

            // Build the wavy path
            var d = 'M ' + wavyX(0).toFixed(2) + ' 0';
            for (var y = 3; y <= h; y += 3) {
                d += ' L ' + wavyX(y).toFixed(2) + ' ' + y;
            }

            // Pulsing stroke width
            var strokePulse = 2 + Math.sin(phase * 2) * 0.5;

            // Main line
            var path = document.createElementNS(ns, 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', timelineColor);
            path.setAttribute('stroke-width', String(strokePulse));
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            if (todayFrac !== null) path.setAttribute('mask', 'url(#tlLineMask)');
            svg.appendChild(path);

            // Glow accent near today
            if (todayFrac !== null) {
                var glowY = todayFrac * h;
                var glowR = 40;
                var gd = 'M ' + wavyX(Math.max(0, glowY - glowR)).toFixed(2) + ' ' + Math.max(0, glowY - glowR);
                for (var gy = Math.max(3, glowY - glowR); gy <= Math.min(h, glowY + glowR); gy += 3) {
                    gd += ' L ' + wavyX(gy).toFixed(2) + ' ' + gy;
                }
                var glowPath = document.createElementNS(ns, 'path');
                glowPath.setAttribute('d', gd);
                glowPath.setAttribute('fill', 'none');
                glowPath.setAttribute('stroke', timelineColor);
                glowPath.setAttribute('stroke-width', '4');
                glowPath.setAttribute('stroke-linecap', 'round');
                glowPath.setAttribute('stroke-opacity', '0.3');
                glowPath.setAttribute('filter', 'url(#tlGlow)');
                svg.appendChild(glowPath);
            }

            // Draw animated filled-triangle arrows along the wavy line
            var arrowSize = isMobile ? 8 : 10;
            var arrowSpacing = isMobile ? 35 : 40;
            var todayY = todayFrac !== null ? todayFrac * h : -1;
            var todayExclude = isMobile ? 14 : 18;

            var phaseOffset = (phase * 30) % arrowSpacing;

            // --- Arrows above today (pointing up, streaming up) ---
            var aboveEnd = todayY >= 0 ? todayY - todayExclude : h;
            if (todayY < 0) aboveEnd = h;
            for (var ay = aboveEnd - phaseOffset; ay >= 0; ay -= arrowSpacing) {
                drawArrow(ay, false);  // false = point up
            }

            // --- Arrows below today (pointing down, streaming down) ---
            if (todayY >= 0) {
                var belowStart = todayY + todayExclude;
                for (var ay2 = belowStart + phaseOffset; ay2 <= h; ay2 += arrowSpacing) {
                    drawArrow(ay2, true);  // true = point down
                }
            }

            function drawArrow(ay, pointDown) {
                var distFromToday = todayY >= 0 ? Math.abs(ay - todayY) : 9999;
                var scaleZone = isMobile ? 55 : 75;
                var baseScale = todayY >= 0 ? Math.min(1, Math.max(0, distFromToday / scaleZone)) : 1;
                var pulse = 1 + Math.sin(phase * 3 + ay * 0.04) * 0.18;
                var scale = baseScale * pulse;
                if (scale < 0.03) return;
                var sz = arrowSize * scale;

                var apx = wavyX(ay);
                var at = wavyTangent(ay);

                // tangent points downward along path; flip for upward arrows
                var dirX, dirY;
                if (pointDown) {
                    dirX = at.x; dirY = at.y;
                } else {
                    dirX = -at.x; dirY = -at.y;
                }

                var perpX = -dirY;
                var perpY = dirX;

                var tipX = apx + dirX * sz;
                var tipY = ay + dirY * sz;
                var base1X = apx - dirX * sz * 0.6 + perpX * sz * 0.6;
                var base1Y = ay - dirY * sz * 0.6 + perpY * sz * 0.6;
                var base2X = apx - dirX * sz * 0.6 - perpX * sz * 0.6;
                var base2Y = ay - dirY * sz * 0.6 - perpY * sz * 0.6;

                var pts = tipX.toFixed(2) + ',' + tipY.toFixed(2) + ' ' +
                          base1X.toFixed(2) + ',' + base1Y.toFixed(2) + ' ' +
                          base2X.toFixed(2) + ',' + base2Y.toFixed(2);

                var tri = document.createElementNS(ns, 'polygon');
                tri.setAttribute('points', pts);
                tri.setAttribute('fill', timelineColor);
                tri.setAttribute('stroke', '#fff');
                tri.setAttribute('stroke-width', String(isMobile ? 0.8 : 1));
                tri.setAttribute('filter', 'url(#tlArrowGlow)');
                tri.setAttribute('opacity', String(Math.max(0.7, Math.min(1, scale + 0.08))));
                svg.appendChild(tri);
            }

            container.insertBefore(svg, container.firstChild);
        }

        // Animate the timeline wave continuously
        function _tlAnimLoop(ts) {
            if (!_tlAnimRunning) return;
            if (!_tlLastTime) _tlLastTime = ts;
            var dt = (ts - _tlLastTime) / 1000;
            _tlLastTime = ts;
            _tlPhase += dt * 0.267; // slow flowing speed (3x slower)
            drawTimelineSVG(_tlPhase);
            _tlAnimFrame = requestAnimationFrame(_tlAnimLoop);
        }
        function startTimelineAnim() {
            if (_tlAnimRunning) return;
            _tlAnimRunning = true;
            _tlLastTime = 0;
            _tlAnimFrame = requestAnimationFrame(_tlAnimLoop);
        }
        function stopTimelineAnim() {
            _tlAnimRunning = false;
            cancelAnimationFrame(_tlAnimFrame);
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) stopTimelineAnim();

        function scrollToToday() {

            var sc = document.querySelector('.table-scroll-container');
            var wrapper = (sc && sc.scrollHeight > sc.clientHeight) ? sc : document.querySelector('.table-wrapper');
            if (!wrapper) return;
            setTimeout(function() {
                var wrapperRect = wrapper.getBoundingClientRect();
                var markerRect = marker.getBoundingClientRect();
                // Position the "Денес" marker so that 2-3 past events
                // are visible below it for context
                var visibleHeight = wrapper.clientHeight;
                var markerOffset = markerRect.top - wrapperRect.top + wrapper.scrollTop;

        function getSelectedArtists() {
            try {
                var parsed = JSON.parse(artistTokens.dataset.values || '[]');

        function renderArtistTokens() {
            artistTokens.innerHTML = '';

                var tag = document.createElement('span');

                    artistInput.focus();

        function setSelectedArtists(values) {
            var seen = {};
            var nextValues = [];
            values.forEach(function(value) {
                var trimmed = String(value || '').trim();
                if (!trimmed) return;
                var key = trimmed.toLowerCase();
                if (seen[key]) return;
                seen[key] = true;
                nextValues.push(trimmed);
            });
            artistTokens.dataset.values = JSON.stringify(nextValues);
            renderArtistTokens();
        }

        function closeArtistSuggestions() {
            artistAcList.classList.remove('open');

            addArtists([name]);
            artistInput.value = '';
            closeArtistSuggestions();
            artistInput.focus();
        }

        function showArtistSuggestions() {
            var q = artistInput.value.trim().toLowerCase();
            var selected = new Set(getSelectedArtists().map(function(name) { return name.toLowerCase(); }));
            if (q.length < 1) { closeArtistSuggestions(); return; }
            var matches = masterArtists.filter(function(a) {
                return !selected.has(a.name.toLowerCase()) && a.name.toLowerCase().indexOf(q) !== -1;
            }).slice(0, 20);
            if (!matches.length) { closeArtistSuggestions(); return; }
            artistAcList.innerHTML = matches.map(function(a) {
                return '<div class="artist-ac-item" data-name="' + escA(a.name) + '">' +
                    esc(localizeText(a.name)) + (a.city ? '<span class="ac-city">' + esc(localizeText(a.city)) + '</span>' : '') + '</div>';
            }).join('');
            artistAcList.classList.add('open');
            artistHlIdx = -1;
            artistAcList.querySelectorAll('.artist-ac-item').forEach(function(item) {

        function hlItems(items, idx) { items.forEach(function(it, i) { it.classList.toggle('hl', i === idx); if (i === idx) it.scrollIntoView({ block: 'nearest' }); }); }

        function commitArtistEntry() {
            var value = artistInput.value.trim();
            if (!value) return true;
            var match = masterArtists.find(function(a) { return a.name.toLowerCase() === value.toLowerCase(); });
            if (!match) {
                notify(t('events.artistNotInList').replace('{0}', value), 'error');
                return false;

            pickArtist(match.name);
            return true;
        }

            if (e.key === 'ArrowDown') {
                if (!items.length) return;
                e.preventDefault();
                artistHlIdx = Math.min(artistHlIdx + 1, items.length - 1);
                hlItems(items, artistHlIdx);
            } else if (e.key === 'ArrowUp') {
                if (!items.length) return;
                e.preventDefault();
                artistHlIdx = Math.max(artistHlIdx - 1, 0);
                hlItems(items, artistHlIdx);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (artistHlIdx >= 0 && items[artistHlIdx]) {
                    pickArtist(items[artistHlIdx].dataset.name);
                    return;

                commitArtistEntry();

                var selectedArtists = getSelectedArtists();

                selectedArtists.pop();
                setSelectedArtists(selectedArtists);

        // ==================== MASKED DATE/TIME INPUTS WITH VALIDATION ====================
        (function() {
            function clampDateDigits(digits) {
                var d = digits.split('');
                // Day: 0-3 for first digit
                if (d[0] && parseInt(d[0]) > 3) d[0] = '3';
                if (d[0] === '3' && d[1] && parseInt(d[1]) > 1) d[1] = '1';
                if (d[0] === '0' && d[1] === '0') d[1] = '1';
                // Month: 0-1 for first digit
                if (d[2] && parseInt(d[2]) > 1) d[2] = '1';
                if (d[2] === '1' && d[3] && parseInt(d[3]) > 2) d[3] = '2';
                if (d[2] === '0' && d[3] === '0') d[3] = '1';
                return d.join('');
            }
            function clampTimeDigits(digits) {
                var d = digits.split('');
                // Hour: 0-2 for first digit
                if (d[0] && parseInt(d[0]) > 2) d[0] = '2';
                if (d[0] === '2' && d[1] && parseInt(d[1]) > 3) d[1] = '3';
                // Minute: 0-5 for first digit
                if (d[2] && parseInt(d[2]) > 5) d[2] = '5';
                return d.join('');
            }
            function renderOverlay(overlayEl, value, template, sepChar) {
                var digits = value.replace(/\D/g, '');
                var datePlaceholders = t('events.datePlaceholders');
                var timePlaceholders = t('events.timePlaceholders');
                var phs = (template === '__/__/____') ? datePlaceholders : timePlaceholders;
                var html = '';
                var di = 0;
                for (var i = 0; i < template.length; i++) {
                    if (template[i] === '_') {
                        if (di < digits.length) {
                            html += '<span class="filled">' + digits[di] + '</span>';
                        } else {
                            html += '<span class="placeholder">' + phs[di] + '</span>';
                        }
                        di++;
                    } else {
                        html += '<span class="separator">' + sepChar + '</span>';
                    }
                }
                overlayEl.innerHTML = html;
            }

            function setupMaskedInput(inputEl, overlayEl, template, sepChar, maxDigits, clampFn) {
                function update() {
                    var raw = inputEl.value.replace(/\D/g, '').slice(0, maxDigits);
                    raw = clampFn(raw);
                    var formatted = '';
                    for (var i = 0; i < raw.length; i++) {
                        if (template[formatted.length] !== '_') formatted += sepChar;
                        formatted += raw[i];
                    }
                    inputEl.value = formatted;
                    renderOverlay(overlayEl, formatted, template, sepChar);
                    // Validate complete value
                    if (raw.length === maxDigits) {
                        var valid = true;
                        if (maxDigits === 8) {
                            var dd = parseInt(raw.slice(0,2)), mm = parseInt(raw.slice(2,4));
                            if (dd < 1 || dd > 31 || mm < 1 || mm > 12) valid = false;
                        } else {
                            var hh = parseInt(raw.slice(0,2)), mi = parseInt(raw.slice(2,4));
                            if (hh > 23 || mi > 59) valid = false;
                        }
                        inputEl.classList.toggle('mask-invalid', !valid);
                    } else {
                        inputEl.classList.remove('mask-invalid');
                    }
                }
                inputEl.addEventListener('input', update);
                // Render initial overlay
                update();
                return update;
            }

            var dateInput = document.getElementById('evt-date');
            var timeInput = document.getElementById('evt-time');
            var dateOverlay = document.getElementById('evt-date-overlay');
            var timeOverlay = document.getElementById('evt-time-overlay');

            window._evtDateUpdate = setupMaskedInput(dateInput, dateOverlay, '__/__/____', '/', 8, clampDateDigits);
            window._evtTimeUpdate = setupMaskedInput(timeInput, timeOverlay, '__:__', ':', 4, clampTimeDigits);
        })();

        // ==================== DELETE ====================
        deleteBtn.addEventListener('click', function() {
            if (!editingEventId) return;
            if (!confirm(t('events.deleteConfirm'))) return;
            var updated = allEvents.filter(function(e) { return e.id !== editingEventId; });
            submitUpdate(updated, t('events.deletedDesc').replace('{0}', editingEventId));
        });

        // ==================== FORM SUBMIT ====================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('evt-title').value.trim();
            var dateRaw = document.getElementById('evt-date').value.trim();
            var time = document.getElementById('evt-time').value.trim();
            var place = document.getElementById('evt-place').value.trim();

            // Convert European date (dd/mm/yyyy) to ISO (YYYY-MM-DD)
            var date = '';
            if (dateRaw) {
                var dp = dateRaw.split(/[./]/);
                if (dp.length === 3 && dp[0].length === 2 && dp[1].length === 2 && dp[2].length === 4) {
                    date = dp[2] + '-' + dp[1] + '-' + dp[0];
                } else {
                    notify(t('events.dateFormatError'), 'error');
                    return;
                }
            }

            // Validate time format HH:MM
            if (time && !/^\d{2}:\d{2}$/.test(time)) {
                notify(t('events.timeFormatError'), 'error');
                return;
            }

            if (!commitArtistEntry()) return;

            var artists = getSelectedArtists();
            var invalidArtist = artists.find(function(name) {
                return !masterArtists.some(function(a) { return a.name === name; });
            });
            if (invalidArtist) {
                notify(t('events.artistNotInList').replace('{0}', invalidArtist), 'error');
                return;
            }

            var tickets = [];
            document.querySelectorAll('#ticket-entries .ticket-entry-row').forEach(function(row) {
                var l = (row.querySelector('.ticket-label-input') || {}).value || '';
                var p = (row.querySelector('.ticket-price-input') || {}).value || '';
                l = l.trim(); p = p.trim();
                if (l || p) tickets.push({ label: l || t('events.defaultTicketLabel'), price: p });
            });

            var links = [];
            document.querySelectorAll('#link-entries .link-entry-row').forEach(function(row) {
                var lbl = (row.querySelector('.link-label-input') || {}).value || '';
                var u = (row.querySelector('.link-url-input') || {}).value || '';
                lbl = lbl.trim(); u = u.trim();
                if (u) links.push({ label: lbl, url: u });
            });

            if (!title || !date || !time || !place) {
                notify(t('events.fillRequired'), 'error');
                return;
            }

            var eventObj = {
                id: editingEventId || generateId(title, date),
                title: title, date: date, time: time, place: place,
                artists: artists, tickets: tickets, links: links
            };

            var updated;
            if (editingEventId) {
                updated = allEvents.map(function(e) { return e.id === editingEventId ? eventObj : e; });
            } else {
                updated = allEvents.slice();
                updated.push(eventObj);
            }

            var desc = (editingEventId ? t('events.editedDesc') : t('events.newDesc')).replace('{0}', title).replace('{1}', date).replace('{2}', place) + (artists.length ? t('events.descArtists').replace('{0}', artists.join(', ')) : '');
            submitUpdate(updated, desc, eventObj);
        });

        /** Save changes to localStorage drafts instead of immediately submitting. */
        function submitUpdate(updatedEvents, description, eventObj) {
            updatedEvents.sort(function(a, b) { return a.date.localeCompare(b.date); });

            // Save to unified draft system
            if (window.MMMDrafts) {
                var origEvents = originalEventsJSON ? { events: JSON.parse(originalEventsJSON) } : { events: [] };
                window.MMMDrafts.save('events.json', { events: updatedEvents }, origEvents);
            }

            // Update local state so the table reflects the change
            allEvents = updatedEvents;
            updateStats();
            renderTable();
            closeModal();
        }

        // ==================== INIT ====================
        // Drag-to-scroll for .cell-scroll elements
        (function() {
            function updateFadeMask(el) {
                if (el.scrollWidth <= el.clientWidth) {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                    return;
                }
                var atStart = el.scrollLeft < 2;
                var atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 2;
                if (atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                } else {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                }
            }
            document.addEventListener('scroll', function(e) {
                var scrollEl = e.target.closest ? e.target.closest('.cell-scroll') : null;
                if (scrollEl) updateFadeMask(scrollEl);
            }, true);
            document.addEventListener('mousedown', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                scrollEl.style.cursor = 'grabbing';
                var startX = e.pageX;
                var startScrollLeft = scrollEl.scrollLeft;
                function onMove(ev) {
                    ev.preventDefault();
                    scrollEl.scrollLeft = startScrollLeft - (ev.pageX - startX);
                    updateFadeMask(scrollEl);
                }
                function onUp() {
                    scrollEl.style.cursor = 'grab';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            document.addEventListener('wheel', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                e.preventDefault();
                scrollEl.scrollLeft += e.deltaY;
                updateFadeMask(scrollEl);
            }, { passive: false });
        })();
        loadData();
    })();
    </script>
</body>
