    <style>
    /* === Events-specific overrides === */

    /* Masked date/time input wrapper */
    .masked-input-wrap {
        position: relative;
        display: block;
    }
    .masked-input-wrap input {
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        background: transparent;
        position: relative;
        z-index: 1;
        caret-color: var(--text-primary);
        color: var(--text-primary);
    }
    .masked-input-wrap .mask-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        padding: 0.45rem 0.6rem;
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        font-size: 0.8rem;
        pointer-events: none;
        z-index: 2;
    }
    .masked-input-wrap .mask-overlay .filled { visibility: hidden; }
    .masked-input-wrap .mask-overlay .placeholder { color: var(--text-muted); opacity: 0.45; }
    .masked-input-wrap .mask-overlay .separator {
        color: var(--text-muted);
        opacity: 0.5;
        visibility: hidden;
    }
    .masked-input-wrap input.mask-invalid {
        color: #ef4444 !important;
    }

    /* Artist tags */
    .nastani-page .artist-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        padding: 0.08rem 0.35rem;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        text-decoration: none;
        transition: border-color 0.15s, background 0.15s;
        cursor: pointer;
    }
    .nastani-page .artist-tag:hover {
        border-color: var(--accent-blue);
        background: rgba(74, 127, 165, 0.06);
    }
    .nastani-page .artist-tag i {
        font-size: 0.5rem;
        color: var(--accent-purple, var(--accent-blue));
    }

    /* Ticket tags */
    .nastani-page .ticket-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        background: rgba(74, 127, 165, 0.06);
        border: 1px solid rgba(74, 127, 165, 0.15);
        padding: 0.08rem 0.35rem;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 600;
        color: var(--accent-blue);
        white-space: nowrap;
    }
    .nastani-page .ticket-tag i { font-size: 0.5rem; }

    /* Countdown badge */
    .nastani-page .countdown-badge {
        display: inline-block;
        font-size: 0.55rem;
        font-weight: 700;
        padding: 0.06rem 0.35rem;
        border-radius: 999px;
        white-space: nowrap;
        vertical-align: middle;
    }
    .nastani-page .countdown-badge.today-cd {
        background: rgba(34, 197, 94, 0.15);
        color: #16a34a;
        border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .nastani-page .countdown-badge.soon {
        background: rgba(34, 197, 94, 0.1);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .nastani-page .countdown-badge.later {
        background: rgba(74, 127, 165, 0.08);
        color: var(--accent-blue);
        border: 1px solid rgba(74, 127, 165, 0.15);
    }
    .nastani-page .countdown-badge.passed {
        background: rgba(139, 146, 154, 0.06);
        color: var(--text-muted);
        border: 1px solid var(--border-color);
    }

    /* Scrollable cells */
    .nastani-page .cell-scroll {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 0.15rem;
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
        position: relative;
        -webkit-mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
        mask-image: linear-gradient(to right, black calc(100% - 14px), transparent 100%);
    }
    .nastani-page .cell-scroll::-webkit-scrollbar { display: none; }

    /* Link button */
    .nastani-page .event-link-btn {
        color: var(--accent-blue);
        font-size: 0.72rem;
        text-decoration: none;
        transition: opacity 0.15s;
    }
    .nastani-page .event-link-btn:hover { opacity: 0.7; }

    /* Search wrap (matching site-wide style) */
    .nastani-page .events-search-wrap {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex: 1;
        min-width: 200px;
        position: relative;
        min-height: 36px;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        cursor: text;
        transition: border-color 0.15s, box-shadow 0.15s;
        margin-left: 0.75rem;
    }
    .nastani-page .events-search-wrap:focus-within {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(29,155,240,0.12);
    }
    body.dark-mode .nastani-page .events-search-wrap {
        background: var(--bg-secondary);
        border-color: var(--border-color);
    }
    body.dark-mode .nastani-page .events-search-wrap:focus-within {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(29,155,240,0.2);
    }
    .nastani-page .events-search-wrap i {
        color: var(--text-muted);
        font-size: 0.8rem;
        flex-shrink: 0;
    }
    .nastani-page #search-events {
        flex: 1;
        min-width: 100px;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 0.82rem;
        font-family: 'Inter', sans-serif;
        padding: 0.2rem 0;
        height: 30px;
    }
    .nastani-page #search-events::placeholder { color: var(--text-muted); }
    /* Filter bar (same as charts.html) */
    .nastani-page .chart-filter-bar {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border-color);
        padding: 0.5rem 1rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        align-items: center;
        gap: 0;
    }
    body.dark-mode .nastani-page .chart-filter-bar {
        background: var(--bg-secondary);
        border-bottom-color: var(--border-color);
    }
    .nastani-page .filter-presets {
        display: flex;
        align-items: center;
        gap: 0;
        flex-shrink: 0;
    }
    .nastani-page .filter-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.35rem 0.65rem;
        font-size: 0.7rem;
        font-weight: 500;
        border: 1px solid var(--border-color);
        background: var(--bg-primary);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
    }
    .nastani-page .filter-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
    }
    .nastani-page .filter-btn.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: var(--bg-primary);
    }
    .nastani-page .filter-btn i { font-size: 0.65rem; }
    body.dark-mode .nastani-page .filter-btn {
        background: var(--bg-hover);
        border-color: var(--border-color);
        color: var(--text-secondary);
    }
    body.dark-mode .nastani-page .filter-btn:hover {
        background: #2a2e36;
        color: var(--text-primary);
    }
    body.dark-mode .nastani-page .filter-btn.active {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: var(--bg-primary);
    }
    .nastani-page .preset-btn {
        border-radius: 0;
        font-family: 'Montserrat', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-weight: 600;
        font-size: 0.72rem;
        padding: 0.3rem 0.85rem;
        height: 32px;
        margin-left: -1px;
    }
    .nastani-page .preset-btn:first-child { margin-left: 0; }
    .nastani-page .preset-btn:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
        z-index: 1;
    }
    .nastani-page .preset-btn.active {
        border-color: #000;
        background: #000;
        color: #fff;
        z-index: 2;
    }
    body.dark-mode .nastani-page .preset-btn.active {
        border-color: #fff;
        background: #fff;
        color: #000;
    }
    body.dark-mode .nastani-page .artist-tag {
        background: var(--bg-primary);
    }

    /* Autocomplete for artist input in modal */
    .nastani-page .artist-ac-wrapper {
        position: relative;
    }
    .nastani-page .artist-ac-list {
        position: absolute;
        left: 0; right: 0; top: 100%;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        max-height: 180px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        display: none;
    }
    .nastani-page .artist-ac-list.open { display: block; }
    .nastani-page .artist-ac-item {
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
        color: var(--text-primary);
        cursor: pointer;
        transition: background 0.1s;
    }
    .nastani-page .artist-ac-item:hover,
    .nastani-page .artist-ac-item.hl {
        background: var(--bg-hover);
    }
    .nastani-page .artist-ac-item .ac-city {
        font-size: 0.62rem;
        color: var(--text-muted);
        margin-left: 0.3rem;
    }
    body.dark-mode .nastani-page .artist-ac-list {
        background: var(--bg-secondary);
        border-color: var(--border-color);
    }

    .nastani-page .artist-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .artist-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .artist-entry-row input { flex: 1; }
    .nastani-page .entry-remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.78rem; padding: 0.2rem; }
    .nastani-page .ticket-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .ticket-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .ticket-entry-row input { flex: 1; }
    .nastani-page .link-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .link-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .link-entry-row input { flex: 1; }

    .nastani-page .add-entry-btn {
        font-family: 'Inter', sans-serif;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--accent-blue);
        background: none;
        border: 1px dashed var(--accent-blue);
        border-radius: 4px;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        margin-top: 0.25rem;
        transition: background 0.15s;
    }
    .nastani-page .add-entry-btn:hover { background: rgba(74, 127, 165, 0.06); }

    .nastani-page .delete-event-btn {
        display: none;
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.5rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 4px;
        background: rgba(239, 68, 68, 0.06);
        color: #ef4444;
        cursor: pointer;
        transition: background 0.15s;
    }
    .nastani-page .delete-event-btn:hover { background: rgba(239, 68, 68, 0.12); }

    /* Notification */
    .nastani-notification {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-primary);
        z-index: 2000;
        max-width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        animation: notifIn 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: opacity 0.3s ease;
    }
    .nastani-notification.success { border-color: #22c55e; }
    .nastani-notification.success i { color: #22c55e; }
    .nastani-notification.error { border-color: #ef4444; }
    .nastani-notification.error i { color: #ef4444; }
    .nastani-notification.info { border-color: var(--accent-blue); }
    .nastani-notification.info i { color: var(--accent-blue); }
    @keyframes notifIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    body.dark-mode .nastani-notification { background: var(--bg-secondary); }

    .nastani-page #save-event-btn {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent-green, #22c55e);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all var(--transition);
    }
    .nastani-page #save-event-btn:hover { opacity: 0.9; }
    .nastani-page #save-event-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== TIMELINE LAYOUT ===== */
    .nastani-page .timeline-container {
        position: relative;
        padding: 0;
    }
    /* SVG timeline line */
    .nastani-page .tl-svg-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        z-index: 25;
        overflow: visible;
    }

    /* Empty state */
    .nastani-page .tl-empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        position: relative;
        z-index: 2;
    }

    /* Month header */
    .nastani-page .tl-month-header {
        display: flex;
        align-items: center;
        padding: 0.15rem 0.5rem 0.15rem 0;
        position: relative;
        z-index: 2;
        border-top: 2px solid var(--border-color)
        /* background-color: var(--text-primary);
        color: var(--bg-primary); */
    }

    .nastani-page .tl-month-date-col {
        width: 44px;
        flex-shrink: 0;
    }
    .nastani-page .tl-month-node {
        width: 20px;
        flex-shrink: 0;
    }
    .nastani-page .tl-month-content {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        min-width: 0;
        padding-left: 0.3rem;
    }
    .nastani-page .tl-month-label {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        white-space: nowrap;
    }

    /* Today marker */
    .nastani-page .tl-today-marker {
        display: flex;
        align-items: center;
        padding: 0.3rem 0.5rem 0.3rem 0;
        position: relative;
        z-index: 2;
    }

    .nastani-page .tl-today-date-col {
        width: 44px;
        flex-shrink: 0;
    }
    .nastani-page .tl-today-node {
        width: 20px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        position: relative;
        z-index: 2;
    }
    .nastani-page .tl-today-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent-blue);
        box-shadow: 0 0 8px rgba(74, 127, 165, 0.4);
    }
    .nastani-page .tl-today-content {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        min-width: 0;
        padding-left: 0.3rem;
    }
    .nastani-page .tl-today-label {
        background: var(--accent-blue);
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.18rem 0.65rem;
        border-radius: 999px;
        white-space: nowrap;
    }
    .nastani-page .tl-today-line {
        flex: 1;
        height: 2px;
        background: var(--accent-blue);
        opacity: 0.2;
        border-radius: 1px;
    }

    /* Direction indicator */
    .nastani-page .tl-direction {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.2rem 0.5rem 0.15rem 0;
        position: relative;
        z-index: 2;
    }
    .nastani-page .tl-direction-label {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        opacity: 0.6;
        white-space: nowrap;
        margin-left: 64px;
    }
    .nastani-page .tl-direction-label i {
        font-size: 0.42rem;
    }

    .nastani-page .tl-item {
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
        z-index: 0;
        min-height: 36px;
    }
    .nastani-page .tl-item.date-group-even {
        background: var(--bg-secondary);
    }
    .nastani-page .tl-item:hover {
        background: var(--bg-hover);
    }
    .nastani-page .tl-item:hover,
    .nastani-page .tl-item:focus-within {
        z-index: 20;
    }

    .nastani-page .tl-date-col {
        width: 44px;
        flex-shrink: 0;
        text-align: center;
        user-select: none;
        padding: 0.15rem 0;
    }

        font-family: 'Montserrat', sans-serif;
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--text-primary);
        line-height: 1.1;

    .nastani-page .tl-weekday {
        font-size: 0.48rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;

    .nastani-page .tl-date-col.hidden-date .tl-weekday {

    .nastani-page .tl-node-col {

        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .nastani-page .tl-content {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0;
        padding: 0;
    }

        font-family: 'Montserrat', sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);

        flex-shrink: 0;

        align-items: center;
        flex-shrink: 0;
        gap: 0;
        justify-content: center;
        padding: 0;
        margin: 0 0.35rem;
        overflow: visible;
    }

    <script>
    (function() {
        'use strict';

        var EVENTS_JSON_URL = 'events.json';
        var BANDS_JSON_URL = 'bands.json';
        var PR_ENDPOINT = 'https://muzichka-master-lista.deeeeelay.workers.dev';
        var EVENTS_FILE_PATH = 'events.json';

        var MK_MONTHS = ['Јан','Фев','Мар','Апр','Мај','Јун','Јул','Авг','Сеп','Окт','Ное','Дек'];

        // Cyrillic transliteration, slug, URL from common.js
        var transliterate = transliterateCyrillicToLatin;
        var artistSlug = generateArtistSlug;
        var artistUrl = getArtistPageUrl;

        var allEvents = [];
        var masterArtists = [];
        var currentFilter = 'all';
        var searchQuery = '';
        var editingEventId = null;

        // Settings menu + nav menu from common.js
        initSettingsMenu();
        initNavMenu();

        // ==================== SEARCH TOGGLE ====================
        (function() {
            var btn = document.getElementById('search-toggle-btn');
            var controls = document.getElementById('controls-bar');
            var searchInput = document.getElementById('search-events');
            if (!btn || !controls) return;
            btn.addEventListener('click', function() {
                var isVisible = controls.classList.toggle('visible');
                btn.innerHTML = '<i class="fas ' + (isVisible ? 'fa-times' : 'fa-search') + '"></i>';
                if (isVisible) {
                    searchInput.focus();
                } else {
                    // Clear search when hiding
                    if (searchInput.value) {
                        searchInput.value = '';
                        searchQuery = '';
                        renderTable();
                    }
                }
            });
        })();



        // ==================== HELPERS ====================
        function getToday() { var d = new Date(); d.setHours(0,0,0,0); return d; }
        function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
        function daysUntil(s) { return Math.ceil((parseDate(s) - getToday()) / 86400000); }

        function getDayName(dateStr) {
            var days = ['недела', 'понеделник', 'вторник', 'среда', 'четврток', 'петок', 'сабота'];
            var p = dateStr.split('-');
            var d = new Date(+p[0], +p[1]-1, +p[2]);
            return days[d.getDay()];
        }

        function countdownText(dateStr) {
            var d = daysUntil(dateStr);
            var day = getDayName(dateStr);
            if (d === 0) return { text: 'Денес', cls: 'today-cd' };
            if (d === 1) return { text: 'Утре, во ' + day, cls: 'soon' };
            if (d > 1 && d <= 7) return { text: 'За ' + d + ' дена, во ' + day, cls: 'soon' };
            if (d > 7 && d <= 30) return { text: 'За ' + d + ' дена, во ' + day, cls: 'later' };
            if (d > 30) { var m = Math.floor(d / 30); return { text: m === 1 ? 'За ~1 месец' : 'За ~' + m + ' месеци', cls: 'later' }; }
            if (d === -1) return { text: 'Вчера', cls: 'passed' };
            if (d < -1 && d >= -30) return { text: 'Пред ' + Math.abs(d) + ' дена', cls: 'passed' };
            if (d < -30) { var mo = Math.floor(Math.abs(d) / 30); return { text: mo === 1 ? 'Пред ~1 месец' : 'Пред ~' + mo + ' месеци', cls: 'passed' }; }
            return { text: '', cls: '' };
        }

        function esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
        function escA(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        /** Normalize event links: supports legacy .link (string) and new .links (array of {label,url}) */
        function getEventLinks(evt) {
            if (evt.links && Array.isArray(evt.links) && evt.links.length) return evt.links;
            if (evt.link) return [{ label: '', url: evt.link }];
            return [];
        }

        function generateId(title, date) {
            var slug = title.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
            return 'evt-' + date.replace(/-/g, '') + '-' + (slug || 'event') + '-' + Math.random().toString(36).slice(2, 6);
        }

        // ==================== NOTIFICATION ====================
        function notify(msg, type) {
            type = type || 'info';
            var c = document.getElementById('nastani-notifications');
            var el = document.createElement('div');
            el.className = 'nastani-notification ' + type;
            var ic = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            el.innerHTML = '<i class="fas ' + (ic[type]||ic.info) + '"></i> ' + msg;
            c.appendChild(el);
            setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 4000);
        }

        // ==================== LOAD DATA ====================
        var originalEventsJSON = null; // keep original for diff comparison

        async function loadData() {
            var loadingBar = document.getElementById('loading-bar');
            loadingBar.classList.add('active');
            try {
                var [evtRes, bandsRes] = await Promise.all([
                    fetch(EVENTS_JSON_URL + '?v=' + Date.now()),
                    fetch(BANDS_JSON_URL + '?v=' + Date.now())
                ]);
                if (!evtRes.ok) throw new Error('events load fail');
                var evtData = await evtRes.json();
                allEvents = evtData.events || [];
                originalEventsJSON = JSON.stringify(allEvents);

                if (bandsRes.ok) {
                    var bandsData = await bandsRes.json();
                    masterArtists = (bandsData.muzickaMasterLista || []).map(function(b) {
                        return { name: b.name, city: b.city || '', image: (b.image || '').replace(/&amp;/g, '&') };
                    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
                }

                // Overlay draft bands so newly-added artists are immediately selectable
                _refreshMasterArtistsFromDrafts();

                // Restore any pending event drafts from localStorage
                if (window.MMMDrafts) {
                    var draft = window.MMMDrafts.load('events.json');
                    if (draft && draft.events && Array.isArray(draft.events)) {
                        allEvents = draft.events;
                        notify('Вчитани се незачувани промени од претходно. Кликнете "Испрати промени" за да ги поднесете.', 'info');
                    }
                }

                updateStats();
                renderTable();
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('events-timeline').innerHTML =
                    '<div class="tl-empty"><i class="fas fa-exclamation-triangle" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i> Не можеме да ги вчитаме настаните.</div>';
            } finally {
                loadingBar.classList.remove('active');
            }
        }

        /**
         * Merge draft bands into masterArtists so that bands added/edited
         * via the master list are immediately available in the artist autocomplete.
         */
        function _refreshMasterArtistsFromDrafts() {
            if (!window.MMMDrafts) return;
            var draft = window.MMMDrafts.load('bands.json');
            if (draft && draft.muzickaMasterLista && Array.isArray(draft.muzickaMasterLista)) {
                masterArtists = draft.muzickaMasterLista.map(function(b) {
                    return { name: b.name, city: b.city || '', image: (b.image || '').replace(/&amp;/g, '&') };
                }).sort(function(a, b) { return a.name.localeCompare(b.name); });
            }
        }

        // Listen for draft discard events (from the floating bar)
        window.addEventListener('mmm-drafts-discarded', function() {
            // Reload original data
            if (originalEventsJSON) {
                allEvents = JSON.parse(originalEventsJSON);
                updateStats();
                renderTable();
            }
            // Revert artist list to server baseline
            _refreshMasterArtistsFromDrafts();
        });

        // Listen for successful draft submission
        window.addEventListener('mmm-drafts-submitted', function() {
            // The submitted data becomes the new baseline
            originalEventsJSON = JSON.stringify(allEvents);
        });

        // When drafts change in another tab (cross-page sync),
        // refresh the artist autocomplete list immediately.
        window.addEventListener('mmm-drafts-changed', function() {
            _refreshMasterArtistsFromDrafts();
        });

        function updateStats() {

        // ==================== SVG TIMELINE LINE ====================
        function drawTimelineSVG() {
            var container = document.getElementById('events-timeline');
            var old = container.querySelector('.tl-svg-line');
            if (old) old.remove();

            var h = container.scrollHeight;
            if (h < 20) return;

            // Center x: date(44) + half-node(10) = 54 desktop; mobile: date(28)+half-node(7)=35
            var isMobile = window.innerWidth <= 600;
            var cx = isMobile ? 35 : 54;

            // Wavy line params
            var amp = 2.5;
            var freq = 0.032;
            var timelineColor = getComputedStyle(document.body).getPropertyValue('--accent-blue').trim() || '#4a7fa5';

            // Helper: get x position on wavy line at a given y
            function wavyX(y) { return cx + Math.sin(y * freq) * amp; }
            // Helper: get normalized tangent vector (dx, dy) at a given y (pointing downward along path)
            function wavyTangent(y) {
                var dx = wavyX(y + 1.5) - wavyX(y - 1.5);
                var dy = 3;
                var len = Math.sqrt(dx * dx + dy * dy);
                return { x: dx / len, y: dy / len };
            }

            // Find today marker position
            var todayMarker = document.getElementById('tl-today');
            var todayFrac = null;
            if (todayMarker) {
                var todayY = todayMarker.offsetTop + todayMarker.offsetHeight / 2;
                todayFrac = todayY / h;
            }

            // Collect row centers for chevrons
            var items = container.querySelectorAll('.tl-item');
            var rowCenters = [];
            for (var ri = 0; ri < items.length; ri++) {
                var item = items[ri];
                var ry = item.offsetTop + item.offsetHeight / 2;
                var isPast = item.classList.contains('past-event');
                var isToday = item.classList.contains('today-event');
                rowCenters.push({ y: ry, past: isPast, today: isToday });
            }

            var ns = 'http://www.w3.org/2000/svg';
            var w = container.offsetWidth || container.clientWidth || 200;
            var svg = document.createElementNS(ns, 'svg');
            svg.classList.add('tl-svg-line');
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);
            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

            // Gradient definition
            var defs = document.createElementNS(ns, 'defs');

            var grad = document.createElementNS(ns, 'linearGradient');
            grad.id = 'tlGrad';
            grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
            grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');

            function addStop(offset, color, opacity) {
                var s = document.createElementNS(ns, 'stop');
                s.setAttribute('offset', offset);
                s.setAttribute('stop-color', color);
                s.setAttribute('stop-opacity', opacity);
                grad.appendChild(s);
            }

            if (todayFrac !== null) {
                var tp = (todayFrac * 100);
                addStop('0%', '#4a7fa5', '0.35');
                addStop(Math.max(0, tp - 3) + '%', '#4a7fa5', '0.55');
                addStop(tp + '%', '#22c55e', '1');
                addStop(Math.min(100, tp + 3) + '%', '#6b7280', '0.25');
                addStop('100%', '#6b7280', '0.08');
            } else {
                addStop('0%', '#4a7fa5', '0.35');
                addStop('100%', '#6b7280', '0.12');
            }

            defs.appendChild(grad);

            // Glow filter for today region
            var filter = document.createElementNS(ns, 'filter');
            filter.id = 'tlGlow';
            filter.setAttribute('x', '-50%'); filter.setAttribute('y', '-2%');
            filter.setAttribute('width', '200%'); filter.setAttribute('height', '104%');
            var blur = document.createElementNS(ns, 'feGaussianBlur');
            blur.setAttribute('stdDeviation', '3');
            blur.setAttribute('result', 'glow');
            filter.appendChild(blur);
            var merge = document.createElementNS(ns, 'feMerge');
            var mn1 = document.createElementNS(ns, 'feMergeNode');
            mn1.setAttribute('in', 'glow');
            var mn2 = document.createElementNS(ns, 'feMergeNode');
            mn2.setAttribute('in', 'SourceGraphic');
            merge.appendChild(mn1); merge.appendChild(mn2);
            filter.appendChild(merge);
            defs.appendChild(filter);

            svg.appendChild(defs);

            // Build the wavy path
            var d = 'M ' + wavyX(0).toFixed(2) + ' 0';
            for (var y = 3; y <= h; y += 3) {
                d += ' L ' + wavyX(y).toFixed(2) + ' ' + y;
            }

            // Main line
            var path = document.createElementNS(ns, 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', timelineColor);
            path.setAttribute('stroke-width', '2');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(path);

            // Glow accent near today
            if (todayFrac !== null) {
                var glowY = todayFrac * h;
                var glowR = 40;
                var gd = 'M ' + wavyX(Math.max(0, glowY - glowR)).toFixed(2) + ' ' + Math.max(0, glowY - glowR);
                for (var gy = Math.max(3, glowY - glowR); gy <= Math.min(h, glowY + glowR); gy += 3) {
                    gd += ' L ' + wavyX(gy).toFixed(2) + ' ' + gy;
                }
                var glowPath = document.createElementNS(ns, 'path');
                glowPath.setAttribute('d', gd);
                glowPath.setAttribute('fill', 'none');
                glowPath.setAttribute('stroke', timelineColor);
                glowPath.setAttribute('stroke-width', '4');
                glowPath.setAttribute('stroke-linecap', 'round');
                glowPath.setAttribute('stroke-opacity', '0.3');
                glowPath.setAttribute('filter', 'url(#tlGlow)');
                svg.appendChild(glowPath);
            }

            // Draw chevrons at each row center, oriented along the tangent
            var chevSize = isMobile ? 4 : 5;
            for (var ci = 0; ci < rowCenters.length; ci++) {
                var rc = rowCenters[ci];
                var px = wavyX(rc.y);
                var t = wavyTangent(rc.y);
                // Tangent direction (dx, dy) pointing downward along the path
                var tdx = t.x;
                var tdy = t.y;
                // Perpendicular
                var pdx = -tdy;
                var pdy = tdx;
                // Chevron: two lines meeting at a point, pointing upward (against flow)
                // Tip is at center, arms go backward (downward along tangent) and outward
                var tipX = px;
                var tipY = rc.y;
                var arm1X = tipX + tdx * chevSize + pdx * chevSize * 0.7;
                var arm1Y = tipY + tdy * chevSize + pdy * chevSize * 0.7;
                var arm2X = tipX + tdx * chevSize - pdx * chevSize * 0.7;
                var arm2Y = tipY + tdy * chevSize - pdy * chevSize * 0.7;

                var chevD = 'M ' + arm1X.toFixed(2) + ' ' + arm1Y.toFixed(2) +
                            ' L ' + tipX.toFixed(2) + ' ' + tipY.toFixed(2) +
                            ' L ' + arm2X.toFixed(2) + ' ' + arm2Y.toFixed(2);

                var chevPath = document.createElementNS(ns, 'path');
                chevPath.setAttribute('d', chevD);
                chevPath.setAttribute('fill', 'none');
                chevPath.setAttribute('stroke-linecap', 'round');
                chevPath.setAttribute('stroke-linejoin', 'round');
                chevPath.setAttribute('stroke', timelineColor);

                if (rc.today) {
                    chevPath.setAttribute('stroke-width', isMobile ? '2' : '2.5');
                    chevPath.setAttribute('filter', 'url(#tlGlow)');
                } else if (rc.past) {
                    chevPath.setAttribute('stroke-width', isMobile ? '1.5' : '2');
                    chevPath.setAttribute('stroke-opacity', '0.5');
                } else {
                    chevPath.setAttribute('stroke-width', isMobile ? '1.5' : '2');
                }
                svg.appendChild(chevPath);
            }

            container.insertBefore(svg, container.firstChild);
        }

        // Redraw SVG on resize
        var _tlResizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(_tlResizeTimer);
            _tlResizeTimer = setTimeout(drawTimelineSVG, 150);
        });

        // ==================== SCROLL TO TODAY ====================
        function scrollToToday() {
            var marker = document.getElementById('tl-today');
            if (!marker) return;
            var sc = document.querySelector('.table-scroll-container');
            var wrapper = (sc && sc.scrollHeight > sc.clientHeight) ? sc : document.querySelector('.table-wrapper');
            if (!wrapper) return;
            setTimeout(function() {
                var wrapperRect = wrapper.getBoundingClientRect();
                var markerRect = marker.getBoundingClientRect();
                // Position the "Денес" marker so that 2-3 past events
                // are visible below it for context
                var visibleHeight = wrapper.clientHeight;
                var markerOffset = markerRect.top - wrapperRect.top + wrapper.scrollTop;
                var targetScroll = markerOffset - visibleHeight + 220; // show ~2-3 past events below marker
                wrapper.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
            }, 100);
        }

        // ==================== SEARCH & FILTERS ====================
        document.getElementById('search-events').addEventListener('input', function() {
            searchQuery = this.value.trim();
            renderTable();
        });

        document.querySelectorAll('.filter-btn.preset-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn.preset-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTable();
            });
        });

        // ==================== ARTIST AUTOCOMPLETE ====================
        function createArtistEntry(value) {
            var row = document.createElement('div');
            row.className = 'artist-entry-row artist-ac-wrapper';
            var input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Пребарај артист...';
            input.className = 'artist-input';
            input.value = value || '';
            input.readOnly = !!value;
            if (value) input.style.fontWeight = '600';
            var acList = document.createElement('div');
            acList.className = 'artist-ac-list';
            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'entry-remove';
            removeBtn.title = 'Отстрани';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';

            row.appendChild(input);
            row.appendChild(acList);
            row.appendChild(removeBtn);
            removeBtn.addEventListener('click', function() { row.remove(); });

            var hlIdx = -1;
            input.addEventListener('input', function() {
                var q = input.value.trim().toLowerCase();
                input.readOnly = false;
                input.style.fontWeight = '';
                hlIdx = -1;
                if (q.length < 1) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                var matches = masterArtists.filter(function(a) { return a.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
                if (!matches.length) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                acList.innerHTML = matches.map(function(a) {
                    return '<div class="artist-ac-item" data-name="' + escA(a.name) + '">' +
                        esc(a.name) + (a.city ? '<span class="ac-city">' + esc(a.city) + '</span>' : '') + '</div>';
                }).join('');
                acList.classList.add('open');
                acList.querySelectorAll('.artist-ac-item').forEach(function(item) {
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        pickArtist(input, acList, item.dataset.name);
                    });
                });
            });
            input.addEventListener('keydown', function(e) {
                var items = acList.querySelectorAll('.artist-ac-item');
                if (!items.length) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); hlIdx = Math.min(hlIdx + 1, items.length - 1); hlItems(items, hlIdx); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); hlIdx = Math.max(hlIdx - 1, 0); hlItems(items, hlIdx); }
                else if (e.key === 'Enter' && hlIdx >= 0) { e.preventDefault(); pickArtist(input, acList, items[hlIdx].dataset.name); }
            });
            input.addEventListener('blur', function() { setTimeout(function() { acList.classList.remove('open'); }, 150); });
            return row;
        }
        function hlItems(items, idx) { items.forEach(function(it, i) { it.classList.toggle('hl', i === idx); if (i === idx) it.scrollIntoView({ block: 'nearest' }); }); }
        function pickArtist(input, acList, name) { input.value = name; input.readOnly = true; input.style.fontWeight = '600'; acList.classList.remove('open'); acList.innerHTML = ''; }

        // ==================== MODAL ====================
        var modal = document.getElementById('event-modal');
        var form = document.getElementById('event-form');
        var modalTitle = document.getElementById('modal-title');
        var deleteBtn = document.getElementById('delete-event-btn');

        function openAddModal() {
            editingEventId = null;
            modalTitle.textContent = 'Додај настан';
            deleteBtn.style.display = 'none';
            form.reset();
            resetArtists(['']);
            resetTickets([{ label: '', price: '' }]);
            resetLinks([{ label: '', url: '' }]);
            document.getElementById('evt-date').dispatchEvent(new Event('input'));
            document.getElementById('evt-time').dispatchEvent(new Event('input'));
            modal.style.display = 'block';
            setTimeout(function() { document.getElementById('evt-title').focus(); }, 100);
        }

        function openEditModal(id) {
            var evt = allEvents.find(function(e) { return e.id === id; });
            if (!evt) return;
            editingEventId = id;
            modalTitle.textContent = 'Уреди настан';
            deleteBtn.style.display = '';

            document.getElementById('evt-title').value = evt.title || '';
            // Convert ISO date (YYYY-MM-DD) to European (dd.mm.yyyy)
            var isoDate = evt.date || '';
            if (isoDate && isoDate.indexOf('-') !== -1) {
                var dp = isoDate.split('-');
                document.getElementById('evt-date').value = dp[2] + '.' + dp[1] + '.' + dp[0];
            } else {
                document.getElementById('evt-date').value = isoDate;
            }
            document.getElementById('evt-time').value = evt.time || '';
            document.getElementById('evt-place').value = evt.place || '';
            document.getElementById('evt-date').dispatchEvent(new Event('input'));
            document.getElementById('evt-time').dispatchEvent(new Event('input'));

            var evtLinks = getEventLinks(evt);
            resetLinks(evtLinks.length ? evtLinks : [{ label: '', url: '' }]);

            var artists = evt.artists || evt.bands || [];
            resetArtists(artists.length ? artists : ['']);
            var tickets = evt.tickets || [];
            resetTickets(tickets.length ? tickets : [{ label: '', price: '' }]);

            modal.style.display = 'block';
        }

        function resetArtists(values) {
            var c = document.getElementById('artist-entries');
            c.innerHTML = '';
            values.forEach(function(v) { c.appendChild(createArtistEntry(v)); });
        }

        function resetTickets(tickets) {
            var c = document.getElementById('ticket-entries');
            c.innerHTML = '';
            tickets.forEach(function(t) { addTicketEntry(t.label || '', t.price || ''); });
        }

        function addLinkEntry(label, url) {
            var c = document.getElementById('link-entries');
            var row = document.createElement('div');
            row.className = 'link-entry-row';
            row.innerHTML =
                '<input type="text" placeholder="Опис (пр. Билети, Инстаграм)" class="link-label-input" value="' + escA(label) + '">' +
                '<input type="url" placeholder="https://..." class="link-url-input" value="' + escA(url) + '">' +
                '<button type="button" class="entry-remove" title="Отстрани"><i class="fas fa-times"></i></button>';
            row.querySelector('.entry-remove').addEventListener('click', function() { row.remove(); });
            c.appendChild(row);
        }

        function resetLinks(links) {
            var c = document.getElementById('link-entries');
            c.innerHTML = '';
            links.forEach(function(l) { addLinkEntry(l.label || '', l.url || ''); });
        }

        function addTicketEntry(label, price) {
            var c = document.getElementById('ticket-entries');
            var row = document.createElement('div');
            row.className = 'ticket-entry-row';
            row.innerHTML =
                '<input type="text" placeholder="Тип (пр. Стандард)" class="ticket-label-input" value="' + escA(label) + '">' +
                '<input type="text" placeholder="Цена (пр. 300 ден)" class="ticket-price-input" value="' + escA(price) + '">' +
                '<button type="button" class="entry-remove" title="Отстрани"><i class="fas fa-times"></i></button>';
            row.querySelector('.entry-remove').addEventListener('click', function() { row.remove(); });
            c.appendChild(row);
        }

        function closeModal() { modal.style.display = 'none'; editingEventId = null; }

        document.getElementById('add-link-btn').addEventListener('click', function() {
            addLinkEntry('', '');
            var entries = document.querySelectorAll('#link-entries .link-entry-row');
            if (entries.length) entries[entries.length - 1].querySelector('.link-url-input').focus();
        });

        document.getElementById('add-event-btn').addEventListener('click', openAddModal);
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        window.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        // Auto-open add modal if navigated with #dodaj-nastan hash
        if (location.hash === '#dodaj-nastan') {
            openAddModal();
            history.replaceState(null, '', location.pathname + location.search);
        }

        document.getElementById('add-artist-btn').addEventListener('click', function() {
            var c = document.getElementById('artist-entries');
            var entry = createArtistEntry('');
            c.appendChild(entry);
            entry.querySelector('input').focus();
        });
        document.getElementById('add-ticket-btn').addEventListener('click', function() {
            addTicketEntry('', '');
            var entries = document.querySelectorAll('#ticket-entries .ticket-entry-row');
            if (entries.length) entries[entries.length - 1].querySelector('.ticket-label-input').focus();
        });

        // ==================== MASKED DATE/TIME INPUTS WITH VALIDATION ====================
        (function() {
            function clampDateDigits(digits) {
                var d = digits.split('');
                // Day: 0-3 for first digit
                if (d[0] && parseInt(d[0]) > 3) d[0] = '3';
                if (d[0] === '3' && d[1] && parseInt(d[1]) > 1) d[1] = '1';
                if (d[0] === '0' && d[1] === '0') d[1] = '1';
                // Month: 0-1 for first digit
                if (d[2] && parseInt(d[2]) > 1) d[2] = '1';
                if (d[2] === '1' && d[3] && parseInt(d[3]) > 2) d[3] = '2';
                if (d[2] === '0' && d[3] === '0') d[3] = '1';
                return d.join('');
            }
            function clampTimeDigits(digits) {
                var d = digits.split('');
                // Hour: 0-2 for first digit
                if (d[0] && parseInt(d[0]) > 2) d[0] = '2';
                if (d[0] === '2' && d[1] && parseInt(d[1]) > 3) d[1] = '3';
                // Minute: 0-5 for first digit
                if (d[2] && parseInt(d[2]) > 5) d[2] = '5';
                return d.join('');
            }
            function renderOverlay(overlayEl, value, template, sepChar) {
                var digits = value.replace(/\D/g, '');
                var datePlaceholders = ['Д','Д','М','М','Г','Г','Г','Г'];
                var timePlaceholders = ['Ч','Ч','М','М'];
                var phs = (template === '__.__.____') ? datePlaceholders : timePlaceholders;
                var html = '';
                var di = 0;
                for (var i = 0; i < template.length; i++) {
                    if (template[i] === '_') {
                        if (di < digits.length) {
                            html += '<span class="filled">' + digits[di] + '</span>';
                        } else {
                            html += '<span class="placeholder">' + phs[di] + '</span>';
                        }
                        di++;
                    } else {
                        html += '<span class="separator">' + sepChar + '</span>';
                    }
                }
                overlayEl.innerHTML = html;
            }

            function setupMaskedInput(inputEl, overlayEl, template, sepChar, maxDigits, clampFn) {
                function update() {
                    var raw = inputEl.value.replace(/\D/g, '').slice(0, maxDigits);
                    raw = clampFn(raw);
                    var formatted = '';
                    for (var i = 0; i < raw.length; i++) {
                        if (template[formatted.length] !== '_') formatted += sepChar;
                        formatted += raw[i];
                    }
                    inputEl.value = formatted;
                    renderOverlay(overlayEl, formatted, template, sepChar);
                    // Validate complete value
                    if (raw.length === maxDigits) {
                        var valid = true;
                        if (maxDigits === 8) {
                            var dd = parseInt(raw.slice(0,2)), mm = parseInt(raw.slice(2,4));
                            if (dd < 1 || dd > 31 || mm < 1 || mm > 12) valid = false;
                        } else {
                            var hh = parseInt(raw.slice(0,2)), mi = parseInt(raw.slice(2,4));
                            if (hh > 23 || mi > 59) valid = false;
                        }
                        inputEl.classList.toggle('mask-invalid', !valid);
                    } else {
                        inputEl.classList.remove('mask-invalid');
                    }
                }
                inputEl.addEventListener('input', update);
                // Render initial overlay
                update();
                return update;
            }

            var dateInput = document.getElementById('evt-date');
            var timeInput = document.getElementById('evt-time');
            var dateOverlay = document.getElementById('evt-date-overlay');
            var timeOverlay = document.getElementById('evt-time-overlay');

            window._evtDateUpdate = setupMaskedInput(dateInput, dateOverlay, '__.__.____', '.', 8, clampDateDigits);
            window._evtTimeUpdate = setupMaskedInput(timeInput, timeOverlay, '__:__', ':', 4, clampTimeDigits);
        })();

        // ==================== DELETE ====================
        deleteBtn.addEventListener('click', function() {
            if (!editingEventId) return;
            if (!confirm('Дали сте сигурни дека сакате да го избришете овој настан?')) return;
            var updated = allEvents.filter(function(e) { return e.id !== editingEventId; });
            submitUpdate(updated, 'Избришан настан: ' + editingEventId);
        });

        // ==================== FORM SUBMIT ====================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('evt-title').value.trim();
            var dateRaw = document.getElementById('evt-date').value.trim();
            var time = document.getElementById('evt-time').value.trim();
            var place = document.getElementById('evt-place').value.trim();

            // Convert European date (dd.mm.yyyy) to ISO (YYYY-MM-DD)
            var date = '';
            if (dateRaw) {
                var dp = dateRaw.split('.');
                if (dp.length === 3 && dp[0].length === 2 && dp[1].length === 2 && dp[2].length === 4) {
                    date = dp[2] + '-' + dp[1] + '-' + dp[0];
                } else {
                    notify('Форматот на датумот треба да биде дд.мм.гггг', 'error');
                    return;
                }
            }

            // Validate time format HH:MM
            if (time && !/^\d{2}:\d{2}$/.test(time)) {
                notify('Форматот на времето треба да биде чч:мм', 'error');
                return;
            }

            var artists = [];
            var valid = true;
            document.querySelectorAll('#artist-entries .artist-input').forEach(function(input) {
                var v = input.value.trim();
                if (!v) return;
                var found = masterArtists.some(function(a) { return a.name === v; });
                if (!found) {
                    input.style.borderColor = '#ef4444';
                    notify('"' + v + '" не е на Мастер Листата. Одберете артист од листата.', 'error');
                    valid = false;
                    return;
                }
                input.style.borderColor = '';
                artists.push(v);
            });
            if (!valid) return;

            var tickets = [];
            document.querySelectorAll('#ticket-entries .ticket-entry-row').forEach(function(row) {
                var l = (row.querySelector('.ticket-label-input') || {}).value || '';
                var p = (row.querySelector('.ticket-price-input') || {}).value || '';
                l = l.trim(); p = p.trim();
                if (l || p) tickets.push({ label: l || 'Влез', price: p });
            });

            var links = [];
            document.querySelectorAll('#link-entries .link-entry-row').forEach(function(row) {
                var lbl = (row.querySelector('.link-label-input') || {}).value || '';
                var u = (row.querySelector('.link-url-input') || {}).value || '';
                lbl = lbl.trim(); u = u.trim();
                if (u) links.push({ label: lbl, url: u });
            });

            if (!title || !date || !time || !place) {
                notify('Пополнете ги сите задолжителни полиња.', 'error');
                return;
            }

            var eventObj = {
                id: editingEventId || generateId(title, date),
                title: title, date: date, time: time, place: place,
                artists: artists, tickets: tickets, links: links
            };

            var updated;
            if (editingEventId) {
                updated = allEvents.map(function(e) { return e.id === editingEventId ? eventObj : e; });
            } else {
                updated = allEvents.slice();
                updated.push(eventObj);
            }

            var desc = (editingEventId ? 'Уреден' : 'Нов') + ' настан: ' + title + ' (' + date + ')\nМесто: ' + place + (artists.length ? '\nАртисти: ' + artists.join(', ') : '');
            submitUpdate(updated, desc);
        });

        /** Save changes to localStorage drafts instead of immediately submitting. */
        function submitUpdate(updatedEvents, description) {
            updatedEvents.sort(function(a, b) { return a.date.localeCompare(b.date); });

            // Save to unified draft system
            if (window.MMMDrafts) {
                var origEvents = originalEventsJSON ? { events: JSON.parse(originalEventsJSON) } : { events: [] };
                window.MMMDrafts.save('events.json', { events: updatedEvents }, origEvents);
            }

            // Update local state so the table reflects the change
            allEvents = updatedEvents;
            updateStats();
            renderTable();
            closeModal();

            notify('Промените се зачувани локално. Кликнете "Испрати промени" за да ги поднесете.', 'info');
        }

        // ==================== INIT ====================
        // Drag-to-scroll for .cell-scroll elements
        (function() {
            function updateFadeMask(el) {
                if (el.scrollWidth <= el.clientWidth) {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                    return;
                }
                var atStart = el.scrollLeft < 2;
                var atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 2;
                if (atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                } else {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                }
            }
            document.addEventListener('scroll', function(e) {
                var scrollEl = e.target.closest ? e.target.closest('.cell-scroll') : null;
                if (scrollEl) updateFadeMask(scrollEl);
            }, true);
            document.addEventListener('mousedown', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                scrollEl.style.cursor = 'grabbing';
                var startX = e.pageX;
                var startScrollLeft = scrollEl.scrollLeft;
                function onMove(ev) {
                    ev.preventDefault();
                    scrollEl.scrollLeft = startScrollLeft - (ev.pageX - startX);
                    updateFadeMask(scrollEl);
                }
                function onUp() {
                    scrollEl.style.cursor = 'grab';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            document.addEventListener('wheel', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                e.preventDefault();
                scrollEl.scrollLeft += e.deltaY;
                updateFadeMask(scrollEl);
            }, { passive: false });
        })();
        loadData();
    })();
    </script>
</body>
