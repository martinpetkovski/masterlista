        // ==================== GLOBAL SITE TOUR ====================
        (function() {
            const tourSteps = [
                { element: null, title: 'Здраво! \ud83d\udc4b', description: 'Ова е <strong>Македонска Музичка Мастер Листа</strong> - сè за македонската музика на едно место.<br><br>Ајде брзо да ти покажам што има.', position: 'center' },
                { element: '.site-nav-trigger', title: 'Навигација', description: 'Кликни на <strong>логото</strong> за мени. Таму ги имаш сите страници: Топ Листа, Мастер Листа, Настани, Вести, Кустоси...', position: 'bottom' },
                { element: '#settings-btn', title: 'Поставки ⚙', description: 'Тука ги менуваш <strong>темата</strong> (светла/темна) и го избираш <strong>стриминг сервисот</strong> (Spotify, YouTube, Deezer...).', position: 'bottom' },
                { element: null, title: 'Топ Листа \ud83d\udcca', description: 'Листа на <strong>најпопуларни изданија</strong> од македонски артисти. <a href="/">Отвори →</a>', position: 'center' },
                { element: null, title: 'Мастер Листа \ud83d\udccb', description: 'Комплетна база на <strong>сите македонски артисти</strong>. <a href="/lista">Отвори →</a>', position: 'center' },
                { element: null, title: 'Настани \ud83d\udcc5', description: 'Претстојни <strong>концерти и настани</strong> со датуми, локации и карти. <a href="/nastani">Отвори →</a>', position: 'center' },
                { element: null, title: 'Вести \ud83d\udcf0', description: 'Најнови <strong>вести и написи</strong> за македонската музичка сцена. <a href="/vesti">Отвори →</a>', position: 'center' },
                { element: null, title: 'Кустоси \ud83c\udfa7', description: 'Музички <strong>кустоси</strong> со нивните плејлисти. <a href="/kustosi">Отвори →</a>', position: 'center' },
                { element: null, title: 'Тоа е сè! \ud83c\udfb8', description: 'Ако сакаш да помогнеш:<br><br>• Додај артист во Мастер Листата<br>• Додај настан<br>• Јави се на <a href="https://discord.gg/fj6dJGhM" target="_blank">Xotel Discord</a><br><br>Фала! \ud83d\ude4c', position: 'center' }
            ];
            let currentStep = 0, active = false, tourOverlay = null;
            function createOverlay() {
                if (document.getElementById('tour-overlay')) return document.getElementById('tour-overlay');
                const el = document.createElement('div'); el.id = 'tour-overlay'; el.className = 'tour-overlay';
                el.innerHTML = '<div class="tour-highlight"></div><div class="tour-tooltip"><div class="tour-tooltip-content"><h3 class="tour-title"></h3><p class="tour-description"></p></div><div class="tour-footer"><span class="tour-progress"></span><div class="tour-buttons"><button class="tour-btn-skip">Прескокни</button><button class="tour-btn-prev"><i class="fas fa-arrow-left"></i></button><button class="tour-btn-next">Следно <i class="fas fa-arrow-right"></i></button></div></div></div>';
                document.body.appendChild(el);
                el.querySelector('.tour-btn-skip').addEventListener('click', endTour);
                el.querySelector('.tour-btn-prev').addEventListener('click', function() { if (currentStep > 0) { currentStep--; showStep(); } });
                el.querySelector('.tour-btn-next').addEventListener('click', function() { if (currentStep < tourSteps.length - 1) { currentStep++; showStep(); } else { endTour(); } });
                el.addEventListener('click', function(e) { if (e.target === el || e.target.classList.contains('tour-highlight')) endTour(); });
                document.addEventListener('keydown', function(e) { if (!active) return; if (e.key === 'Escape') endTour(); if (e.key === 'ArrowRight' || e.key === 'Enter') { if (currentStep < tourSteps.length - 1) { currentStep++; showStep(); } else endTour(); } if (e.key === 'ArrowLeft' && currentStep > 0) { currentStep--; showStep(); } });
                return el;
            }
            function startTour() { tourOverlay = createOverlay(); active = true; currentStep = 0; tourOverlay.classList.add('active'); if (window.innerWidth > 600) document.body.style.overflow = 'hidden'; showStep(); }
            function endTour() { active = false; if (tourOverlay) tourOverlay.classList.remove('active'); document.body.style.overflow = ''; }
            function showStep() {
                var step = tourSteps[currentStep]; if (!step || !tourOverlay) return;
                var highlight = tourOverlay.querySelector('.tour-highlight'), tooltip = tourOverlay.querySelector('.tour-tooltip');
                tooltip.querySelector('.tour-title').textContent = step.title;
                tooltip.querySelector('.tour-description').innerHTML = step.description;
                tooltip.querySelector('.tour-progress').textContent = (currentStep + 1) + ' / ' + tourSteps.length;
                tooltip.querySelector('.tour-btn-prev').disabled = currentStep === 0;
                tooltip.querySelector('.tour-btn-next').innerHTML = currentStep === tourSteps.length - 1 ? 'Заврши <i class="fas fa-check"></i>' : 'Следно <i class="fas fa-arrow-right"></i>';
                tooltip.classList.remove('arrow-top', 'arrow-bottom', 'arrow-left', 'arrow-right', 'tour-center');
                if (step.position === 'center' || !step.element) {
                    highlight.style.display = 'none'; tooltip.classList.add('tour-center'); tooltip.style.top = ''; tooltip.style.left = '';
                } else {
                    var targetEl = document.querySelector(step.element);
                    if (!targetEl) { highlight.style.display = 'none'; tooltip.classList.add('tour-center'); tooltip.style.top = ''; tooltip.style.left = ''; return; }
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(function() {
                        var rect = targetEl.getBoundingClientRect(), p = 4;
                        highlight.style.display = 'block'; highlight.style.position = window.innerWidth <= 600 ? 'fixed' : 'absolute';
                        highlight.style.top = (rect.top - p + (window.innerWidth > 600 ? window.scrollY : 0)) + 'px';
                        highlight.style.left = (rect.left - p) + 'px'; highlight.style.width = (rect.width + p * 2) + 'px'; highlight.style.height = (rect.height + p * 2) + 'px';
                        if (window.innerWidth > 600) {
                            var tr = tooltip.getBoundingClientRect(); var top = rect.bottom + 16, left = rect.left + rect.width / 2 - tr.width / 2;
                            if (left < 10) left = 10; if (left + tr.width > window.innerWidth - 10) left = window.innerWidth - tr.width - 10;
                            if (top + tr.height > window.innerHeight - 10) top = rect.top - tr.height - 16;
                            tooltip.style.top = top + 'px'; tooltip.style.left = left + 'px'; tooltip.classList.add('arrow-top');
                        }
                    }, 150);
                }
            }
            window.startGlobalTour = startTour;

        // ==================== HELPERS ====================
        function getToday() { var d = new Date(); d.setHours(0,0,0,0); return d; }
        function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
        function daysUntil(s) { return Math.ceil((parseDate(s) - getToday()) / 86400000); }

        function countdownText(dateStr) {
            var d = daysUntil(dateStr);
            if (d === 0) return { text: 'Денес', cls: 'today-cd' };
            if (d === 1) return { text: 'Утре', cls: 'soon' };
            if (d > 1 && d <= 7) return { text: 'За ' + d + ' дена', cls: 'soon' };
            if (d > 7 && d <= 30) return { text: 'За ' + d + ' дена', cls: 'later' };
            if (d > 30) { var m = Math.floor(d / 30); return { text: m === 1 ? 'За ~1 месец' : 'За ~' + m + ' месеци', cls: 'later' }; }
            if (d === -1) return { text: 'Вчера', cls: 'passed' };
            if (d < -1 && d >= -30) return { text: 'Пред ' + Math.abs(d) + ' дена', cls: 'passed' };
            if (d < -30) { var mo = Math.floor(Math.abs(d) / 30); return { text: mo === 1 ? 'Пред ~1 месец' : 'Пред ~' + mo + ' месеци', cls: 'passed' }; }
            return { text: '', cls: '' };
        }

        function esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
        function escA(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function generateId(title, date) {
            var slug = title.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
            return 'evt-' + date.replace(/-/g, '') + '-' + (slug || 'event') + '-' + Math.random().toString(36).slice(2, 6);

        // ==================== LOAD DATA ====================

        async function loadData() {

                if (!evtRes.ok) throw new Error('events load fail');
                var evtData = await evtRes.json();
                allEvents = evtData.events || [];
                originalEventsJSON = JSON.stringify(allEvents);

                if (bandsRes.ok) {
                    var bandsData = await bandsRes.json();
                    masterArtists = (bandsData.muzickaMasterLista || []).map(function(b) {
                        return { name: b.name, city: b.city || '' };
                    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
                }

                // Restore any pending event drafts from localStorage
                if (window.MMMDrafts) {
                    var draft = window.MMMDrafts.load('events.json');
                    if (draft && draft.events && Array.isArray(draft.events)) {
                        allEvents = draft.events;
                        notify('Вчитани се незачувани промени од претходно. Кликнете "Испрати промени" за да ги поднесете.', 'info');
                    }
                }

                updateStats();
                renderTable();
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('events-table-body').innerHTML =
                    '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)"><i class="fas fa-exclamation-triangle"></i> Не можеме да ги вчитаме настаните.</td></tr>';
            } finally {
                loadingBar.classList.remove('active');
            }
        }

        // Listen for draft discard events (from the floating bar)
        window.addEventListener('mmm-drafts-discarded', function() {
            // Reload original data
            if (originalEventsJSON) {
                allEvents = JSON.parse(originalEventsJSON);
                updateStats();
                renderTable();
            }
        });

        // Listen for successful draft submission
        window.addEventListener('mmm-drafts-submitted', function() {
            // The submitted data becomes the new baseline
            originalEventsJSON = JSON.stringify(allEvents);
        });

        function updateStats() {
            var t = getToday(), up = 0, pa = 0;
            allEvents.forEach(function(e) { if (parseDate(e.date) >= t) up++; else pa++; });
            document.getElementById('stat-total').textContent = allEvents.length;
            document.getElementById('stat-upcoming').textContent = up;
            document.getElementById('stat-past').textContent = pa;
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            var tbody = document.getElementById('events-table-body');
            var t = getToday();
            var q = searchQuery.toLowerCase();

            var filtered = allEvents.filter(function(e) {
                if (currentFilter === 'upcoming' && parseDate(e.date) < t) return false;
                if (currentFilter === 'past' && parseDate(e.date) >= t) return false;
                if (q) {
                    var artists = (e.artists || e.bands || []).join(' ').toLowerCase();
                    var hay = (e.title + ' ' + e.place + ' ' + artists).toLowerCase();
                    if (hay.indexOf(q) === -1) return false;
                }
                return true;
            });

            // Sort: farthest future at top, farthest past at bottom
            filtered.sort(function(a, b) {
                return parseDate(b.date) - parseDate(a.date);
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)">' +
                    '<i class="fas fa-calendar-xmark" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i>' +
                    'Нема настани' + (q ? ' за "' + esc(q) + '"' : '') + '</td></tr>';
                return;
            }

            var html = '';
            var todayInserted = false;

            for (var i = 0; i < filtered.length; i++) {
                var evt = filtered[i];
                var evtDate = parseDate(evt.date);
                var isPast = evtDate < t;
                var isToday = daysUntil(evt.date) === 0;

                // Today separator
                if (!todayInserted && isPast && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                    todayInserted = true;
                    html += '<tr class="today-separator"><td colspan="8">' +
                        '<div class="today-marker">' +
                        '<div class="tm-line"></div>' +
                        '<span class="tm-label"><i class="fas fa-location-dot"></i> Денес</span>' +
                        '<div class="tm-line"></div>' +
                        '</div></td></tr>';
                }

                var d = evtDate;
                var cd = countdownText(evt.date);
                var artists = evt.artists || evt.bands || [];
                var rowCls = isPast ? 'past-event' : (isToday ? 'today-event' : '');

                html += '<tr class="' + rowCls + '" data-id="' + escA(evt.id) + '">';

                // 1. Name + countdown + mobile meta
                html += '<td data-label="Настан"><div class="event-name-row"><span class="event-title-cell">' + esc(evt.title) + '</span>';
                if (cd.text) html += '<span class="countdown-badge ' + cd.cls + '">' + cd.text + '</span>';
                html += '</div>';
                // Mobile: structured meta with icons
                html += '<span class="mobile-meta">';
                html += '<span class="mm-item"><i class="fas fa-location-dot"></i> ' + esc(evt.place) + '</span>';
                html += '<span class="mm-sep">·</span>';
                html += '<span class="mm-item"><i class="fas fa-calendar"></i> ' + d.getDate() + ' ' + MK_MONTHS[d.getMonth()] + '</span>';
                html += '<span class="mm-sep">·</span>';
                html += '<span class="mm-item"><i class="fas fa-clock"></i> ' + esc(evt.time) + '</span>';
                html += '</span>';
                // Mobile: artists inline
                if (artists.length) {
                    html += '<span class="mobile-artists-inline">';
                    for (var ma = 0; ma < artists.length; ma++) {
                        html += '<a href="' + escA(artistUrl(artists[ma])) + '" class="artist-tag" onclick="event.stopPropagation()"><i class="fas fa-music"></i> ' + esc(artists[ma]) + '</a>';
                    }
                    html += '</span>';
                }
                html += '</td>';

                // 2. Artists
                html += '<td data-label="Артисти"><div class="cell-scroll">';
                for (var a = 0; a < artists.length; a++) {
                    html += '<a href="' + escA(artistUrl(artists[a])) + '" class="artist-tag" onclick="event.stopPropagation()" title="' + escA(artists[a]) + '"><i class="fas fa-music"></i> ' + esc(artists[a]) + '</a>';
                }
                if (!artists.length) html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                html += '</div></td>';

                // 3. Place
                html += '<td data-label="Место"><span class="event-place-cell">' + esc(evt.place) + '</span></td>';

                // 4. Date (single line)
                html += '<td data-label="Датум"><div class="event-date-cell">' +
                    d.getDate() + ' ' + MK_MONTHS[d.getMonth()] + ' ' + d.getFullYear() +
                    '</div></td>';

                // 5. Time
                html += '<td data-label="Време"><span class="event-time-cell">' + esc(evt.time) + '</span></td>';

                // Tickets
                html += '<td data-label="Карти"><div class="cell-scroll">';
                if (evt.tickets && evt.tickets.length) {
                    for (var ti = 0; ti < evt.tickets.length; ti++) {
                        var tk = evt.tickets[ti];
                        html += '<span class="ticket-tag"><i class="fas fa-ticket"></i> ' + esc(tk.label) + ': ' + esc(tk.price) + '</span>';
                    }
                } else {
                    html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                }
                html += '</div></td>';

                // Link
                html += '<td data-label="Линк" style="text-align:center">';
                if (evt.link) {
                    html += '<a href="' + escA(evt.link) + '" target="_blank" rel="noopener" class="event-link-btn" onclick="event.stopPropagation()" title="' + escA(evt.link) + '"><i class="fas fa-arrow-up-right-from-square"></i></a>';
                } else {
                    html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                }
                html += '</td>';

                // Actions
                html += '<td data-label="Акции" style="text-align:center"><button class="action-btn edit-btn" data-id="' + escA(evt.id) + '" title="Уреди"><i class="fas fa-pen"></i></button></td>';

                html += '</tr>';
            }

            // If all upcoming, insert today marker at end
            if (!todayInserted && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                html += '<tr class="today-separator"><td colspan="8">' +
                    '<div class="today-marker">' +
                    '<div class="tm-line"></div>' +
                    '<span class="tm-label"><i class="fas fa-location-dot"></i> Денес</span>' +
                    '<div class="tm-line"></div>' +
                    '</div></td></tr>';
            }

            tbody.innerHTML = html;

            // Scroll to today separator
            scrollToToday();

            // Bind edit buttons
            tbody.querySelectorAll('.edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openEditModal(btn.dataset.id);
                });
            });

            // Row click to open event page
            tbody.querySelectorAll('tr[data-id]').forEach(function(row) {
                row.style.cursor = 'pointer';
                row.addEventListener('click', function() {
                    var eid = encodeURIComponent(row.dataset.id);
                    window.location.href = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'nastan.html?id=' + eid : '/nastan/' + eid;
                });
            });
        }

        // ==================== SCROLL TO TODAY ====================
        function scrollToToday() {
            var sep = document.querySelector('.today-separator');
            if (!sep) return;
            var wrapper = document.querySelector('.table-wrapper');
            if (!wrapper) return;
            // Delay slightly to let DOM settle
            setTimeout(function() {
                var wrapperRect = wrapper.getBoundingClientRect();
                var sepRect = sep.getBoundingClientRect();
                var offset = sepRect.top - wrapperRect.top + wrapper.scrollTop - (wrapperRect.height / 3);
                wrapper.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
            }, 100);
        }

        // ==================== SEARCH & FILTERS ====================
        document.getElementById('search-events').addEventListener('input', function() {
            searchQuery = this.value.trim();
            renderTable();
        });

        document.querySelectorAll('.evt-filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.evt-filter-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTable();
            });
        });

        document.getElementById('clear-filters').addEventListener('click', function() {
            searchQuery = '';
            currentFilter = 'all';
            document.getElementById('search-events').value = '';
            document.querySelectorAll('.evt-filter-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelector('.evt-filter-btn[data-filter="all"]').classList.add('active');
            renderTable();
        });

        // ==================== ARTIST AUTOCOMPLETE ====================
        function createArtistEntry(value) {
            var row = document.createElement('div');
            row.className = 'artist-entry-row artist-ac-wrapper';
            var input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Пребарај артист...';
            input.className = 'artist-input';
            input.value = value || '';
            input.readOnly = !!value;
            if (value) input.style.fontWeight = '600';
            var acList = document.createElement('div');
            acList.className = 'artist-ac-list';
            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'entry-remove';
            removeBtn.title = 'Отстрани';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';

            row.appendChild(input);
            row.appendChild(acList);
            row.appendChild(removeBtn);
            removeBtn.addEventListener('click', function() { row.remove(); });

            var hlIdx = -1;
            input.addEventListener('input', function() {
                var q = input.value.trim().toLowerCase();
                input.readOnly = false;
                input.style.fontWeight = '';
                hlIdx = -1;
                if (q.length < 1) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                var matches = masterArtists.filter(function(a) { return a.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
                if (!matches.length) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                acList.innerHTML = matches.map(function(a) {
                    return '<div class="artist-ac-item" data-name="' + escA(a.name) + '">' +
                        esc(a.name) + (a.city ? '<span class="ac-city">' + esc(a.city) + '</span>' : '') + '</div>';
                }).join('');
                acList.classList.add('open');
                acList.querySelectorAll('.artist-ac-item').forEach(function(item) {
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        pickArtist(input, acList, item.dataset.name);
                    });
                });
            });
            input.addEventListener('keydown', function(e) {
                var items = acList.querySelectorAll('.artist-ac-item');
                if (!items.length) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); hlIdx = Math.min(hlIdx + 1, items.length - 1); hlItems(items, hlIdx); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); hlIdx = Math.max(hlIdx - 1, 0); hlItems(items, hlIdx); }
                else if (e.key === 'Enter' && hlIdx >= 0) { e.preventDefault(); pickArtist(input, acList, items[hlIdx].dataset.name); }
            });
            input.addEventListener('blur', function() { setTimeout(function() { acList.classList.remove('open'); }, 150); });
            return row;
        }
        function hlItems(items, idx) { items.forEach(function(it, i) { it.classList.toggle('hl', i === idx); if (i === idx) it.scrollIntoView({ block: 'nearest' }); }); }
        function pickArtist(input, acList, name) { input.value = name; input.readOnly = true; input.style.fontWeight = '600'; acList.classList.remove('open'); acList.innerHTML = ''; }

        // ==================== MODAL ====================
        var modal = document.getElementById('event-modal');
        var form = document.getElementById('event-form');
        var modalTitle = document.getElementById('modal-title');
        var deleteBtn = document.getElementById('delete-event-btn');

        function openAddModal() {
            editingEventId = null;
            modalTitle.textContent = 'Додај настан';
            deleteBtn.style.display = 'none';
            form.reset();
            resetArtists(['']);
            resetTickets([{ label: '', price: '' }]);
            modal.style.display = 'block';
            setTimeout(function() { document.getElementById('evt-title').focus(); }, 100);
        }

        function openEditModal(id) {
            var evt = allEvents.find(function(e) { return e.id === id; });
            if (!evt) return;
            editingEventId = id;
            modalTitle.textContent = 'Уреди настан';
            deleteBtn.style.display = '';

            document.getElementById('evt-title').value = evt.title || '';
            document.getElementById('evt-date').value = evt.date || '';
            document.getElementById('evt-time').value = evt.time || '';
            document.getElementById('evt-place').value = evt.place || '';
            document.getElementById('evt-link').value = evt.link || '';

            var artists = evt.artists || evt.bands || [];
            resetArtists(artists.length ? artists : ['']);
            var tickets = evt.tickets || [];
            resetTickets(tickets.length ? tickets : [{ label: '', price: '' }]);

            modal.style.display = 'block';
        }

        function resetArtists(values) {
            var c = document.getElementById('artist-entries');
            c.innerHTML = '';
            values.forEach(function(v) { c.appendChild(createArtistEntry(v)); });
        }

        function resetTickets(tickets) {
            var c = document.getElementById('ticket-entries');
            c.innerHTML = '';
            tickets.forEach(function(t) { addTicketEntry(t.label || '', t.price || ''); });
        }

        function addTicketEntry(label, price) {
            var c = document.getElementById('ticket-entries');
            var row = document.createElement('div');
            row.className = 'ticket-entry-row';
            row.innerHTML =
                '<input type="text" placeholder="Тип (пр. Стандард)" class="ticket-label-input" value="' + escA(label) + '">' +
                '<input type="text" placeholder="Цена (пр. 300 ден)" class="ticket-price-input" value="' + escA(price) + '">' +
                '<button type="button" class="entry-remove" title="Отстрани"><i class="fas fa-times"></i></button>';
            row.querySelector('.entry-remove').addEventListener('click', function() { row.remove(); });
            c.appendChild(row);
        }

        function closeModal() { modal.style.display = 'none'; editingEventId = null; }

        document.getElementById('add-event-btn').addEventListener('click', openAddModal);
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        window.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        document.getElementById('add-artist-btn').addEventListener('click', function() {
            var c = document.getElementById('artist-entries');
            var entry = createArtistEntry('');
            c.appendChild(entry);
            entry.querySelector('input').focus();
        });
        document.getElementById('add-ticket-btn').addEventListener('click', function() {
            addTicketEntry('', '');
            var entries = document.querySelectorAll('#ticket-entries .ticket-entry-row');
            if (entries.length) entries[entries.length - 1].querySelector('.ticket-label-input').focus();
        });

        // ==================== DELETE ====================
        deleteBtn.addEventListener('click', function() {
            if (!editingEventId) return;
            if (!confirm('Дали сте сигурни дека сакате да го избришете овој настан?')) return;
            var updated = allEvents.filter(function(e) { return e.id !== editingEventId; });
            submitUpdate(updated, 'Избришан настан: ' + editingEventId);
        });

        // ==================== FORM SUBMIT ====================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('evt-title').value.trim();
            var date = document.getElementById('evt-date').value;
            var time = document.getElementById('evt-time').value;
            var place = document.getElementById('evt-place').value.trim();
            var link = document.getElementById('evt-link').value.trim();

            var artists = [];
            var valid = true;
            document.querySelectorAll('#artist-entries .artist-input').forEach(function(input) {
                var v = input.value.trim();
                if (!v) return;
                var found = masterArtists.some(function(a) { return a.name === v; });
                if (!found) {
                    input.style.borderColor = '#ef4444';
                    notify('"' + v + '" не е на Мастер Листата. Одберете артист од листата.', 'error');
                    valid = false;
                    return;
                }
                input.style.borderColor = '';
                artists.push(v);
            });
            if (!valid) return;

            var tickets = [];
            document.querySelectorAll('#ticket-entries .ticket-entry-row').forEach(function(row) {
                var l = (row.querySelector('.ticket-label-input') || {}).value || '';
                var p = (row.querySelector('.ticket-price-input') || {}).value || '';
                l = l.trim(); p = p.trim();
                if (l || p) tickets.push({ label: l || 'Влез', price: p });
            });

            if (!title || !date || !time || !place || !artists.length) {
                notify('Пополнете ги сите задолжителни полиња.', 'error');
                return;
            }

            var eventObj = {
                id: editingEventId || generateId(title, date),
                title: title, date: date, time: time, place: place,
                artists: artists, tickets: tickets, link: link
            };

            var updated;
            if (editingEventId) {
                updated = allEvents.map(function(e) { return e.id === editingEventId ? eventObj : e; });
            } else {
                updated = allEvents.slice();
                updated.push(eventObj);
            }

            var desc = (editingEventId ? 'Уреден' : 'Нов') + ' настан: ' + title + ' (' + date + ')\nМесто: ' + place + '\nАртисти: ' + artists.join(', ');
            submitUpdate(updated, desc);
        });

        /** Save changes to localStorage drafts instead of immediately submitting. */
        function submitUpdate(updatedEvents, description) {
            updatedEvents.sort(function(a, b) { return a.date.localeCompare(b.date); });

            // Save to unified draft system
            if (window.MMMDrafts) {
                var origEvents = originalEventsJSON ? JSON.parse(originalEventsJSON) : { events: [] };
                window.MMMDrafts.save('events.json', { events: updatedEvents }, origEvents);
            }

            // Update local state so the table reflects the change
            allEvents = updatedEvents;
            updateStats();
            renderTable();
            closeModal();

            notify('Промените се зачувани локално. Кликнете "Испрати промени" за да ги поднесете.', 'info');
        }

        // ==================== INIT ====================
        // Drag-to-scroll for .cell-scroll elements
        (function() {
            function updateFadeMask(el) {
                if (el.scrollWidth <= el.clientWidth) {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                    return;
                }
                var atStart = el.scrollLeft < 2;
                var atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 2;
                if (atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                } else {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                }
            }
            document.addEventListener('scroll', function(e) {
                var scrollEl = e.target.closest ? e.target.closest('.cell-scroll') : null;
                if (scrollEl) updateFadeMask(scrollEl);
            }, true);
            document.addEventListener('mousedown', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                scrollEl.style.cursor = 'grabbing';
                var startX = e.pageX;
                var startScrollLeft = scrollEl.scrollLeft;
                function onMove(ev) {
                    ev.preventDefault();
                    scrollEl.scrollLeft = startScrollLeft - (ev.pageX - startX);
                    updateFadeMask(scrollEl);
                }
                function onUp() {
                    scrollEl.style.cursor = 'grab';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            document.addEventListener('wheel', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                e.preventDefault();
                scrollEl.scrollLeft += e.deltaY;
                updateFadeMask(scrollEl);
            }, { passive: false });
        })();
        loadData();
    })();
    </script>
</body>
