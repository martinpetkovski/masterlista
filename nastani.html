    <style>
    /* === Events-specific overrides === */

    /* Masked date/time input wrapper */
    .masked-input-wrap {
        position: relative;
        display: block;
    }
    .masked-input-wrap input {
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        background: transparent;
        position: relative;
        z-index: 1;
        caret-color: var(--text-primary);
        color: var(--text-primary);
    }
    .masked-input-wrap .mask-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        padding: 0.45rem 0.6rem;
        font-family: 'Montserrat', 'Courier New', monospace;
        letter-spacing: 0.12em;
        font-weight: 600;
        font-size: 0.8rem;
        pointer-events: none;
        z-index: 2;
    }
    .masked-input-wrap .mask-overlay .filled { visibility: hidden; }
    .masked-input-wrap .mask-overlay .placeholder { color: var(--text-muted); opacity: 0.45; }
    .masked-input-wrap .mask-overlay .separator {
        color: var(--text-muted);
        opacity: 0.5;
        visibility: hidden;
    }
    .masked-input-wrap input.mask-invalid {
        color: #ef4444 !important;
    }

    /* Column sizing: Name, Artists, Place, Date, Time, Tickets, Link, Actions */
    .nastani-page table { width: 100%; table-layout: auto; }
    .nastani-page th:nth-child(1), .nastani-page td:nth-child(1) { width: auto; padding: 0.25rem 0.5rem; }  /* Name - takes remaining space */
    .nastani-page th:nth-child(2), .nastani-page td:nth-child(2) { max-width: 180px; white-space: nowrap; overflow: hidden; } /* Artists */
    .nastani-page th:nth-child(3), .nastani-page td:nth-child(3) { white-space: nowrap; overflow: hidden; } /* Place */
    .nastani-page th:nth-child(4), .nastani-page td:nth-child(4) { white-space: nowrap; padding: 0.25rem 0.5rem; } /* Date */
    .nastani-page th:nth-child(5), .nastani-page td:nth-child(5) { white-space: nowrap; text-align: center; } /* Time */
    .nastani-page th:nth-child(6), .nastani-page td:nth-child(6) { max-width: 150px; white-space: nowrap; overflow: hidden; } /* Tickets */
    .nastani-page th:nth-child(7), .nastani-page td:nth-child(7) { width: 36px; white-space: nowrap; text-align: center; padding: 0 0.3rem; } /* Link */
    .nastani-page th:nth-child(8), .nastani-page td:nth-child(8) { width: 36px; white-space: nowrap; text-align: center; } /* Actions */

    .nastani-page .event-title-cell {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-primary);

        gap: 0.3rem;
        min-width: 0;
        max-width: 100%;
    }
    .nastani-page .event-name-row .event-title-cell {

    }
    .nastani-page .event-name-row .countdown-badge {

    .nastani-page .event-date-cell {

    /* Scrollable artist/ticket cells */
    .nastani-page .cell-scroll {

    .nastani-page .cell-scroll::-webkit-scrollbar { display: none; }

    /* Link column */
    .nastani-page .event-link-btn {
        color: var(--accent-blue);

        text-decoration: none;
        transition: opacity 0.15s;
    }

    /* Filter section */
    .nastani-page .controls {
        flex-wrap: wrap;
    }
    .nastani-page .filter-btn-group {
        display: flex;

        border: 1px solid var(--border-color);

        overflow: hidden;
    }
    .nastani-page .evt-filter-btn {
        font-family: 'Inter', sans-serif;

        padding: 0.35rem 0.7rem;

        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
        border-right: 1px solid var(--border-color);
    }
    .nastani-page .evt-filter-btn:last-child { border-right: none; }
    .nastani-page .evt-filter-btn:hover {
        background: var(--bg-hover);

    }
    .nastani-page .evt-filter-btn.active {

    body.dark-mode .nastani-page .evt-filter-btn {

    }
    body.dark-mode .nastani-page .evt-filter-btn.active {
        background: var(--accent-blue);
        color: #fff;
    }
    body.dark-mode .nastani-page .artist-tag {
        background: var(--bg-primary);
    }

    /* Today separator row */
    .nastani-page tr.today-separator td {
        padding: 0.2rem 0.5rem;
        background: none;
        border: none;
        position: relative;
    }
    .nastani-page .today-marker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .nastani-page .today-marker .tm-line {
        flex: 1;
        height: 1px;
        background: var(--accent-blue);
        opacity: 0.3;
    }
    .nastani-page .today-marker .tm-label {
        background: var(--accent-blue);
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        white-space: nowrap;
    }

    /* Autocomplete for artist input in modal */
    .nastani-page .artist-ac-wrapper {
        position: relative;
    }
    .nastani-page .artist-ac-list {
        position: absolute;
        left: 0; right: 0; top: 100%;

        border: 1px solid var(--border-color);
        border-radius: 4px;

        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        display: none;
    }
    .nastani-page .artist-ac-list.open { display: block; }
    .nastani-page .artist-ac-item {
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
        color: var(--text-primary);
        cursor: pointer;
        transition: background 0.1s;
    }
    .nastani-page .artist-ac-item:hover,
    .nastani-page .artist-ac-item.hl {
        background: var(--bg-hover);
    }
    .nastani-page .artist-ac-item .ac-city {
        font-size: 0.62rem;
        color: var(--text-muted);
        margin-left: 0.3rem;
    }
    body.dark-mode .nastani-page .artist-ac-list {
        background: var(--bg-secondary);
        border-color: var(--border-color);
    }

    .nastani-page .artist-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .artist-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .artist-entry-row input { flex: 1; }
    .nastani-page .entry-remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.78rem; padding: 0.2rem; }
    .nastani-page .ticket-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .ticket-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .ticket-entry-row input { flex: 1; }
    .nastani-page .link-entries-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .nastani-page .link-entry-row { display: flex; gap: 0.3rem; align-items: center; }
    .nastani-page .link-entry-row input { flex: 1; }

    .nastani-page .add-entry-btn {
        font-family: 'Inter', sans-serif;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--accent-blue);
        background: none;
        border: 1px dashed var(--accent-blue);
        border-radius: 4px;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        margin-top: 0.25rem;
        transition: background 0.15s;
    }
    .nastani-page .add-entry-btn:hover { background: rgba(74, 127, 165, 0.06); }

    .nastani-page .delete-event-btn {
        display: none;
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.5rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 4px;
        background: rgba(239, 68, 68, 0.06);
        color: #ef4444;
        cursor: pointer;
        transition: background 0.15s;
    }
    .nastani-page .delete-event-btn:hover { background: rgba(239, 68, 68, 0.12); }

    /* Notification */
    .nastani-notification {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-primary);
        z-index: 2000;
        max-width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        animation: notifIn 0.25s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: opacity 0.3s ease;
    }
    .nastani-notification.success { border-color: #22c55e; }
    .nastani-notification.success i { color: #22c55e; }
    .nastani-notification.error { border-color: #ef4444; }
    .nastani-notification.error i { color: #ef4444; }
    .nastani-notification.info { border-color: var(--accent-blue); }
    .nastani-notification.info i { color: var(--accent-blue); }
    @keyframes notifIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    body.dark-mode .nastani-notification { background: var(--bg-secondary); }

    /* Input & button styling to match master list */
    .nastani-page #search-events {
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 34px;
        flex: 2;
        min-width: 200px;
        transition: all var(--transition);
    }
    .nastani-page #search-events:focus {
        outline: none;
        border-color: var(--accent-blue);
        background: #fff;
    }
    .nastani-page #search-events::placeholder { color: var(--text-muted); }
    body.dark-mode .nastani-page #search-events {
        background: var(--bg-primary);
        color: var(--text-primary);
        border-color: var(--border-color);
    }
    body.dark-mode .nastani-page #search-events:focus {
        border-color: var(--accent-blue);
        background: var(--bg-primary);
    }

    .nastani-page #save-event-btn {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent-green, #22c55e);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all var(--transition);
    }
    .nastani-page #save-event-btn:hover { opacity: 0.9; }
    .nastani-page #save-event-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        display: none;
    }

        .events-mobile-search {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.4rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .events-mobile-search input {
            flex: 1;
            font-family: 'Inter', sans-serif;

        .nastani-page th:nth-child(5), .nastani-page td:nth-child(5) { display: none; }

    @media (max-width: 1000px) {

            gap: 0.4rem;
            padding: 0.4rem;

            height: 40px;

        .nastani-page table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }
        .nastani-page .table-wrapper {
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            flex: 1 !important;
        }
        .nastani-page .table-scroll-container {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            width: 100% !important;
            flex: 1 !important;
        }

    <script>
    (function() {
        'use strict';

        var EVENTS_JSON_URL = 'events.json';
        var BANDS_JSON_URL = 'bands.json';
        var PR_ENDPOINT = 'https://muzichka-master-lista.deeeeelay.workers.dev';
        var EVENTS_FILE_PATH = 'events.json';

        var MK_MONTHS = ['Јан','Фев','Мар','Апр','Мај','Јун','Јул','Авг','Сеп','Окт','Ное','Дек'];

        // Cyrillic-to-Latin transliteration for artist slug URLs
        var cyrMap = {
            'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g',
            'Д':'D','д':'d','Ѓ':'Gj','ѓ':'gj','Е':'E','е':'e','Ж':'Zh','ж':'zh',
            'З':'Z','з':'z','Ѕ':'Dz','ѕ':'dz','И':'I','и':'i','Ј':'J','ј':'j',
            'К':'K','к':'k','Л':'L','л':'l','Љ':'Lj','љ':'lj','М':'M','м':'m',
            'Н':'N','н':'n','Њ':'Nj','њ':'nj','О':'O','о':'o','П':'P','п':'p',
            'Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','Ќ':'Kj','ќ':'kj',
            'У':'U','у':'u','Ф':'F','ф':'f','Х':'H','х':'h','Ц':'C','ц':'c',
            'Ч':'Ch','ч':'ch','Џ':'Dz','џ':'dz','Ш':'Sh','ш':'sh'
        };
        function transliterate(text) { return text.split('').map(function(c) { return cyrMap[c] || c; }).join(''); }
        function artistSlug(name) { return transliterate(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
        function artistUrl(name) {
            var slug = encodeURIComponent(artistSlug(name));
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'artist.html?a=' + slug;
            return '/' + slug;
        }

        var allEvents = [];
        var masterArtists = [];
        var currentFilter = 'all';
        var searchQuery = '';
        var editingEventId = null;

        // ==================== SETTINGS MENU ====================
        (function() {
            const settingsBtn = document.getElementById('settings-btn');
            if (!settingsBtn) return;
            const svcDefs = {
                spotify: { name: 'Spotify', icon: 'fab fa-spotify', color: '#1DB954' },
                youtube: { name: 'YouTube', icon: 'fab fa-youtube', color: '#FF0000' },
                youtubeMusic: { name: 'YouTube Music', icon: 'fab fa-youtube', color: '#FF0000' },
                appleMusic: { name: 'Apple Music', icon: 'fab fa-apple', color: '#fc3c44' },
                deezer: { name: 'Deezer', icon: 'fas fa-headphones', color: '#A238FF' },
                tidal: { name: 'Tidal', icon: 'fas fa-water', color: '#000000' },
                amazonMusic: { name: 'Amazon Music', icon: 'fab fa-amazon', color: '#FF9900' },
                soundcloud: { name: 'SoundCloud', icon: 'fab fa-soundcloud', color: '#ff7700' },
                bandcamp: { name: 'Bandcamp', icon: 'fab fa-bandcamp', color: '#1da0c3' }
            };
            const overlay = document.createElement('div');
            overlay.id = 'settings-overlay';
            overlay.className = 'settings-overlay';
            const currentService = localStorage.getItem('mmm-preferred-service');
            const isDark = document.documentElement.classList.contains('dark-mode');
            overlay.innerHTML = `
                <div class="settings-panel">
                    <h3><i class="fas fa-gear"></i> Поставки</h3>
                    <div class="settings-section">
                        <div class="settings-section-title">Тема</div>
                        <div class="settings-theme-toggle">
                            <button class="settings-theme-btn ${!isDark ? 'active' : ''}" data-theme="light"><i class="fas fa-sun"></i> Светла</button>
                            <button class="settings-theme-btn ${isDark ? 'active' : ''}" data-theme="dark"><i class="fas fa-moon"></i> Темна</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Стриминг сервис</div>
                        <select class="settings-service-select">
                            <option value="" ${!currentService ? 'selected' : ''}>Секогаш прашувај</option>
                            ${Object.entries(svcDefs).map(([id, svc]) => `<option value="${id}" ${id === currentService ? 'selected' : ''}>${svc.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="settings-section settings-tour-section">
                        <button class="settings-tour-btn" id="settings-start-tour"><i class="fas fa-route"></i> Тура на сајтот</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('visible'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const ov = document.getElementById('settings-overlay'); if (ov) ov.classList.remove('visible'); } });
            overlay.querySelectorAll('.settings-theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dark = btn.dataset.theme === 'dark';
                    document.body.classList.toggle('dark-mode', dark);
                    document.documentElement.classList.toggle('dark-mode', dark);
                    document.documentElement.style.backgroundColor = dark ? '#111318' : '';
                    localStorage.setItem('mmm-dark-mode', dark);
                    overlay.querySelectorAll('.settings-theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            const svcSelect = overlay.querySelector('.settings-service-select');
            if (svcSelect) {
                svcSelect.addEventListener('change', () => {
                    const serviceId = svcSelect.value;
                    if (serviceId) { localStorage.setItem('mmm-preferred-service', serviceId); }
                    else { localStorage.removeItem('mmm-preferred-service'); }
                });
            }
            const tourBtnEl = overlay.querySelector('#settings-start-tour');
            if (tourBtnEl) { tourBtnEl.addEventListener('click', () => { overlay.classList.remove('visible'); if (typeof window.startGlobalTour === 'function') window.startGlobalTour(); }); }
            settingsBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark-mode');
                overlay.querySelectorAll('.settings-theme-btn').forEach(btn => { btn.classList.toggle('active', (btn.dataset.theme === 'dark') === isDark); });
                const currentSvc = localStorage.getItem('mmm-preferred-service');
                const svcSel = overlay.querySelector('.settings-service-select'); if (svcSel) svcSel.value = currentSvc || '';
                overlay.classList.add('visible');
            });
        })();

        // ==================== NAV MENU ====================
        (function() {
            var trigger = document.querySelector('.site-nav-trigger');
            var menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            trigger.addEventListener('click', function(e) {
                if (window.innerWidth <= 600) { e.preventDefault(); e.stopPropagation(); menu.classList.toggle('open'); }
            });
            document.addEventListener('click', function(e) {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) menu.classList.remove('open');
            });
        })();

        // ==================== FILTER TOGGLE ====================
        (function() {
            var btn = document.getElementById('toggle-filters');
            var controls = document.getElementById('controls-bar');
            if (!btn || !controls) return;
            btn.addEventListener('click', function() {
                // On mobile, toggle via .active class; on desktop, toggle display
                if (window.innerWidth <= 600) {
                    controls.classList.toggle('active');
                } else {
                    controls.style.display = controls.style.display === 'none' ? '' : 'none';
                }
            });
        })();

        // ==================== HELPERS ====================
        function getToday() { var d = new Date(); d.setHours(0,0,0,0); return d; }
        function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
        function daysUntil(s) { return Math.ceil((parseDate(s) - getToday()) / 86400000); }

        function getDayName(dateStr) {
            var days = ['недела', 'понеделник', 'вторник', 'среда', 'четврток', 'петок', 'сабота'];
            var p = dateStr.split('-');
            var d = new Date(+p[0], +p[1]-1, +p[2]);
            return days[d.getDay()];
        }

        function countdownText(dateStr) {
            var d = daysUntil(dateStr);
            var day = getDayName(dateStr);
            if (d === 0) return { text: 'Денес', cls: 'today-cd' };
            if (d === 1) return { text: 'Утре, во ' + day, cls: 'soon' };
            if (d > 1 && d <= 7) return { text: 'За ' + d + ' дена, во ' + day, cls: 'soon' };
            if (d > 7 && d <= 30) return { text: 'За ' + d + ' дена, во ' + day, cls: 'later' };
            if (d > 30) { var m = Math.floor(d / 30); return { text: m === 1 ? 'За ~1 месец' : 'За ~' + m + ' месеци', cls: 'later' }; }
            if (d === -1) return { text: 'Вчера', cls: 'passed' };
            if (d < -1 && d >= -30) return { text: 'Пред ' + Math.abs(d) + ' дена', cls: 'passed' };
            if (d < -30) { var mo = Math.floor(Math.abs(d) / 30); return { text: mo === 1 ? 'Пред ~1 месец' : 'Пред ~' + mo + ' месеци', cls: 'passed' }; }
            return { text: '', cls: '' };
        }

        function esc(str) { var d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
        function escA(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        /** Normalize event links: supports legacy .link (string) and new .links (array of {label,url}) */
        function getEventLinks(evt) {
            if (evt.links && Array.isArray(evt.links) && evt.links.length) return evt.links;
            if (evt.link) return [{ label: '', url: evt.link }];
            return [];
        }

        function generateId(title, date) {
            var slug = title.toLowerCase().replace(/[^a-z0-9\u0400-\u04FF]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
            return 'evt-' + date.replace(/-/g, '') + '-' + (slug || 'event') + '-' + Math.random().toString(36).slice(2, 6);
        }

        // ==================== NOTIFICATION ====================
        function notify(msg, type) {
            type = type || 'info';
            var c = document.getElementById('nastani-notifications');
            var el = document.createElement('div');
            el.className = 'nastani-notification ' + type;
            var ic = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            el.innerHTML = '<i class="fas ' + (ic[type]||ic.info) + '"></i> ' + msg;
            c.appendChild(el);
            setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 4000);
        }

        // ==================== LOAD DATA ====================
        var originalEventsJSON = null; // keep original for diff comparison

        async function loadData() {
            var loadingBar = document.getElementById('loading-bar');
            loadingBar.classList.add('active');
            try {
                var [evtRes, bandsRes] = await Promise.all([
                    fetch(EVENTS_JSON_URL + '?v=' + Date.now()),
                    fetch(BANDS_JSON_URL + '?v=' + Date.now())
                ]);
                if (!evtRes.ok) throw new Error('events load fail');
                var evtData = await evtRes.json();
                allEvents = evtData.events || [];
                originalEventsJSON = JSON.stringify(allEvents);

                if (bandsRes.ok) {
                    var bandsData = await bandsRes.json();
                    masterArtists = (bandsData.muzickaMasterLista || []).map(function(b) {
                        return { name: b.name, city: b.city || '' };
                    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
                }

                // Overlay draft bands so newly-added artists are immediately selectable
                _refreshMasterArtistsFromDrafts();

                // Restore any pending event drafts from localStorage
                if (window.MMMDrafts) {
                    var draft = window.MMMDrafts.load('events.json');
                    if (draft && draft.events && Array.isArray(draft.events)) {
                        allEvents = draft.events;
                        notify('Вчитани се незачувани промени од претходно. Кликнете "Испрати промени" за да ги поднесете.', 'info');
                    }
                }

                updateStats();
                renderTable();
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('events-table-body').innerHTML =
                    '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)"><i class="fas fa-exclamation-triangle"></i> Не можеме да ги вчитаме настаните.</td></tr>';
            } finally {
                loadingBar.classList.remove('active');
            }
        }

        /**
         * Merge draft bands into masterArtists so that bands added/edited
         * via the master list are immediately available in the artist autocomplete.
         */
        function _refreshMasterArtistsFromDrafts() {
            if (!window.MMMDrafts) return;
            var draft = window.MMMDrafts.load('bands.json');
            if (draft && draft.muzickaMasterLista && Array.isArray(draft.muzickaMasterLista)) {
                masterArtists = draft.muzickaMasterLista.map(function(b) {
                    return { name: b.name, city: b.city || '' };
                }).sort(function(a, b) { return a.name.localeCompare(b.name); });
            }
        }

        // Listen for draft discard events (from the floating bar)
        window.addEventListener('mmm-drafts-discarded', function() {
            // Reload original data
            if (originalEventsJSON) {
                allEvents = JSON.parse(originalEventsJSON);
                updateStats();
                renderTable();
            }
            // Revert artist list to server baseline
            _refreshMasterArtistsFromDrafts();
        });

        // Listen for successful draft submission
        window.addEventListener('mmm-drafts-submitted', function() {
            // The submitted data becomes the new baseline
            originalEventsJSON = JSON.stringify(allEvents);
        });

        // When drafts change in another tab (cross-page sync),
        // refresh the artist autocomplete list immediately.
        window.addEventListener('mmm-drafts-changed', function() {
            _refreshMasterArtistsFromDrafts();
        });

        function updateStats() {
            var t = getToday(), up = 0, pa = 0;
            allEvents.forEach(function(e) { if (parseDate(e.date) >= t) up++; else pa++; });
            document.getElementById('stat-total').textContent = allEvents.length;
            document.getElementById('stat-upcoming').textContent = up;
            document.getElementById('stat-past').textContent = pa;
        }

        // ==================== RENDER TABLE ====================
        function renderTable() {
            var tbody = document.getElementById('events-table-body');
            var t = getToday();
            var q = searchQuery.toLowerCase();

            var filtered = allEvents.filter(function(e) {
                if (currentFilter === 'upcoming' && parseDate(e.date) < t) return false;
                if (currentFilter === 'past' && parseDate(e.date) >= t) return false;
                if (q) {
                    var artists = (e.artists || e.bands || []).join(' ').toLowerCase();
                    var hay = (e.title + ' ' + e.place + ' ' + artists).toLowerCase();
                    if (hay.indexOf(q) === -1) return false;
                }
                return true;
            });

            // Sort: farthest future at top, farthest past at bottom
            filtered.sort(function(a, b) {
                return parseDate(b.date) - parseDate(a.date);
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)">' +
                    '<i class="fas fa-calendar-xmark" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i>' +
                    'Нема настани' + (q ? ' за "' + esc(q) + '"' : '') + '</td></tr>';
                return;
            }

            var html = '';
            var todayInserted = false;

            for (var i = 0; i < filtered.length; i++) {
                var evt = filtered[i];
                var evtDate = parseDate(evt.date);
                var isPast = evtDate < t;
                var isToday = daysUntil(evt.date) === 0;

                // Today separator
                if (!todayInserted && isPast && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                    todayInserted = true;
                    html += '<tr class="today-separator"><td colspan="8">' +
                        '<div class="today-marker">' +
                        '<div class="tm-line"></div>' +
                        '<span class="tm-label"><i class="fas fa-location-dot"></i> Денес</span>' +
                        '<div class="tm-line"></div>' +
                        '</div></td></tr>';
                }

                var d = evtDate;
                var cd = countdownText(evt.date);
                var artists = evt.artists || evt.bands || [];
                var rowCls = isPast ? 'past-event' : (isToday ? 'today-event' : '');

                html += '<tr class="' + rowCls + '" data-id="' + escA(evt.id) + '">';

                // 1. Name + badges (countdown, location, price)
                var cheapest = '';
                if (evt.tickets && evt.tickets.length) {
                    var prices = evt.tickets.map(function(t) { return parseInt(t.price, 10); }).filter(function(n) { return !isNaN(n); });
                    if (prices.length) cheapest = Math.min.apply(null, prices) + ' ден.';
                }
                html += '<td data-label="Настан"><div class="event-name-row"><span class="event-title-cell">' + esc(evt.title) + '</span>';
                if (cd.text) html += '<span class="countdown-badge ' + cd.cls + '">' + cd.text + '</span>';
                if (evt.place) html += '<a href="https://www.google.com/maps/search/' + encodeURIComponent(evt.place) + '" target="_blank" rel="noopener" class="countdown-badge mobile-place-badge" onclick="event.stopPropagation()"><i class="fas fa-location-dot"></i> ' + esc(evt.place) + '</a>';
                if (cheapest) html += '<span class="countdown-badge mobile-price-badge"><i class="fas fa-ticket"></i> ' + esc(cheapest) + '</span>';
                html += '</div>';
                // Mobile: structured meta with icons
                html += '<span class="mobile-meta">';
                html += '<span class="mm-item"><i class="fas fa-location-dot"></i> ' + esc(evt.place) + '</span>';
                html += '<span class="mm-sep">·</span>';
                html += '<span class="mm-item"><i class="fas fa-calendar"></i> ' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '</span>';
                html += '<span class="mm-sep">·</span>';
                html += '<span class="mm-item"><i class="fas fa-clock"></i> ' + esc(evt.time) + '</span>';
                html += '</span>';
                // Mobile: artists inline
                if (artists.length) {
                    html += '<span class="mobile-artists-inline">';
                    for (var ma = 0; ma < artists.length; ma++) {
                        html += '<a href="' + escA(artistUrl(artists[ma])) + '" class="artist-tag" onclick="event.stopPropagation()"><i class="fas fa-music"></i> ' + esc(artists[ma]) + '</a>';
                    }
                    html += '</span>';
                }
                html += '</td>';

                // 2. Artists
                html += '<td data-label="Артисти"><div class="cell-scroll">';
                for (var a = 0; a < artists.length; a++) {
                    html += '<a href="' + escA(artistUrl(artists[a])) + '" class="artist-tag" onclick="event.stopPropagation()" title="' + escA(artists[a]) + '"><i class="fas fa-music"></i> ' + esc(artists[a]) + '</a>';
                }
                if (!artists.length) html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                html += '</div></td>';

                // 3. Place (links to Google Maps)
                var mapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(evt.place || '');
                html += '<td data-label="Место"><a href="' + escA(mapsUrl) + '" target="_blank" rel="noopener" class="event-place-cell place-maps-link" onclick="event.stopPropagation()">' + esc(evt.place) + '</a></td>';

                // 4. Date (single line)
                html += '<td data-label="Датум"><div class="event-date-cell">' +
                    String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear() +
                    '</div></td>';

                // 5. Time
                html += '<td data-label="Време"><span class="event-time-cell">' + esc(evt.time) + '</span></td>';

                // Tickets
                html += '<td data-label="Карти"><div class="cell-scroll">';
                if (evt.tickets && evt.tickets.length) {
                    for (var ti = 0; ti < evt.tickets.length; ti++) {
                        var tk = evt.tickets[ti];
                        html += '<span class="ticket-tag"><i class="fas fa-ticket"></i> ' + esc(tk.label) + ': ' + esc(tk.price) + '</span>';
                    }
                } else {
                    html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                }
                html += '</div></td>';

                // Link (support both legacy .link and new .links array)
                var evtLinks = getEventLinks(evt);
                html += '<td data-label="Линк" style="text-align:center">';
                if (evtLinks.length === 1) {
                    html += '<a href="' + escA(evtLinks[0].url) + '" target="_blank" rel="noopener" class="event-link-btn" onclick="event.stopPropagation()" title="' + escA(evtLinks[0].label || evtLinks[0].url) + '"><i class="fas fa-arrow-up-right-from-square"></i></a>';
                } else if (evtLinks.length > 1) {
                    html += '<span class="event-link-btn" style="cursor:pointer" title="' + evtLinks.length + ' линкови">';
                    html += '<i class="fas fa-arrow-up-right-from-square"></i><sup style="font-size:0.55rem;margin-left:1px">' + evtLinks.length + '</sup>';
                    html += '</span>';
                } else {
                    html += '<span style="color:var(--text-muted);font-size:0.7rem">—</span>';
                }
                html += '</td>';

                // Actions
                html += '<td data-label="Акции" style="text-align:center"><button class="action-btn edit-btn" data-id="' + escA(evt.id) + '" title="Уреди"><i class="fas fa-pen"></i></button></td>';

                html += '</tr>';
            }

            // If all upcoming, insert today marker at end
            if (!todayInserted && currentFilter !== 'past' && currentFilter !== 'upcoming') {
                html += '<tr class="today-separator"><td colspan="8">' +
                    '<div class="today-marker">' +
                    '<div class="tm-line"></div>' +
                    '<span class="tm-label"><i class="fas fa-location-dot"></i> Денес</span>' +
                    '<div class="tm-line"></div>' +
                    '</div></td></tr>';
            }

            tbody.innerHTML = html;

            // Scroll to today separator
            scrollToToday();

            // Bind edit buttons
            tbody.querySelectorAll('.edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openEditModal(btn.dataset.id);
                });
            });

            // Row click to open event page
            tbody.querySelectorAll('tr[data-id]').forEach(function(row) {
                row.style.cursor = 'pointer';
                row.addEventListener('click', function() {
                    var eid = encodeURIComponent(row.dataset.id);
                    window.location.href = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'nastan.html?id=' + eid : '/nastan/' + eid;
                });
            });
        }

        // ==================== SCROLL TO TODAY ====================
        function scrollToToday() {
            var sep = document.querySelector('.today-separator');
            if (!sep) return;
            // On mobile, table-scroll-container is the scroll parent; on desktop, table-wrapper
            var sc = document.querySelector('.table-scroll-container');
            var wrapper = (sc && sc.scrollHeight > sc.clientHeight) ? sc : document.querySelector('.table-wrapper');
            if (!wrapper) return;
            // Delay slightly to let DOM settle
            setTimeout(function() {
                var wrapperRect = wrapper.getBoundingClientRect();
                var sepRect = sep.getBoundingClientRect();
                var offset = sepRect.top - wrapperRect.top + wrapper.scrollTop - (wrapperRect.height / 3);
                wrapper.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
            }, 100);
        }

        // ==================== ARTIST AUTOCOMPLETE ====================
        function createArtistEntry(value) {
            var row = document.createElement('div');
            row.className = 'artist-entry-row artist-ac-wrapper';
            var input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Пребарај артист...';
            input.className = 'artist-input';
            input.value = value || '';
            input.readOnly = !!value;
            if (value) input.style.fontWeight = '600';
            var acList = document.createElement('div');
            acList.className = 'artist-ac-list';
            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'entry-remove';
            removeBtn.title = 'Отстрани';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';

            row.appendChild(input);
            row.appendChild(acList);
            row.appendChild(removeBtn);
            removeBtn.addEventListener('click', function() { row.remove(); });

            var hlIdx = -1;
            input.addEventListener('input', function() {
                var q = input.value.trim().toLowerCase();
                input.readOnly = false;
                input.style.fontWeight = '';
                hlIdx = -1;
                if (q.length < 1) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                var matches = masterArtists.filter(function(a) { return a.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
                if (!matches.length) { acList.classList.remove('open'); acList.innerHTML = ''; return; }
                acList.innerHTML = matches.map(function(a) {
                    return '<div class="artist-ac-item" data-name="' + escA(a.name) + '">' +
                        esc(a.name) + (a.city ? '<span class="ac-city">' + esc(a.city) + '</span>' : '') + '</div>';
                }).join('');
                acList.classList.add('open');
                acList.querySelectorAll('.artist-ac-item').forEach(function(item) {
                    item.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        pickArtist(input, acList, item.dataset.name);
                    });
                });
            });
            input.addEventListener('keydown', function(e) {
                var items = acList.querySelectorAll('.artist-ac-item');
                if (!items.length) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); hlIdx = Math.min(hlIdx + 1, items.length - 1); hlItems(items, hlIdx); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); hlIdx = Math.max(hlIdx - 1, 0); hlItems(items, hlIdx); }
                else if (e.key === 'Enter' && hlIdx >= 0) { e.preventDefault(); pickArtist(input, acList, items[hlIdx].dataset.name); }
            });
            input.addEventListener('blur', function() { setTimeout(function() { acList.classList.remove('open'); }, 150); });
            return row;
        }
        function hlItems(items, idx) { items.forEach(function(it, i) { it.classList.toggle('hl', i === idx); if (i === idx) it.scrollIntoView({ block: 'nearest' }); }); }
        function pickArtist(input, acList, name) { input.value = name; input.readOnly = true; input.style.fontWeight = '600'; acList.classList.remove('open'); acList.innerHTML = ''; }

        // ==================== MASKED DATE/TIME INPUTS WITH VALIDATION ====================
        (function() {
            function clampDateDigits(digits) {
                var d = digits.split('');
                // Day: 0-3 for first digit
                if (d[0] && parseInt(d[0]) > 3) d[0] = '3';
                if (d[0] === '3' && d[1] && parseInt(d[1]) > 1) d[1] = '1';
                if (d[0] === '0' && d[1] === '0') d[1] = '1';
                // Month: 0-1 for first digit
                if (d[2] && parseInt(d[2]) > 1) d[2] = '1';
                if (d[2] === '1' && d[3] && parseInt(d[3]) > 2) d[3] = '2';
                if (d[2] === '0' && d[3] === '0') d[3] = '1';
                return d.join('');
            }
            function clampTimeDigits(digits) {
                var d = digits.split('');
                // Hour: 0-2 for first digit
                if (d[0] && parseInt(d[0]) > 2) d[0] = '2';
                if (d[0] === '2' && d[1] && parseInt(d[1]) > 3) d[1] = '3';
                // Minute: 0-5 for first digit
                if (d[2] && parseInt(d[2]) > 5) d[2] = '5';
                return d.join('');
            }
            function renderOverlay(overlayEl, value, template, sepChar) {
                var digits = value.replace(/\D/g, '');
                var datePlaceholders = ['Д','Д','М','М','Г','Г','Г','Г'];
                var timePlaceholders = ['Ч','Ч','М','М'];
                var phs = (template === '__.__.____') ? datePlaceholders : timePlaceholders;
                var html = '';
                var di = 0;
                for (var i = 0; i < template.length; i++) {
                    if (template[i] === '_') {
                        if (di < digits.length) {
                            html += '<span class="filled">' + digits[di] + '</span>';
                        } else {
                            html += '<span class="placeholder">' + phs[di] + '</span>';
                        }
                        di++;
                    } else {
                        html += '<span class="separator">' + sepChar + '</span>';
                    }
                }
                overlayEl.innerHTML = html;
            }

            function setupMaskedInput(inputEl, overlayEl, template, sepChar, maxDigits, clampFn) {
                function update() {
                    var raw = inputEl.value.replace(/\D/g, '').slice(0, maxDigits);
                    raw = clampFn(raw);
                    var formatted = '';
                    for (var i = 0; i < raw.length; i++) {
                        if (template[formatted.length] !== '_') formatted += sepChar;
                        formatted += raw[i];
                    }
                    inputEl.value = formatted;
                    renderOverlay(overlayEl, formatted, template, sepChar);
                    // Validate complete value
                    if (raw.length === maxDigits) {
                        var valid = true;
                        if (maxDigits === 8) {
                            var dd = parseInt(raw.slice(0,2)), mm = parseInt(raw.slice(2,4));
                            if (dd < 1 || dd > 31 || mm < 1 || mm > 12) valid = false;
                        } else {
                            var hh = parseInt(raw.slice(0,2)), mi = parseInt(raw.slice(2,4));
                            if (hh > 23 || mi > 59) valid = false;
                        }
                        inputEl.classList.toggle('mask-invalid', !valid);
                    } else {
                        inputEl.classList.remove('mask-invalid');
                    }
                }
                inputEl.addEventListener('input', update);
                // Render initial overlay
                update();
                return update;
            }

            var dateInput = document.getElementById('evt-date');
            var timeInput = document.getElementById('evt-time');
            var dateOverlay = document.getElementById('evt-date-overlay');
            var timeOverlay = document.getElementById('evt-time-overlay');

            window._evtDateUpdate = setupMaskedInput(dateInput, dateOverlay, '__.__.____', '.', 8, clampDateDigits);
            window._evtTimeUpdate = setupMaskedInput(timeInput, timeOverlay, '__:__', ':', 4, clampTimeDigits);
        })();

        // ==================== DELETE ====================
        deleteBtn.addEventListener('click', function() {
            if (!editingEventId) return;
            if (!confirm('Дали сте сигурни дека сакате да го избришете овој настан?')) return;
            var updated = allEvents.filter(function(e) { return e.id !== editingEventId; });
            submitUpdate(updated, 'Избришан настан: ' + editingEventId);

        // ==================== FORM SUBMIT ====================
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('evt-title').value.trim();
            var dateRaw = document.getElementById('evt-date').value.trim();
            var time = document.getElementById('evt-time').value.trim();
            var place = document.getElementById('evt-place').value.trim();

            // Convert European date (dd.mm.yyyy) to ISO (YYYY-MM-DD)
            var date = '';
            if (dateRaw) {
                var dp = dateRaw.split('.');
                if (dp.length === 3 && dp[0].length === 2 && dp[1].length === 2 && dp[2].length === 4) {
                    date = dp[2] + '-' + dp[1] + '-' + dp[0];
                } else {
                    notify('Форматот на датумот треба да биде дд.мм.гггг', 'error');
                    return;
                }
            }

            // Validate time format HH:MM
            if (time && !/^\d{2}:\d{2}$/.test(time)) {
                notify('Форматот на времето треба да биде чч:мм', 'error');
                return;
            }

            var artists = [];
            var valid = true;
            document.querySelectorAll('#artist-entries .artist-input').forEach(function(input) {
                var v = input.value.trim();
                if (!v) return;
                var found = masterArtists.some(function(a) { return a.name === v; });
                if (!found) {
                    input.style.borderColor = '#ef4444';
                    notify('"' + v + '" не е на Мастер Листата. Одберете артист од листата.', 'error');
                    valid = false;
                    return;
                }
                input.style.borderColor = '';
                artists.push(v);
            });
            if (!valid) return;

            var tickets = [];
            document.querySelectorAll('#ticket-entries .ticket-entry-row').forEach(function(row) {
                var l = (row.querySelector('.ticket-label-input') || {}).value || '';
                var p = (row.querySelector('.ticket-price-input') || {}).value || '';
                l = l.trim(); p = p.trim();
                if (l || p) tickets.push({ label: l || 'Влез', price: p });
            });

            var links = [];
            document.querySelectorAll('#link-entries .link-entry-row').forEach(function(row) {
                var lbl = (row.querySelector('.link-label-input') || {}).value || '';
                var u = (row.querySelector('.link-url-input') || {}).value || '';
                lbl = lbl.trim(); u = u.trim();
                if (u) links.push({ label: lbl, url: u });
            });

            if (!title || !date || !time || !place) {
                notify('Пополнете ги сите задолжителни полиња.', 'error');
                return;
            }

            var eventObj = {
                id: editingEventId || generateId(title, date),
                title: title, date: date, time: time, place: place,
                artists: artists, tickets: tickets, links: links
            };

            var updated;
            if (editingEventId) {
                updated = allEvents.map(function(e) { return e.id === editingEventId ? eventObj : e; });
            } else {
                updated = allEvents.slice();
                updated.push(eventObj);
            }

            var desc = (editingEventId ? 'Уреден' : 'Нов') + ' настан: ' + title + ' (' + date + ')\nМесто: ' + place + (artists.length ? '\nАртисти: ' + artists.join(', ') : '');
            submitUpdate(updated, desc);
        });

        /** Save changes to localStorage drafts instead of immediately submitting. */
        function submitUpdate(updatedEvents, description) {
            updatedEvents.sort(function(a, b) { return a.date.localeCompare(b.date); });

            // Save to unified draft system
            if (window.MMMDrafts) {
                var origEvents = originalEventsJSON ? { events: JSON.parse(originalEventsJSON) } : { events: [] };
                window.MMMDrafts.save('events.json', { events: updatedEvents }, origEvents);
            }

            // Update local state so the table reflects the change
            allEvents = updatedEvents;
            updateStats();
            renderTable();
            closeModal();

            notify('Промените се зачувани локално. Кликнете "Испрати промени" за да ги поднесете.', 'info');
        }

        // ==================== INIT ====================
        // Drag-to-scroll for .cell-scroll elements
        (function() {
            function updateFadeMask(el) {
                if (el.scrollWidth <= el.clientWidth) {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                    return;
                }
                var atStart = el.scrollLeft < 2;
                var atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 2;
                if (atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to left, black calc(100% - 18px), transparent 100%)';
                } else if (!atStart && !atEnd) {
                    el.style.webkitMaskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                    el.style.maskImage = 'linear-gradient(to right, transparent 0%, black 18px, black calc(100% - 18px), transparent 100%)';
                } else {
                    el.style.webkitMaskImage = 'none';
                    el.style.maskImage = 'none';
                }
            }
            document.addEventListener('scroll', function(e) {
                var scrollEl = e.target.closest ? e.target.closest('.cell-scroll') : null;
                if (scrollEl) updateFadeMask(scrollEl);
            }, true);
            document.addEventListener('mousedown', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                scrollEl.style.cursor = 'grabbing';
                var startX = e.pageX;
                var startScrollLeft = scrollEl.scrollLeft;
                function onMove(ev) {
                    ev.preventDefault();
                    scrollEl.scrollLeft = startScrollLeft - (ev.pageX - startX);
                    updateFadeMask(scrollEl);
                }
                function onUp() {
                    scrollEl.style.cursor = 'grab';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            document.addEventListener('wheel', function(e) {
                var scrollEl = e.target.closest('.cell-scroll');
                if (!scrollEl || scrollEl.scrollWidth <= scrollEl.clientWidth) return;
                e.preventDefault();
                scrollEl.scrollLeft += e.deltaY;
                updateFadeMask(scrollEl);
            }, { passive: false });
        })();
        loadData();
    })();
    </script>
</body>
