    <style>
        /* ==================== PAGE LAYOUT ==================== */
        body.vesti-page {
            height: auto;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.vesti-page main {
            height: auto;
            overflow: visible;
        }

        .news-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 2rem;
        }

        /* ==================== PAGE HEADER / FILTERS ==================== */
        .news-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .news-page-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
            letter-spacing: -0.01em;
        }

        .news-search {
            flex: 0 1 220px;
            padding: 0.4rem 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .news-search:focus {
            border-color: var(--accent-blue);
        }

        .news-search::placeholder {
            color: var(--text-muted);
        }

        .news-source-filters {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            max-width: 100%;
            -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
            mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
        }

        .news-source-filters::-webkit-scrollbar {
            display: none;
        }

        .news-source-filter {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-primary);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .news-source-filter:hover {
            border-color: var(--accent-blue);
            background: var(--bg-secondary);
        }

        .news-source-filter.active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: #fff;
        }

        .news-source-filter img {
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        /* ==================== HERO ARTICLE ==================== */
        .news-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.25rem;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .news-hero:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 20px rgba(74, 127, 165, 0.08);
        }

        .news-hero-image {
            aspect-ratio: 16 / 10;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-hover) 100%);
            overflow: hidden;
            position: relative;
        }

        .news-hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-hero-image .hero-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
            opacity: 0.25;
            background: linear-gradient(135deg, #e8ecf1 0%, #d1d8e0 100%);
        }

        .news-hero-body {
            padding: 1.5rem 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.6rem;
        }

        .news-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .news-hero-badge img {
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        .news-hero-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .news-hero:hover .news-hero-title {
            color: var(--accent-blue);
        }

        .news-hero-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-hero-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* ==================== SECTION LABEL ==================== */
        .news-section-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-blue);
            display: inline-block;
        }

        /* ==================== CARD GRID ==================== */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        /* ==================== NEWS CARD ==================== */
        .news-card {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .news-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 16px rgba(74, 127, 165, 0.07);
            transform: translateY(-2px);
        }

        .news-card-image {
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-hover) 100%);
            position: relative;
        }

        .news-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .news-card:hover .news-card-image img {
            transform: scale(1.03);
        }

        .news-card-image .card-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: var(--text-muted);
            opacity: 0.2;
        }

        .news-card-body {
            padding: 0.85rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 0.35rem;
        }

        .news-card-source {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .news-card-source-name {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .news-card-source-name img {
            width: 13px;
            height: 13px;
            border-radius: 2px;
        }

        .news-card-date {
            font-size: 0.65rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .news-card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.15s ease;
        }

        .news-card:hover .news-card-title {
            color: var(--accent-blue);
        }

        .news-card-desc {
            font-size: 0.76rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .news-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.4rem;
            margin-top: auto;
            gap: 0.5rem;
        }

        .news-card-footer .news-artist-tags {
            display: flex;
            gap: 0.25rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            min-width: 0;
            flex: 1;
            -webkit-mask-image: linear-gradient(to right, black calc(100% - 16px), transparent 100%);
            mask-image: linear-gradient(to right, black calc(100% - 16px), transparent 100%);
        }
        .news-card-footer .news-artist-tags::-webkit-scrollbar { display: none; }

        .news-card-readmore {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            opacity: 0;
            transform: translateX(-4px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .news-card:hover .news-card-readmore {
            opacity: 1;
            transform: translateX(0);
        }

        /* ==================== STATES ==================== */
        .news-loading {
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-muted);
        }

        .news-loading i {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            display: block;
            animation: spin 1s linear infinite;
            color: var(--accent-blue);
        }

        .news-loading div:last-child {
            font-size: 0.82rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .news-empty {
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .news-empty i {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.75rem;
            opacity: 0.3;
        }

        /* ==================== FOOTER ==================== */
        .news-footer {
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .news-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .news-footer a:hover {
            text-decoration: underline;
        }

        /* ==================== ARTIST TAG ==================== */
        .news-artist-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--accent-purple, #7b6e9e);
            background: rgba(123, 110, 158, 0.1);
            padding: 0.15rem 0.45rem;
            border-radius: 10px;
            white-space: nowrap;
        }

        .news-artist-tag i {
            font-size: 0.55rem;
        }

        /* Multiple artist tags container (hero) */
        .news-artist-tags {
            display: flex;
            gap: 0.3rem;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .news-artist-tags::-webkit-scrollbar { display: none; }

        body.dark-mode .news-artist-tag {
            background: rgba(138, 125, 181, 0.15);
            color: var(--accent-purple, #8a7db5);
        }

        /* ==================== DARK MODE ==================== */
        body.dark-mode .news-hero {
            background: var(--bg-secondary);
        }

        body.dark-mode .news-hero:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        body.dark-mode .news-hero-image .hero-placeholder {
            background: linear-gradient(135deg, #1a1e26 0%, #22262e 100%);
        }

        body.dark-mode .news-card {
            background: var(--bg-secondary);
        }

        body.dark-mode .news-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        body.dark-mode .news-card-image {
            background: linear-gradient(135deg, #1a1e26 0%, #22262e 100%);
        }

        /* ==================== MOBILE ==================== */
        @media (max-width: 600px) {
            .news-container {
                padding: 0.75rem 0.6rem 1.5rem;
            }

            .news-page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            .news-page-header h2 {
                font-size: 1rem;
            }

            .news-search {
                width: 100%;
                padding: 0 0.75rem;
                font-size: 0.8rem;
                border-radius: 6px;
                height: 32px;
                max-height: 32px;
                min-height: 32px;
                line-height: 32px;
                flex-shrink: 0;
                flex-grow: 0;
            }

            .news-source-filters {
                justify-content: flex-start;
                width: 100%;
                padding-bottom: 0.25rem;
            }

            .news-source-filter {
                padding: 0.35rem 0.6rem;
                font-size: 0.68rem;
                min-height: 32px;
            }

            /* Hero stacks vertically on mobile */
            .news-hero {
                grid-template-columns: 1fr;
                border-radius: 10px;
            }

            .news-hero-image {
                aspect-ratio: 16 / 9;
            }

            .news-hero-body {
                padding: 1rem;
            }

            .news-hero-title {
                font-size: 1.05rem;
            }

            .news-hero-desc {
                font-size: 0.78rem;
                -webkit-line-clamp: 2;
            }

            .news-hero-meta {
                flex-wrap: wrap;
            }

            /* Single column grid on mobile */
            .news-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            /* Card: horizontal compact layout */
            .news-card {
                flex-direction: row;
                border-radius: 8px;
            }

            .news-card-image {
                width: 100px;
                min-width: 100px;
                min-height: 100%;
                aspect-ratio: auto;
                flex-shrink: 0;
            }

            .news-card-body {
                padding: 0.5rem 0.65rem;
                gap: 0.25rem;
            }

            .news-card-title {
                font-size: 0.78rem;
                -webkit-line-clamp: 2;
            }

            .news-card-desc {
                -webkit-line-clamp: 1;
                font-size: 0.7rem;
            }

            .news-card-footer {
                padding-top: 0.2rem;
                gap: 0.3rem;
            }

            .news-card-footer .news-artist-tags {
                gap: 0.2rem;
            }

            .news-card-footer .news-artist-tag {
                font-size: 0.55rem;
                padding: 0.1rem 0.3rem;
            }

            .news-card-readmore {
                opacity: 1;
                transform: none;
                font-size: 0.6rem;
                flex-shrink: 0;
            }

            .news-artist-tag {
                font-size: 0.58rem;
                padding: 0.1rem 0.35rem;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .news-hero {
                grid-template-columns: 1fr;
            }

            .news-hero-image {
                aspect-ratio: 16 / 8;
            }

            .news-hero-body {
                padding: 1.1rem 1.25rem;
            }
        }

        /* ==================== MOBILE WIDTH FIX ==================== */
        @media (max-width: 600px) {
            .news-container {
                max-width: 100vw;
                overflow-x: hidden;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .news-card-image img,
            .news-hero-image img {
                max-width: 100%;
            }

            .news-hero-title,
            .news-hero-desc,
            .news-card-title,
            .news-card-desc {
                word-break: break-word;
                overflow-wrap: break-word;
            }

            .news-page-header {
                max-width: 100%;
                overflow: hidden;
            }

            .news-source-filters {
                max-width: 100%;
            }
        }

        /* ==================== COMPACT VIEW ==================== */
        .header-btn.compact-active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: #fff;
        }

        /* Compact list container — table layout */
        .news-compact-list {
            display: none;
            width: 100%;
            border-collapse: collapse;
        }

        .news-compact-list.visible {
            display: table;
        }

        .news-compact-item {
            display: table-row;
            text-decoration: none;
            color: inherit;
            transition: background 0.12s ease;
        }

        .news-compact-item:hover {
            background: var(--bg-hover);
        }

        .news-compact-item > * {
            display: table-cell;
            vertical-align: middle;
            padding: 0.45rem 0.35rem;
            border-bottom: 1px solid var(--border-color);
        }

        .news-compact-item:first-child > * {
            border-top: 1px solid var(--border-color);
        }

        .news-compact-date {
            font-size: 0.62rem;
            color: var(--text-muted);
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            padding-right: 0.5rem;
        }

        .news-compact-source-icon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            vertical-align: middle;
        }

        .news-compact-icon-cell {
            width: 1px;
            white-space: nowrap;
            text-align: center;
        }

        .news-compact-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            max-width: 0;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .news-compact-item:hover .news-compact-title {
            color: var(--accent-blue);
        }

        .news-compact-artists {
            white-space: nowrap;
            text-align: right;
        }

        .news-compact-artists .news-artist-tag {
            font-size: 0.55rem;
            padding: 0.08rem 0.3rem;
        }

        @media (max-width: 600px) {
            .news-compact-item > * {
                padding: 0.4rem 0.2rem;
            }

            .news-compact-date {
                font-size: 0.58rem;
            }

            .news-compact-source-icon {
                width: 14px;
                height: 14px;
            }

            .news-compact-title {
                font-size: 0.72rem;
            }

            .news-compact-artists {
                display: none;
            }
        }
    </style>
    <script>if(location.hostname==='localhost'||location.hostname==='127.0.0.1')document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||!h.startsWith('/'))return;if(h==='/'){e.preventDefault();location.href='/index.html';return;}var m;if(m=h.match(/^\/nastan\/(.+)/)){e.preventDefault();location.href='/nastan.html?id='+m[1];return;}if(m=h.match(/^\/kustos\/(.+)/)){e.preventDefault();location.href='/kustos.html?name='+m[1];return;}if(h.indexOf('.')===-1){e.preventDefault();var q=h.indexOf('?');location.href=(q>0?h.substring(0,q):h)+'.html'+(q>0?h.substring(q):'');}});</script>

<body class="compact vesti-page">
    <header id="site-header" data-active="/vesti" data-title="Музички Вести">
        <span class="header-info">
            <span>Ажурирано <span id="articles-updated">...</span></span>
        </span>
        <button id="compact-toggle" class="header-btn" title="Компактен приказ">
            <i class="fas fa-list"></i>
        </button>
    </header>
    <script src="/load-header.js"></script>
    <main>
        <div class="news-container">
            <div class="news-page-header">
                <input type="text" id="news-search" class="news-search" placeholder="Пребарај вести...">
                <div class="news-source-filters" id="news-source-filters"></div>
            </div>
            <div id="news-loading" class="news-loading">
                <div><i class="fas fa-spinner"></i></div>
                <div>Се вчитуваат вестите...</div>
            </div>
            <div id="news-hero" style="display:none;"></div>
            <div class="news-section-label" id="news-section-label" style="display:none;">Последни Написи</div>
            <div id="news-grid" class="news-grid" style="display:none;"></div>
            <div id="news-compact-list" class="news-compact-list"></div>
            <div id="news-empty" class="news-empty" style="display:none;">
                <i class="fas fa-newspaper"></i>
                <p>Нема вести за артисти од Мастер Листата во моментов.</p>
            </div>
        </div>
    </main>
    <script>
        // ==================== SETTINGS MENU ====================
        (function() {
            const settingsBtn = document.getElementById('settings-btn');
            if (!settingsBtn) return;
            const svcDefs = {
                spotify: { name: 'Spotify', icon: 'fab fa-spotify', color: '#1DB954' },
                youtube: { name: 'YouTube', icon: 'fab fa-youtube', color: '#FF0000' },
                youtubeMusic: { name: 'YouTube Music', icon: 'fab fa-youtube', color: '#FF0000' },
                appleMusic: { name: 'Apple Music', icon: 'fab fa-apple', color: '#fc3c44' },
                deezer: { name: 'Deezer', icon: 'fas fa-headphones', color: '#A238FF' },
                tidal: { name: 'Tidal', icon: 'fas fa-water', color: '#000000' },
                amazonMusic: { name: 'Amazon Music', icon: 'fab fa-amazon', color: '#FF9900' },
                soundcloud: { name: 'SoundCloud', icon: 'fab fa-soundcloud', color: '#ff7700' },
                bandcamp: { name: 'Bandcamp', icon: 'fab fa-bandcamp', color: '#1da0c3' }
            };
            const overlay = document.createElement('div');
            overlay.id = 'settings-overlay';
            overlay.className = 'settings-overlay';
            const currentService = localStorage.getItem('mmm-preferred-service');
            const isDark = document.documentElement.classList.contains('dark-mode');
            overlay.innerHTML = `
                <div class="settings-panel">
                    <h3><i class="fas fa-gear"></i> Поставки</h3>
                    <div class="settings-section">
                        <div class="settings-section-title">Тема</div>
                        <div class="settings-theme-toggle">
                            <button class="settings-theme-btn ${!isDark ? 'active' : ''}" data-theme="light"><i class="fas fa-sun"></i> Светла</button>
                            <button class="settings-theme-btn ${isDark ? 'active' : ''}" data-theme="dark"><i class="fas fa-moon"></i> Темна</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Стриминг сервис</div>
                        <select class="settings-service-select">
                            <option value="" ${!currentService ? 'selected' : ''}>Секогаш прашувај</option>
                            ${Object.entries(svcDefs).map(([id, svc]) => `<option value="${id}" ${id === currentService ? 'selected' : ''}>${svc.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="settings-section settings-tour-section">
                        <button class="settings-tour-btn" id="settings-start-tour"><i class="fas fa-route"></i> Тура на сајтот</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('visible'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const ov = document.getElementById('settings-overlay'); if (ov) ov.classList.remove('visible'); } });
            overlay.querySelectorAll('.settings-theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dark = btn.dataset.theme === 'dark';
                    document.body.classList.toggle('dark-mode', dark);
                    document.documentElement.classList.toggle('dark-mode', dark);
                    document.documentElement.style.backgroundColor = dark ? '#111318' : '';
                    localStorage.setItem('mmm-dark-mode', dark);
                    overlay.querySelectorAll('.settings-theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            const svcSelect = overlay.querySelector('.settings-service-select');
            if (svcSelect) {
                svcSelect.addEventListener('change', () => {
                    const serviceId = svcSelect.value;
                    if (serviceId) { localStorage.setItem('mmm-preferred-service', serviceId); }
                    else { localStorage.removeItem('mmm-preferred-service'); }
                });
            }
            const tourBtnEl = overlay.querySelector('#settings-start-tour');
            if (tourBtnEl) { tourBtnEl.addEventListener('click', () => { overlay.classList.remove('visible'); if (typeof window.startGlobalTour === 'function') window.startGlobalTour(); }); }
            settingsBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark-mode');
                overlay.querySelectorAll('.settings-theme-btn').forEach(btn => { btn.classList.toggle('active', (btn.dataset.theme === 'dark') === isDark); });
                const currentSvc = localStorage.getItem('mmm-preferred-service');
                const svcSel = overlay.querySelector('.settings-service-select'); if (svcSel) svcSel.value = currentSvc || '';
                overlay.classList.add('visible');
            });
        })();

        // ==================== NAV MENU ====================
        function initNavMenu() {
            const trigger = document.querySelector('.site-nav-trigger');
            const menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            
            trigger.addEventListener('click', (e) => {
                // Only toggle dropdown on mobile (<=600px); on desktop nav is always visible
                if (window.innerWidth <= 600) {
                    e.preventDefault();
                    e.stopPropagation();
                    menu.classList.toggle('open');
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });
        }
        initNavMenu();

        // ==================== ARTICLE LOADING FROM articles.json ====================
        
        // Artist names loaded from bands.json for filtering
        let artistNames = [];    // array of { patterns: [lowercase strings], name: original }
        
        async function loadArtistNames() {
            try {
                const resp = await fetch('bands.json');
                const data = await resp.json();
                const bands = data.muzickaMasterLista || [];
                artistNames = bands.map(b => {
                    const patterns = [];
                    if (b.name) patterns.push(b.name);
                    return { name: b.name, patterns };
                }).filter(a => a.patterns.length > 0);
            } catch (err) {
                console.warn('Failed to load bands.json for news filtering:', err);
            }
        }
        
        /**
         * Check if an article mentions any artist from the master list.
         * Returns an array of all matched artist names (empty if none).
         */
        function matchesArtist(article) {
            // Build searchable text from article fields
            const haystack = [article.title, article.description]
                .filter(Boolean).join(' ');
            
            // Capitalize helper: first letter uppercase unless starts with digit
            function capitalize(s) {
                if (!s || /^\d/.test(s)) return s;
                return s.charAt(0).toUpperCase() + s.slice(1);
            }
            
            // Word boundary chars (Cyrillic-safe, since \b doesn't work for Cyrillic)
            const B = '[\\s,;:.!?\\-–—\\/\\(\\)\\[\\]"\'\\ |«»„"\u2018\u2019\u201c\u201d]';
            
            const matched = [];
            for (const artist of artistNames) {
                for (const pattern of artist.patterns) {
                    // Skip very short names (<=2 chars) — too many false positives
                    if (pattern.length <= 2) continue;
                    
                    // Require capitalized form and exact word boundaries (case-sensitive)
                    const term = capitalize(pattern);
                    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp('(?:^|' + B + ')' + escaped + '(?:$|' + B + ')');
                    if (regex.test(haystack)) {
                        if (!matched.includes(artist.name)) matched.push(artist.name);
                        break; // Don't match same artist twice via different patterns
                    }
                }
            }
            return matched;
        }
        
        async function loadNewsFeeds() {
            try {
                // Load artist names and articles archive in parallel
                const [articlesResp] = await Promise.all([
                    fetch('articles.json'),
                    loadArtistNames()
                ]);
                
                if (!articlesResp.ok) throw new Error(`Failed to load articles.json: ${articlesResp.status}`);
                const archive = await articlesResp.json();
                
                // Populate last-updated in header
                const updatedEl = document.getElementById('articles-updated');
                if (updatedEl && archive.lastUpdated) {
                    const d = new Date(archive.lastUpdated);
                    const ageMs = Date.now() - d.getTime();
                    const hours = Math.floor(ageMs / (60 * 60 * 1000));
                    const minutes = Math.floor((ageMs % (60 * 60 * 1000)) / (60 * 1000));
                    if (hours >= 24) { updatedEl.textContent = `пред ${Math.floor(hours/24)}д`; }
                    else if (hours > 0) { updatedEl.textContent = `пред ${hours}ч`; }
                    else { updatedEl.textContent = `пред ${minutes}мин`; }
                }
                
                const allArticles = (archive.articles || []).map(a => ({
                    ...a,
                    pubDate: a.date ? new Date(a.date) : new Date(0),
                    image: a.thumbnail || '',
                    sourceIcon: a.iconUrl || '',
                    content: ''
                }));
                
                let matchedArticles = [];
                const filtersContainer = document.getElementById('news-source-filters');
                
                // Build source filter buttons from the unique sources in the archive
                const sources = new Map();
                allArticles.forEach(a => {
                    if (!sources.has(a.source)) {
                        sources.set(a.source, { name: a.source, iconUrl: a.sourceIcon || a.iconUrl });
                    }
                });
                
                sources.forEach(feed => {
                    const btn = document.createElement('button');
                    btn.className = 'news-source-filter active';
                    btn.dataset.source = feed.name;
                    btn.innerHTML = `<img src="${feed.iconUrl}" alt="${feed.name}"> ${feed.name}`;
                    btn.addEventListener('click', () => {
                        btn.classList.toggle('active');
                        renderNews(matchedArticles);
                    });
                    filtersContainer.appendChild(btn);
                });
                
                // Match articles against master list artists
                allArticles.forEach(article => {
                    article.matchedArtists = matchesArtist(article);
                });
                
                // Only keep articles that mention a master list artist
                matchedArticles = allArticles.filter(a => a.matchedArtists.length > 0);
                
                // Sort by date descending
                matchedArticles.sort((a, b) => b.pubDate - a.pubDate);
                
                document.getElementById('news-loading').style.display = 'none';
                
                if (matchedArticles.length === 0) {
                    document.getElementById('news-empty').style.display = 'block';
                } else {
                    renderNews(matchedArticles);
                }
                
                // Wire up search
                const searchInput = document.getElementById('news-search');
                if (searchInput) {
                    let searchTimeout;
                    searchInput.addEventListener('input', () => {
                        clearTimeout(searchTimeout);
                        searchTimeout = setTimeout(() => renderNews(matchedArticles), 200);
                    });
                }
            } catch (err) {
                console.error('Failed to load articles:', err);
                document.getElementById('news-loading').innerHTML = '<div><i class="fas fa-exclamation-triangle"></i></div><div>Грешка при вчитување на вестите.</div>';
            }
        }
        
        function relativeTime(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Сега';
            if (diffMins < 60) return `пред ${diffMins} мин`;
            if (diffHours < 24) return `пред ${diffHours} ч`;
            if (diffDays < 7) return `пред ${diffDays} ${diffDays === 1 ? 'ден' : 'дена'}`;
            return date.toLocaleDateString('mk-MK', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        
        let isCompactView = false;

        function initCompactToggle() {
            const btn = document.getElementById('compact-toggle');
            if (!btn) return;
            // Restore saved preference
            const saved = localStorage.getItem('mmm-news-compact');
            if (saved === 'true') {
                isCompactView = true;
                btn.classList.add('compact-active');
                btn.innerHTML = '<i class="fas fa-th-large"></i>';
            }
            btn.addEventListener('click', () => {
                isCompactView = !isCompactView;
                localStorage.setItem('mmm-news-compact', isCompactView);
                btn.classList.toggle('compact-active', isCompactView);
                btn.innerHTML = isCompactView
                    ? '<i class="fas fa-th-large"></i>'
                    : '<i class="fas fa-list"></i>';
                // Re-render with current articles
                if (window._currentNewsArticles) renderNews(window._currentNewsArticles);
            });
        }
        initCompactToggle();

        function renderNews(articles) {
            window._currentNewsArticles = articles;
            const heroContainer = document.getElementById('news-hero');
            const gridContainer = document.getElementById('news-grid');
            const sectionLabel = document.getElementById('news-section-label');
            const compactList = document.getElementById('news-compact-list');
            const activeFilters = Array.from(document.querySelectorAll('.news-source-filter.active'))
                .map(btn => btn.dataset.source);
            const searchQuery = (document.getElementById('news-search')?.value || '').trim().toLowerCase();
            
            let filtered = articles.filter(a => activeFilters.includes(a.source));
            
            if (searchQuery) {
                filtered = filtered.filter(a => {
                    const title = (a.title || '').toLowerCase();
                    const desc = (a.description || '').toLowerCase();
                    const source = (a.source || '').toLowerCase();
                    const artists = (a.matchedArtists || []).join(' ').toLowerCase();
                    return title.includes(searchQuery) || desc.includes(searchQuery) || source.includes(searchQuery) || artists.includes(searchQuery);
                });
            }
            
            if (filtered.length === 0) {
                heroContainer.style.display = 'none';
                gridContainer.style.display = 'none';
                sectionLabel.style.display = 'none';
                compactList.classList.remove('visible');
                document.getElementById('news-empty').style.display = 'block';
                return;
            }
            
            document.getElementById('news-empty').style.display = 'none';

            // Compact view
            if (isCompactView) {
                heroContainer.style.display = 'none';
                gridContainer.style.display = 'none';
                sectionLabel.style.display = 'none';
                compactList.classList.add('visible');
                compactList.innerHTML = filtered.map(article => {
                    const dateStr = article.pubDate.getTime() > 0 ? relativeTime(article.pubDate) : '';
                    const artistTagsHtml = (article.matchedArtists || []).slice(0, 2)
                        .map(a => `<span class="news-artist-tag"><i class="fas fa-guitar"></i> ${a}</span>`).join('');
                    return `<a href="${article.link}" target="_blank" class="news-compact-item">
                        <span class="news-compact-date">${dateStr}</span>
                        <span class="news-compact-icon-cell"><img class="news-compact-source-icon" src="${article.sourceIcon}" alt="${article.source}"></span>
                        <span class="news-compact-title">${article.title}</span>
                        ${artistTagsHtml ? `<span class="news-compact-artists">${artistTagsHtml}</span>` : ''}
                    </a>`;
                }).join('');
                return;
            }

            // Card/default view
            compactList.classList.remove('visible');
            heroContainer.style.display = '';
            gridContainer.style.display = '';
            sectionLabel.style.display = filtered.length > 1 ? '' : 'none';
            
            // Hero article (first/latest)
            const hero = filtered[0];
            const heroDate = hero.pubDate.getTime() > 0 ? relativeTime(hero.pubDate) : '';
            const heroImageHtml = hero.image
                ? `<img src="${hero.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'hero-placeholder\\'><i class=\\'fas fa-newspaper\\'></i></div>'">`
                : `<div class="hero-placeholder"><i class="fas fa-newspaper"></i></div>`;
            
            heroContainer.innerHTML = `<a href="${hero.link}" target="_blank" class="news-hero">
                <div class="news-hero-image">${heroImageHtml}</div>
                <div class="news-hero-body">
                    <div class="news-hero-badge">
                        <img src="${hero.sourceIcon}" alt="${hero.source}">
                        ${hero.source}
                    </div>
                    <div class="news-hero-title">${hero.title}</div>
                    ${hero.description ? `<div class="news-hero-desc">${hero.description}</div>` : ''}
                    <div class="news-hero-meta">
                        ${hero.matchedArtists && hero.matchedArtists.length > 0 ? `<span class="news-artist-tags">${hero.matchedArtists.map(a => `<span class="news-artist-tag"><i class="fas fa-guitar"></i> ${a}</span>`).join('')}</span>` : ''}
                        ${heroDate ? `<span><i class="far fa-clock"></i> ${heroDate}</span>` : ''}
                    </div>
                </div>
            </a>`;
            
            // Grid cards (rest of articles)
            const rest = filtered.slice(1);
            gridContainer.innerHTML = rest.map(article => {
                const dateStr = article.pubDate.getTime() > 0 ? relativeTime(article.pubDate) : '';
                const imageHtml = article.image
                    ? `<img src="${article.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-placeholder\\'><i class=\\'fas fa-music\\'></i></div>'">`
                    : `<div class="card-placeholder"><i class="fas fa-music"></i></div>`;
                
                const artistTagsHtml = article.matchedArtists && article.matchedArtists.length > 0
                    ? `<span class="news-artist-tags">${article.matchedArtists.map(a => `<span class="news-artist-tag"><i class="fas fa-guitar"></i> ${a}</span>`).join('')}</span>`
                    : '';
                
                return `<a href="${article.link}" target="_blank" class="news-card">
                        <div class="news-card-image">${imageHtml}</div>
                        <div class="news-card-body">
                            <div class="news-card-source">
                                <span class="news-card-source-name">
                                    <img src="${article.sourceIcon}" alt="${article.source}">
                                    ${article.source}
                                </span>
                                ${dateStr ? `<span class="news-card-date">${dateStr}</span>` : ''}
                            </div>
                            <div class="news-card-title">${article.title}</div>
                            ${article.description ? `<div class="news-card-desc">${article.description}</div>` : ''}
                            <div class="news-card-footer">
                                ${artistTagsHtml}
                                <span class="news-card-readmore">Прочитај повеќе <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </div>
                </a>`;
            }).join('');
        }
        
        // Start loading
        loadNewsFeeds();

        // Enable drag-to-scroll on news source filters and artist tag containers
        function enableDragScroll(selector) {
            document.querySelectorAll(selector).forEach(el => {
                if (el.scrollWidth <= el.clientWidth) return;
                el.style.cursor = 'grab';
                el.addEventListener('mousedown', (e) => {
                    el.style.cursor = 'grabbing';
                    const startX = e.pageX;
                    const startScrollLeft = el.scrollLeft;
                    const onMove = (ev) => {
                        ev.preventDefault();
                        el.scrollLeft = startScrollLeft - (ev.pageX - startX);
                    };
                    const onUp = () => {
                        el.style.cursor = 'grab';
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
                el.addEventListener('wheel', (e) => {
                    if (el.scrollWidth <= el.clientWidth) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                }, { passive: false });
            });
        }
        // Delay to ensure DOM is rendered
        setTimeout(() => {
            enableDragScroll('.news-source-filters');
            enableDragScroll('.news-artist-tags');
        }, 2000);
    </script>
</body>
