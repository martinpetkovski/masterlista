	.vesti-page .news-item:nth-child(1) { animation-delay: 0.05s; }

	.vesti-page .news-item:nth-child(n+6) { animation-delay: 0.2s; }
	@keyframes vestiCardReveal {
		from { opacity: 0; transform: translateX(-20px); filter: blur(4px); }

<body class="compact vesti-page">

					<i class="fas fa-newspaper"></i> <span data-i18n="news.all">Сите</span>
				</button>

	<script>
	(function() {
		'use strict';

		var allArticles = [];
		var filteredArticles = [];
		var bandsData = [];
		var visibleCount = 36;

		var searchQuery = '';
		var sourceFilter = 'all';
		var sortFilter = 'date_desc';
		var genreFilter = 'all';
		var lastUpdated = '';

		var searchInput = document.getElementById('news-search');
		var loadMoreWrap = document.getElementById('load-more-wrap');
		var loadMoreBtn = document.getElementById('load-more-btn');
		var newsContainer = document.getElementById('news-container');
		var loadingBar = document.getElementById('loading-bar');

		initSettingsMenu();
		initNavMenu();

		(function setupSearchToggle() {
			var btn = document.getElementById('search-toggle-btn');
			var controls = document.getElementById('controls-bar');
			var icon = btn ? btn.querySelector('i') : null;

			if (!btn || !controls) return;

			btn.addEventListener('click', function() {
				var isVisible = controls.classList.toggle('visible');
				if (icon) icon.className = 'fas ' + (isVisible ? 'fa-times' : 'fa-search');
				if (isVisible) {
					setTimeout(function() { searchInput.focus(); }, 50);
				} else if (searchInput && searchInput.value) {
					searchInput.value = '';
					searchQuery = '';
					visibleCount = 36;
					applyFilters();
				}
			});

			// Always visible on desktop
			if (window.innerWidth > 600) {
				controls.classList.add('visible');
			}
		})();

		function esc(str) {
			return escHtml(String(str || ''));
		}

		function escAttr(str) {
			return esc(str).replace(/'/g, '&#39;');
		}

		function normalizeArticle(a) {
			var artistList = Array.isArray(a.matchedArtists) ? a.matchedArtists.filter(Boolean) : [];
			return {
				title: a.title || '',
				link: a.link || '#',
				description: a.description || '',
				date: a.date || '',
				source: a.source || t('news.unknownSource'),
				iconUrl: a.iconUrl || '',
				thumbnail: a.thumbnail || '',
				matchedArtists: artistList
			};
		}

		function normalizeDateOnly(raw) {
			if (!raw) return '';
			return String(raw).slice(0, 10);
		}

		function parseDate(article) {
			var dateOnly = normalizeDateOnly(article.date);
			if (!dateOnly) return 0;
			return new Date(dateOnly + 'T00:00:00').getTime() || 0;
		}

		function formatDateLabel(dateStr) {
			var dateOnly = normalizeDateOnly(dateStr);
			if (!dateOnly) return '';
			return formatDate(dateOnly);
		}

		function artistLink(name) {
			return getArtistPageUrl(name);
		}

		function getArtistBandInfo(name) {
			if (!name || !bandsData || !bandsData.length) return null;
			var lower = String(name).toLowerCase();
			for (var i = 0; i < bandsData.length; i++) {
				if (bandsData[i].name && bandsData[i].name.toLowerCase() === lower) return bandsData[i];
			}
			return null;
		}

		function getArtistAvatarInitials(name) {
			var trimmed = String(name || '').trim();
			if (!trimmed) return '?';
			var words = trimmed.split(/[\s\-&,]+/).filter(function(word) { return word.length > 0; });
			if (words.length >= 2) {
				return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
			}
			return trimmed.substring(0, 2).toUpperCase();
		}

		function getArtistAvatarGradient(name) {
			var palette = [
				['#e74c3c', '#c0392b'], ['#e67e22', '#d35400'], ['#f1c40f', '#e6a700'],
				['#2ecc71', '#27ae60'], ['#1abc9c', '#16a085'], ['#3498db', '#2980b9'],
				['#9b59b6', '#8e44ad'], ['#e84393', '#d63384'], ['#fd79a8', '#e17055'],
				['#00cec9', '#0984e3'], ['#6c5ce7', '#a29bfe'], ['#fdcb6e', '#e17055']
			];
			var hash = 0;
			var artistName = String(name || '');
			for (var i = 0; i < artistName.length; i++) {
				hash = ((hash << 5) - hash + artistName.charCodeAt(i)) | 0;
			}
			var paletteIndex = ((hash % palette.length) + palette.length) % palette.length;
			var colors = palette[paletteIndex];
			return 'background:linear-gradient(145deg,' + colors[0] + ',' + colors[1] + ')';
		}

		function buildNewsArtistChip(name) {
			var band = getArtistBandInfo(name);
			var artistName = band && band.name ? band.name : name;
			var artistLabel = esc(localizeText(artistName));
			var avatarHtml = band && band.image
				? '<img class="artist-chip-avatar" src="' + escAttr(band.image) + '" alt="' + artistLabel + '" loading="lazy" onerror="this.onerror=null;this.src=ARTIST_FALLBACK_IMG">'
				: '<span class="artist-chip-avatar-placeholder" style="' + getArtistAvatarGradient(artistName) + '">' + esc(getArtistAvatarInitials(artistName)) + '</span>';
			return '<a href="' + escAttr(artistLink(artistName)) + '" class="artist-chip" title="' + escAttr(localizeText(artistName)) + '">' + avatarHtml + '<span class="artist-chip-name">' + artistLabel + '</span></a>';
		}

		function updateHeaderStats() {
			var sourceSet = new Set();
			for (var i = 0; i < allArticles.length; i++) {
				if (allArticles[i].source) sourceSet.add(allArticles[i].source);
			}
			document.getElementById('stat-articles').textContent = allArticles.length;
			document.getElementById('stat-sources').textContent = sourceSet.size;
			document.getElementById('stat-updated').textContent = lastUpdated ? (t('news.updated') + ' ' + formatDateLabel(lastUpdated)) : t('news.updated') + ' —';
		}

		function applyFilters() {
			var q = searchQuery.toLowerCase().trim();
			filteredArticles = allArticles.filter(function(a) {
				if (sourceFilter !== 'all' && a.source !== sourceFilter) return false;

				// Genre filter: article passes if ANY matched artist matches genre
				if (genreFilter !== 'all' && a.matchedArtists && a.matchedArtists.length) {
					var anyMatch = a.matchedArtists.some(function(name) {
						return artistMatchesGenre(name, genreFilter, bandsData);
					});
					if (!anyMatch) return false;
				} else if (genreFilter !== 'all' && (!a.matchedArtists || !a.matchedArtists.length)) {
					return false; // no artists = can't match genre
				}

				if (!q) return true;

				var artists = (a.matchedArtists || []).join(' ').toLowerCase();
				var hay = (a.title + ' ' + a.description + ' ' + a.source + ' ' + artists).toLowerCase();
				return hay.indexOf(q) !== -1;
			});

			filteredArticles.sort(function(a, b) {
				if (sortFilter === 'date_asc') return parseDate(a) - parseDate(b);
				if (sortFilter === 'source_asc') return a.source.localeCompare(b.source, 'mk');
				if (sortFilter === 'title_asc') return a.title.localeCompare(b.title, 'mk');
				return parseDate(b) - parseDate(a);
			});

			renderNews();
		}

		function renderNews() {
			// Update filter count badge in header
			var activeFilters = 0;
			if (genreFilter !== 'all') activeFilters++;
			if (searchQuery.trim()) activeFilters++;
			var badge = document.getElementById('filter-count');
			if (badge) {
				badge.textContent = activeFilters;
				badge.classList.toggle('visible', activeFilters > 0);
			}

			if (!filteredArticles.length) {
				newsContainer.innerHTML = '<div class="news-empty"><i class="fas fa-newspaper" style="font-size:1.3rem;display:block;margin-bottom:0.5rem"></i>' + t('news.noNews') + '</div>';
				loadMoreWrap.style.display = 'none';
				return;
			}

			var shown = filteredArticles.slice(0, visibleCount);
			var html = '';

			var noImageText = t('news.noImage');
			shown.forEach(function(article) {
				var thumbHtml = article.thumbnail
					? '<img class="news-thumb" src="' + escAttr(article.thumbnail) + '" alt="" loading="lazy" onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;news-thumb news-thumb-placeholder&quot;><i class=&quot;fas fa-newspaper&quot;></i><span>' + esc(noImageText) + '</span></div>\'">'
					: '<div class="news-thumb news-thumb-placeholder"><i class="fas fa-newspaper"></i><span>' + t('news.noImage') + '</span></div>';
				var iconHtml = article.iconUrl ? '<img src="' + escAttr(article.iconUrl) + '" alt="">' : '';
				var descHtml = article.description ? '<div class="news-desc">' + esc(article.description.length > 120 ? article.description.substring(0, 120) + '...' : article.description) + '</div>' : '';
				var artistsHtml = '';

				if (article.matchedArtists && article.matchedArtists.length) {
					artistsHtml = '<div class="news-artists">' + article.matchedArtists.slice(0, 6).map(function(name) {
						return buildNewsArtistChip(name);
					}).join('') + '</div>';
				} else {
					artistsHtml = '<div class="news-artists"><span class="artist-empty">' + t('news.noArtists') + '</span></div>';
				}

				html += '<li class="news-item">' +
					'<a href="' + escAttr(article.link) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">' +
						thumbHtml +
					'</a>' +
					'<div class="news-info">' +
						'<div class="news-title"><a href="' + escAttr(article.link) + '" target="_blank" rel="noopener">' + esc(article.title) + '</a></div>' +
						descHtml +
						'<div class="news-source">' + iconHtml + esc(article.source) + ' &bull; ' + esc(formatDateLabel(article.date)) + '</div>' +
						artistsHtml +
					'</div>' +
				'</li>';
			});

			newsContainer.innerHTML = html;
			loadMoreWrap.style.display = (visibleCount < filteredArticles.length) ? '' : 'none';
		}

		async function loadNewsData() {
			loadingBar.classList.add('active');
			try {
				// Load bands data for genre filtering
				try {
					var bandsResp = await fetch('bands.json');
					if (bandsResp.ok) {
						var bandsJson = await bandsResp.json();
						bandsData = bandsJson.muzickaMasterLista || bandsJson || [];
						registerArtistNames(bandsData);
					}
				} catch (e) { console.warn('Could not load bands.json for genre filter:', e); }

				var fromMaster = null;
				var master = await loadSiteMaster();
				if (master && master.news) {
					fromMaster = master.news;
				}

				if (fromMaster && Array.isArray(fromMaster.matched)) {
					allArticles = fromMaster.matched.map(normalizeArticle);
					lastUpdated = fromMaster.lastUpdated || '';
				} else {
					var resp = await fetch('articles.json');
					if (!resp.ok) throw new Error(t('news.fetchError'));
					var raw = await resp.json();
					allArticles = (raw.articles || []).map(normalizeArticle);
					lastUpdated = raw.lastUpdated || '';
				}

				allArticles.sort(function(a, b) { return parseDate(b) - parseDate(a); });
				updateHeaderStats();
				applyFilters();
			} catch (err) {
				console.error('News load error:', err);
				newsContainer.innerHTML = '<div class="news-empty"><i class="fas fa-triangle-exclamation" style="font-size:1.1rem;display:block;margin-bottom:0.4rem"></i>' + t('news.loadError') + '</div>';
			} finally {
				loadingBar.classList.remove('active');
			}
		}

		searchInput.addEventListener('input', function() {
			searchQuery = this.value || '';
			visibleCount = 36;
			applyFilters();
		});

		// Genre filter buttons
		document.querySelectorAll('.filter-btn.preset-btn').forEach(function(btn) {
			btn.addEventListener('click', function() {
				document.querySelectorAll('.filter-btn.preset-btn').forEach(function(b) { b.classList.remove('active'); });
				btn.classList.add('active');
				genreFilter = btn.getAttribute('data-genre');
				visibleCount = 36;
				applyFilters();
			});
		});

		loadMoreBtn.addEventListener('click', function() {
			visibleCount += 36;
			renderNews();
		});

		loadNewsData();
	})();
	</script>
</body>
</html>
