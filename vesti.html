            gap: 0.4rem;

            flex-wrap: wrap;
        }

        .news-source-filter {

            cursor: pointer;

        .news-source-filter:hover {
            border-color: var(--accent-blue);
            background: var(--bg-secondary);
        }

        .news-source-filter.active {
            border-color: var(--accent-blue);

            color: #fff;
        }

        .news-source-filter img {
            width: 14px;

            border-radius: 2px;
        }

        .news-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.25rem;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;

        .news-hero:hover {

        /* ==================== DARK MODE ==================== */

        body.dark-mode .news-card {

        }

        body.dark-mode .news-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        body.dark-mode .news-card-image {
            background: linear-gradient(135deg, #1a1e26 0%, #22262e 100%);

        /* ==================== MOBILE ==================== */
        @media (max-width: 600px) {
            .news-container {
                padding: 0.75rem 0.6rem 1.5rem;

                margin-bottom: 1rem;

            .news-source-filters {
                justify-content: flex-start;

            .news-hero {

                aspect-ratio: 16 / 9;

            .news-hero-body {
                padding: 1rem;

            .news-hero-title {

            .news-hero-desc {

                -webkit-line-clamp: 2;
            }

            /* Single column grid on mobile */

                grid-template-columns: 1fr;
                gap: 0.75rem;

            /* Horizontal card layout on mobile */
            .news-card {

    <script>
        // ==================== DARK MODE ====================
        function initDarkMode() {
            const toggle = document.getElementById('dark-mode-toggle');
            if (!toggle) return;
            const savedMode = localStorage.getItem('mmm-dark-mode');
            if (savedMode === 'true') {
                document.body.classList.add('dark-mode');
                toggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
            toggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('mmm-dark-mode', isDark);
                toggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });
        }
        initDarkMode();

        // ==================== NAV MENU ====================
        function initNavMenu() {
            const trigger = document.querySelector('.site-nav-trigger');
            const menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            
            trigger.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                menu.classList.toggle('open');
            });
            
            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });
        }
        initNavMenu();

        // ==================== RSS FEED LOADING ====================
        const RSS_PROXY = 'https://muzichka-master-lista.deeeeelay.workers.dev/rss-proxy';
        
        async function fetchFeed(feedUrl) {
            // Try direct fetch first, fallback to proxy for CORS-blocked feeds
            try {
                const resp = await fetch(feedUrl);
                return await resp.text();
            } catch {
                const proxyUrl = `${RSS_PROXY}?url=${encodeURIComponent(feedUrl)}`;
                const resp = await fetch(proxyUrl);
                return await resp.text();
            }
        }
        
        async function loadNewsFeeds() {
            try {
                const feedsResp = await fetch('rss-feeds.json');
                const feeds = await feedsResp.json();
                
                const allArticles = [];
                const filtersContainer = document.getElementById('news-source-filters');
                
                // Build source filter buttons
                feeds.forEach(feed => {
                    const btn = document.createElement('button');
                    btn.className = 'news-source-filter active';
                    btn.dataset.source = feed.name;
                    btn.innerHTML = `<img src="${feed.iconUrl}" alt="${feed.name}"> ${feed.name}`;
                    btn.addEventListener('click', () => {
                        btn.classList.toggle('active');
                        renderNews(allArticles);
                    });
                    filtersContainer.appendChild(btn);
                });
                
                // Fetch all feeds in parallel
                const feedPromises = feeds.map(async (feed) => {
                    try {
                        const text = await fetchFeed(feed.feedUrl);
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(text, 'text/xml');
                        const items = xml.querySelectorAll('item');
                        
                        items.forEach(item => {
                            const title = item.querySelector('title')?.textContent || '';
                            const link = item.querySelector('link')?.textContent || '';
                            const description = item.querySelector('description')?.textContent || '';
                            const content = item.querySelector('content\\:encoded, encoded')?.textContent || '';
                            const pubDateStr = item.querySelector('pubDate')?.textContent || '';
                            const pubDate = pubDateStr ? new Date(pubDateStr) : new Date(0);
                            
                            // Extract image from various RSS sources
                            let image = '';
                            // 1. Check enclosure
                            const enclosure = item.querySelector('enclosure[type^="image"]');
                            if (enclosure) {
                                image = enclosure.getAttribute('url') || '';
                            }
                            // 2. Check media:content / media:thumbnail
                            if (!image) {
                                const media = item.querySelector('media\\:content, content[medium="image"], media\\:thumbnail, thumbnail');
                                if (media) image = media.getAttribute('url') || '';
                            }
                            // 3. Extract first image from content or description HTML
                            if (!image) {
                                const htmlContent = content || description;
                                const imgMatch = htmlContent.match(/<img[^>]+src=["']([^"']+)["']/i);
                                if (imgMatch) image = imgMatch[1];
                            }
                            
                            // Strip HTML tags from description for display
                            const cleanDesc = description.replace(/<[^>]*>/g, '').trim();
                            
                            allArticles.push({
                                title,
                                link,
                                description: cleanDesc,
                                content: content.replace(/<[^>]*>/g, '').trim(),
                                pubDate,
                                pubDateStr,
                                image,
                                source: feed.name,
                                sourceIcon: feed.iconUrl,
                                siteUrl: feed.siteUrl
                            });
                        });
                    } catch (err) {
                        console.warn(`Failed to fetch feed ${feed.name}:`, err);
                    }
                });
                
                await Promise.all(feedPromises);
                
                // Sort by date descending
                allArticles.sort((a, b) => b.pubDate - a.pubDate);
                
                document.getElementById('news-loading').style.display = 'none';
                
                if (allArticles.length === 0) {
                    document.getElementById('news-empty').style.display = 'block';
                } else {
                    renderNews(allArticles);
                }
            } catch (err) {
                console.error('Failed to load news feeds:', err);
                document.getElementById('news-loading').innerHTML = '<div><i class="fas fa-exclamation-triangle"></i></div><div>Грешка при вчитување на вестите.</div>';
            }
        }
        
        function relativeTime(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Сега';
            if (diffMins < 60) return `пред ${diffMins} мин`;
            if (diffHours < 24) return `пред ${diffHours} ч`;
            if (diffDays < 7) return `пред ${diffDays} ${diffDays === 1 ? 'ден' : 'дена'}`;
            return date.toLocaleDateString('mk-MK', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        
        function renderNews(articles) {
            const heroContainer = document.getElementById('news-hero');
            const gridContainer = document.getElementById('news-grid');
            const sectionLabel = document.getElementById('news-section-label');
            const activeFilters = Array.from(document.querySelectorAll('.news-source-filter.active'))
                .map(btn => btn.dataset.source);
            
            const filtered = articles.filter(a => activeFilters.includes(a.source));
            
            if (filtered.length === 0) {
                heroContainer.style.display = 'none';
                gridContainer.style.display = 'none';
                sectionLabel.style.display = 'none';
                document.getElementById('news-empty').style.display = 'block';
                return;
            }
            
            document.getElementById('news-empty').style.display = 'none';
            heroContainer.style.display = '';
            gridContainer.style.display = '';
            sectionLabel.style.display = filtered.length > 1 ? '' : 'none';
            
            // Hero article (first/latest)
            const hero = filtered[0];
            const heroDate = hero.pubDate.getTime() > 0 ? relativeTime(hero.pubDate) : '';
            const heroImageHtml = hero.image
                ? `<img src="${hero.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'hero-placeholder\\'><i class=\\'fas fa-newspaper\\'></i></div>'">`
                : `<div class="hero-placeholder"><i class="fas fa-newspaper"></i></div>`;
            
            heroContainer.innerHTML = `<a href="${hero.link}" target="_blank" class="news-hero">
                <div class="news-hero-image">${heroImageHtml}</div>
                <div class="news-hero-body">
                    <div class="news-hero-badge">
                        <img src="${hero.sourceIcon}" alt="${hero.source}">
                        ${hero.source}
                    </div>
                    <div class="news-hero-title">${hero.title}</div>
                    ${hero.description ? `<div class="news-hero-desc">${hero.description}</div>` : ''}
                    <div class="news-hero-meta">
                        ${heroDate ? `<span><i class="far fa-clock"></i> ${heroDate}</span>` : ''}
                    </div>
                </div>
            </a>`;
            
            // Grid cards (rest of articles)
            const rest = filtered.slice(1);
            gridContainer.innerHTML = rest.map(article => {
                const dateStr = article.pubDate.getTime() > 0 ? relativeTime(article.pubDate) : '';
                const imageHtml = article.image
                    ? `<img src="${article.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-placeholder\\'><i class=\\'fas fa-music\\'></i></div>'">`
                    : `<div class="card-placeholder"><i class="fas fa-music"></i></div>`;
                
                return `<a href="${article.link}" target="_blank" class="news-card">
                    <div class="news-card-image">${imageHtml}</div>
                    <div class="news-card-body">
                        <div class="news-card-source">
                            <span class="news-card-source-name">
                                <img src="${article.sourceIcon}" alt="${article.source}">
                                ${article.source}
                            </span>
                            ${dateStr ? `<span class="news-card-date">${dateStr}</span>` : ''}
                        </div>
                        <div class="news-card-title">${article.title}</div>
                        ${article.description ? `<div class="news-card-desc">${article.description}</div>` : ''}
                        <div class="news-card-footer">
                            <span class="news-card-readmore">Прочитај повеќе <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </div>
                </a>`;
            }).join('');
        }
        
        // Start loading
        loadNewsFeeds();
    </script>
</body>
</html>
