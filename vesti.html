<body class="compact vesti-page">
	<header id="site-header" data-active="/vesti" data-title="Вести">
		<span class="header-info">
			<span><strong id="stat-articles">0</strong> вести</span>
			<span class="separator">•</span>
			<span><strong id="stat-sources">0</strong> извори</span>
			<span class="separator">•</span>
			<span id="stat-updated">ажурирање —</span>
		</span>
		<button id="search-toggle-btn" class="header-btn search-toggle" title="Пребарај"><i class="fas fa-search"></i><span id="filter-count" class="filter-count"></span></button>
	</header>
	<script src="/load-header.js"></script>

	<main>
		<div class="controls" id="controls-bar">
			<div class="genre-filter-group">
				<button class="genre-filter-btn active" data-genre="all">Сите</button>
				<button class="genre-filter-btn" data-genre="pop">Поп</button>
				<button class="genre-filter-btn" data-genre="alt">Алтернативна</button>
				<button class="genre-filter-btn" data-genre="rap">Рап</button>
				<button class="genre-filter-btn" data-genre="electronic">Електронска</button>
			</div>
			<div class="news-search-wrap">
				<i class="fas fa-search"></i>
				<input type="text" id="news-search" placeholder="Пребарај наслов, опис, артист...">
			</div>
			<select id="source-filter" class="news-filter-select">
				<option value="all">Сите извори</option>
			</select>
			<select id="sort-filter" class="news-filter-select">
				<option value="date_desc">Најнови</option>
				<option value="date_asc">Најстари</option>
				<option value="source_asc">Извор A-Ш</option>
				<option value="title_asc">Наслов A-Ш</option>
			</select>
			<button id="clear-filters" class="clear-filters-btn" title="Исчисти филтри"><i class="fas fa-times"></i> Исчисти</button>
		</div>

		<div id="loading-bar" class="loading-bar"><div class="loading-progress"></div></div>

		<div class="news-wrap">
			<div id="news-container" class="news-container"></div>
			<div class="load-more-wrap" id="load-more-wrap" style="display:none">
				<button id="load-more-btn" class="load-more-btn">Вчитај повеќе</button>
			</div>
		</div>
	</main>

	<script>
	(function() {
		'use strict';

		var allArticles = [];
		var filteredArticles = [];
		var bandsData = [];
		var visibleCount = 36;

		var searchQuery = '';
		var sourceFilter = 'all';
		var sortFilter = 'date_desc';
		var genreFilter = 'all';
		var lastUpdated = '';

		var sourceSelect = document.getElementById('source-filter');
		var sortSelect = document.getElementById('sort-filter');
		var searchInput = document.getElementById('news-search');
		var loadMoreWrap = document.getElementById('load-more-wrap');
		var loadMoreBtn = document.getElementById('load-more-btn');
		var newsContainer = document.getElementById('news-container');
		var loadingBar = document.getElementById('loading-bar');

		initSettingsMenu();
		initNavMenu();

		(function setupSearchToggle() {
			var btn = document.getElementById('search-toggle-btn');
			var controls = document.getElementById('controls-bar');

			if (!btn || !controls) return;

			btn.addEventListener('click', function() {
				controls.classList.toggle('visible');
				btn.classList.toggle('active');
				if (controls.classList.contains('visible')) {
					setTimeout(function() { searchInput.focus(); }, 50);
				}
			});

			if (window.innerWidth > 600) {
				controls.classList.add('visible');
			}
		})();

		function esc(str) {
			return escHtml(String(str || ''));
		}

		function escAttr(str) {
			return esc(str).replace(/'/g, '&#39;');
		}

		function normalizeArticle(a) {
			var artistList = Array.isArray(a.matchedArtists) ? a.matchedArtists.filter(Boolean) : [];
			return {
				title: a.title || '',
				link: a.link || '#',
				description: a.description || '',
				date: a.date || '',
				source: a.source || 'Непознат извор',
				iconUrl: a.iconUrl || '',
				thumbnail: a.thumbnail || '',
				matchedArtists: artistList
			};
		}

		function normalizeDateOnly(raw) {
			if (!raw) return '';
			return String(raw).slice(0, 10);
		}

		function parseDate(article) {
			var dateOnly = normalizeDateOnly(article.date);
			if (!dateOnly) return 0;
			return new Date(dateOnly + 'T00:00:00').getTime() || 0;
		}

		function formatDateLabel(dateStr) {
			var dateOnly = normalizeDateOnly(dateStr);
			if (!dateOnly) return '';
			return formatDate(dateOnly);
		}

		function artistLink(name) {
			return getArtistPageUrl(name);
		}

		function updateHeaderStats() {
			var sourceSet = new Set();
			for (var i = 0; i < allArticles.length; i++) {
				if (allArticles[i].source) sourceSet.add(allArticles[i].source);
			}
			document.getElementById('stat-articles').textContent = allArticles.length;
			document.getElementById('stat-sources').textContent = sourceSet.size;
			document.getElementById('stat-updated').textContent = lastUpdated ? ('ажурирање ' + formatDateLabel(lastUpdated)) : 'ажурирање —';
		}

		function buildSourceOptions() {
			var counts = {};
			allArticles.forEach(function(a) {
				counts[a.source] = (counts[a.source] || 0) + 1;
			});
			var sources = Object.keys(counts).sort(function(a, b) { return a.localeCompare(b, 'mk'); });

			sourceSelect.innerHTML = '<option value="all">Сите извори</option>';
			sources.forEach(function(source) {
				var o = document.createElement('option');
				o.value = source;
				o.textContent = source + ' (' + counts[source] + ')';
				sourceSelect.appendChild(o);
			});
		}

		function applyFilters() {
			var q = searchQuery.toLowerCase().trim();
			filteredArticles = allArticles.filter(function(a) {
				if (sourceFilter !== 'all' && a.source !== sourceFilter) return false;

				// Genre filter: article passes if ANY matched artist matches genre
				if (genreFilter !== 'all' && a.matchedArtists && a.matchedArtists.length) {
					var anyMatch = a.matchedArtists.some(function(name) {
						return artistMatchesGenre(name, genreFilter, bandsData);
					});
					if (!anyMatch) return false;
				} else if (genreFilter !== 'all' && (!a.matchedArtists || !a.matchedArtists.length)) {
					return false; // no artists = can't match genre
				}

				if (!q) return true;

				var artists = (a.matchedArtists || []).join(' ').toLowerCase();
				var hay = (a.title + ' ' + a.description + ' ' + a.source + ' ' + artists).toLowerCase();
				return hay.indexOf(q) !== -1;
			});

			filteredArticles.sort(function(a, b) {
				if (sortFilter === 'date_asc') return parseDate(a) - parseDate(b);
				if (sortFilter === 'source_asc') return a.source.localeCompare(b.source, 'mk');
				if (sortFilter === 'title_asc') return a.title.localeCompare(b.title, 'mk');
				return parseDate(b) - parseDate(a);
			});

			renderNews();
		}

		function renderNews() {
			// Update filter count badge in header
			var activeFilters = 0;
			if (genreFilter !== 'all') activeFilters++;
			if (sourceFilter !== 'all') activeFilters++;
			if (searchQuery.trim()) activeFilters++;
			var badge = document.getElementById('filter-count');
			if (badge) {
				badge.textContent = activeFilters;
				badge.classList.toggle('visible', activeFilters > 0);
			}

			if (!filteredArticles.length) {
				newsContainer.innerHTML = '<div class="news-empty"><i class="fas fa-newspaper" style="font-size:1.3rem;display:block;margin-bottom:0.5rem"></i>Нема вести за тековните филтри.</div>';
				loadMoreWrap.style.display = 'none';
				return;
			}

			var shown = filteredArticles.slice(0, visibleCount);
			var html = '';

			shown.forEach(function(article) {
				var thumb = article.thumbnail ? '<img src="' + escAttr(article.thumbnail) + '" alt="" class="news-thumb" loading="lazy" decoding="async">' : '';
				var sourceIcon = article.iconUrl ? '<img src="' + escAttr(article.iconUrl) + '" alt="" class="news-source-icon" loading="lazy" decoding="async">' : '';
				var artistChips = '';

				if (article.matchedArtists && article.matchedArtists.length) {
					artistChips = '<div class="news-artists">' + article.matchedArtists.slice(0, 6).map(function(name) {
						return '<a href="' + escAttr(artistLink(name)) + '" class="artist-chip" title="' + escAttr(name) + '"><i class="fas fa-music"></i> ' + esc(name) + '</a>';
					}).join('') + '</div>';
				}

				html +=
					'<article class="news-card">' +
						'<div class="news-card-head">' +
							thumb +
							'<div class="news-main">' +
								'<h2 class="news-title"><a href="' + escAttr(article.link) + '" target="_blank" rel="noopener">' + esc(article.title) + '</a></h2>' +
								'<div class="news-meta">' +
									'<span>' + sourceIcon + ' ' + esc(article.source) + '</span>' +
									'<span class="dot">•</span>' +
									'<span>' + esc(formatDateLabel(article.date)) + '</span>' +
								'</div>' +
							'</div>' +
						'</div>' +
						(article.description ? '<p class="news-desc">' + esc(article.description) + '</p>' : '') +
						artistChips +
						'<div class="news-footer">' +
							'<span class="news-meta" style="margin:0">' + esc(article.matchedArtists.length ? article.matchedArtists.length + ' артист' + (article.matchedArtists.length > 1 ? 'и' : '') : '') + '</span>' +
							'<a class="news-link" href="' + escAttr(article.link) + '" target="_blank" rel="noopener">Отвори <i class="fas fa-arrow-up-right-from-square"></i></a>' +
						'</div>' +
					'</article>';
			});

			newsContainer.innerHTML = html;
			loadMoreWrap.style.display = filteredArticles.length > shown.length ? 'flex' : 'none';
		}

		async function loadNewsData() {
			loadingBar.classList.add('active');
			try {
				// Load bands data for genre filtering
				try {
					var bandsResp = await fetch('bands.json');
					if (bandsResp.ok) {
						var bandsJson = await bandsResp.json();
						bandsData = bandsJson.muzickaMasterLista || bandsJson || [];
					}
				} catch (e) { console.warn('Could not load bands.json for genre filter:', e); }

				var fromMaster = null;
				var master = await loadSiteMaster();
				if (master && master.news) {
					fromMaster = master.news;
				}

				if (fromMaster && Array.isArray(fromMaster.matched)) {
					allArticles = fromMaster.matched.map(normalizeArticle);
					lastUpdated = fromMaster.lastUpdated || '';
				} else {
					var resp = await fetch('articles.json');
					if (!resp.ok) throw new Error('Не можеме да го вчитаме articles.json');
					var raw = await resp.json();
					allArticles = (raw.articles || []).map(normalizeArticle);
					lastUpdated = raw.lastUpdated || '';
				}

				allArticles.sort(function(a, b) { return parseDate(b) - parseDate(a); });
				updateHeaderStats();
				buildSourceOptions();
				applyFilters();
			} catch (err) {
				console.error('News load error:', err);
				newsContainer.innerHTML = '<div class="news-empty"><i class="fas fa-triangle-exclamation" style="font-size:1.1rem;display:block;margin-bottom:0.4rem"></i>Не можеме да ги вчитаме вестите.</div>';
			} finally {
				loadingBar.classList.remove('active');
			}
		}

		searchInput.addEventListener('input', function() {
			searchQuery = this.value || '';
			visibleCount = 36;
			applyFilters();
		});

		sourceSelect.addEventListener('change', function() {
			sourceFilter = this.value;
			visibleCount = 36;
			applyFilters();
		});

		sortSelect.addEventListener('change', function() {
			sortFilter = this.value;
			visibleCount = 36;
			applyFilters();
		});

		document.getElementById('clear-filters').addEventListener('click', function() {
			searchQuery = '';
			sourceFilter = 'all';
			sortFilter = 'date_desc';
			genreFilter = 'all';
			visibleCount = 36;

			searchInput.value = '';
			sourceSelect.value = 'all';
			sortSelect.value = 'date_desc';

			document.querySelectorAll('.genre-filter-btn').forEach(function(b) { b.classList.remove('active'); });
			document.querySelector('.genre-filter-btn[data-genre="all"]').classList.add('active');

			applyFilters();
		});

		// Genre filter buttons
		document.querySelectorAll('.genre-filter-btn').forEach(function(btn) {
			btn.addEventListener('click', function() {
				document.querySelectorAll('.genre-filter-btn').forEach(function(b) { b.classList.remove('active'); });
				btn.classList.add('active');
				genreFilter = btn.getAttribute('data-genre');
				visibleCount = 36;
				applyFilters();
			});
		});

		loadMoreBtn.addEventListener('click', function() {
			visibleCount += 36;
			renderNews();
		});

		loadNewsData();
	})();
	</script>
</body>
</html>
