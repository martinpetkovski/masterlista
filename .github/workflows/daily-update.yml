name: Daily update

on:
  schedule:
    # GitHub cron uses UTC; 17:00 UTC is 18:00 CET, 18:00 UTC is 19:00 CET.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Which update phase to run"
        required: true
        default: publish-verification
        type: choice
        options:
          - publish-verification
          - finalize-after-verification
          - full

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore update cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: update-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            update-cache-${{ runner.os }}-

      - name: Write automation credentials
        shell: powershell
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          $required = @('SPOTIFY_CLIENT_ID', 'SPOTIFY_CLIENT_SECRET', 'YOUTUBE_API_KEY')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secret(s): $($missing -join ', ')"
          }

          New-Item -ItemType Directory -Path config/credentials -Force | Out-Null

          $spotify = [ordered]@{
            clientId = $env:SPOTIFY_CLIENT_ID
            clientSecret = $env:SPOTIFY_CLIENT_SECRET
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SPOTIFY_REFRESH_TOKEN)) {
            $spotify.refreshToken = $env:SPOTIFY_REFRESH_TOKEN
          }
          if (-not [string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            $spotify.discordWebhookUrl = $env:DISCORD_WEBHOOK_URL
          }
          $spotify | ConvertTo-Json -Depth 5 | Set-Content config/credentials/spotify-credentials.json -Encoding UTF8

          [ordered]@{
            apiKey = $env:YOUTUBE_API_KEY
          } | ConvertTo-Json -Depth 5 | Set-Content config/credentials/youtube-credentials.json -Encoding UTF8

      - name: Determine update phase
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $phase = "${{ inputs.phase }}"
          }
          elseif ("${{ github.event.schedule }}" -eq "0 17 * * *") {
            $phase = "publish-verification"
          }
          else {
            $phase = "finalize-after-verification"
          }

          Write-Host "Running update phase: $phase"
          "UPDATE_PHASE=$phase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run update-all
        shell: powershell
        run: |
          if ($env:UPDATE_PHASE -eq "publish-verification") {
            .\update-publish-verification.ps1 -VerificationTimeoutMinutes 60
          }
          elseif ($env:UPDATE_PHASE -eq "finalize-after-verification") {
            .\update-finalize-after-verification.ps1 -VerificationTimeoutMinutes 60
          }
          else {
            .\update-all.ps1 -AutomationPhase full -VerificationTimeoutMinutes 60
          }

      - name: Commit update changes
        shell: powershell
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host "No update changes to commit."
            exit 0
          }

          git add -A
          git commit -m "Daily data update ($env:UPDATE_PHASE)"
          git push
