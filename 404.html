<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пренасочување... | Топ Листа МК</title>
    <script>
        (function() {
            const path = window.location.pathname;
            const search = window.location.search;

            // Clean URL → .html page mapping
            const pageRoutes = {
                '/list': '/list.html',
                '/nastani': '/nastani.html',
                '/vesti': '/vesti.html',
                '/curators': '/curators.html',
                '/surprise': '/surprise.html',
                '/help': '/help.html',
                '/event': '/event.html',
                '/privacy': '/privacy.html',
                '/terms': '/terms.html',
                '/admin': '/admin.html',
                '/artist': '/artist.html'
            };

            // Handle clean URL page routes (e.g. /list → /list.html, /event?id=x → /event.html?id=x)
            if (pageRoutes[path]) {
                window.location.replace(pageRoutes[path] + search);
                return;
            }

            // Known static files to exclude from artist routing
            const staticFiles = [
                '/', '/index.html', '/list.html', '/admin.html',
                '/artist.html', '/curator.html', '/404.html',
                '/nastani.html', '/vesti.html', '/curators.html',
                '/surprise.html', '/help.html', '/event.html',
                '/privacy.html', '/terms.html',
                '/robots.txt', '/sitemap.xml', '/CNAME',
                '/desktop.css', '/mobile.css', '/script.js',
                '/spotify-api.js', '/bands.json', '/chart-data.json',
                '/curators-tracklists.json',
                '/favicon.svg', '/og-image.svg'
            ];

            // Check if path starts with known directories
            const staticDirs = ['/chart-history/', '/scripts/', '/workers/'];
            const isStaticDir = staticDirs.some(dir => path.startsWith(dir));

            // Handle /curators/[name] routes
            if (path.startsWith('/curators/')) {
                const curatorSlug = decodeURIComponent(path.substring('/curators/'.length).replace(/\/$/, ''));
                if (curatorSlug) {
                    sessionStorage.setItem('curatorSlug', curatorSlug);
                    sessionStorage.setItem('curatorCleanUrl', 'true');
                    window.location.replace('/curator.html?name=' + encodeURIComponent(curatorSlug));
                    return;
                }
                window.location.replace('/curators.html');
                return;
            }

            // If it's not a static file or directory, treat it as an artist page
            if (!staticFiles.includes(path) && !isStaticDir && path !== '/') {
                const artistSlug = decodeURIComponent(path.substring(1));
                sessionStorage.setItem('artistSlug', artistSlug);
                sessionStorage.setItem('cleanUrl', 'true');
                window.location.replace('/artist.html?a=' + encodeURIComponent(artistSlug));
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: #374151;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
        }
        a {
            color: #5b8fb9;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Страницата не е пронајдена</h1>
        <p>Страницата што ја барате не постои.</p>
        <p><a href="/">← Назад кон почетна</a></p>
    </div>
</body>
</html>
