<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <script>if(localStorage.getItem('mmm-dark-mode')==='true'){document.documentElement.classList.add('dark-mode');document.documentElement.style.backgroundColor='#111318'}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пренасочување... | Топ Листа МК</title>
    <script>
        (function() {
            const path = window.location.pathname;
            const search = window.location.search;

            // Clean URL → .html page mapping
            const pageRoutes = {
                '/lista': '/lista.html',
                '/nastani': '/nastani.html',
                '/vesti': '/vesti.html',
                '/kustosi': '/kustosi.html',
                '/iznenadi-me': '/iznenadi-me.html',
                '/pomosh': '/pomosh.html',
                '/privatnost': '/privatnost.html',
                '/uslovi': '/uslovi.html',
                '/admin': '/admin.html',
                '/artist': '/artist.html'
            };

            // Backward-compat redirects for old clean URLs
            const legacyRoutes = {
                '/list': '/lista',
                '/curators': '/kustosi',
                '/surprise': '/iznenadi-me',
                '/help': '/pomosh',
                '/event': '/nastan',
                '/privacy': '/privatnost',
                '/terms': '/uslovi'
            };

            // Handle legacy routes (redirect to new clean URL)
            if (legacyRoutes[path]) {
                window.location.replace(legacyRoutes[path] + search);
                return;
            }

            // Handle clean URL page routes
            if (pageRoutes[path]) {
                window.location.replace(pageRoutes[path] + search);
                return;
            }

            // Handle /kustos/[name] routes (individual curator page)
            if (path.startsWith('/kustos/')) {
                const curatorSlug = decodeURIComponent(path.substring('/kustos/'.length).replace(/\/$/, ''));
                if (curatorSlug) {
                    sessionStorage.setItem('curatorSlug', curatorSlug);
                    sessionStorage.setItem('curatorCleanUrl', 'true');
                    window.location.replace('/kustos.html?name=' + encodeURIComponent(curatorSlug));
                    return;
                }
                window.location.replace('/kustosi.html');
                return;
            }

            // Legacy /curators/[name] → redirect to /kustos/[name]
            if (path.startsWith('/curators/')) {
                const curatorSlug = path.substring('/curators/'.length);
                window.location.replace('/kustos/' + curatorSlug);
                return;
            }

            // Handle /nastan/[id] routes (individual event page)
            if (path.startsWith('/nastan/')) {
                const eventId = decodeURIComponent(path.substring('/nastan/'.length).replace(/\/$/, ''));
                if (eventId) {
                    sessionStorage.setItem('eventCleanPath', path);
                    window.location.replace('/nastan.html?id=' + encodeURIComponent(eventId));
                    return;
                }
                window.location.replace('/nastani.html');
                return;
            }

            // Known static files to exclude from artist routing
            const staticFiles = [
                '/', '/index.html', '/lista.html', '/admin.html',
                '/artist.html', '/kustos.html', '/404.html',
                '/nastani.html', '/vesti.html', '/kustosi.html',
                '/iznenadi-me.html', '/pomosh.html', '/nastan.html',
                '/privatnost.html', '/uslovi.html',
                '/robots.txt', '/sitemap.xml', '/CNAME',
                '/desktop.css', '/mobile.css', '/script.js',
                '/spotify-api.js', '/bands.json', '/chart-data.json',
                '/curators-tracklists.json',
                '/favicon.svg', '/og-image.svg'
            ];

            // Check if path starts with known directories
            const staticDirs = ['/chart-history/', '/scripts/', '/workers/'];
            const isStaticDir = staticDirs.some(dir => path.startsWith(dir));

            // If it's not a static file or directory, treat it as an artist page
            if (!staticFiles.includes(path) && !isStaticDir && path !== '/') {
                const artistSlug = decodeURIComponent(path.substring(1));
                sessionStorage.setItem('artistSlug', artistSlug);
                sessionStorage.setItem('cleanUrl', 'true');
                window.location.replace('/artist.html?a=' + encodeURIComponent(artistSlug));
            }
        })();
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            color: #374151;
        }
        html.dark-mode, html.dark-mode body {
            background: #111318 !important;
            color: #d5d8de;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
        }
        a {
            color: #5b8fb9;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Страницата не е пронајдена</h1>
        <p>Страницата што ја барате не постои.</p>
        <p><a href="/">← Назад кон почетна</a></p>
    </div>
</body>
</html>
