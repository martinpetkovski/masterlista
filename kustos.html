    <style>
        /* ==================== CURATOR PAGE ==================== */
        body.curator-page {
            background: #f2f3f5;
            min-height: 100vh;
            min-height: 100dvh;
            height: auto !important;
            overflow-y: auto !important;
            display: flex;
            flex-direction: column;
        }

        body.curator-page.dark-mode,
        html.dark-mode body.curator-page {
            background: #111318;
        }

        .curator-container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
            flex: 1;
            width: 100%;
        }

        /* ==================== HEADER CARD ==================== */
        .curator-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .curator-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 0.75rem;
            overflow: hidden;
            border: 3px solid rgba(102, 126, 234, 0.2);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #667eea33, #764ba233);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .curator-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .curator-avatar i {
            font-size: 2.5rem;
            color: #667eea;
        }

        body.dark-mode .curator-avatar {
            border-color: rgba(102, 126, 234, 0.15);
            background: linear-gradient(135deg, #667eea22, #764ba222);
        }

        body.dark-mode .curator-avatar i {
            color: #8b9cf7;
        }

        .curator-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--text-primary, #1a1a2e);
            margin: 0;
        }

        body.dark-mode .curator-name {
            color: #e8e8f0;
        }

        .curator-name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.35rem;
        }

        .curator-relevance {
            font-size: 0.88rem;
            color: #666;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        body.dark-mode .curator-relevance {
            color: #999;
        }

        .curator-relevance a {
            color: #5b8fb9;
            text-decoration: none;
            font-weight: 500;
        }

        .curator-relevance a:hover {
            text-decoration: underline;
        }

        body.dark-mode .curator-relevance a {
            color: #7db8e0;
        }

        .curator-relevance .sep {
            margin: 0 0.25em;
            opacity: 0.5;
        }

        /* Social links */
        .curator-socials {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .curator-socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f0f1f3;
            color: #555;
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .curator-socials a:hover {
            background: #5b8fb9;
            color: #fff;
            transform: scale(1.1);
        }

        body.dark-mode .curator-socials a {
            background: #2a2d36;
            color: #aaa;
        }

        body.dark-mode .curator-socials a:hover {
            background: #5b8fb9;
            color: #fff;
        }

        /* ==================== PLAYLIST SECTION ==================== */
        .curator-section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted, #888);
            margin: 1.5rem 0 0.75rem;
            padding-left: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .curator-section-title i {
            font-size: 0.8rem;
        }

        /* Playlist tabs */
        .curator-playlist-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .curator-playlist-tab {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.08);
            background: #f3f4f6;
            color: #555;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            user-select: none;
        }

        .curator-playlist-tab:hover { background: #e8eaed; }
        .curator-playlist-tab.active { background: #5b8fb9; color: #fff; border-color: #5b8fb9; }
        .curator-playlist-tab i { font-size: 0.9rem; }
        .curator-playlist-tab.spotify i { color: #1DB954; }
        .curator-playlist-tab.youtube i { color: #FF0000; }
        .curator-playlist-tab.apple i { color: #FA243C; }
        .curator-playlist-tab.tidal i { color: #000; }
        .curator-playlist-tab.deezer i { color: #A238FF; }
        .curator-playlist-tab.soundcloud i { color: #FF5500; }
        .curator-playlist-tab.active i { color: #fff; }

        body.dark-mode .curator-playlist-tab { background: #2a2d36; border-color: rgba(255,255,255,0.06); color: #aaa; }
        body.dark-mode .curator-playlist-tab:hover { background: #333640; }
        body.dark-mode .curator-playlist-tab.active { background: #5b8fb9; color: #fff; border-color: #5b8fb9; }
        body.dark-mode .curator-playlist-tab.tidal i { color: #fff; }
        body.dark-mode .curator-playlist-tab.active i { color: #fff; }

        .curator-playlist-panel { display: none; }
        .curator-playlist-panel.active { display: block; }

        /* ==================== TRACKLIST (reuse styles from kustosi.html but wider) ==================== */
        .tracklist-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.15s;
        }

        .tracklist-header:hover {
            opacity: 0.8;
        }

        .tracklist-cover {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .tracklist-info { flex: 1; min-width: 0; }

        .tracklist-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary, #1a1a2e);
        }

        body.dark-mode .tracklist-title { color: #e8e8f0; }

        .tracklist-meta {
            font-size: 0.78rem;
            color: #888;
            margin-top: 0.15rem;
        }

        .tracklist-play-all {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            background: #1DB954;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
            text-decoration: none;
        }

        .tracklist-play-all:hover { background: #1ed760; transform: scale(1.05); }
        .tracklist-play-all i { font-size: 0.75rem; }

        .tracklist-service-deezer .tracklist-play-all { background: #A238FF; }
        .tracklist-service-deezer .tracklist-play-all:hover { background: #b355ff; }
        .tracklist-service-youtube .tracklist-play-all { background: #FF0000; }
        .tracklist-service-youtube .tracklist-play-all:hover { background: #ff3333; }
        .tracklist-service-apple .tracklist-play-all { background: #FA243C; }
        .tracklist-service-apple .tracklist-play-all:hover { background: #fc4a5f; }
        .tracklist-service-tidal .tracklist-play-all { background: #000; }
        .tracklist-service-tidal .tracklist-play-all:hover { background: #222; }
        body.dark-mode .tracklist-service-tidal .tracklist-play-all { background: #fff; color: #000; }

        .tracklist-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.06);
            background: #fff;
        }

        body.dark-mode .tracklist-list {
            border-color: rgba(255,255,255,0.06);
            background: #1e2028;
        }

        .tracklist-list::-webkit-scrollbar { width: 4px; }
        .tracklist-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
        body.dark-mode .tracklist-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

        .track-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.75rem;
            transition: background 0.15s;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        .track-item:last-child { border-bottom: none; }
        .track-item:hover { background: rgba(91,143,185,0.06); }
        body.dark-mode .track-item { border-bottom-color: rgba(255,255,255,0.04); }
        body.dark-mode .track-item:hover { background: rgba(91,143,185,0.08); }

        .track-num {
            font-size: 0.75rem;
            color: #aaa;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .track-art {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f0f1f3;
        }

        body.dark-mode .track-art { background: #2a2d36; }

        .track-details { flex: 1; min-width: 0; }

        .track-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary, #1a1a2e);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.dark-mode .track-name { color: #e8e8f0; }
        .track-name a { color: inherit; text-decoration: none; }
        .track-name a:hover { text-decoration: underline; }

        .track-artist {
            font-size: 0.75rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-duration {
            font-size: 0.75rem;
            color: #aaa;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .track-play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #999;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.15s;
            flex-shrink: 0;
        }

        .track-play-btn:hover { background: rgba(102, 126, 234, 0.15); color: #667eea; transform: scale(1.15); }

        body.dark-mode .track-play-btn:hover { background: rgba(102, 126, 234, 0.12); }

        /* ==================== VIEW TOGGLE (header) ==================== */
        .tracklist-view-toggle {
            display: none;
        }

        /* ==================== COMPACT VIEW (page-level) ==================== */
        body.curator-compact .tracklist-wrapper .track-num { display: none; }
        body.curator-compact .tracklist-wrapper .track-art { width: 30px; height: 30px; border-radius: 3px; }
        body.curator-compact .tracklist-wrapper .track-details { flex-direction: row; display: flex; align-items: baseline; gap: 0.3rem; }
        body.curator-compact .tracklist-wrapper .track-name { font-size: 0.82rem; font-weight: 600; }
        body.curator-compact .tracklist-wrapper .track-artist { font-size: 0.82rem; flex-shrink: 1; }
        body.curator-compact .tracklist-wrapper .track-artist::before { content: '\2014\00a0'; }
        body.curator-compact .tracklist-wrapper .track-item { padding: 0.35rem 0.75rem; gap: 0.5rem; }
        body.curator-compact .tracklist-wrapper .track-play-btn { width: 26px; height: 26px; font-size: 0.65rem; }
        body.curator-compact .tracklist-wrapper .track-duration { font-size: 0.72rem; }

        /* Playlist open link */
        .curator-playlist-link {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 0.9rem;
            background: linear-gradient(135deg, #667eea0a, #764ba20a);
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary, #1a1a2e);
            transition: background 0.2s, border-color 0.2s;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .curator-playlist-link:hover {
            background: linear-gradient(135deg, #667eea18, #764ba218);
            border-color: rgba(102, 126, 234, 0.25);
        }

        body.dark-mode .curator-playlist-link {
            background: linear-gradient(135deg, #667eea08, #764ba208);
            border-color: rgba(102, 126, 234, 0.08);
            color: #e8e8f0;
        }

        .curator-playlist-link .pl-icon { font-size: 1.2rem; flex-shrink: 0; }
        .curator-playlist-link .pl-icon.spotify { color: #1DB954; }
        .curator-playlist-link .pl-icon.youtube { color: #FF0000; }
        .curator-playlist-link .pl-icon.apple { color: #FA243C; }
        .curator-playlist-link .pl-icon.tidal { color: #000; }
        body.dark-mode .curator-playlist-link .pl-icon.tidal { color: #fff; }
        .curator-playlist-link .pl-icon.deezer { color: #A238FF; }
        .curator-playlist-link .pl-icon.soundcloud { color: #FF5500; }
        .curator-playlist-link .pl-icon.default { color: #5b8fb9; }

        .curator-playlist-link .pl-text {
            flex: 1; min-width: 0; font-weight: 600; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .curator-playlist-link .pl-arrow { color: #aaa; font-size: 0.75rem; flex-shrink: 0; }
        body.dark-mode .curator-playlist-link .pl-arrow { color: #666; }

        /* ==================== SERVICE CHOOSER ==================== */
        .service-chooser-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .service-chooser-dialog {
            background: #fff; border-radius: 0; width: 340px;
            max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
        }
        body.dark-mode .service-chooser-dialog { background: #1e2030; }
        .service-chooser-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.85rem 1rem; background: #333;
        }
        .service-chooser-img {
            width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0;
        }
        .service-chooser-header-text { min-width: 0; flex: 1; }
        .service-chooser-artist {
            font-size: 0.72rem; opacity: 0.85; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .service-chooser-song {
            font-size: 0.88rem; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .service-chooser-links {
            display: flex; flex-direction: column; gap: 0.4rem; padding: 0.75rem 1rem 1rem;
        }
        .service-chooser-links a {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem;
            border-radius: 10px; text-decoration: none; font-size: 0.88rem; font-weight: 500;
            color: var(--text-primary, #1a1a2e); background: rgba(0,0,0,0.03);
            transition: background 0.15s, transform 0.1s;
        }
        body.dark-mode .service-chooser-links a { color: #e8e8f0; background: rgba(255,255,255,0.05); }
        .service-chooser-links a:hover { background: rgba(0,0,0,0.07); transform: translateX(2px); }
        body.dark-mode .service-chooser-links a:hover { background: rgba(255,255,255,0.1); }
        .service-chooser-links a i { width: 24px; text-align: center; font-size: 1.1rem; }
        .service-chooser-links a .pref-badge {
            margin-left: auto; font-size: 0.65rem; background: #667eea22; color: #667eea;
            padding: 2px 6px; border-radius: 4px;
        }
        .service-chooser-links .service-loading {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem;
            border-radius: 10px; font-size: 0.88rem; font-weight: 500;
            color: #888; background: rgba(0,0,0,0.02);
            opacity: 0.7;
        }
        body.dark-mode .service-chooser-links .service-loading { 
            color: #999; background: rgba(255,255,255,0.03); 
        }
        .service-chooser-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 1rem 0.75rem;
        }
        .service-chooser-footer button {
            background: none; border: none; font-size: 0.82rem; color: #888; cursor: pointer;
        }
        .service-chooser-footer button:hover { color: #667eea; }

        .service-toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 0.6rem 1.2rem; border-radius: 10px;
            font-size: 0.82rem; z-index: 10001; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s ease;
        }

        /* ==================== ERROR / LOADING ==================== */
        .curator-loading, .curator-error {
            text-align: center;
            padding: 3rem 1rem;
        }

        .curator-loading i, .curator-error i {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
        }

        .curator-loading i {
            color: #5b8fb9;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .curator-error i { color: #888; }

        .curator-error h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
        }

        .curator-error p { color: #888; margin-bottom: 1rem; }

        .curator-error a {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1rem; background: #5b8fb9; color: #fff;
            text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem;
        }

        /* Footer branding */
        .curator-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        body.dark-mode .curator-footer { border-top-color: rgba(255,255,255,0.06); }

        .curator-footer a {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: #888; text-decoration: none; font-size: 0.75rem;
            transition: color 0.2s;
        }

        .curator-footer a:hover { color: #5b8fb9; }

        .curator-footer .mmm-logo-svg {
            vertical-align: middle;
            border-radius: 50%;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 600px) {

            .curator-avatar { width: 80px; height: 80px; }
            .curator-name { font-size: 1.35rem; }
            .track-art { width: 34px; height: 34px; }

    <script>if(location.hostname==='localhost'||location.hostname==='127.0.0.1')document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||!h.startsWith('/'))return;if(h==='/'){e.preventDefault();location.href='/index.html';return;}var m;if(m=h.match(/^\/nastan\/(.+)/)){e.preventDefault();location.href='/nastan.html?id='+m[1];return;}if(m=h.match(/^\/kustos\/(.+)/)){e.preventDefault();location.href='/kustos.html?name='+m[1];return;}if(h.indexOf('.')===-1){e.preventDefault();var q=h.indexOf('?');location.href=(q>0?h.substring(0,q):h)+'.html'+(q>0?h.substring(q):'');}});</script>
</head>
<body class="compact curator-page curator-compact">
    <script>if(document.documentElement.classList.contains('dark-mode'))document.body.classList.add('dark-mode')</script>
    <header id="site-header" data-active="/kustosi" data-title="Кустос" data-title-id="header-title">
        <a href="/kustosi" class="header-btn" style="text-decoration:none;font-size:0.8rem;font-weight:600;" title="Сите кустоси">
            <i class="fas fa-arrow-left"></i>
        </a>
        <button id="curator-compact-toggle" class="header-btn" title="Компактен/Проширен приказ">
            <i class="fas fa-compress-alt"></i>
        </button>
    </header>
    <script src="/load-header.js"></script>
    <main>
        <div class="curator-container" id="curator-content">
            <div class="curator-loading" id="curator-loading">
                <i class="fas fa-spinner"></i>
                <div>Се вчитува...</div>
            </div>
        </div>
    </main>



    <script>
        // Settings menu + nav menu from common.js
        initSettingsMenu();
        initNavMenu();

        // ==================== COMPACT TOGGLE ====================
        function initCompactToggle() {
            const btn = document.getElementById('curator-compact-toggle');
            if (!btn) return;
            const saved = JSON.parse(localStorage.getItem('mmm-curators-compact') || 'true');
            document.body.classList.toggle('curator-compact', saved);
            btn.innerHTML = saved ? '<i class="fas fa-expand-alt"></i>' : '<i class="fas fa-compress-alt"></i>';
            btn.title = saved ? 'Проширен приказ' : 'Компактен приказ';
            btn.addEventListener('click', () => {
                const isCompact = document.body.classList.toggle('curator-compact');
                btn.innerHTML = isCompact ? '<i class="fas fa-expand-alt"></i>' : '<i class="fas fa-compress-alt"></i>';
                btn.title = isCompact ? 'Проширен приказ' : 'Компактен приказ';
                localStorage.setItem('mmm-curators-compact', JSON.stringify(isCompact));
            });
        }
        initCompactToggle();

        // ==================== HELPERS ====================
        function detectLinkInfo(url) {
            const u = url.toLowerCase();
            if (u.includes('instagram.com'))   return { icon: 'fab fa-instagram',    label: 'Instagram',     service: 'instagram' };
            if (u.includes('twitter.com') || u.includes('x.com'))
                                               return { icon: 'fab fa-x-twitter',    label: 'X / Twitter',   service: 'twitter' };
            if (u.includes('facebook.com'))     return { icon: 'fab fa-facebook-f',   label: 'Facebook',      service: 'facebook' };
            if (u.includes('tiktok.com'))       return { icon: 'fab fa-tiktok',       label: 'TikTok',        service: 'tiktok' };
            if (u.includes('music.youtube.com'))return { icon: 'fab fa-youtube',      label: 'YouTube Music', service: 'youtube' };
            if (u.includes('youtube.com') || u.includes('youtu.be'))
                                               return { icon: 'fab fa-youtube',       label: 'YouTube',       service: 'youtube' };
            if (u.includes('open.spotify.com')) return { icon: 'fab fa-spotify',      label: 'Spotify',       service: 'spotify' };
            if (u.includes('bandcamp.com'))     return { icon: 'fab fa-bandcamp',     label: 'Bandcamp',      service: 'bandcamp' };
            if (u.includes('soundcloud.com'))   return { icon: 'fab fa-soundcloud',   label: 'SoundCloud',    service: 'soundcloud' };
            if (u.includes('music.apple.com'))  return { icon: 'fab fa-apple',        label: 'Apple Music',   service: 'apple' };
            if (u.includes('tidal.com'))        return { icon: 'fas fa-water',        label: 'Tidal',         service: 'tidal' };
            if (u.includes('deezer.com'))       return { icon: 'fab fa-deezer',       label: 'Deezer',        service: 'deezer' };
            if (u.includes('discord.gg') || u.includes('discord.com'))
                                               return { icon: 'fab fa-discord',       label: 'Discord',       service: 'discord' };
            if (u.includes('linkedin.com'))     return { icon: 'fab fa-linkedin-in',  label: 'LinkedIn',      service: 'linkedin' };
            if (u.includes('linktr.ee'))        return { icon: 'fas fa-link',         label: 'Linktree',      service: 'linktree' };
            return { icon: 'fas fa-globe', label: 'Линк', service: 'default' };
        }

        // escHtml from common.js
        function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        const WORKER_BASE = 'https://muzichka-master-lista.martinpetkovski.workers.dev';

        function getInstagramPic(links) {
            if (!links) return null;
            for (const url of links) {
                const m = url.match(/instagram\.com\/([a-zA-Z0-9_.]+)/);
                if (m && m[1]) return `${WORKER_BASE}/ig-pic/${m[1]}`;
            }
            return null;
        }

        // cyrillicToLatinMap + transliterateCyrillicToLatin from common.js
        const cyrillicToLatinShorthandMap = {
            'А': 'A', 'а': 'a', 'Б': 'B', 'б': 'b', 'В': 'V', 'в': 'v', 'Г': 'G', 'г': 'g',
            'Д': 'D', 'д': 'd', 'Ѓ': 'G', 'ѓ': 'g', 'Е': 'E', 'е': 'e', 'Ж': 'Z', 'ж': 'z',
            'З': 'Z', 'з': 'z', 'Ѕ': 'D', 'ѕ': 'd', 'И': 'I', 'и': 'i', 'Ј': 'J', 'ј': 'j',
            'К': 'K', 'к': 'k', 'Л': 'L', 'л': 'l', 'Љ': 'L', 'љ': 'l', 'М': 'M', 'м': 'm',
            'Н': 'N', 'н': 'n', 'Њ': 'N', 'њ': 'n', 'О': 'O', 'о': 'o', 'П': 'P', 'п': 'p',
            'Р': 'R', 'р': 'r', 'С': 'S', 'с': 's', 'Т': 'T', 'т': 't', 'Ќ': 'K', 'ќ': 'k',
            'У': 'U', 'у': 'u', 'Ф': 'F', 'ф': 'f', 'Х': 'H', 'х': 'h', 'Ц': 'C', 'ц': 'c',
            'Ч': 'C', 'ч': 'c', 'Џ': 'D', 'џ': 'd', 'Ш': 'S', 'ш': 's'
        };
        function transliterateCyrToLatShort(text) {
            return text.split('').map(ch => cyrillicToLatinShorthandMap[ch] || ch).join('');
        }

        /** Generate URL-safe slug from curator name (transliterated latin, no spaces) */
        function generateCuratorSlug(name) {
            return transliterateCyrillicToLatin(name)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // ==================== BAND NAME LOOKUP ====================
        let bandNameSet = new Set();
        let bandNameLookup = new Map();

        async function loadBandNames() {
            try {
                const resp = await fetch('/bands.json');
                const data = await resp.json();
                const bands = data.muzickaMasterLista || [];
                bands.forEach(b => {
                    if (!b.name) return;
                    bandNameSet.add(b.name);
                    const lower = b.name.toLowerCase();
                    const latinFull = transliterateCyrillicToLatin(b.name).toLowerCase();
                    const latinShort = transliterateCyrToLatShort(b.name).toLowerCase();
                    bandNameLookup.set(lower, b.name);
                    if (!bandNameLookup.has(latinFull)) bandNameLookup.set(latinFull, b.name);
                    if (!bandNameLookup.has(latinShort)) bandNameLookup.set(latinShort, b.name);
                });
            } catch (err) {}
        }

        /** Find a band name match using Cyrillic + Latin transliteration (case-insensitive) */
        function findBandMatch(text) {
            if (!text) return null;
            const lower = text.toLowerCase();
            if (bandNameLookup.has(lower)) return bandNameLookup.get(lower);
            const latinFull = transliterateCyrillicToLatin(text).toLowerCase();
            if (bandNameLookup.has(latinFull)) return bandNameLookup.get(latinFull);
            const latinShort = transliterateCyrToLatShort(text).toLowerCase();
            if (bandNameLookup.has(latinShort)) return bandNameLookup.get(latinShort);
            return null;
        }

        function renderArtistName(artist) {
            if (!artist) return '';
            const parts = artist.split(/\s*(?:feat\.?|ft\.?|&|,|\sx\s)\s*/i);
            const separators = artist.match(/\s*(?:feat\.?|ft\.?|&|,|\sx\s)\s*/gi) || [];
            let result = '';
            parts.forEach((part, i) => {
                const trimmed = part.trim();
                const match = findBandMatch(trimmed);
                if (match) {
                    result += `<a href="/artist.html?name=${encodeURIComponent(match)}" style="color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;">${escHtml(trimmed)}</a>`;
                } else {
                    result += escHtml(trimmed);
                }
                if (i < separators.length) result += escHtml(separators[i]);
            });
            return result;
        }

        function renderRelevance(items) {
            if (!items || !items.length) return '';
            const flatItems = [];
            items.forEach(item => {
                const subItems = item.split(/,(?![^(]*\))/g).map(s => s.trim()).filter(Boolean);
                flatItems.push(...subItems);
            });
            const parts = flatItems.map(item => {
                const nameOnly = item.replace(/\s*\([^)]*\)/g, '').trim();
                const extra = item.slice(nameOnly.length).trim();
                const match = findBandMatch(nameOnly);
                if (match) {
                    const href = '/artist.html?name=' + encodeURIComponent(match);
                    return `<a href="${href}">${escHtml(match)}</a>${extra ? ' <span style="opacity:.65">' + escHtml(extra) + '</span>' : ''}`;
                }
                return escHtml(item);
            });
            return parts.join('<span class="sep">·</span>');
        }

        // ==================== SERVICE PREFERENCE & OPEN ON SERVICE ====================
        let tracklistData = null;

        const serviceDefinitions = {
            spotify:      { name: 'Spotify',       icon: 'fab fa-spotify',        color: '#1DB954' },
            youtube:      { name: 'YouTube',        icon: 'fab fa-youtube',        color: '#FF0000' },
            youtubeMusic: { name: 'YouTube Music',  icon: 'fab fa-youtube',        color: '#FF0000' },
            appleMusic:   { name: 'Apple Music',    icon: 'fab fa-apple',          color: '#FA2D48' },
            deezer:       { name: 'Deezer',         icon: 'fas fa-headphones',     color: '#A238FF' },
            tidal:        { name: 'Tidal',          icon: 'fas fa-water',          color: '#000000' },
            amazonMusic:  { name: 'Amazon Music',   icon: 'fab fa-amazon',         color: '#00A8E1' },
            soundcloud:   { name: 'SoundCloud',     icon: 'fab fa-soundcloud',     color: '#FF5500' },
            bandcamp:     { name: 'Bandcamp',       icon: 'fab fa-bandcamp',       color: '#629AA9' }
        };
        function getPreferredService() { return localStorage.getItem('mmm-preferred-service'); }
        function setPreferredService(s) { localStorage.setItem('mmm-preferred-service', s); }

        function buildSearchUrl(serviceId, artist, title) {
            const query = `${artist} ${title}`;
            const encoded = encodeURIComponent(query);
            const plusEncoded = query.replace(/\s+/g, '+');
            const searchUrls = {
                youtube: `https://www.youtube.com/results?search_query=${plusEncoded}`,
                youtubeMusic: `https://music.youtube.com/search?q=${encoded}`,
                appleMusic: `https://music.apple.com/search?term=${encoded}`,
                deezer: `https://www.deezer.com/search/${encoded}`,
                tidal: `https://listen.tidal.com/search?q=${encoded}`,
                amazonMusic: `https://music.amazon.com/search/${encoded}`,
                soundcloud: `https://soundcloud.com/search?q=${encoded}`,
                bandcamp: `https://bandcamp.com/search?q=${encoded}`
            };
            return searchUrls[serviceId] || null;
        }

        function openOnPreferredService(releaseUrl, title, artistName) {
            if (!releaseUrl) return;
            const overlay = document.createElement('div');
            overlay.className = 'service-chooser-overlay';
            const pref = getPreferredService();
            
            let linksHtml = '';
            for (const [key, svc] of Object.entries(serviceDefinitions)) {
                const badge = key === pref ? '<span class="pref-badge">★</span>' : '';
                let url;
                if (key === 'spotify' && releaseUrl) {
                    url = releaseUrl;
                } else {
                    url = buildSearchUrl(key, artistName || '', title || '');
                }
                if (!url) continue;
                linksHtml += `<a href="${url}" target="_blank" rel="noopener" data-service="${key}"><i class="${svc.icon}" style="color:${svc.color}"></i>${svc.name}${badge}</a>`;
            }
            
            overlay.innerHTML = `<div class="service-chooser-dialog">
                <div class="service-chooser-header">
                    <div class="service-chooser-header-text">
                        <div class="service-chooser-artist">${artistName ? escHtml(artistName) : ''}</div>
                        <div class="service-chooser-song">${title ? escHtml(title) : 'Отвори во сервис'}</div>
                    </div>
                </div>
                <div class="service-chooser-links">${linksHtml}</div>
                <div class="service-chooser-footer">
                    <button class="chooser-cancel">Откажи</button>
                    <button class="chooser-set-default">Постави стандарден</button>
                </div>
            </div>`;
            
            document.body.appendChild(overlay);
            overlay.querySelector('.chooser-cancel').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            overlay.querySelector('.chooser-set-default').addEventListener('click', () => {
                overlay.remove();
                showServicePreferencePicker();
            });
            overlay.querySelectorAll('.service-chooser-links a').forEach(a => {
                a.addEventListener('click', () => overlay.remove());
            });
        }

        function showServicePreferencePicker() {
            const ov = document.getElementById('settings-overlay');
            if (ov) ov.classList.add('visible');
        }

        // ==================== TRACKLIST RENDERING ====================

        function buildPlaylistLink(url) {
            const info = detectLinkInfo(url);
            return `<a href="${escAttr(url)}" class="curator-playlist-link" target="_blank" rel="noopener">
                <span class="pl-icon ${info.service}"><i class="${info.icon}"></i></span>
                <span class="pl-text">Отвори плејлиста</span>
                <span class="pl-arrow"><i class="fas fa-arrow-up-right-from-square"></i></span>
            </a>`;
        }

        function renderTracklist(playlist, playlistUrl) {
            if (!playlist || !playlist.tracks || playlist.tracks.length === 0) return null;
            const service = playlist.service || 'default';
            const trackItems = playlist.tracks.map((t, i) => {
                const hasUrl = !!t.trackUrl;
                return `<li class="track-item" data-track-index="${i}" data-track-url="${escAttr(t.trackUrl || '')}">
                    <span class="track-num">${i + 1}</span>
                    ${t.image ? `<img class="track-art" src="${t.image}" alt="" loading="lazy">` : ''}
                    <div class="track-details">
                        <div class="track-name">${escHtml(t.title)}</div>
                        <div class="track-artist">${renderArtistName(t.artist || '')}</div>
                    </div>
                    <span class="track-duration">${t.duration || ''}</span>
                    <button class="track-play-btn" data-track-id="${escAttr(t.trackId || i.toString())}" data-track-index="${i}" title="${hasUrl ? 'Отвори во сервис' : ''}">
                        <i class="fas fa-external-link-alt"></i>
                    </button>
                </li>`;
            }).join('');

            const trackCount = playlist.tracks.length;
            const totalMs = playlist.tracks.reduce((s, t) => s + (t.durationMs || 0), 0);
            const totalMin = Math.round(totalMs / 60000);
            const metaText = `${trackCount} песни` + (totalMin > 0 ? ` · ${totalMin} мин.` : '');

            return `<div class="tracklist-wrapper tracklist-service-${service}" data-curator-playlist>
                <a class="tracklist-header" href="${escAttr(playlistUrl)}" target="_blank" rel="noopener">
                    ${playlist.image ? `<img class="tracklist-cover" src="${playlist.image}" alt="" loading="lazy">` : ''}
                    <div class="tracklist-info">
                        <div class="tracklist-title">${escHtml(playlist.name || 'Playlist')}</div>
                        <div class="tracklist-meta">${metaText}</div>
                    </div>
                </a>
                <ul class="tracklist-list">${trackItems}</ul>
                ${buildPlaylistLink(playlistUrl)}
            </div>`;
        }

        /** Find tracklist data for a curator & playlist URL */
        function findTracklist(curatorName, playlistUrl) {
            if (!tracklistData?.curators?.[curatorName]) return null;
            const curatorData = tracklistData.curators[curatorName];
            if (!curatorData.playlists) return null;
            const normalizeUrl = u => u.replace(/[?#].*$/, '').replace(/\/$/, '').toLowerCase();
            const targetNorm = normalizeUrl(playlistUrl);
            return curatorData.playlists.find(p => normalizeUrl(p.url).includes(targetNorm.split('/').pop()));
        }

        function initTracklistHandlers(container) {
            container.addEventListener('click', (e) => {
                const playBtn = e.target.closest('.track-play-btn');
                if (playBtn) {
                    e.preventDefault();
                    const trackItem = playBtn.closest('.track-item');
                    const trackUrl = trackItem?.dataset.trackUrl;
                    const nameEl = trackItem?.querySelector('.track-name');
                    const artistEl = trackItem?.querySelector('.track-artist');
                    const title = nameEl?.textContent || '';
                    const artistName = artistEl?.textContent || '';
                    if (trackUrl) openOnPreferredService(trackUrl, title, artistName);
                    return;
                }
                const trackItem = e.target.closest('.track-item');
                if (trackItem && !e.target.closest('a')) {
                    e.preventDefault();
                    const trackUrl = trackItem.dataset.trackUrl;
                    const nameEl = trackItem.querySelector('.track-name');
                    const artistEl = trackItem.querySelector('.track-artist');
                    const title = nameEl?.textContent || '';
                    const artistName = artistEl?.textContent || '';
                    if (trackUrl) openOnPreferredService(trackUrl, title, artistName);
                    return;
                }
            });
        }

        // ==================== MAIN ====================
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let curatorParam = urlParams.get('name') || urlParams.get('c');

            // Restore clean URL if redirected via 404.html
            const cleanUrl = sessionStorage.getItem('curatorCleanUrl');
            if (cleanUrl) {
                sessionStorage.removeItem('curatorCleanUrl');
                const savedSlug = sessionStorage.getItem('curatorSlug');
                sessionStorage.removeItem('curatorSlug');
                const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
                if (!isLocal && savedSlug) {
                    history.replaceState(null, '', '/kustos/' + savedSlug);
                }
            }

            if (!curatorParam) {
                renderError();
                return;
            }

            curatorParam = decodeURIComponent(curatorParam);

            const contentEl = document.getElementById('curator-content');
            const loadingEl = document.getElementById('curator-loading');

            // Load data in parallel
            const [curatorsResp, , tracklistResp] = await Promise.allSettled([
                fetch('/curators.json').then(r => r.json()),
                loadBandNames(),
                fetch('/curators-tracklists.json').then(r => r.ok ? r.json() : null).catch(() => null)
            ]);

            const curatorsData = curatorsResp.status === 'fulfilled' ? curatorsResp.value : null;
            tracklistData = tracklistResp.status === 'fulfilled' ? tracklistResp.value : null;

            if (!curatorsData?.curators) {
                renderError();
                return;
            }

            // Find curator (by slug match, then case-insensitive name match)
            const curator = curatorsData.curators.find(c =>
                generateCuratorSlug(c.name) === curatorParam
            ) || curatorsData.curators.find(c =>
                c.name.toLowerCase() === curatorParam.toLowerCase()
            );

            if (!curator) {
                renderError();
                return;
            }

            // Update page title & meta
            const title = `${curator.name} — Кустос | Македонска Музичка Мастер Листа`;
            document.getElementById('page-title').textContent = title;
            document.getElementById('header-title').textContent = curator.name;
            const desc = `Курирана плејлиста од ${curator.name}`;
            const metaDesc = document.getElementById('meta-description');
            if (metaDesc) metaDesc.content = desc;
            const ogTitle = document.getElementById('og-title');
            if (ogTitle) ogTitle.content = title;
            const ogDesc = document.getElementById('og-description');
            if (ogDesc) ogDesc.content = desc;
            const curatorSlug = generateCuratorSlug(curator.name);
            const cleanCuratorUrl = 'https://toplista.mk/kustos/' + curatorSlug;
            const canonicalEl = document.getElementById('canonical-url');
            if (canonicalEl) canonicalEl.href = cleanCuratorUrl;
            const ogUrlEl = document.getElementById('og-url');
            if (ogUrlEl) ogUrlEl.content = cleanCuratorUrl;
            const twitterUrlEl = document.getElementById('twitter-url');
            if (twitterUrlEl) twitterUrlEl.content = cleanCuratorUrl;

            // Update browser URL to clean slug URL (if not already)
            const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (!isLocalhost) {
                const cleanPath = '/kustos/' + curatorSlug;
                if (window.location.pathname !== cleanPath) {
                    window.history.replaceState({}, '', cleanPath);
                }
            }

            // Render
            renderCurator(curator);
        }

        function renderCurator(c) {
            const contentEl = document.getElementById('curator-content');

            // Avatar
            const igPic = getInstagramPic(c.links);
            const fallbackImg = c.image || null;
            const primarySrc = igPic || fallbackImg;
            let avatarInner;
            if (primarySrc) {
                let onerror;
                if (igPic && fallbackImg) {
                    const escaped = fallbackImg.replace(/'/g, "\\'");
                    onerror = "this.onerror=function(){this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';};this.src='" + escaped + "';";
                } else {
                    onerror = "this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';";
                }
                avatarInner = `<img src="${primarySrc}" alt="${c.name}" loading="lazy" referrerpolicy="no-referrer" onerror="${onerror}">`;
            } else {
                avatarInner = '<i class="fas fa-user"></i>';
            }

            // Social links
            const links = c.links || [];
            const socialLinks = links.map(url => {
                const info = detectLinkInfo(url);
                return `<a href="${url}" target="_blank" rel="noopener" title="${info.label}"><i class="${info.icon}"></i></a>`;
            }).join('');

            // Relevance
            const relevanceHtml = renderRelevance(c.relevance);

            // Playlists
            const playlistUrls = c.playlists || (c.playlist ? [c.playlist] : []);
            let playlistContent = '';

            if (playlistUrls.length === 1) {
                const url = playlistUrls[0];
                const tl = findTracklist(c.name, url);
                playlistContent = (tl && tl.tracks?.length > 0) ? renderTracklist(tl, url) : buildPlaylistLink(url);
            } else if (playlistUrls.length > 1) {
                let tabs = '<div class="curator-playlist-tabs">';
                let panels = '';
                const groupId = 'cp-' + Math.random().toString(36).slice(2, 8);
                playlistUrls.forEach((url, i) => {
                    const info = detectLinkInfo(url);
                    const active = i === 0 ? ' active' : '';
                    tabs += `<button class="curator-playlist-tab ${info.service}${active}" data-tab-group="${groupId}" data-tab-index="${i}"><i class="${info.icon}"></i> ${info.label}</button>`;
                    const tl = findTracklist(c.name, url);
                    const content = (tl && tl.tracks?.length > 0) ? renderTracklist(tl, url) : buildPlaylistLink(url);
                    panels += `<div class="curator-playlist-panel${active}" data-tab-group="${groupId}" data-panel-index="${i}">${content}</div>`;
                });
                tabs += '</div>';
                playlistContent = tabs + panels;
            }

            contentEl.innerHTML = `
                <div class="curator-header">
                    <div class="curator-avatar">${avatarInner}</div>
                    <div class="curator-name-row">
                        <div class="curator-name">${escHtml(c.name)}</div>
                        ${socialLinks ? `<div class="curator-socials">${socialLinks}</div>` : ''}
                    </div>
                    ${relevanceHtml ? `<div class="curator-relevance">${relevanceHtml}</div>` : ''}
                </div>

                ${playlistUrls.length > 0 ? `
                    ${playlistContent}
                ` : ''}

                <div class="curator-footer">
                    <a href="/kustosi">
                        <img src="/logo.png" alt="MMM" width="20" height="20" class="mmm-logo-svg">
                        Македонска Музичка Мастер Листа
                    </a>
                </div>
            `;

            // Init tab switching
            const tabContainer = contentEl.querySelector('.curator-playlist-tabs');
            if (tabContainer) {
                tabContainer.addEventListener('click', (e) => {
                    const tab = e.target.closest('.curator-playlist-tab');
                    if (!tab) return;
                    const group = tab.dataset.tabGroup;
                    const index = tab.dataset.tabIndex;
                    contentEl.querySelectorAll(`.curator-playlist-tab[data-tab-group="${group}"]`).forEach(t => t.classList.remove('active'));
                    contentEl.querySelectorAll(`.curator-playlist-panel[data-tab-group="${group}"]`).forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    const panel = contentEl.querySelector(`.curator-playlist-panel[data-tab-group="${group}"][data-panel-index="${index}"]`);
                    if (panel) panel.classList.add('active');
                });
            }

            // Init tracklist handlers
            initTracklistHandlers(contentEl);
        }

        function renderError() {
            const contentEl = document.getElementById('curator-content');
            contentEl.innerHTML = `
                <div class="curator-error">
                    <i class="fas fa-headphones"></i>
                    <h2>Кустосот не е пронајден</h2>
                    <p>Кустосот што го барате не постои или е отстранет.</p>
                    <a href="/kustosi"><i class="fas fa-arrow-left"></i> Сите кустоси</a>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
