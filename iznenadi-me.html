    <style>
        body.surprise-page {
            height: auto;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.surprise-page main {
            height: auto;
            overflow: visible;
            padding: 0.75rem 0 1.5rem;
        }

        .surprise-container {
            max-width: 620px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            position: relative;
        }

        .surprise-container::before {

        }

        .surprise-container > * {
            position: relative;
            z-index: 1;
        }

        /* Dropdown rows */
        .surprise-dropdown-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            padding: 0.5rem 0.9rem;
        }

        .surprise-dropdown-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 60px;
        }

        .surprise-dropdown-label i {
            font-size: 0.7rem;
            color: var(--accent-blue);
        }

        .surprise-select {
            flex: 1;
            padding: 0.4rem 0.6rem;
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.15s ease;
            appearance: auto;
        }

        .surprise-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        body.dark-mode .surprise-select {
            background: var(--bg-hover);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        /* Filters section */
        .surprise-filters-section {
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            padding: 0.6rem 0.9rem 0.7rem;
        }

        .surprise-filters-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.45rem;
        }

        /* Option grid */
        .option-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .option-grid .filter-btn.preset-btn {
            min-width: 140px;
            width: calc(50% - 0.2rem);
            justify-content: center;
            flex: 0 0 auto;
        }

        /* Filter buttons (same as charts.html preset-btn) */
        .surprise-page .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.65rem;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .surprise-page .filter-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .surprise-page .filter-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }
        .surprise-page .filter-btn i { font-size: 0.65rem; }
        body.dark-mode .surprise-page .filter-btn {
            background: var(--bg-hover);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        body.dark-mode .surprise-page .filter-btn:hover {
            background: #2a2e36;
            color: var(--text-primary);
        }
        body.dark-mode .surprise-page .filter-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }
        .surprise-page .preset-btn {
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.035em;
            font-weight: 600;
            font-size: 0.71rem;
            padding: 0.4rem 0.85rem;
            height: 34px;
            margin-left: 0;
        }

        .surprise-page .preset-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            z-index: 1;
            transform: translateY(-1px);
        }
        .surprise-page .preset-btn.active {
            border-color: #000;
            background: #000;
            color: #fff;
            z-index: 2;
            animation: selectionPop 0.24s ease;
        }
        body.dark-mode .surprise-page .preset-btn.active {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        /* Go button */
        .surprise-go-wrapper {
            text-align: center;
            margin-top: 0.75rem;
            padding: 0.75rem;
        }

        .surprise-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 260px;
            justify-content: center;
            padding: 0.9rem 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.015em;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .surprise-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(34, 92, 228, 0.35);
        }

        .surprise-cta-btn:active {
            transform: scale(0.97);
        }

        .surprise-cta-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .surprise-cta-btn i {
            font-size: 1rem;
        }

        .surprise-cta-btn.ready {
            animation: ctaReady 2.7s ease-in-out infinite;
        }

        /* Loading spinner */
        .surprise-cta-btn.loading i {
            animation: spin 0.8s linear infinite;
        }

        .surprise-go-wrapper.shake {
            animation: noResultsShake 0.35s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes ctaReady {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,92,228,0); }
            50% { box-shadow: 0 0 0 5px rgba(34,92,228,0.08); }
        }

        @keyframes noResultsShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* No results message */
        .no-results-msg {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: none;
        }

        .no-results-msg.visible {
            display: block;
        }

        .no-results-msg i {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        /* Tabs */
        .surprise-tabs {
            display: flex;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .surprise-tab {
            flex: 1;
            padding: 0.6rem 1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .surprise-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }
        .surprise-tab.active {
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        .surprise-tab i { font-size: 0.72rem; }
        body.dark-mode .surprise-tab {
            color: var(--text-secondary);
        }
        body.dark-mode .surprise-tab:hover {
            background: #2a2e36;
            color: var(--text-primary);
        }
        body.dark-mode .surprise-tab.active {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Song result card */
        .song-result-card {
            display: none;
            text-align: center;
            padding: 1.2rem;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            border-radius: 8px;
            animation: cardFadeIn 0.35s ease;
        }
        .song-result-card.visible { display: block; }
        .song-result-card .song-thumb {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }
        .song-result-card .song-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .song-result-card .song-artist {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }
        .song-result-card .song-play-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .song-result-card .song-play-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(34,92,228,0.3);
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .surprise-container {
                padding: 1.25rem 1rem 2rem;
            }

            .surprise-dropdown-row {
                padding: 0.45rem 0.75rem;
                gap: 0.5rem;
            }

            .surprise-filters-section {
                padding: 0.5rem 0.75rem 0.6rem;
            }

            .option-grid {
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .option-grid .filter-btn.preset-btn {
                min-width: 0;
                width: calc(50% - 0.2rem);
                flex: 0 0 auto;
            }
            .surprise-page .preset-btn {
                padding: 0.3rem 0.65rem;
                font-size: 0.66rem;
            }

            .surprise-cta-btn {
                min-width: 100%;
                font-size: 1.05rem;
                padding: 0.78rem 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .surprise-cta-btn.ready,
            .surprise-go-wrapper.shake {
                animation: none !important;
            }
        }
    </style>

<body class="compact surprise-page">
    <header id="site-header" data-active="/iznenadi-me" data-title="Изненади ме"></header>
    <script src="/scripts/site/load-header.js"></script>
    <main>
        <div class="surprise-container">
            <!-- Hidden summary elements for JS compatibility -->
            <span id="summary-genre" style="display:none" data-i18n="surprise.allGenres">Сите жанрови</span>
            <span id="summary-era" style="display:none" data-i18n="surprise.anyEra">Било која ера</span>
            <span id="summary-filters" style="display:none" data-i18n="surprise.noFilters">Без дополнителни филтри</span>

            <!-- Tabs -->

                    <option value="jazz" data-i18n="surprise.jazz">Џез</option>

            <!-- Era dropdown -->
            <div class="surprise-dropdown-row">
                <label for="era-select" class="surprise-dropdown-label"><i class="fas fa-clock"></i> <span data-i18n="surprise.era">Ера</span></label>
                <select id="era-select" class="surprise-select">
                    <option value="any" selected data-i18n="surprise.anyEra">Било која ера</option>
                    <option value="new" data-i18n="surprise.newEra">Нови (последни 10г.)</option>

            <div class="surprise-filters-section">

                    <button class="filter-btn preset-btn" data-filter="verified">
                        <i class="fas fa-circle-check"></i> <span data-i18n="surprise.verified">Потврдени</span>
                    </button>
                    <button class="filter-btn preset-btn" data-filter="spotify">
                        <i class="fab fa-spotify"></i> <span data-i18n="surprise.withSpotify">Со Spotify</span>
                    </button>
                    <button class="filter-btn preset-btn" data-filter="active">
                        <i class="fas fa-bolt"></i> <span data-i18n="surprise.active">Активни</span>

                    <button class="filter-btn preset-btn" data-filter="inactive">
                        <i class="fas fa-moon"></i> <span data-i18n="surprise.inactive">Неактивни</span>

            </div>

            <!-- Go button -->
            <div class="surprise-go-wrapper">
                <button class="btn-generic surprise-cta-btn" id="surprise-go" disabled>
                    <i class="fas fa-shuffle"></i> <span data-i18n="surprise.surpriseMe">Изненади ме!</span>

            <div class="no-results-msg" id="no-results">

            <div class="song-result-card" id="song-result">

                <a class="btn-generic song-play-btn" id="song-play" href="#" target="_blank" rel="noopener">

                </a>
            </div>

    <script>
        // Settings menu + nav menu from common.js
        initSettingsMenu();
        initNavMenu();

    (function() {

        // ==================== GENRE CONFIG (same as chart page) ====================
        const genreConfig = {
            'alt': {
                genres: ['Alternative', 'Indie', 'Post-Punk', 'Punk', 'Shoegaze', 'Dream Pop', 'Post-Rock',
                         'Grunge', 'Experimental', 'Math Rock', 'Art Rock', 'Alternative Rock', 'Indie Rock'],
                excludeIfContains: ['pop', 'metal', 'hardcore', 'thrashcore', 'metalcore', 'jazz']
            },
            'rap': {
                genres: ['Rap', 'Trap', 'Hip Hop', 'Boom Bap'],
                excludeIfContains: []
            },
            'electronic': {
                genres: ['Electronic', 'Techno', 'House', 'Trance', 'Synthwave', 'Synth-Pop',
                         'EDM', 'DnB', 'Drum and Bass', 'Ambient', 'Vaporwave'],
                excludeIfContains: []
            },
            'jazz': {
                genres: ['Jazz', 'Jazz Fusion', 'Jazz Rock', 'Acid Jazz', 'Fusion'],
                excludeIfContains: []
            },
            'metal': {
                genres: ['Metal', 'Heavy Metal', 'Thrash Metal', 'Power Metal', 'Progressive Metal',
                         'Speed Metal', 'Metalcore', 'Crossover Thrash', 'Death Metal', 'Black Metal',
                         'Stoner Rock', 'Hardcore', 'Thrashcore', 'Post-Hardcore'],
                excludeIfContains: []
            }
        };

        // ==================== STATE ====================
        let selectedGenre = 'all';
        let selectedEra = 'any';
        let activeFilters = new Set();
        let selectedTab = 'artist';
        let bandsData = [];
        let releasesData = [];
        let eventsData = [];
        let dataLoaded = false;
        const goBtn = document.getElementById('surprise-go');
        const summaryGenreEl = document.getElementById('summary-genre');
        const summaryEraEl = document.getElementById('summary-era');
        const summaryFiltersEl = document.getElementById('summary-filters');

        const genreLabels = {
            all: t('surprise.allGenres'),
            alt: t('surprise.alt'),
            rap: t('surprise.rap'),
            electronic: t('surprise.electronic'),
            jazz: t('surprise.jazz'),
            metal: t('surprise.metal')
        };

        const eraLabels = {
            any: t('surprise.anyEra'),
            new: t('surprise.newShort'),
            old: t('surprise.oldShort')
        };

        const filterLabels = {
            verified: t('surprise.verified'),
            spotify: t('surprise.withSpotify'),
            active: t('surprise.active'),
            inactive: t('surprise.inactive')
        };

        function updateSelectionSummary() {
            // Update hidden summary elements for compatibility
            if (summaryGenreEl) summaryGenreEl.textContent = genreLabels[selectedGenre] || t('surprise.allGenres');
            if (summaryEraEl) summaryEraEl.textContent = eraLabels[selectedEra] || t('surprise.anyEra');
            if (summaryFiltersEl) {
                summaryFiltersEl.textContent = activeFilters.size
                    ? Array.from(activeFilters).map(f => filterLabels[f]).filter(Boolean).join(' • ')
                    : t('surprise.noFilters');
            }
        }

        // ==================== OPTION LOGIC ====================
        // Genre dropdown
        document.getElementById('genre-select').addEventListener('change', (e) => {
            selectedGenre = e.target.value;
            updateGoButton();
            updateSelectionSummary();
        });

        // Era dropdown
        document.getElementById('era-select').addEventListener('change', (e) => {
            selectedEra = e.target.value;
            updateGoButton();
            updateSelectionSummary();
        });

        // Filter buttons (toggle, multi-select)
        document.querySelectorAll('.surprise-filters-section .filter-btn.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                if (activeFilters.has(filter)) {
                    activeFilters.delete(filter);
                    btn.classList.remove('active');
                } else {
                    if (filter === 'active') {
                        activeFilters.delete('inactive');
                        const inactiveBtn = document.querySelector('.surprise-filters-section .filter-btn.preset-btn[data-filter="inactive"]');
                        if (inactiveBtn) inactiveBtn.classList.remove('active');
                    }
                    if (filter === 'inactive') {
                        activeFilters.delete('active');
                        const activeBtn = document.querySelector('.surprise-filters-section .filter-btn.preset-btn[data-filter="active"]');
                        if (activeBtn) activeBtn.classList.remove('active');
                    }
                    activeFilters.add(filter);
                    btn.classList.add('active');
                }
                updateGoButton();
                updateSelectionSummary();
            });
        });

        // Tab switching
        document.querySelectorAll('.surprise-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.surprise-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                selectedTab = tab.dataset.tab;
                document.getElementById('no-results').classList.remove('visible');
                document.getElementById('song-result').classList.remove('visible');
                document.querySelector('.surprise-filters-section').style.display = selectedTab === 'song' ? 'none' : '';
            });
        });

        // ==================== LOAD DATA ====================
        async function loadData() {
            try {
                const [bandsResp, siteMasterData, eventsResp] = await Promise.all([
                    fetch('bands.json').then(r => r.json()),
                    loadSiteMaster(),
                    fetch('events.json').then(r => r.json()).catch(() => null)
                ]);

                bandsData = bandsResp.muzickaMasterLista || [];
                registerArtistNames(bandsData);
                releasesData = siteMasterData?.chartData?.releases || [];
                eventsData = eventsResp?.events || [];
                window._siteMasterActivity = siteMasterData?.artistActivity || {};
                dataLoaded = true;
                updateGoButton();
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }

        function updateGoButton() {
            goBtn.disabled = !dataLoaded;
            goBtn.classList.toggle('ready', dataLoaded);
            document.getElementById('no-results').classList.remove('visible');
        }

        // ==================== GENRE MATCHING ====================
        function artistMatchesGenre(artist, genreFilter) {
            if (genreFilter === 'all') return true;
            const config = genreConfig[genreFilter];
            if (!config) return true;

            const artistGenres = artist.genre.toLowerCase();

            // Exclude if genre has exclusion keywords (e.g., exclude поп from alt)
            for (const ex of config.excludeIfContains) {
                if (artistGenres.includes(ex)) return false;
            }

            return config.genres.some(g => artistGenres.includes(g.toLowerCase()));
        }

        // ==================== ERA MATCHING ====================
        function buildArtistEraMap() {
            // Build a map: artist name -> most recent release year
            const eraMap = {};
            for (const release of releasesData) {
                const name = release.bandName;
                const year = parseInt(release.releaseDate, 10);
                if (!isNaN(year)) {
                    if (!eraMap[name] || year > eraMap[name]) {
                        eraMap[name] = year;
                    }
                }
            }
            return eraMap;
        }

        function artistMatchesEra(artist, eraFilter, eraMap) {
            if (eraFilter === 'any') return true;

            const currentYear = new Date().getFullYear();
            const cutoffYear = currentYear - 10;
            const latestYear = eraMap[artist.name];

            if (latestYear === undefined) {
                // No release data available — include in "any" only
                return false;
            }

            if (eraFilter === 'new') return latestYear >= cutoffYear;
            if (eraFilter === 'old') return latestYear < cutoffYear;
            return true;
        }

        // ==================== ACTIVITY STATUS ====================
        function getArtistActivity(artistName, eraMap) {
            // Try pre-computed activity from site-master (keys are lowercased names)
            const key = artistName.toLowerCase().trim();
            const precomputed = window._siteMasterActivity?.[key];
            if (precomputed) {
                const map = { 'Активен': 'active', 'Неактивен': 'inactive', 'Можеби': 'maybe', 'Непознато': 'unknown' };
                return map[precomputed] || precomputed;
            }
            
            // Fallback
            const now = new Date();
            const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            const oneYearAgoStr = oneYearAgo.toISOString().slice(0, 10);
            const lower = artistName.toLowerCase();
            const hasRecentEvent = eventsData.some(e =>
                e.date >= oneYearAgoStr &&
                (e.artists || []).some(a => a.toLowerCase() === lower)
            );
            if (hasRecentEvent) return 'active';

            const latestYear = eraMap[artistName];
            if (!latestYear) return 'unknown';

            const diffYears = (now - new Date(latestYear, 0, 1)) / (365.25 * 24 * 60 * 60 * 1000);
            if (diffYears <= 2) return 'active';
            if (diffYears <= 3) return 'maybe';
            return 'inactive';
        }

        // ==================== GO! ====================
        goBtn.addEventListener('click', () => {
            if (!dataLoaded) return;

            const eraMap = buildArtistEraMap();

            // Filter artists
            const candidates = bandsData.filter(artist => {
                if (!artistMatchesGenre(artist, selectedGenre)) return false;
                if (!artistMatchesEra(artist, selectedEra, eraMap)) return false;
                if (activeFilters.has('verified') && !artist.confirmed) return false;
                if (activeFilters.has('spotify') && !(artist.links && artist.links.spotify)) return false;
                if (activeFilters.has('active')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'active' && status !== 'maybe') return false;
                }
                if (activeFilters.has('inactive')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'inactive') return false;
                }
                return true;
            });

            const noResultsEl = document.getElementById('no-results');
            const goWrapper = document.querySelector('.surprise-go-wrapper');
            const songResultEl = document.getElementById('song-result');
            songResultEl.classList.remove('visible');

            if (selectedTab === 'song') {
                // Song mode: pick random song from matching artists' releases
                const candidateNames = new Set(candidates.map(a => a.name));
                const songReleases = releasesData.filter(r =>
                    candidateNames.has(r.bandName) &&
                    r.youtubeTracks && r.youtubeTracks.length > 0
                );

                if (songReleases.length === 0) {
                    noResultsEl.classList.add('visible');
                    goWrapper.classList.remove('shake');
                    void goWrapper.offsetWidth;
                    goWrapper.classList.add('shake');
                    return;
                }

                noResultsEl.classList.remove('visible');
                goBtn.classList.add('loading');
                goBtn.querySelector('i').className = 'fas fa-spinner';

                const randomRelease = songReleases[Math.floor(Math.random() * songReleases.length)];
                // Get unique track names from YouTube tracks
                const trackNames = [...new Set(randomRelease.youtubeTracks.map(t => t.name))];
                const randomTrackName = trackNames[Math.floor(Math.random() * trackNames.length)];
                // Find most popular video for this track
                const matchingVideos = randomRelease.youtubeTracks
                    .filter(t => t.name === randomTrackName)
                    .sort((a, b) => (b.views || 0) - (a.views || 0));
                const bestVideo = matchingVideos[0];

                setTimeout(() => {
                    goBtn.classList.remove('loading');
                    goBtn.querySelector('i').className = 'fas fa-shuffle';

                    if (bestVideo && bestVideo.url) {
                        const thumbUrl = randomRelease.thumbnail || 
                            'https://img.youtube.com/vi/' + bestVideo.videoId + '/mqdefault.jpg';
                        document.getElementById('song-thumb').src = thumbUrl;
                        document.getElementById('song-title').textContent = randomTrackName;
                        document.getElementById('song-artist').textContent = randomRelease.bandName;
                        document.getElementById('song-play').href = bestVideo.url;
                        songResultEl.classList.remove('visible');
                        void songResultEl.offsetWidth;
                        songResultEl.classList.add('visible');
                    }
                }, 400);

            } else {
                // Artist mode (original behavior)
                if (candidates.length === 0) {
                    noResultsEl.classList.add('visible');
                    goWrapper.classList.remove('shake');
                    void goWrapper.offsetWidth;
                    goWrapper.classList.add('shake');
                    return;
                }

                noResultsEl.classList.remove('visible');
                goBtn.classList.add('loading');
                goBtn.querySelector('i').className = 'fas fa-spinner';

                const randomArtist = candidates[Math.floor(Math.random() * candidates.length)];
                const artistUrl = 'artist.html?name=' + encodeURIComponent(randomArtist.name);

                setTimeout(() => {
                    window.location.href = artistUrl;
                }, 400);
            }
        });

        // ==================== INIT ====================
        updateSelectionSummary();
        loadData();
    })();
    </script>
</body>
</html>
