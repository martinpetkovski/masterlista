    <style>
        body.surprise-page {
            height: auto;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.surprise-page main {
            height: auto;
            overflow: visible;
        }

        .surprise-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .surprise-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .surprise-hero .hero-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: block;
            color: var(--accent-blue);
        }

        .surprise-hero h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            color: var(--text-primary);
        }

        .surprise-hero p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        /* Step container */
        .surprise-step {
            margin-bottom: 2rem;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .surprise-step.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .step-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .step-label .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .step-label .step-number.completed {
            background: #3dba6f;
        }

        /* Option buttons */
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            line-height: 1.3;
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(74, 127, 165, 0.06);
        }

        .option-btn.selected {
            border-color: var(--accent-blue);
            background: rgba(74, 127, 165, 0.1);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .option-btn i {
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        /* Go button */
        .surprise-go-wrapper {
            text-align: center;
            margin-top: 2rem;
        }

        .surprise-go-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            border: none;
            border-radius: 12px;
            background: var(--accent-blue);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }

        .surprise-go-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(74, 127, 165, 0.35);
        }

        .surprise-go-btn:active {
            transform: scale(0.97);
        }

        .surprise-go-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .surprise-go-btn i {
            font-size: 1rem;
        }

        /* Loading spinner */
        .surprise-go-btn.loading i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* No results message */
        .no-results-msg {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: none;
        }

        .no-results-msg.visible {
            display: block;
        }

        .no-results-msg i {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .surprise-container {
                padding: 1.25rem 1rem 2rem;
            }

            .surprise-hero h2 {
                font-size: 1.15rem;
            }

            .surprise-hero .hero-icon {
                font-size: 2rem;
            }

            .option-btn {
                padding: 0.65rem 0.75rem;
                font-size: 0.78rem;
            }

            .surprise-go-btn {
                font-size: 0.85rem;
                padding: 0.75rem 1.8rem;
            }
        }
    </style>

    <script>
        // ==================== SETTINGS MENU ====================
        (function() {
            const settingsBtn = document.getElementById('settings-btn');
            if (!settingsBtn) return;
            const svcDefs = {
                spotify: { name: 'Spotify', icon: 'fab fa-spotify', color: '#1DB954' },
                youtube: { name: 'YouTube', icon: 'fab fa-youtube', color: '#FF0000' },
                youtubeMusic: { name: 'YouTube Music', icon: 'fab fa-youtube', color: '#FF0000' },
                appleMusic: { name: 'Apple Music', icon: 'fab fa-apple', color: '#fc3c44' },
                deezer: { name: 'Deezer', icon: 'fas fa-headphones', color: '#A238FF' },
                tidal: { name: 'Tidal', icon: 'fas fa-water', color: '#000000' },
                amazonMusic: { name: 'Amazon Music', icon: 'fab fa-amazon', color: '#FF9900' },
                soundcloud: { name: 'SoundCloud', icon: 'fab fa-soundcloud', color: '#ff7700' },
                bandcamp: { name: 'Bandcamp', icon: 'fab fa-bandcamp', color: '#1da0c3' }
            };
            const overlay = document.createElement('div');
            overlay.id = 'settings-overlay';
            overlay.className = 'settings-overlay';
            const currentService = localStorage.getItem('mmm-preferred-service');
            const isDark = document.documentElement.classList.contains('dark-mode');
            overlay.innerHTML = `
                <div class="settings-panel">
                    <h3><i class="fas fa-gear"></i> Поставки</h3>
                    <div class="settings-section">
                        <div class="settings-section-title">Тема</div>
                        <div class="settings-theme-toggle">
                            <button class="settings-theme-btn ${!isDark ? 'active' : ''}" data-theme="light"><i class="fas fa-sun"></i> Светла</button>
                            <button class="settings-theme-btn ${isDark ? 'active' : ''}" data-theme="dark"><i class="fas fa-moon"></i> Темна</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">Стриминг сервис</div>
                        <div class="settings-service-options">
                            <button class="settings-service-btn no-pref ${!currentService ? 'active' : ''}" data-service=""><i class="fas fa-question"></i> Секогаш прашувај</button>
                            ${Object.entries(svcDefs).map(([id, svc]) => `<button class="settings-service-btn ${id === currentService ? 'active' : ''}" data-service="${id}" style="--svc-color: ${svc.color}"><i class="${svc.icon}"></i> ${svc.name}</button>`).join('')}
                        </div>
                    </div>
                    <div class="settings-section settings-tour-section">
                        <button class="settings-tour-btn" id="settings-start-tour"><i class="fas fa-route"></i> Тура на сајтот</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('visible'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const ov = document.getElementById('settings-overlay'); if (ov) ov.classList.remove('visible'); } });
            overlay.querySelectorAll('.settings-theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dark = btn.dataset.theme === 'dark';
                    document.body.classList.toggle('dark-mode', dark);
                    document.documentElement.classList.toggle('dark-mode', dark);
                    document.documentElement.style.backgroundColor = dark ? '#111318' : '';
                    localStorage.setItem('mmm-dark-mode', dark);
                    overlay.querySelectorAll('.settings-theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            overlay.querySelectorAll('.settings-service-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const serviceId = btn.dataset.service;
                    if (serviceId) { localStorage.setItem('mmm-preferred-service', serviceId); }
                    else { localStorage.removeItem('mmm-preferred-service'); }
                    overlay.querySelectorAll('.settings-service-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            const tourBtnEl = overlay.querySelector('#settings-start-tour');
            if (tourBtnEl) { tourBtnEl.addEventListener('click', () => { overlay.classList.remove('visible'); if (typeof window.startGlobalTour === 'function') window.startGlobalTour(); }); }
            settingsBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark-mode');
                overlay.querySelectorAll('.settings-theme-btn').forEach(btn => { btn.classList.toggle('active', (btn.dataset.theme === 'dark') === isDark); });
                const currentSvc = localStorage.getItem('mmm-preferred-service');
                overlay.querySelectorAll('.settings-service-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.service === (currentSvc || '')); });
                overlay.classList.add('visible');
            });
        })();

    (function() {
        // ==================== NAV MENU ====================
        const trigger = document.querySelector('.site-nav-trigger');
        const menu = document.getElementById('site-nav-menu');
        if (trigger && menu) {
            trigger.addEventListener('click', (e) => {
                if (window.innerWidth <= 600) {
                    e.preventDefault();
                    e.stopPropagation();
                    menu.classList.toggle('open');
                }
            });
            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });
        }

        // ==================== GENRE CONFIG (same as chart page) ====================
        const genreConfig = {
            'alt': {
                genres: ['Алтернативен', 'Инди', 'Пост-панк', 'Панк', 'Шугејз', 'Дрим Поп', 'Пост-рок',
                         'Гранџ', 'Експериментален', 'Мат Рок', 'Арт Рок', 'Алтернативен Рок', 'Инди Рок', 'Пост-Панк'],
                excludeIfContains: ['поп', 'метал', 'хардкор', 'трешкор', 'металкор', 'џез']
            },
            'rap': {
                genres: ['Рап', 'Трап', 'Хип Хоп', 'Бум Бап'],
                excludeIfContains: []
            },
            'electronic': {
                genres: ['Електронска', 'Техно', 'Хаус', 'Транс', 'Синтвејв', 'Синт-Поп',
                         'EDM', 'ДНБ', 'Драм', 'Амбиентална', 'Вејпорвејв'],
                excludeIfContains: []
            },
            'jazz': {
                genres: ['Џез', 'Џез Фјужн', 'Џез Рок', 'Ацид Џез', 'Фјужн'],
                excludeIfContains: []
            },
            'metal': {
                genres: ['Метал', 'Хеви Метал', 'Треш Метал', 'Пауер Метал', 'Прогресивен Метал',
                         'Спид Метал', 'Металкор', 'Кросовер Треш', 'Дет Метал', 'Блек Метал',
                         'Стонер', 'Хардкор', 'Трешкор', 'Пост-Хардкор'],
                excludeIfContains: []
            }
        };

        // ==================== STATE ====================
        let selectedGenre = 'all';
        let selectedEra = 'any';
        let activeFilters = new Set();
        let bandsData = [];
        let releasesData = [];
        let eventsData = [];
        let dataLoaded = false;

        // ==================== OPTION BUTTON LOGIC ====================
        document.querySelectorAll('#step-genre .option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#step-genre .option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedGenre = btn.dataset.genre;
                updateGoButton();
            });
        });

        document.querySelectorAll('#step-era .option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#step-era .option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedEra = btn.dataset.era;
                updateGoButton();
            });
        });

        // Filter buttons (toggle, multi-select)
        document.querySelectorAll('#step-filters .option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                if (activeFilters.has(filter)) {
                    activeFilters.delete(filter);
                    btn.classList.remove('selected');
                } else {
                    activeFilters.add(filter);
                    btn.classList.add('selected');
                }
                updateGoButton();
            });
        });

        // ==================== LOAD DATA ====================
        async function loadData() {
            try {
                const [bandsResp, chartResp, eventsResp] = await Promise.all([
                    fetch('bands.json'),
                    fetch('chart-data.json'),
                    fetch('events.json')
                ]);
                const bandsJson = await bandsResp.json();
                const chartJson = await chartResp.json();
                const eventsJson = await eventsResp.json();

                bandsData = bandsJson.muzickaMasterLista || [];
                releasesData = chartJson.releases || [];
                eventsData = eventsJson.events || [];
                dataLoaded = true;
                updateGoButton();
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }

        function updateGoButton() {
            const goBtn = document.getElementById('surprise-go');
            goBtn.disabled = !dataLoaded;
            document.getElementById('no-results').classList.remove('visible');
        }

        // ==================== GENRE MATCHING ====================
        function artistMatchesGenre(artist, genreFilter) {
            if (genreFilter === 'all') return true;
            const config = genreConfig[genreFilter];
            if (!config) return true;

            const artistGenres = artist.genre.toLowerCase();

            // Exclude if genre has exclusion keywords (e.g., exclude поп from alt)
            for (const ex of config.excludeIfContains) {
                if (artistGenres.includes(ex)) return false;
            }

            return config.genres.some(g => artistGenres.includes(g.toLowerCase()));
        }

        // ==================== ERA MATCHING ====================
        function buildArtistEraMap() {
            // Build a map: artist name -> most recent release year
            const eraMap = {};
            for (const release of releasesData) {
                const name = release.bandName;
                const year = parseInt(release.releaseDate, 10);
                if (!isNaN(year)) {
                    if (!eraMap[name] || year > eraMap[name]) {
                        eraMap[name] = year;
                    }
                }
            }
            return eraMap;
        }

        function artistMatchesEra(artist, eraFilter, eraMap) {
            if (eraFilter === 'any') return true;

            const currentYear = new Date().getFullYear();
            const cutoffYear = currentYear - 10;
            const latestYear = eraMap[artist.name];

            if (latestYear === undefined) {
                // No release data available — include in "any" only
                return false;
            }

            if (eraFilter === 'new') return latestYear >= cutoffYear;
            if (eraFilter === 'old') return latestYear < cutoffYear;
            return true;
        }

        // ==================== ACTIVITY STATUS ====================
        function getArtistActivity(artistName, eraMap) {
            const now = new Date();
            // Check recent event (past year)
            const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            const oneYearAgoStr = oneYearAgo.toISOString().slice(0, 10);
            const lower = artistName.toLowerCase();
            const hasRecentEvent = eventsData.some(e =>
                e.date >= oneYearAgoStr &&
                (e.artists || []).some(a => a.toLowerCase() === lower)
            );
            if (hasRecentEvent) return 'active';

            // Check release dates
            const latestYear = eraMap[artistName];
            if (!latestYear) return 'unknown';

            const diffYears = (now - new Date(latestYear, 0, 1)) / (365.25 * 24 * 60 * 60 * 1000);
            if (diffYears <= 2) return 'active';
            if (diffYears <= 3) return 'maybe';
            return 'inactive';
        }

        // ==================== GO! ====================
        const goBtn = document.getElementById('surprise-go');
        goBtn.addEventListener('click', () => {
            if (!dataLoaded) return;

            const eraMap = buildArtistEraMap();

            // Filter artists
            const candidates = bandsData.filter(artist => {
                if (!artistMatchesGenre(artist, selectedGenre)) return false;
                if (!artistMatchesEra(artist, selectedEra, eraMap)) return false;
                if (activeFilters.has('verified') && !artist.confirmed) return false;
                if (activeFilters.has('spotify') && !(artist.links && artist.links.spotify)) return false;
                if (activeFilters.has('active')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'active' && status !== 'maybe') return false;
                }
                if (activeFilters.has('inactive')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'inactive') return false;
                }
                return true;
            });

            const noResultsEl = document.getElementById('no-results');

            if (candidates.length === 0) {
                noResultsEl.classList.add('visible');
                return;
            }

            noResultsEl.classList.remove('visible');

            // Show loading state
            goBtn.classList.add('loading');
            goBtn.querySelector('i').className = 'fas fa-spinner';

            // Pick random artist and navigate
            const randomArtist = candidates[Math.floor(Math.random() * candidates.length)];
            const artistUrl = 'artist.html?name=' + encodeURIComponent(randomArtist.name);

            setTimeout(() => {
                window.location.href = artistUrl;
            }, 400);
        });

        // ==================== INIT ====================
        loadData();
    })();
    </script>
</body>
</html>
