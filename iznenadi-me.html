    <style>
        body.surprise-page {
            height: auto;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.surprise-page main {
            height: auto;
            overflow: visible;
        }

        .surprise-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .surprise-hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .surprise-hero .hero-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: block;
            color: var(--accent-blue);
        }

        .surprise-hero h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            color: var(--text-primary);
        }

        .surprise-hero p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        /* Step container */
        .surprise-step {
            margin-bottom: 2rem;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .surprise-step.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .step-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .step-label .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-primary);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .step-label .step-number.completed {
            background: #3dba6f;
        }

        /* Option grid */
        .option-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }
        .option-grid .filter-btn.preset-btn {
            min-width: 120px;
            width: 50%;
            justify-content: center;
            flex: 0 0 auto;
        }

        /* Filter buttons (same as charts.html preset-btn) */
        .surprise-page .filter-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.65rem;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .surprise-page .filter-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .surprise-page .filter-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }
        .surprise-page .filter-btn i { font-size: 0.65rem; }
        body.dark-mode .surprise-page .filter-btn {
            background: var(--bg-hover);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        body.dark-mode .surprise-page .filter-btn:hover {
            background: #2a2e36;
            color: var(--text-primary);
        }
        body.dark-mode .surprise-page .filter-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }
        .surprise-page .preset-btn {
            border-radius: 0;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 0.3rem 0.85rem;
            height: 32px;
            margin-left: -1px;
        }
        .surprise-page .preset-btn:first-child { margin-left: 0; }
        .surprise-page .preset-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            z-index: 1;
        }
        .surprise-page .preset-btn.active {
            border-color: #000;
            background: #000;
            color: #fff;
            z-index: 2;
        }
        body.dark-mode .surprise-page .preset-btn.active {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        /* Go button */
        .surprise-go-wrapper {
            text-align: center;
            margin-top: 2rem;
        }

        .surprise-go-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 2.2rem;
            border: none;
            border-radius: 12px;
            background: var(--accent-blue);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }

        .surprise-go-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(74, 127, 165, 0.35);
        }

        .surprise-go-btn:active {
            transform: scale(0.97);
        }

        .surprise-go-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .surprise-go-btn i {
            font-size: 1rem;
        }

        /* Loading spinner */
        .surprise-go-btn.loading i {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* No results message */
        .no-results-msg {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            display: none;
        }

        .no-results-msg.visible {
            display: block;
        }

        .no-results-msg i {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .surprise-container {
                padding: 1.25rem 1rem 2rem;
            }

            .surprise-hero h2 {
                font-size: 1.15rem;
            }

            .surprise-hero .hero-icon {
                font-size: 2rem;
            }

            .option-grid {
                flex-wrap: wrap;
            }
            .option-grid .filter-btn.preset-btn {
                min-width: 0;
                flex: 1 1 auto;
            }
            .surprise-page .preset-btn {
                padding: 0.3rem 0.65rem;
                font-size: 0.66rem;
            }

            .surprise-go-btn {
                font-size: 0.85rem;
                padding: 0.75rem 1.8rem;
            }
        }
    </style>
    <script>if(location.hostname==='localhost'||location.hostname==='127.0.0.1')document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||!h.startsWith('/'))return;if(h==='/'){e.preventDefault();location.href='/index.html';return;}var m;if(m=h.match(/^\/nastan\/(.+)/)){e.preventDefault();location.href='/nastan.html?id='+m[1];return;}if(m=h.match(/^\/kustos\/(.+)/)){e.preventDefault();location.href='/kustos.html?name='+m[1];return;}if(h.indexOf('.')===-1){e.preventDefault();var q=h.indexOf('?');location.href=(q>0?h.substring(0,q):h)+'.html'+(q>0?h.substring(q):'');}});</script>

<body class="compact surprise-page">
    <header id="site-header" data-active="/iznenadi-me" data-title="Изненади ме"></header>
    <script src="/load-header.js"></script>
    <main>
        <div class="surprise-container">
            <!-- Step 1: Genre -->
            <div class="surprise-step" id="step-genre">
                <div class="step-label">
                    <span class="step-number" id="step-num-1">1</span>
                    Жанр
                </div>
                <div class="option-grid">
                    <button class="filter-btn preset-btn active" data-genre="all">
                        <i class="fas fa-music"></i> Сите
                    </button>
                    <button class="filter-btn preset-btn" data-genre="alt">
                        <i class="fas fa-guitar"></i> Алтернативна
                    </button>
                    <button class="filter-btn preset-btn" data-genre="rap">
                        <i class="fas fa-microphone-lines"></i> Рап/Трап
                    </button>
                    <button class="filter-btn preset-btn" data-genre="electronic">
                        <i class="fas fa-headphones"></i> Електронска
                    </button>
                    <button class="filter-btn preset-btn" data-genre="jazz">
                        <i class="fas fa-saxophone"></i> Џез
                    </button>
                    <button class="filter-btn preset-btn" data-genre="metal">
                        <i class="fas fa-skull-crossbones"></i> Метал
                    </button>
                </div>
            </div>

            <!-- Step 2: Era -->
            <div class="surprise-step" id="step-era">
                <div class="step-label">
                    <span class="step-number" id="step-num-2">2</span>
                    Ера
                </div>
                <div class="option-grid">
                    <button class="filter-btn preset-btn active" data-era="any">
                        <i class="fas fa-infinity"></i> Било која
                    </button>
                    <button class="filter-btn preset-btn" data-era="new">
                        <i class="fas fa-bolt"></i> Нови (последни 10г.)
                    </button>
                    <button class="filter-btn preset-btn" data-era="old">
                        <i class="fas fa-record-vinyl"></i> Стари (10+ години)
                    </button>
                </div>
            </div>

            <!-- Step 3: Filters -->
            <div class="surprise-step" id="step-filters">
                <div class="step-label">
                    <span class="step-number" id="step-num-3">3</span>
                    Филтри (опционално)
                </div>
                <div class="option-grid">
                    <button class="filter-btn preset-btn" data-filter="verified">
                        <i class="fas fa-circle-check"></i> Потврдени
                    </button>
                    <button class="filter-btn preset-btn" data-filter="spotify">
                        <i class="fab fa-spotify"></i> Со Spotify
                    </button>
                    <button class="filter-btn preset-btn" data-filter="active">
                        <i class="fas fa-bolt"></i> Активни
                    </button>
                    <button class="filter-btn preset-btn" data-filter="inactive">
                        <i class="fas fa-moon"></i> Неактивни
                    </button>
                </div>
            </div>

            <!-- Go button -->
            <div class="surprise-go-wrapper">
                <button class="btn-generic" style="font-size: 2.5em; margin-top: 60px; padding: 0.75em 2em;" id="surprise-go" disabled>
                    <i class="fas fa-shuffle"></i> Изненади ме!
                </button>
            </div>

            <div class="no-results-msg" id="no-results">
                <i class="fas fa-face-sad-tear"></i>
                Нема артисти со избраните критериуми. Пробај друга комбинација.
            </div>
        </div>
    </main>

    <script>
        // Settings menu + nav menu from common.js
        initSettingsMenu();
        initNavMenu();

    (function() {

        // ==================== GENRE CONFIG (same as chart page) ====================
        const genreConfig = {
            'alt': {
                genres: ['Алтернативен', 'Инди', 'Пост-панк', 'Панк', 'Шугејз', 'Дрим Поп', 'Пост-рок',
                         'Гранџ', 'Експериментален', 'Мат Рок', 'Арт Рок', 'Алтернативен Рок', 'Инди Рок', 'Пост-Панк'],
                excludeIfContains: ['поп', 'метал', 'хардкор', 'трешкор', 'металкор', 'џез']
            },
            'rap': {
                genres: ['Рап', 'Трап', 'Хип Хоп', 'Бум Бап'],
                excludeIfContains: []
            },
            'electronic': {
                genres: ['Електронска', 'Техно', 'Хаус', 'Транс', 'Синтвејв', 'Синт-Поп',
                         'EDM', 'ДНБ', 'Драм', 'Амбиентална', 'Вејпорвејв'],
                excludeIfContains: []
            },
            'jazz': {
                genres: ['Џез', 'Џез Фјужн', 'Џез Рок', 'Ацид Џез', 'Фјужн'],
                excludeIfContains: []
            },
            'metal': {
                genres: ['Метал', 'Хеви Метал', 'Треш Метал', 'Пауер Метал', 'Прогресивен Метал',
                         'Спид Метал', 'Металкор', 'Кросовер Треш', 'Дет Метал', 'Блек Метал',
                         'Стонер', 'Хардкор', 'Трешкор', 'Пост-Хардкор'],
                excludeIfContains: []
            }
        };

        // ==================== STATE ====================
        let selectedGenre = 'all';
        let selectedEra = 'any';
        let activeFilters = new Set();
        let bandsData = [];
        let releasesData = [];
        let eventsData = [];
        let dataLoaded = false;

        // ==================== OPTION BUTTON LOGIC ====================
        document.querySelectorAll('#step-genre .filter-btn.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#step-genre .filter-btn.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedGenre = btn.dataset.genre;
                updateGoButton();
            });
        });

        document.querySelectorAll('#step-era .filter-btn.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#step-era .filter-btn.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedEra = btn.dataset.era;
                updateGoButton();
            });
        });

        // Filter buttons (toggle, multi-select)
        document.querySelectorAll('#step-filters .filter-btn.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                if (activeFilters.has(filter)) {
                    activeFilters.delete(filter);
                    btn.classList.remove('active');
                } else {
                    activeFilters.add(filter);
                    btn.classList.add('active');
                }
                updateGoButton();
            });
        });

        // ==================== LOAD DATA ====================
        async function loadData() {
            try {
                const [bandsResp, siteMasterData] = await Promise.all([
                    fetch('bands.json').then(r => r.json()),
                    loadSiteMaster()
                ]);

                bandsData = bandsResp.muzickaMasterLista || [];
                releasesData = siteMasterData?.chartData?.releases || [];
                eventsData = siteMasterData?.events?.all || [];
                window._siteMasterActivity = siteMasterData?.artistActivity || {};
                dataLoaded = true;
                updateGoButton();
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }

        function updateGoButton() {
            const goBtn = document.getElementById('surprise-go');
            goBtn.disabled = !dataLoaded;
            document.getElementById('no-results').classList.remove('visible');
        }

        // ==================== GENRE MATCHING ====================
        function artistMatchesGenre(artist, genreFilter) {
            if (genreFilter === 'all') return true;
            const config = genreConfig[genreFilter];
            if (!config) return true;

            const artistGenres = artist.genre.toLowerCase();

            // Exclude if genre has exclusion keywords (e.g., exclude поп from alt)
            for (const ex of config.excludeIfContains) {
                if (artistGenres.includes(ex)) return false;
            }

            return config.genres.some(g => artistGenres.includes(g.toLowerCase()));
        }

        // ==================== ERA MATCHING ====================
        function buildArtistEraMap() {
            // Build a map: artist name -> most recent release year
            const eraMap = {};
            for (const release of releasesData) {
                const name = release.bandName;
                const year = parseInt(release.releaseDate, 10);
                if (!isNaN(year)) {
                    if (!eraMap[name] || year > eraMap[name]) {
                        eraMap[name] = year;
                    }
                }
            }
            return eraMap;
        }

        function artistMatchesEra(artist, eraFilter, eraMap) {
            if (eraFilter === 'any') return true;

            const currentYear = new Date().getFullYear();
            const cutoffYear = currentYear - 10;
            const latestYear = eraMap[artist.name];

            if (latestYear === undefined) {
                // No release data available — include in "any" only
                return false;
            }

            if (eraFilter === 'new') return latestYear >= cutoffYear;
            if (eraFilter === 'old') return latestYear < cutoffYear;
            return true;
        }

        // ==================== ACTIVITY STATUS ====================
        function getArtistActivity(artistName, eraMap) {
            // Try pre-computed activity from site-master
            const slug = generateSlug ? generateSlug(artistName) : artistName.toLowerCase().replace(/\s+/g, '-');
            const precomputed = window._siteMasterActivity?.[slug];
            if (precomputed) {
                const map = { 'Активен': 'active', 'Неактивен': 'inactive', 'Можеби': 'maybe', 'Непознато': 'unknown' };
                return map[precomputed] || precomputed;
            }
            
            // Fallback
            const now = new Date();
            const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
            const oneYearAgoStr = oneYearAgo.toISOString().slice(0, 10);
            const lower = artistName.toLowerCase();
            const hasRecentEvent = eventsData.some(e =>
                e.date >= oneYearAgoStr &&
                (e.artists || []).some(a => a.toLowerCase() === lower)
            );
            if (hasRecentEvent) return 'active';

            const latestYear = eraMap[artistName];
            if (!latestYear) return 'unknown';

            const diffYears = (now - new Date(latestYear, 0, 1)) / (365.25 * 24 * 60 * 60 * 1000);
            if (diffYears <= 2) return 'active';
            if (diffYears <= 3) return 'maybe';
            return 'inactive';
        }

        // ==================== GO! ====================
        const goBtn = document.getElementById('surprise-go');
        goBtn.addEventListener('click', () => {
            if (!dataLoaded) return;

            const eraMap = buildArtistEraMap();

            // Filter artists
            const candidates = bandsData.filter(artist => {
                if (!artistMatchesGenre(artist, selectedGenre)) return false;
                if (!artistMatchesEra(artist, selectedEra, eraMap)) return false;
                if (activeFilters.has('verified') && !artist.confirmed) return false;
                if (activeFilters.has('spotify') && !(artist.links && artist.links.spotify)) return false;
                if (activeFilters.has('active')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'active' && status !== 'maybe') return false;
                }
                if (activeFilters.has('inactive')) {
                    const status = getArtistActivity(artist.name, eraMap);
                    if (status !== 'inactive') return false;
                }
                return true;
            });

            const noResultsEl = document.getElementById('no-results');

            if (candidates.length === 0) {
                noResultsEl.classList.add('visible');
                return;
            }

            noResultsEl.classList.remove('visible');

            // Show loading state
            goBtn.classList.add('loading');
            goBtn.querySelector('i').className = 'fas fa-spinner';

            // Pick random artist and navigate
            const randomArtist = candidates[Math.floor(Math.random() * candidates.length)];
            const artistUrl = 'artist.html?name=' + encodeURIComponent(randomArtist.name);

            setTimeout(() => {
                window.location.href = artistUrl;
            }, 400);
        });

        // ==================== INIT ====================
        loadData();
    })();
    </script>
</body>
