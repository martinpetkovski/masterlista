		initSettingsMenu();
		initNavMenu();

		(function setupSearchToggle() {
			var btn = document.getElementById('search-toggle-btn');
			var controls = document.getElementById('controls-bar');
			var icon = btn ? btn.querySelector('i') : null;

			if (!btn || !controls) return;

			btn.addEventListener('click', function() {
				var isVisible = controls.classList.toggle('visible');
				if (icon) icon.className = 'fas ' + (isVisible ? 'fa-times' : 'fa-search');
				if (isVisible) {
					setTimeout(function() { searchInput.focus(); }, 50);
				} else if (searchInput && searchInput.value) {
					searchInput.value = '';
					searchQuery = '';
					visibleCount = 36;
					applyFilters();
				}
			});

			if (window.innerWidth > 600) {
				controls.classList.add('visible');
			}
		})();

		function esc(str) {
			return escHtml(String(str || ''));
		}

		function escAttr(str) {
			return esc(str).replace(/'/g, '&#39;');
		}

		function normalizeInterview(item) {
			var artistList = Array.isArray(item.matchedArtists) ? item.matchedArtists.filter(Boolean) : [];
			return {
				title: item.title || '',
				link: item.link || '#',
				description: item.description || '',
				date: item.date || '',
				source: item.source || t('news.unknownSource'),
				iconUrl: item.iconUrl || '',
				thumbnail: item.thumbnail || '',
				videoId: item.videoId || '',
				matchedArtists: artistList
			};
		}

		function normalizeDateOnly(raw) {
			if (!raw) return '';
			return String(raw).slice(0, 10);
		}

		function parseDate(item) {
			var dateOnly = normalizeDateOnly(item.date);
			if (!dateOnly) return 0;
			return new Date(dateOnly + 'T00:00:00').getTime() || 0;
		}

		function formatDateLabel(dateStr) {
			var dateOnly = normalizeDateOnly(dateStr);
			if (!dateOnly) return '';
			return formatDate(dateOnly);
		}

		function getYouTubeVideoId(item) {
			if (item.videoId) return String(item.videoId);

			var link = item.link || '';
			try {
				var url = new URL(link, window.location.href);
				var host = (url.hostname || '').toLowerCase();
				if (host.indexOf('youtu.be') !== -1) {
					return url.pathname.replace(/^\/+/, '').split('/')[0] || '';
				}
				var directId = url.searchParams.get('v');
				if (directId) return directId;
				var pathMatch = url.pathname.match(/\/(?:embed|shorts)\/([^/?#]+)/i);
				if (pathMatch) return pathMatch[1];
			} catch (e) {
				// Ignore malformed URLs and fall back to regex parsing below.
			}

			var queryMatch = link.match(/[?&]v=([^&#]+)/i);
			if (queryMatch) return queryMatch[1];

			var shortMatch = link.match(/youtu\.be\/([^?&#/]+)/i);
			if (shortMatch) return shortMatch[1];

			return '';
		}

		function artistLink(name) {
			return getArtistPageUrl(name);
		}

		function getArtistBandInfo(name) {
			if (!name || !bandsData || !bandsData.length) return null;
			var lower = String(name).toLowerCase();
			for (var i = 0; i < bandsData.length; i++) {
				if (bandsData[i].name && bandsData[i].name.toLowerCase() === lower) return bandsData[i];
			}
			return null;
		}

		function getArtistAvatarInitials(name) {
			var trimmed = String(name || '').trim();
			if (!trimmed) return '?';
			var words = trimmed.split(/[\s\-&,]+/).filter(function(word) { return word.length > 0; });
			if (words.length >= 2) {
				return (words[0].charAt(0) + words[1].charAt(0)).toUpperCase();
			}
			return trimmed.substring(0, 2).toUpperCase();
		}

		function getArtistAvatarGradient(name) {
			var palette = [
				['#e74c3c', '#c0392b'], ['#e67e22', '#d35400'], ['#f1c40f', '#e6a700'],
				['#2ecc71', '#27ae60'], ['#1abc9c', '#16a085'], ['#3498db', '#2980b9'],
				['#9b59b6', '#8e44ad'], ['#e84393', '#d63384'], ['#fd79a8', '#e17055'],
				['#00cec9', '#0984e3'], ['#6c5ce7', '#a29bfe'], ['#fdcb6e', '#e17055']
			];
			var hash = 0;
			var artistName = String(name || '');
			for (var i = 0; i < artistName.length; i++) {
				hash = ((hash << 5) - hash + artistName.charCodeAt(i)) | 0;
			}
			var paletteIndex = ((hash % palette.length) + palette.length) % palette.length;
			var colors = palette[paletteIndex];
			return 'background:linear-gradient(145deg,' + colors[0] + ',' + colors[1] + ')';
		}

		function buildArtistChip(name) {
			var band = getArtistBandInfo(name);
			var artistName = band && band.name ? band.name : name;
			var artistLabel = esc(localizeText(artistName));
			var avatarHtml = band && band.image
				? '<img class="artist-chip-avatar" src="' + escAttr(band.image) + '" alt="' + artistLabel + '" loading="lazy" onerror="this.onerror=null;this.src=ARTIST_FALLBACK_IMG">'
				: '<span class="artist-chip-avatar-placeholder" style="' + getArtistAvatarGradient(artistName) + '">' + esc(getArtistAvatarInitials(artistName)) + '</span>';
			return '<a href="' + escAttr(artistLink(artistName)) + '" class="artist-chip" title="' + escAttr(localizeText(artistName)) + '">' + avatarHtml + '<span class="artist-chip-name">' + artistLabel + '</span></a>';
		}

		function updateHeaderStats() {
			var sourceSet = new Set();
			for (var i = 0; i < allInterviews.length; i++) {
				if (allInterviews[i].source) sourceSet.add(allInterviews[i].source);
			}
			document.getElementById('stat-videos').textContent = allInterviews.length;
			document.getElementById('stat-channels').textContent = sourceSet.size;
			document.getElementById('stat-updated').textContent = lastUpdated ? (t('interviews.updated') + ' ' + formatDateLabel(lastUpdated)) : t('interviews.updated') + ' —';
		}

		function applyFilters() {
			var q = searchQuery.toLowerCase().trim();
			filteredInterviews = allInterviews.filter(function(item) {
				if (sourceFilter !== 'all' && item.source !== sourceFilter) return false;

				if (genreFilter !== 'all' && item.matchedArtists && item.matchedArtists.length) {
					var anyMatch = item.matchedArtists.some(function(name) {
						return artistMatchesGenre(name, genreFilter, bandsData);
					});
					if (!anyMatch) return false;
				} else if (genreFilter !== 'all' && (!item.matchedArtists || !item.matchedArtists.length)) {
					return false;
				}

				if (!q) return true;

				var artists = (item.matchedArtists || []).join(' ').toLowerCase();
				var hay = (item.title + ' ' + item.description + ' ' + item.source + ' ' + artists).toLowerCase();
				return hay.indexOf(q) !== -1;
			});

			filteredInterviews.sort(function(a, b) {
				if (sortFilter === 'date_asc') return parseDate(a) - parseDate(b);
				if (sortFilter === 'source_asc') return a.source.localeCompare(b.source, 'mk');
				if (sortFilter === 'title_asc') return a.title.localeCompare(b.title, 'mk');
				return parseDate(b) - parseDate(a);
			});

			renderInterviews();
		}

		function renderInterviews() {
			var activeFilters = 0;
			if (genreFilter !== 'all') activeFilters++;
			if (searchQuery.trim()) activeFilters++;
			var badge = document.getElementById('filter-count');
			if (badge) {
				badge.textContent = activeFilters;
				badge.classList.toggle('visible', activeFilters > 0);
			}

			if (!filteredInterviews.length) {
				interviewsContainer.innerHTML = '<li class="news-empty-wrap"><div class="news-empty"><i class="fas fa-microphone-lines" style="font-size:1.3rem;display:block;margin-bottom:0.5rem"></i>' + t('interviews.noInterviews') + '</div></li>';
				loadMoreWrap.style.display = 'none';
				return;
			}

			var shown = filteredInterviews.slice(0, visibleCount);
			var html = '';

			shown.forEach(function(item) {
				var videoId = getYouTubeVideoId(item);
				var videoHtml = videoId
					? '<iframe class="news-thumb interview-embed" src="https://www.youtube-nocookie.com/embed/' + escAttr(videoId) + '?rel=0" title="' + escAttr(item.title) + '" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>'
					: '<a href="' + escAttr(item.link) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div class="news-thumb news-thumb-placeholder"><i class="fas fa-microphone-lines"></i><span>YouTube</span></div></a>';
				var iconHtml = item.iconUrl ? '<img src="' + escAttr(item.iconUrl) + '" alt="">' : '';
				var descHtml = item.description ? '<div class="news-desc">' + esc(item.description.length > 120 ? item.description.substring(0, 120) + '...' : item.description) + '</div>' : '';
				var artistsHtml = '';

				if (item.matchedArtists && item.matchedArtists.length) {
					artistsHtml = '<div class="news-artists">' + item.matchedArtists.slice(0, 6).map(function(name) {
						return buildArtistChip(name);
					}).join('') + '</div>';
				} else {
					artistsHtml = '<div class="news-artists"><span class="artist-empty">' + t('news.noArtists') + '</span></div>';
				}

				html += '<li class="news-item">' +
					videoHtml +
					'<div class="news-info">' +
						'<div class="news-title"><a href="' + escAttr(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a></div>' +
						descHtml +
						'<div class="news-source">' + iconHtml + esc(item.source) + ' &bull; ' + esc(formatDateLabel(item.date)) + '</div>' +
						artistsHtml +
					'</div>' +
				'</li>';
			});

			interviewsContainer.innerHTML = html;
			loadMoreWrap.style.display = (visibleCount < filteredInterviews.length) ? '' : 'none';
		}

		async function loadInterviewData() {
			loadingBar.classList.add('active');
			try {
				try {
					var bandsResp = await fetch('bands.json');
					if (bandsResp.ok) {
						var bandsJson = await bandsResp.json();
						bandsData = bandsJson.muzickaMasterLista || bandsJson || [];
						registerArtistNames(bandsData);
					}
				} catch (e) { console.warn('Could not load bands.json for genre filter:', e); }

				var fromMaster = null;
				var master = await loadSiteMaster();
				if (master && master.interviews) {
					fromMaster = master.interviews;
				}

				if (fromMaster && Array.isArray(fromMaster.matched)) {
					allInterviews = fromMaster.matched.map(normalizeInterview);
					lastUpdated = fromMaster.lastUpdated || '';
				} else {
					var resp = await fetch('interviews.json');
					if (!resp.ok) throw new Error(t('interviews.fetchError'));
					var raw = await resp.json();
					allInterviews = (raw.interviews || []).map(normalizeInterview);
					lastUpdated = raw.lastUpdated || '';
				}

				allInterviews.sort(function(a, b) { return parseDate(b) - parseDate(a); });
				updateHeaderStats();
				applyFilters();
			} catch (err) {
				console.error('Interviews load error:', err);
				interviewsContainer.innerHTML = '<li class="news-empty-wrap"><div class="news-empty"><i class="fas fa-triangle-exclamation" style="font-size:1.1rem;display:block;margin-bottom:0.4rem"></i>' + t('interviews.loadError') + '</div></li>';
			} finally {
				loadingBar.classList.remove('active');
			}
		}

		searchInput.addEventListener('input', function() {
			searchQuery = this.value || '';
			visibleCount = 36;
			applyFilters();
		});

		document.querySelectorAll('.filter-btn.preset-btn').forEach(function(btn) {
			btn.addEventListener('click', function() {
				document.querySelectorAll('.filter-btn.preset-btn').forEach(function(b) { b.classList.remove('active'); });
				btn.classList.add('active');
				genreFilter = btn.getAttribute('data-genre');
				visibleCount = 36;
				applyFilters();
			});
		});

		loadMoreBtn.addEventListener('click', function() {
			visibleCount += 36;
			renderInterviews();
		});

		loadInterviewData();
	})();
	</script>
</body>
</html>
