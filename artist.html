                        : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
                        : '';
                    
                    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordingChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        if (recordingChunks.length > 0) {
                            const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                            const ext = (mediaRecorder.mimeType || '').includes('mp4') ? 'm4a' : 'webm';
                            setGreetingBlob(blob, ext);
                        }
                    };

                    mediaRecorder.start(100);
                    recordBtn.classList.add('recording');
                    recordBtn.innerHTML = '<i class="fas fa-stop"></i> ' + t('artist.stop');
                    timerEl.style.display = 'block';
                    recordingSeconds = 0;
                    timerEl.textContent = formatTime(0);

                    recordingTimer = setInterval(() => {
                        recordingSeconds++;
                        timerEl.textContent = formatTime(recordingSeconds);
                        if (recordingSeconds >= 60) {
                            stopRecording();
                        }
                    }, 1000);

                } catch (err) {
                    console.error('Microphone access denied:', err);
                    alert(t('artist.micDenied'));
                }
            });

            // ---- Submit ----
            submitBtn.addEventListener('click', async () => {
                if (!currentArtist || !currentBandsData) return;

                const c1 = color1Input.value;
                const c2 = color2Input.value;
                if (!c1 || !c2) {
                    alert(t('artist.chooseTwoColors'));
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('artist.submitting');

                try {
                    // Build updated bands data
                    const updatedBands = JSON.parse(JSON.stringify({ muzickaMasterLista: currentBandsData }));
                    const bandEntry = updatedBands.muzickaMasterLista.find(b => b.name === currentArtist.name);
                    if (!bandEntry) throw new Error(t('artist.notInList'));

                    bandEntry.confirmed = true;
                    bandEntry.accentColors = [c1, c2];

                    const bandsJsonStr = JSON.stringify(updatedBands, null, 2);

                    // Prepare original (current server version) for 3-way merge
                    const origResp = await fetch('bands.json?v=' + Date.now());
                    const origData = await origResp.json();
                    const originalJsonStr = JSON.stringify(origData, null, 2);

                    // Prepare additional files (greeting audio)
                    const additionalFiles = [];
                    if (greetingBlob) {
                        const slug = generateSlug(currentArtist.name);
                        const ext = greetingFilename || 'webm';
                        const greetingPath = `greetings/${slug}.${ext}`;

                        // Convert blob to base64
                        const arrayBuffer = await greetingBlob.arrayBuffer();
                        const bytes = new Uint8Array(arrayBuffer);
                        let binary = '';
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        const base64 = btoa(binary);

                        additionalFiles.push({
                            path: greetingPath,
                            contentBase64: base64
                        });
                    }

                    // Submit directly to PR worker
                    const endpoint = localStorage.getItem('mmm_pr_endpoint') || 'https://muzichka-master-lista.deeeeelay.workers.dev';
                    const resp = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            bandsJson: bandsJsonStr,
                            originalJson: originalJsonStr,
                            contributor: currentArtist.name,
                            description: `Верификација на артист: ${currentArtist.name}\n\nПотврдено со акцент бои: ${c1}, ${c2}${greetingBlob ? '\nВклучена звучна порака за фановите.' : ''}`,
                            path: 'bands.json',
                            additionalFiles: additionalFiles
                        })
                    });

                    if (!resp.ok) {
                        const text = await resp.text();
                        throw new Error(`Грешка од серверот (${resp.status}): ${text}`);
                    }

                    const result = await resp.json();

                    // Show success
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> ' + t('artist.success');
                    submitBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';

                    setTimeout(() => {
                        closeModal();
                        // Show a toast notification
                        const toast = document.createElement('div');
                        toast.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-size:0.85rem;font-weight:600;z-index:10001;box-shadow:0 4px 20px rgba(34,197,94,0.4);display:flex;align-items:center;gap:0.5rem;animation:verifyModalIn 0.3s ease;';
                        toast.innerHTML = '<i class="fas fa-check-circle"></i> ' + t('artist.verifySuccess');
                        document.body.appendChild(toast);
                        setTimeout(() => {
                            toast.style.transition = 'opacity 0.3s';
                            toast.style.opacity = '0';
                            setTimeout(() => toast.remove(), 300);
                        }, 4000);
                    }, 1200);

                } catch (err) {
                    console.error('Verify submit failed:', err);
                    alert(t('artist.submitError') + (err.message || err));
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + t('artist.submitForApproval');
                    submitBtn.style.background = '';
                }
            });

            // Wire up the verify button (after init renders the page)
            // Use event delegation since the button is rendered dynamically
            document.addEventListener('click', (e) => {
                const verifyBtn = e.target.closest('#verify-artist-btn');
                if (!verifyBtn) return;
                // Find the artist from the page context
                (async () => {
                    try {
                        const resp = await fetch('bands.json?v=' + Date.now());
                        const data = await resp.json();
                        const bandsData = data.muzickaMasterLista;
                        registerArtistNames(bandsData);
                        // Try query param first, then pathname slug (URL may have been cleaned)
                        const urlParams = new URLSearchParams(window.location.search);
                        let artistParam = urlParams.get('a') || urlParams.get('artist') || urlParams.get('name');
                        if (!artistParam) {
                            // Extract slug from clean URL pathname (e.g. /artist-slug)
                            const pathSlug = decodeURIComponent(window.location.pathname.replace(/^\//, '').replace(/\/$/, ''));
                            if (pathSlug) artistParam = pathSlug;
                        }
                        if (!artistParam) return;
                        const artist = findArtist(bandsData, decodeURIComponent(artistParam));
                        if (!artist) return;
                        openModal(artist, bandsData);
                    } catch (err) {
                        console.error('Failed to load data for verify modal:', err);
                    }
                })();
            });
        })();

        // ==================== ADD RELEASE ====================
        (function () {
            var _releasesData = null;
            var _originalData = null;

            function _esc(s) {
                if (!s) return '';
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function _toast(msg, type) {
                var c = document.getElementById('mmm-notifications');
                if (!c) { c = document.createElement('div'); c.id = 'mmm-notifications'; c.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:10001;max-width:340px;'; document.body.appendChild(c); }
                var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
                var el = document.createElement('div'); el.className = 'notification ' + (type || 'info');
                el.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + msg;
                c.appendChild(el);
                setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }, 4000);
            }

            function _getArtistName() {
                var params = new URLSearchParams(window.location.search);
                var p = params.get('a') || params.get('artist') || params.get('name');
                if (p) return decodeURIComponent(p);
                var slug = decodeURIComponent(window.location.pathname.replace(/^\//, '').replace(/\/$/, ''));
                return slug || null;
            }

            function _resolveArtistFromBands(nameParam) {
                var bd = window.bandsData || [];
                var lower = nameParam.toLowerCase().trim();
                for (var i = 0; i < bd.length; i++) {
                    if (bd[i].name && bd[i].name.toLowerCase().trim() === lower) return bd[i];
                }
                // Also try matching slug-style names (spaces → dashes etc.)
                var slug = lower.replace(/[\s]+/g, '-');
                for (var i = 0; i < bd.length; i++) {
                    if (bd[i].name && bd[i].name.toLowerCase().trim().replace(/[\s]+/g, '-') === slug) return bd[i];
                }
                return null;
            }

            async function _loadReleases() {
                if (_releasesData) return _releasesData;
                var draft = window.MMMDrafts ? MMMDrafts.load('releases.json') : null;
                var resp = await fetch('/releases.json?_=' + Date.now());
                var data = await resp.json();
                _originalData = JSON.parse(JSON.stringify(data));
                _releasesData = draft || data;
                return _releasesData;
            }

            function _showAddReleaseForm() {
                var nameParam = _getArtistName();
                if (!nameParam) return;
                var band = _resolveArtistFromBands(nameParam);
                var artistName = band ? band.name : nameParam;

                var overlay = document.createElement('div');
                overlay.className = 'add-release-overlay';
                overlay.innerHTML =
                    '<div class="add-release-dialog">' +
                        '<h3><i class="fas fa-plus-circle"></i> Ново издание за ' + _esc(artistName) + '</h3>' +
                        '<label>Наслов на издание *</label>' +
                        '<input type="text" id="ar-title" placeholder="Име на песна / албум...">' +
                        '<label>Тип</label>' +
                        '<select id="ar-type"><option value="single">Сингл</option><option value="album">Албум</option></select>' +
                        '<label>Датум на издавање</label>' +
                        '<input type="date" id="ar-date" value="' + new Date().toISOString().slice(0, 10) + '">' +
                        '<label>Spotify линк (по избор)</label>' +
                        '<input type="text" id="ar-spotify" placeholder="https://open.spotify.com/album/...">' +
                        '<label>YouTube линк (по избор)</label>' +
                        '<input type="text" id="ar-youtube" placeholder="https://youtube.com/watch?v=...">' +
                        '<div class="add-release-actions">' +
                            '<button class="add-release-cancel">Откажи</button>' +
                            '<button class="add-release-save" id="ar-save"><i class="fas fa-check"></i> Додај</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(overlay);

                overlay.querySelector('.add-release-cancel').addEventListener('click', function () {
                    overlay.remove();
                });
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) overlay.remove();
                });

                var titleInput = overlay.querySelector('#ar-title');
                titleInput.focus();
                titleInput.addEventListener('input', function () {
                    overlay.querySelector('#ar-save').disabled = !titleInput.value.trim();
                });
                overlay.querySelector('#ar-save').disabled = true;

                overlay.querySelector('#ar-save').addEventListener('click', async function () {
                    var title = titleInput.value.trim();
                    if (!title) return;
                    var type = overlay.querySelector('#ar-type').value;
                    var date = overlay.querySelector('#ar-date').value || new Date().toISOString().slice(0, 10);
                    var spotifyUrl = overlay.querySelector('#ar-spotify').value.trim();
                    var youtubeUrl = overlay.querySelector('#ar-youtube').value.trim();

                    try {
                        var data = await _loadReleases();
                        var releaseId = 'manual-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
                        var newRelease = {
                            bandName: artistName,
                            artistId: band ? (band.spotifyId || '') : '',
                            releaseId: releaseId,
                            releaseTitle: title,
                            releaseType: type,
                            releaseDate: date,
                            releaseUrl: spotifyUrl || '',
                            thumbnail: '',
                            totalTracks: type === 'album' ? 0 : 1,
                            trackNames: [title],
                            spotifyUrl: band ? (band.links && band.links.spotify || '') : ''
                        };

                        // Add youtube track if provided
                        if (youtubeUrl) {
                            var videoId = null;
                            var m = youtubeUrl.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
                            if (m) videoId = m[1];
                            if (!videoId) { m = youtubeUrl.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/); if (m) videoId = m[1]; }
                            if (videoId) {
                                newRelease.youtubeTracks = [{
                                    name: title,
                                    videoId: videoId,
                                    url: 'https://www.youtube.com/watch?v=' + videoId,
                                    verified: true
                                }];
                            }
                        }

                        data.releases.unshift(newRelease);
                        data.totalReleases = data.releases.length;

                        if (window.MMMDrafts) {
                            MMMDrafts.save('releases.json', data, _originalData);
                        }

                        overlay.remove();
                        _toast('Изданието "' + _esc(title) + '" е додадено', 'success');
                    } catch (err) {
                        console.error('Failed to add release:', err);
                        _toast('Грешка: ' + err.message, 'error');
                    }
                });
            }
        })();
    </script>
</body>
