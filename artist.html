        // Build artistHistory from pre-computed site-master.json data
        // Returns the same format as the old loadChartHistory() for compatibility with renderers
        function buildArtistHistoryFromSiteMaster(artistName, siteMaster, artistSpotifyName) {
            const artistHistory = {
                releases: new Map(),
                weeklyPopularity: new Map(),
                totalWeeksOnChart: 0,
                peakPopularity: 0,
                followers: 0
            };
            
            const artistNameLower = artistName.toLowerCase().trim();
            
            // 1. Build weeklyPopularity from artistPopularityGraphs
            const graphData = siteMaster.artistPopularityGraphs?.[artistNameLower] || [];
            graphData.forEach(entry => {
                artistHistory.weeklyPopularity.set(entry.weekId, {
                    week: entry.weekId,
                    popularity: entry.value || 0,
                    date: null,
                    newReleases: entry.newReleaseTitles || (entry.hasNewRelease ? [''] : [])
                });
            });
            
            // 2. Build per-release data from chartData.releases + releaseSparklines
            const releases = siteMaster.chartData?.releases || [];
            releases.forEach(r => {
                // Include releases where this artist appears anywhere in the credits
                if (!r.bandName) return;
                const allArtists = r.bandName.split(',').map(a => a.trim().toLowerCase()).filter(a => a);
                if (!allArtists.includes(artistNameLower)) return;
                const rid = r.releaseId;
                if (artistHistory.releases.has(rid)) return;
                
                // Determine if this is a guest/feature appearance using per-track artist data
                let isCollabAppearance = false;
                if (r.trackArtists && r.trackArtists.length > 1) {
                    // Check if this artist appears on all tracks (case-insensitive + spotifyName)
                    const spotifyLower = artistSpotifyName ? artistSpotifyName.toLowerCase() : '';
                    const appearsOnCount = r.trackArtists.filter(artists =>
                        artists && artists.some(a => {
                            const al = a.toLowerCase();
                            return al === artistNameLower || (spotifyLower && al === spotifyLower);
                        })
                    ).length;
                    isCollabAppearance = appearsOnCount < r.trackArtists.length;
                } else if (allArtists.length > 1) {
                    // Fallback for single-track releases or missing trackArtists: use bandName position
                    isCollabAppearance = allArtists[0] !== artistNameLower;
                }
                
                // Get sparkline data for this release
                const sparkline = siteMaster.releaseSparklines?.[rid] || [];
                const chartWeeks = sparkline.map(s => ({
                    week: s.weekId,
                    youtubeViews: s.youtubeViews || 0,
                    date: null
                }));
                
                artistHistory.releases.set(rid, {
                    ...r,
                    chartWeeks,
                    firstSeenWeek: chartWeeks.length > 0 ? chartWeeks[0].week : '',
                    _isCollabAppearance: isCollabAppearance
                });
                
                // Update followers
                if (r.followers) artistHistory.followers = r.followers;
                
                // Update peak
                const maxPop = Math.max(...chartWeeks.map(w => w.youtubeViews), r.youtubeViews || 0);
                if (maxPop > artistHistory.peakPopularity) artistHistory.peakPopularity = maxPop;
                
                artistHistory.totalWeeksOnChart += chartWeeks.length;
            });
            
            // 3. Reconstruct new release titles from chartData.releases dates
            // For each week with hasNewRelease, find releases whose releaseDate falls in that ISO week
            graphData.forEach(entry => {
                if (!entry.hasNewRelease) return;
                const weekEntry = artistHistory.weeklyPopularity.get(entry.weekId);
                if (!weekEntry) return;
                // Parse ISO week to date range
                const match = entry.weekId.match(/(\d{4})-W(\d{2})/);
                if (!match) return;
                const year = parseInt(match[1]);
                const week = parseInt(match[2]);
                const jan4 = new Date(year, 0, 4);
                const dayOfWeek = jan4.getDay() || 7;
                const weekMonday = new Date(jan4);
                weekMonday.setDate(jan4.getDate() + (week - 1) * 7 - dayOfWeek + 1);
                const weekSunday = new Date(weekMonday);
                weekSunday.setDate(weekMonday.getDate() + 6);
                const mondayStr = weekMonday.toISOString().slice(0, 10);
                const sundayStr = weekSunday.toISOString().slice(0, 10);
                
                const titles = [];
                artistHistory.releases.forEach(rel => {
                    if (rel.releaseDate >= mondayStr && rel.releaseDate <= sundayStr) {
                        titles.push(rel.releaseTitle);
                    }
                });
                if (titles.length > 0) weekEntry.newReleases = titles;
            });
            
            return artistHistory;
        }
        
        // Render popularity graph
        function renderPopularityGraph(artistHistory, siteMaster, artistName) {
            const container = document.getElementById('popularity-graph-container');
            if (!container) return;
            
            // Convert weekly popularity to sorted array
            const weeklyDataRaw = Array.from(artistHistory.weeklyPopularity.values())
                .sort((a, b) => a.week.localeCompare(b.week));
            
            if (weeklyDataRaw.length === 0) {
                console.warn('[popularity] No weekly data for artist, skipping chart');
                container.innerHTML = '';
                return;
            }

            // Compute delta views per week (how many views gained each week)
            const weeklyData = weeklyDataRaw.map((d, i) => {
                const prevPop = i > 0 ? weeklyDataRaw[i - 1].popularity : d.popularity;
                const delta = d.popularity - prevPop;
                return {
                    week: d.week,
                    popularity: Math.max(0, delta),
                    date: d.date,
                    newReleases: d.newReleases || []
                };
            });

            // Estimate end-of-week projection: take the current week's actual delta
            // (last data point) and project forward to next Monday using average daily rate.
            let estimatedPoint = null;
            if (weeklyData.length >= 2) {
                // Average daily views from completed weeks (skip first which is always 0)
                const completed = weeklyData.slice(1);
                const avgDaily = completed.length > 0
                    ? completed.reduce((s, d) => s + d.popularity, 0) / completed.length / 7
                    : 0;
                if (avgDaily > 0) {
                    const lastEntry = weeklyData[weeklyData.length - 1];
                    const lastWeekId = lastEntry.week;
                    const lastMonday = isoWeekToMonday(lastWeekId);
                    const now = new Date();
                    // Days remaining until next Monday (next chart drop)
                    const nextMonday = new Date(lastMonday);
                    nextMonday.setDate(lastMonday.getDate() + 7);
                    const daysRemaining = Math.max(0, (nextMonday - now) / 86400000);
                    if (daysRemaining > 0 && daysRemaining < 7) {
                        // Project: current actual value + average growth for remaining days
                        const projected = Math.round(lastEntry.popularity + avgDaily * daysRemaining);
                        if (projected > lastEntry.popularity) {
                            estimatedPoint = {
                                week: lastWeekId + '*',
                                popularity: projected,
                                isEstimate: true
                            };
                        }
                    }
                }
            }

            // Include estimated point in min/max calculation for proper scaling
            const allPopValues = weeklyData.map(d => d.popularity);
            if (estimatedPoint) allPopValues.push(estimatedPoint.popularity);

            // Will fade in after rendering
            container.classList.remove('section-loaded');
            
            const maxPopularity = Math.max(...allPopValues);
            const minPopularity = Math.min(...allPopValues);
            const avgPopularity = Math.round(weeklyData.reduce((sum, d) => sum + d.popularity, 0) / weeklyData.length);
            
            // Generate SVG path
            const width = 340;
            const height = 100;
            const padding = 10;
            const leftPadding = 35; // Extra space for Y-axis labels
            const graphWidth = width - leftPadding - padding;
            const graphHeight = height - padding * 2;
            
            const points = weeklyData.map((d, i) => {
                const x = leftPadding + (i / (weeklyData.length - 1 || 1)) * graphWidth;
                const normalizedY = maxPopularity === minPopularity ? 0.5 : 
                    (d.popularity - minPopularity) / (maxPopularity - minPopularity);
                const y = height - padding - (normalizedY * graphHeight);
                return { x, y, popularity: d.popularity, week: d.week, newReleases: d.newReleases || [] };
            });
            
            // Create smooth path
            let pathD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                pathD += ` L ${points[i].x} ${points[i].y}`;
            }
            
            // Create area fill path
            let areaD = pathD + ` L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z`;
            
            // Week labels
            const firstWeek = weeklyData[0].week.replace(/^\d{4}-/, '');
            const lastWeek = weeklyData[weeklyData.length - 1].week.replace(/^\d{4}-/, '');
            
            // Create dots for weekly data points
            const dotsHtml = points.map(p => {
                return `<circle class="graph-dot" cx="${p.x}" cy="${p.y}" r="3" fill="var(--accent-orange)" stroke="var(--bg-primary)" stroke-width="1.5"/>`;
            }).join('');

            // Estimated current week: dashed line extending from last point
            let estimatedHtml = '';
            if (estimatedPoint && points.length >= 1) {
                const lastPt = points[points.length - 1];
                // Position the estimated point one step beyond the last
                const stepX = points.length >= 2 ? (points[points.length - 1].x - points[points.length - 2].x) : graphWidth * 0.15;
                const estX = Math.min(lastPt.x + stepX, width - padding);
                const normalizedEstY = maxPopularity === minPopularity ? 0.5 :
                    (estimatedPoint.popularity - minPopularity) / (maxPopularity - minPopularity);
                const estY = height - padding - (normalizedEstY * graphHeight);
                estimatedHtml = `
                    <path d="M ${lastPt.x} ${lastPt.y} L ${estX} ${estY}" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.5"/>
                    <circle cx="${estX}" cy="${estY}" r="3" fill="var(--accent-orange)" stroke="var(--bg-primary)" stroke-width="1.5" opacity="0.5"/>
                    <text x="${estX}" y="${estY - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="7" opacity="0.7">~${formatViewsAbsolute(estimatedPoint.popularity)}</text>
                `;
            }

            // Create release date dots with sub-week interpolation
            // Use string-based date range from ISO weeks to avoid timezone issues
            let releaseDotsHtml = '';
            if (points.length >= 2) {
                const weekMondays = weeklyData.map(d => isoWeekToMonday(d.week));
                // Compute first/last date as ISO strings for clean comparison
                const firstMon = weekMondays[0];
                const firstDateStr = `${firstMon.getFullYear()}-${String(firstMon.getMonth()+1).padStart(2,'0')}-${String(firstMon.getDate()).padStart(2,'0')}`;
                const lastMon = weekMondays[weekMondays.length - 1];
                const lastSun = new Date(lastMon);
                lastSun.setDate(lastMon.getDate() + 6);
                const lastDateStr = `${lastSun.getFullYear()}-${String(lastSun.getMonth()+1).padStart(2,'0')}-${String(lastSun.getDate()).padStart(2,'0')}`;

                const releases = Array.from(artistHistory.releases.values());
                releases.forEach(rel => {
                    if (!rel.releaseDate) return;
                    // Pure string comparison — no timezone ambiguity
                    if (rel.releaseDate < firstDateStr || rel.releaseDate > lastDateStr) return;

                    // Parse date for fractional positioning
                    const rdParts = rel.releaseDate.split('-');
                    const rd = new Date(parseInt(rdParts[0]), parseInt(rdParts[1]) - 1, parseInt(rdParts[2]));

                    let fracIdx = 0;
                    if (rd <= weekMondays[0]) {
                        fracIdx = 0;
                    } else if (rd >= weekMondays[weekMondays.length - 1]) {
                        fracIdx = weekMondays.length - 1;
                    } else {
                        for (let j = 0; j < weekMondays.length - 1; j++) {
                            if (rd >= weekMondays[j] && rd < weekMondays[j + 1]) {
                                const totalMs = weekMondays[j + 1] - weekMondays[j];
                                const elapsedMs = rd - weekMondays[j];
                                fracIdx = j + elapsedMs / totalMs;
                                break;
                            }
                        }
                    }
                    fracIdx = Math.max(0, Math.min(fracIdx, points.length - 1));

                    const idx = Math.min(Math.floor(fracIdx), points.length - 2);
                    const frac = fracIdx - idx;
                    const nextIdx = Math.min(idx + 1, points.length - 1);
                    const dotX = points[idx].x + frac * (points[nextIdx].x - points[idx].x);
                    const dotY = points[idx].y + frac * (points[nextIdx].y - points[idx].y);

                    releaseDotsHtml += `
                        <line x1="${dotX}" y1="${padding}" x2="${dotX}" y2="${height - padding}" stroke="#22c55e" stroke-width="0.7" opacity="0.35" stroke-dasharray="2,2"/>
                        <circle cx="${dotX}" cy="${dotY}" r="5" fill="#22c55e" stroke="var(--bg-primary)" stroke-width="2"/>
                        <text x="${dotX}" y="${dotY - 8}" text-anchor="middle" fill="#22c55e" font-size="8" font-weight="bold">${rel.releaseTitle.length > 14 ? rel.releaseTitle.slice(0, 13) + '…' : rel.releaseTitle}</text>
                    `;
                });
            }
            
            // Y-axis labels (min and max)
            const yAxisLabels = `
                <text x="${leftPadding - 5}" y="${padding + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-weight="600">${formatViewsAbsolute(maxPopularity)}</text>
                <text x="${leftPadding - 5}" y="${height - padding + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-weight="600">${formatViewsAbsolute(minPopularity)}</text>
                <line x1="${leftPadding - 2}" y1="${padding}" x2="${leftPadding + 3}" y2="${padding}" stroke="var(--text-muted)" stroke-width="1"/>
                <line x1="${leftPadding - 2}" y1="${height - padding}" x2="${leftPadding + 3}" y2="${height - padding}" stroke="var(--text-muted)" stroke-width="1"/>
            `;
            
            // Find new releases to show below graph
            const allNewReleases = weeklyData
                .filter(d => d.newReleases && d.newReleases.length > 0)
                .map(d => ({ week: d.week.replace(/^\d{4}-/, ''), titles: d.newReleases }));
            
            const newReleasesHtml = allNewReleases.length > 0 
                ? `<div class="graph-new-releases">
                    ${allNewReleases.map(r => 
                        `<span class="new-release-tag"><i class="fas fa-plus-circle"></i> ${r.titles.join(', ')} <small>(${r.week})</small></span>`
                    ).join('')}
                   </div>`
                : '';
            
            // Build VU meter for cumulative popularity (sum of viewsDeltas)
            let cumulativeVuHtml = '';
            let cumulativePop = 0;
            let cumulativeRankIndex = -1;
            if (artistName && siteMaster?.artistCumulativeRanking) {
                const artistNameLower = artistName.toLowerCase().trim();
                cumulativeRankIndex = siteMaster.artistCumulativeRanking.findIndex(a => a.bandName.toLowerCase().trim() === artistNameLower);
                if (cumulativeRankIndex >= 0) {
                    cumulativePop = siteMaster.artistCumulativeRanking[cumulativeRankIndex].cumulativePopularity || 0;
                }
            }
            const globalMaxCumulative = siteMaster?.maxCumulativePopularity || maxPopularity;
            if (cumulativePop > 0 && globalMaxCumulative > 0) {
                const totalSegs = 16;
                const litSegs = Math.max(1, Math.round((cumulativePop / globalMaxCumulative) * totalSegs));
                let segs = '';
                for (let s = 0; s < totalSegs; s++) {
                    const isOn = s < litSegs;
                    let color;
                    if (s < 10) color = '#4ade80';
                    else if (s < 13) color = '#facc15';
                    else color = '#ef4444';
                    segs += `<span class="vu-seg ${isOn ? 'vu-seg--on' : 'vu-seg--off'}" style="height:10px;background:${color};color:${color}"></span>`;
                }
                let positionHtml = cumulativeRankIndex >= 0 ? `<span class="vu-pop-value">#${cumulativeRankIndex + 1}</span>` : '';
                cumulativeVuHtml = `<div class="vu-meter-row"><div class="vu-meter">${segs}</div><span class="vu-pop-value">${formatViewsAbsoluteHtml(cumulativePop)}</span>${positionHtml}</div>`;
            }

            container.innerHTML = `
                <div class="popularity-graph-section">
                    <h3 class="section-title">
                        <i class="fas fa-chart-area"></i>
                        ${t('artist.cumulativePopularity')}
                        ${cumulativeVuHtml ? '<span class="section-title-vu">' + cumulativeVuHtml + '</span>' : ''}
                    </h3>
                    <div class="popularity-graph-container">
                        <svg class="popularity-graph" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">
                            <defs>
                                <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:var(--accent-orange);stop-opacity:0.3" />
                                    <stop offset="100%" style="stop-color:var(--accent-orange);stop-opacity:0.05" />
                                </linearGradient>
                            </defs>
                            ${yAxisLabels}
                            <path d="${areaD}" fill="url(#areaGradient)" />
                            <path d="${pathD}" fill="none" stroke="var(--accent-orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            ${dotsHtml}
                            ${estimatedHtml}
                            <g class="release-markers">${releaseDotsHtml}</g>
                            <line class="hover-line" x1="0" y1="${padding}" x2="0" y2="${height - padding}" stroke="var(--text-muted)" stroke-width="0.7" stroke-dasharray="3,2" opacity="0" pointer-events="none"/>
                            <circle class="hover-dot" cx="0" cy="0" r="4" fill="var(--accent-orange)" stroke="var(--bg-primary)" stroke-width="1.5" opacity="0" pointer-events="none"/>
                            <text class="hover-label" x="0" y="0" text-anchor="middle" fill="var(--text-primary)" font-size="8" font-weight="600" opacity="0" pointer-events="none"></text>
                            <text class="hover-week" x="0" y="0" text-anchor="middle" fill="var(--text-muted)" font-size="7" opacity="0" pointer-events="none"></text>
                            <rect class="hover-area" x="${leftPadding}" y="0" width="${graphWidth}" height="${height}" fill="transparent" cursor="crosshair"/>
                        </svg>
                        <div class="graph-labels">
                            <span style="margin-left: 25px;">${firstWeek}</span>
                            <span>${lastWeek}${estimatedPoint ? ' →' : ''}</span>
                        </div>
                        ${newReleasesHtml}
                    </div>
                </div>
            `;
            // Fade in the section
            void container.offsetWidth;
            container.classList.add('section-loaded');
            container.addEventListener('transitionend', function handler(e) {
                if (e.propertyName === 'max-height') {
                    container.style.maxHeight = 'none';
                    container.removeEventListener('transitionend', handler);
                }
            });

            // Hover interaction: show value under cursor
            const svg = container.querySelector('.popularity-graph');
            const hoverArea = svg && svg.querySelector('.hover-area');
            if (svg && hoverArea && points.length >= 2) {
                const hLine = svg.querySelector('.hover-line');
                const hDot = svg.querySelector('.hover-dot');
                const hLabel = svg.querySelector('.hover-label');
                const hWeek = svg.querySelector('.hover-week');
                // All data points including estimated
                const allPts = [...points];
                if (estimatedPoint && estimatedHtml) {
                    const lastPt = points[points.length - 1];
                    const stepX = points.length >= 2 ? (points[points.length - 1].x - points[points.length - 2].x) : graphWidth * 0.15;
                    const estX = Math.min(lastPt.x + stepX, width - padding);
                    const normalizedEstY = maxPopularity === minPopularity ? 0.5 :
                        (estimatedPoint.popularity - minPopularity) / (maxPopularity - minPopularity);
                    const estY = height - padding - (normalizedEstY * graphHeight);
                    allPts.push({ x: estX, y: estY, popularity: estimatedPoint.popularity, week: estimatedPoint.week });
                }
                function showHover(e) {
                    const rect = svg.getBoundingClientRect();
                    const svgX = (e.clientX - rect.left) / rect.width * width;
                    // Find closest point
                    let closest = allPts[0], minDist = Math.abs(svgX - allPts[0].x);
                    for (let i = 1; i < allPts.length; i++) {
                        const d = Math.abs(svgX - allPts[i].x);
                        if (d < minDist) { minDist = d; closest = allPts[i]; }
                    }
                    hLine.setAttribute('x1', closest.x); hLine.setAttribute('x2', closest.x); hLine.setAttribute('opacity', '0.5');
                    hDot.setAttribute('cx', closest.x); hDot.setAttribute('cy', closest.y); hDot.setAttribute('opacity', '1');
                    const labelY = closest.y - 14;
                    hLabel.setAttribute('x', closest.x); hLabel.setAttribute('y', labelY); hLabel.setAttribute('opacity', '1');
                    hLabel.textContent = formatViewsAbsolute(closest.popularity);
                    hWeek.setAttribute('x', closest.x); hWeek.setAttribute('y', labelY - 10); hWeek.setAttribute('opacity', '0.7');
                    hWeek.textContent = (closest.week || '').replace(/^\d{4}-/, '');
                }
                function hideHover() {
                    hLine.setAttribute('opacity', '0'); hDot.setAttribute('opacity', '0');
                    hLabel.setAttribute('opacity', '0'); hWeek.setAttribute('opacity', '0');
                }
                hoverArea.addEventListener('mousemove', showHover);
                hoverArea.addEventListener('mouseleave', hideHover);
                hoverArea.addEventListener('touchmove', e => { e.preventDefault(); showHover(e.touches[0]); }, { passive: false });
                hoverArea.addEventListener('touchend', hideHover);
            }
        }
        
        // Convert ISO week string (e.g. "2026-W03") to Monday date
        function isoWeekToMonday(weekId) {
            const m = weekId.match(/(\d{4})-W(\d{2})/);
            if (!m) return new Date(0);
            const year = parseInt(m[1]), week = parseInt(m[2]);
            const jan4 = new Date(year, 0, 4);
            const dow = jan4.getDay() || 7;
            const mon = new Date(jan4);
            mon.setDate(jan4.getDate() + (week - 1) * 7 - dow + 1);
            return mon;
        }

        // Render unified timeline of releases, articles, and events
        function renderTimeline(artistHistory, artistLinks, siteMaster, articles, matchedEvents, artistName, artistSpotifyName) {
            const container = document.getElementById('timeline-container');
            if (!container) return;

            const today = new Date(); today.setHours(0,0,0,0);
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            const MK_MONTHS = t('months.full');
            const MK_DAYS = t('days.short');

            // ---- RELEASES ----
            const releases = Array.from(artistHistory.releases.values());
            window.artistReleases = releases;
            window.artistLinks = artistLinks || {};

            function getYtMap(release) {
                const map = {};
                if (release.youtubeTracks) {
                    release.youtubeTracks.forEach(yt => {
                        if (yt.verified !== 'verified') return;
                        const key = yt.name.toLowerCase().trim();
                        if (!map[key]) map[key] = [];
                        map[key].push(yt);
                    });
                }
                return map;
            }

            const releaseItems = releases.map((release, rIdx) => {

                const typeClass = release.releaseType === 'album' ? 'album' : 'single';

                const isNew = new Date(release.releaseDate) >= oneWeekAgo;
                const newBadge = isNew ? '<span class="release-new-badge">НОВО</span>' : '';
                const releaseDisplay = buildReleaseDisplayContext(release, artistName, artistSpotifyName);
                const tracks = releaseDisplay.tracks;
                const releaseViews = releaseDisplay.viewCount;
                release._effectiveViews = releaseDisplay.effectiveViews;

                const ytMap = getYtMap(release);
                let trackNum = 0;

                const tracksHtml = tracks.map(trackName => {
                    trackNum++;
                    const ytEntries = ytMap[trackName.toLowerCase().trim()] || [];
                    // Sort by views descending so most-viewed is first
                    const ytEntriesSorted = [...ytEntries].sort((a, b) => (b.views || 0) - (a.views || 0));
                    const bestEntry = ytEntriesSorted[0];
                    const isVerified = bestEntry && bestEntry.verified === 'verified';
                    const bestYtUrl = bestEntry ? (bestEntry.url || 'https://www.youtube.com/watch?v=' + bestEntry.videoId) : '';
                    const tick = isVerified
                        ? '<span class="release-track-verified" title="Верификуван"><i class="fas fa-check-circle"></i></span>'
                        : '';
                    const totalViews = ytEntries.reduce((sum, yt) => sum + (yt.views || 0), 0);
                    const deltaEntries = ytEntries.filter(yt => typeof yt.viewsDelta === 'number');
                    const songViewsDelta = deltaEntries.length > 0
                        ? deltaEntries.reduce((sum, yt) => sum + (yt.viewsDelta || 0), 0)
                        : (tracks.length === 1 && typeof release.viewsDelta === 'number' ? release.viewsDelta : null);
                    const viewsHtml = totalViews > 0
                        ? `<span class="release-track-views"><i class="fas fa-eye"></i> ${formatViewsAbsoluteHtml(totalViews)}</span>`
                        : '';
                    const popularityHtml = songViewsDelta > 0
                        ? `<span class="release-track-popularity"><i class="fas fa-chart-line"></i> ${formatViewsAbsoluteHtml(songViewsDelta)}</span>`
                        : '';
                    const statsHtml = viewsHtml || popularityHtml
                        ? `<span class="release-track-stats">${viewsHtml}${popularityHtml}</span>`
                        : '';
                    // Build all YT URLs JSON for the service chooser video picker
                    const allYtData = ytEntriesSorted.map(yt => ({
                        url: yt.url || 'https://www.youtube.com/watch?v=' + yt.videoId,
                        views: yt.views || 0
                    }));
                    const ytDataAttr = allYtData.length > 1 ? ` data-yt-all="${encodeURIComponent(JSON.stringify(allYtData))}"` : '';
                    let linksHtml = '';
                    if (ytEntries.length >= 1) {
                        const maxVisible = 3;
                        const visibleEntries = ytEntries.slice(0, maxVisible);
                        const hiddenEntries = ytEntries.slice(maxVisible);
                        let pills = visibleEntries.map(yt => {
                            const url = yt.url || 'https://www.youtube.com/watch?v=' + yt.videoId;
                            const v = yt.views || 0;
                            const viewStr = formatCompactCountPlain(v);
                            return `<a class="release-track-yt-pill" href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener" title="${viewStr}"><i class="fab fa-youtube"></i></a>`;
                        }).join('');
                        if (hiddenEntries.length > 0) {
                            pills += `<button class="release-track-yt-expand" data-release-idx="${rIdx}" data-track-name="${trackName.replace(/"/g, '&quot;')}" title="+${hiddenEntries.length}">+${hiddenEntries.length}</button>`;
                        }
                        linksHtml = '<span class="release-track-links">' + pills + '</span>';
                    }
                    const sideHtml = linksHtml || statsHtml || tick
                        ? `<span class="release-track-side">${linksHtml}${statsHtml}${tick}</span>`
                        : '';
                    const totalViewsAttr = ` data-total-views="${String(totalViews)}"`;
                    const viewsDeltaAttr = songViewsDelta == null ? '' : ` data-views-delta="${String(songViewsDelta)}"`;
                    return `<li class="release-track-item" data-release-idx="${rIdx}" data-track-name="${trackName.replace(/"/g, '&quot;')}" data-yt-url="${bestYtUrl.replace(/"/g, '&quot;')}"${ytDataAttr}${totalViewsAttr}${viewsDeltaAttr}><span class="release-track-num">${trackNum}</span><span class="release-track-name">${trackName}</span>${sideHtml}</li>`;
                }).join('');

                const releaseDate = new Date(release.releaseDate);
                const dateStr = `${String(releaseDate.getDate()).padStart(2,'0')}.${String(releaseDate.getMonth()+1).padStart(2,'0')}.${releaseDate.getFullYear()}`;
                const releaseCertification = getReleaseCertification(releaseViews);
                const certificationHtml = buildReleaseCertificationBadge(releaseCertification, releaseViews, release.releaseTitle);

                let releasePopularityHtml = '';
                const currentDelta = release.viewsDelta || (release.chartWeeks && release.chartWeeks.length >= 2
                    ? release.chartWeeks[release.chartWeeks.length - 1].youtubeViews - release.chartWeeks[release.chartWeeks.length - 2].youtubeViews
                    : 0);
                if (currentDelta > 0) {
                    releasePopularityHtml = `<span class="release-popularity-stat"><i class="fas fa-arrow-trend-up"></i> ${formatViewsAbsoluteHtml(currentDelta)}</span>`;
                }
                const releaseCertificationRowHtml = certificationHtml
                    ? `<div class="release-certification-row">${certificationHtml}</div>`
                    : '';
                const releaseViewsHtml = releaseViews
                    ? `<span class="release-yt-views"><i class="fas fa-eye"></i> ${formatViewsAbsoluteHtml(releaseViews)}</span>`
                    : '';
                const releaseInsightsHtml = releaseViewsHtml || releasePopularityHtml
                    ? `<div class="release-insights-row">${releaseViewsHtml}${releasePopularityHtml}</div>`
                    : '';
                const releaseCardMainClass = certificationHtml
                    ? 'release-card-main release-card-main--with-cert'
                    : 'release-card-main';

                const allArtists = release.bandName ? release.bandName.split(',').map(a => a.trim()).filter(a => a) : [];
                let collabHtml = '';
                if (release._isCollabAppearance) {
                    const otherArtists = allArtists.filter(name => name.toLowerCase() !== (artistName || '').toLowerCase());
                    collabHtml = otherArtists.length > 0
                        ? `<div class="release-collab-artists"><span style="opacity:0.5">со</span> ${otherArtists.map(name =>
                            `<a href="${getArtistPageUrl(name)}" class="release-collab-link">${name}</a>`
                          ).join(', ')}</div>`
                        : '';
                } else {
                    const collabArtists = allArtists.slice(1);
                    collabHtml = collabArtists.length > 0
                        ? `<div class="release-collab-artists"><span style="opacity:0.5">feat.</span> ${collabArtists.map(name =>
                            `<a href="${getArtistPageUrl(name)}" class="release-collab-link">${name}</a>`
                          ).join(', ')}</div>`
                        : '';
                }

                return {
                    type: 'release',
                    date: releaseDate,
                    html: `
                    <div class="chart-history-item" style="flex-direction:column;align-items:stretch;cursor:default;">
                        <div class="${releaseCardMainClass}">
                            ${releaseCertificationRowHtml}
                            <div class="chart-history-cover">
                                ${release.thumbnail 
                                    ? `<img src="${release.thumbnail}" alt="${release.releaseTitle}" loading="lazy">`
                                    : `<i class="${typeIcon}" style="font-size: 1.25rem; color: var(--text-muted);"></i>`
                                }
                            </div>
                            <div class="chart-history-info">
                                <div class="chart-history-title"><span class="chart-history-title-text">${release.releaseTitle}</span>${newBadge}</div>
                                ${collabHtml}
                                <div class="chart-history-meta">
                                    <span class="chart-history-type ${typeClass}">
                                        <i class="${typeIcon}"></i> ${typeLabel}
                                    </span>
                                    <span>${dateStr}</span>
                                </div>
                                ${releaseInsightsHtml}
                            </div>
                        </div>
                        <ol class="release-track-list">${tracksHtml}</ol>
                    </div>`
                };
            });

            // ---- ARTICLES ----
            const articleItems = (articles || []).map(article => {
                const dateStr = article.pubDate.getTime() > 0
                    ? String(article.pubDate.getDate()).padStart(2,'0') + '.' + String(article.pubDate.getMonth()+1).padStart(2,'0') + '.' + article.pubDate.getFullYear()
                    : '';
                return {
                    type: 'article',
                    date: article.pubDate.getTime() > 0 ? article.pubDate : new Date(0),
                    html: `<a href="${article.link}" target="_blank" rel="noopener" class="artist-link rss-article timeline-item-article">
                        <img src="${article.sourceIcon}" alt="${article.source}" style="width:24px;height:24px;border-radius:3px;flex-shrink:0">
                        <span class="artist-link-text">${article.title}${dateStr ? `<span style="display:block;font-size:0.7rem;font-weight:400;color:var(--text-muted);margin-top:0.15rem"><i class="fas fa-newspaper" style="margin-right:0.3rem;opacity:0.5"></i>${article.source} &middot; ${dateStr}</span>` : ''}</span>
                        <i class="fas fa-chevron-right artist-link-arrow"></i>
                    </a>`
                };
            });

            // ---- EVENTS ----
            const upcoming = (matchedEvents || []).filter(e => {
                const parts = e.date.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                return d >= today;
            }).sort((a, b) => new Date(a.date) - new Date(b.date));

            const past = (matchedEvents || []).filter(e => {
                const parts = e.date.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                return d < today;
            }).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

            function buildEventHtml(evt, isPast) {
                const parts = evt.date.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                const daysDiff = Math.ceil((d - today) / (1000 * 60 * 60 * 24));
                let badge = '';
                if (!isPast) {
                    if (daysDiff === 0) badge = '<span style="background:rgba(34,197,94,0.15);color:#16a34a;border:1px solid rgba(34,197,94,0.3);font-size:0.6rem;font-weight:700;padding:0.1rem 0.4rem;border-radius:999px;margin-left:0.4rem">' + t('artist.today') + '</span>';
                    else if (daysDiff <= 7) badge = `<span style="background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.2);font-size:0.6rem;font-weight:700;padding:0.1rem 0.4rem;border-radius:999px;margin-left:0.4rem">${daysDiff === 1 ? t('artist.inDays').replace('{0}', daysDiff) : t('artist.inDaysPlural').replace('{0}', daysDiff)}</span>`;
                    else if (daysDiff <= 30) badge = `<span style="background:rgba(74,127,165,0.08);color:var(--accent-blue);border:1px solid rgba(74,127,165,0.15);font-size:0.6rem;font-weight:700;padding:0.1rem 0.4rem;border-radius:999px;margin-left:0.4rem">${t('artist.inDaysPlural').replace('{0}', daysDiff)}</span>`;
                }
                const dateStr = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
                const dayStr = MK_DAYS[d.getDay()];
                return `<a href="/nastan/${encodeURIComponent(evt.id)}" class="artist-link timeline-item-event" style="text-decoration:none;${isPast ? 'opacity:0.55;' : ''}">
                    <div style="width:40px;height:40px;border-radius:8px;background:var(--bg-secondary);border:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;flex-shrink:0">
                        <i class="fas fa-calendar-day" style="font-size:1rem;color:${isPast ? 'var(--text-muted)' : 'var(--accent-blue)'}"></i>
                    </div>
                    <span class="artist-link-text">
                        ${evt.title}${badge}
                        <span style="display:block;font-size:0.7rem;font-weight:400;color:var(--text-muted);margin-top:0.15rem">
                            ${dateStr} (${dayStr})${evt.time ? ' · ' + evt.time : ''}${evt.place ? ' · ' + evt.place : ''}
                        </span>
                    </span>
                    <i class="fas fa-chevron-right artist-link-arrow"></i>
                </a>`;
            }

            const upcomingItems = upcoming.map(evt => ({
                type: 'event-upcoming',
                date: new Date(evt.date),
                html: buildEventHtml(evt, false)
            }));

            const pastEventItems = past.map(evt => ({
                type: 'event-past',
                date: new Date(evt.date),
                html: buildEventHtml(evt, true)
            }));

            // ---- MERGE & SORT ----
            // All items sorted newest-first (upcoming events naturally appear at top)
            const timelineItems = [...releaseItems, ...articleItems, ...pastEventItems, ...upcomingItems]
                .sort((a, b) => b.date - a.date);

            // ---- BUILD HTML ----
            // Stats for the section header
            const totalYtViews = releases.reduce((sum, r) => sum + (r._effectiveViews != null ? r._effectiveViews : (r.youtubeViews || 0)), 0);
            const releaseCountHtml = `<span><i class="fas fa-compact-disc"></i> ${releases.length}</span>`;
            const articleCountHtml = articles && articles.length > 0 ? `<span><i class="fas fa-newspaper"></i> ${articles.length}</span>` : '';
            const eventCountHtml = (upcoming.length + past.length) > 0 ? `<span><i class="fas fa-calendar-day"></i> ${upcoming.length + past.length}</span>` : '';
            const ytViewsHtml = totalYtViews > 0
                ? `<span class="release-yt-views"><i class="fas fa-eye"></i> ${formatViewsAbsoluteHtml(totalYtViews)}</span>`
                : '';

            // Group timeline items by month/year
            let timelineHtml = '';
            let lastMonthKey = '';
            let todayInserted = false;
            const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
            const todayMarkerHtml = `<div class="timeline-today-marker"><span class="today-label">${t('artist.today')}</span><span class="today-line"></span></div>`;

            timelineItems.forEach(item => {
                // Insert today marker before the first item that's in the past
                if (!todayInserted && item.date < todayStart) {
                    timelineHtml += todayMarkerHtml;
                    todayInserted = true;
                }
                const monthKey = item.date.getFullYear() > 1970
                    ? `${MK_MONTHS[item.date.getMonth()]} ${item.date.getFullYear()}`
                    : '';
                if (monthKey && monthKey !== lastMonthKey) {
                    timelineHtml += `<div class="timeline-month-header">${monthKey}</div>`;
                    lastMonthKey = monthKey;
                }
                timelineHtml += item.html;
            });
            // If all items are in the future/today, append marker at the end
            if (!todayInserted && timelineItems.length > 0) {
                timelineHtml += todayMarkerHtml;
            }

            if (timelineItems.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <div class="chart-history-section">
                    <h3 class="section-title">
                        <i class="fas fa-timeline"></i>
                        ${t('artist.timeline')}
                        <div class="tl-stats">
                            ${releaseCountHtml}
                            ${articleCountHtml}
                            ${eventCountHtml}
                            ${ytViewsHtml}
                        </div>
                    </h3>
                    <div class="tl-search-wrap">
                        <i class="fas fa-search tl-search-icon"></i>
                        <input type="text" class="tl-search-input" id="tl-search" placeholder="${t('artist.searchTimeline') || 'Пребарај...'}" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="chart-history-list">
                        ${timelineHtml}
                    </div>
                </div>
            `;

            // Wire up timeline search filter
            var tlSearch = document.getElementById('tl-search');
            if (tlSearch) {
                tlSearch.addEventListener('input', function() {
                    var q = this.value.toLowerCase().trim();
                    var list = container.querySelector('.chart-history-list');
                    if (!list) return;
                    var items = list.children;
                    var lastMonthVisible = false;
                    var lastMonthHeader = null;
                    for (var i = 0; i < items.length; i++) {
                        var el = items[i];
                        if (el.classList.contains('timeline-month-header')) {
                            if (lastMonthHeader) lastMonthHeader.style.display = lastMonthVisible ? '' : 'none';
                            lastMonthHeader = el;
                            lastMonthVisible = false;
                            continue;
                        }
                        if (el.classList.contains('timeline-today-marker')) continue;
                        if (!q) { el.style.display = ''; lastMonthVisible = true; continue; }
                        var text = el.textContent.toLowerCase();
                        var match = text.indexOf(q) !== -1;
                        el.style.display = match ? '' : 'none';
                        if (match) lastMonthVisible = true;
                    }
                    if (lastMonthHeader) lastMonthHeader.style.display = lastMonthVisible ? '' : 'none';
                });
            }

            // Fade in
            void container.offsetWidth;
            container.classList.add('section-loaded');
            container.addEventListener('transitionend', function handler(e) {
                if (e.propertyName === 'max-height') {
                    container.style.maxHeight = 'none';
                    container.removeEventListener('transitionend', handler);
                }
            });

            // Add click handlers for release track items
            container.querySelectorAll('.release-track-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openTrackServiceChooser(item);
                });
            });
            // +N expand buttons also open the service chooser
            container.querySelectorAll('.release-track-yt-expand').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const item = btn.closest('.release-track-item');
                    if (item) openTrackServiceChooser(item);
                });
            });
        }

        function openTrackServiceChooser(item) {
            const rIdx = parseInt(item.dataset.releaseIdx);
            const trackName = item.dataset.trackName;
            const ytUrl = item.dataset.ytUrl || '';
            const totalViews = item.dataset.totalViews === undefined ? null : Number(item.dataset.totalViews);
            const viewsDelta = item.dataset.viewsDelta === undefined ? null : Number(item.dataset.viewsDelta);
            // Parse all YouTube video URLs for the video picker
            let allYtVideos = null;
            if (item.dataset.ytAll) {
                try { allYtVideos = JSON.parse(decodeURIComponent(item.dataset.ytAll)); } catch(_) {}
            }
            const releases = window.artistReleases || [];
            const release = releases[rIdx];
            if (!release) return;
            const bd = window.bandsData || [];
            const band = bd.find(b => b.name && b.name.toLowerCase() === (release.bandName || '').toLowerCase());
            showServiceChooserDialog(
                release.releaseUrl,
                trackName,
                release.bandName,
                release.thumbnail,
                band?.accentColors,
                release.spotifyName || band?.spotifyName,
                band?.confirmed,
                ytUrl || undefined,
                allYtVideos || undefined,
                {
                    totalViews: Number.isFinite(totalViews) ? totalViews : null,
                    viewsDelta: Number.isFinite(viewsDelta) ? viewsDelta : null
                }
            );
        }
        
        // ==================== OPEN ON PREFERRED SERVICE ====================
        // Uses shared showServiceChooserDialog / closeServiceChooserDialog from common.js
        function openOnPreferredService(releaseUrl, title, artistName, thumbnail, accentColors, spotifyArtistName, verified) {
            if (!releaseUrl) return;
            showServiceChooserDialog(releaseUrl, title, artistName, thumbnail, accentColors, spotifyArtistName, verified);
        }

        // Render error state
        function renderError() {
            const el = document.getElementById('artist-content');
            el.innerHTML = `
                <div class="artist-error">
                    <i class="fas fa-question-circle"></i>
                    <h2>${t('artist.notFound')}</h2>
                    <p>${t('artist.notFoundDesc')}</p>
                    <a href="/lista">
                        <i class="fas fa-list"></i>
                        ${t('artist.browseList')}
                    </a>
                </div>
            `;
        }
        
        // Main initialization
        // ==================== ARTICLE MATCHING (from pre-computed site-master.json) ====================
        
        function getArtistArticles(siteMaster, artistName) {
            const allMatched = siteMaster?.news?.matched || [];
            if (!artistName || allMatched.length === 0) return [];
            
            const artistNameLower = artistName.toLowerCase().trim();
            const artistTranslit = transliterate(artistName).toLowerCase().trim();
            
            return allMatched.filter(article => {
                const matched = article.matchedArtists || [];
                return matched.some(a => {
                    const aLower = a.toLowerCase().trim();
                    return aLower === artistNameLower || transliterate(a).toLowerCase().trim() === artistTranslit;
                });
            }).map(a => ({
                title: a.title || '',
                link: a.link || '',
                description: a.description || '',
                content: '',
                pubDate: a.date ? new Date(a.date) : new Date(0),
                source: a.source || '',
                sourceIcon: a.iconUrl || a.sourceIcon || '',
                siteUrl: a.siteUrl || ''
            }));
        }
        
        async function init() {
            // Load site-master.json + artist-data.json in parallel
            let siteMaster = null;
            try {
                const [sm, _ad] = await Promise.all([loadSiteMaster(), loadArtistData()]);
                siteMaster = sm;
            } catch (e) {
                console.warn('Could not load site-master.json:', e);
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            let artistParam = urlParams.get('a') || urlParams.get('artist') || urlParams.get('name');
            
            // Check if we came from a clean URL (via 404.html redirect)
            const cleanUrl = sessionStorage.getItem('cleanUrl');
            if (cleanUrl) {
                sessionStorage.removeItem('cleanUrl');
                sessionStorage.removeItem('artistSlug');
            }
            
            if (!artistParam) {
                renderError();
                return;
            }
            
            try {
                // Load bands data
                const response = await fetch('bands.json');
                const data = await response.json();
                const bandsData = data.muzickaMasterLista;
                window.bandsData = bandsData;
                primeMasterArtistNameSet(bandsData);
                registerArtistNames(bandsData);
                
                // Find artist
                const artist = findArtist(bandsData, decodeURIComponent(artistParam));
                
                if (!artist) {
                    renderError();
                    return;
                }
                
                // Get thumbnail and latest release date from pre-computed chart data
                let thumbnail = artist.image || null;
                let latestReleaseDate = null;
                let latestReleaseThumbnail = null;
                
                const releases = siteMaster?.chartData?.releases || [];
                const artistNameLower = artist.name.toLowerCase();
                releases.forEach(r => {
                    if (r.bandName && r.bandName.toLowerCase().split(', ').some(n => n === artistNameLower)) {
                        if (!thumbnail && r.thumbnail) thumbnail = r.thumbnail;
                        if (r.releaseDate && (!latestReleaseDate || r.releaseDate > latestReleaseDate)) {
                            latestReleaseDate = r.releaseDate;
                            if (r.thumbnail) latestReleaseThumbnail = r.thumbnail;
                        }
                    }
                });
                if (!thumbnail && latestReleaseThumbnail) thumbnail = latestReleaseThumbnail;
                
                // Get pre-computed activity status from site-master
                const artistSlug = generateSlug(artist.name);
                const precomputedActivity = siteMaster?.artistActivity?.[artistSlug];
                if (precomputedActivity) {
                    // Map Macedonian labels to internal codes
                    const statusMap = { 'Активен': 'active', 'Неактивен': 'inactive', 'Можеби': 'maybe', 'Непознато': 'unknown' };
                    artist._activityStatus = statusMap[precomputedActivity] || precomputedActivity;
                } else {
                    // Fallback: compute from events
                    let hasRecentEvent = false;
                    try {
                        const evResp = await fetch('events.json');
                        const evJson = await evResp.json();
                        const allEvents = evJson.events || [];
                        const now = new Date();
                        const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
                        const oneYearAgoStr = oneYearAgo.toISOString().slice(0, 10);
                        hasRecentEvent = allEvents.some(e =>
                            e.date >= oneYearAgoStr &&
                            (e.artists || e.bands || []).some(a => a.toLowerCase() === artistNameLower)
                        );
                    } catch (evErr) {
                        console.warn('Could not load events for activity fallback:', evErr);
                    }
                    artist._activityStatus = computeActivityStatus(latestReleaseDate, hasRecentEvent);
                }
                
                // Render artist page
                renderArtist(artist, thumbnail, bandsData);
                
                // (per-section fade-in handled by each render function)
                
                // Store artist links globally for the music player
                window.artistLinks = artist.links || {};
                
                // Apply cinematic accent styling for confirmed artists
                if (artist.confirmed && artist.accentColors && (artist.accentColors[0] || artist.accentColors[1])) {
                    const c1 = artist.accentColors[0] || artist.accentColors[1];
                    const c2 = artist.accentColors[1] || artist.accentColors[0];
                    const root = document.documentElement;
                    root.style.setProperty('--artist-accent-1', c1);
                    root.style.setProperty('--artist-accent-2', c2);
                    root.style.setProperty('--vfx-c1', c1);
                    root.style.setProperty('--vfx-c2', c2);
                    root.style.setProperty('--vfx-c1-glow', c1 + '40');
                    root.style.setProperty('--vfx-c2-glow', c2 + '30');

                    // Theme-aware accent application function
                    function applyVfxAccentTheme() {
                        var dark = document.body.classList.contains('vfx-dark');
                        var tc = dark ? '#fff' : '#1a1a2e';
                        var tcRgb = dark ? '255,255,255' : '0,0,0';

                        // Avatar accent border
                        var avatar = document.querySelector('.artist-avatar');
                        if (avatar) {
                            avatar.style.borderColor = c2;
                        }

                        // Artist name with theme-appropriate glow
                        var nameEl = document.querySelector('.artist-name');
                        if (nameEl) {
                            nameEl.style.color = tc;
                            nameEl.style.textShadow = dark
                                ? '0 0 30px ' + c2 + '50, 0 0 60px ' + c2 + '30, 0 2px 10px rgba(0,0,0,0.5)'
                                : '0 0 20px ' + c2 + '28, 0 0 40px ' + c2 + '18, 0 1px 4px rgba(0,0,0,0.06)';
                            var dot = nameEl.querySelector('.status-dot');
                            if (dot) dot.style.boxShadow = '0 0 0 2px rgba(' + tcRgb + ',0.2)';
                        }

                        // Meta badges with accent glass
                        var badgeAlpha = dark ? '30' : '20';
                        var badgeBorder = dark ? '50' : '38';
                        document.querySelectorAll('.artist-city').forEach(function(el) {
                            el.style.background = c2 + badgeAlpha; el.style.color = tc; el.style.border = '1px solid ' + c2 + badgeBorder;
                        });
                        document.querySelectorAll('.artist-genre').forEach(function(el) {
                            el.style.background = c2 + badgeAlpha; el.style.color = tc; el.style.border = '1px solid ' + c2 + badgeBorder;
                        });
                        document.querySelectorAll('.artist-label').forEach(function(el) {
                            el.style.background = c2 + (dark ? '40' : '28'); el.style.color = tc;
                        });
                    }
                    applyVfxAccentTheme();
                    // Store for theme-change listener
                    window._applyVfxAccentTheme = applyVfxAccentTheme;

                    // Section titles with c2 accent border
                    document.querySelectorAll('.section-title').forEach(function(el) {
                        el.style.borderLeft = '3px solid ' + c2;
                        el.style.paddingLeft = '0.65rem';
                        var icon = el.querySelector('i');
                        if (icon) icon.style.color = c2;
                    });

                    // Greeting player
                    const greetingBtn = document.querySelector('.artist-greeting-btn');
                    if (greetingBtn) greetingBtn.style.background = c2;
                    document.querySelectorAll('.artist-greeting-wave span').forEach(function(bar) {
                        bar.style.background = c2;
                    });

                    // Link hover accents + staggered entrance
                    document.querySelectorAll('.artist-link').forEach(function(link, idx) {
                        link.style.setProperty('--link-accent', c1);
                        link.style.animationDelay = (idx * 0.06) + 's';
                    });

                    // c2-themed graph & element overrides
                    const c2Style = document.createElement('style');
                    c2Style.textContent =
                        '.popularity-graph-container svg [id="areaGradient"] stop:first-child { stop-color: ' + c2 + ' !important; }' +
                        '.popularity-graph-container svg [id="areaGradient"] stop:last-child { stop-color: ' + c2 + ' !important; }' +
                        '.popularity-graph-container svg path[stroke] { stroke: ' + c2 + ' !important; }' +
                        '.popularity-graph-container svg circle.graph-dot { fill: ' + c2 + ' !important; }' +
                        '.popularity-graph-container .graph-value-label span { color: ' + c2 + ' !important; }' +
                        '.release-play-btn { background: ' + c2 + ' !important; }' +

                    // Intersection Observer for parallax reveal of content sections
                    var revealEls = document.querySelectorAll(
                        '.artist-header, .artist-links, #popularity-graph-container, #timeline-container, .artist-footer'
                    );
                    revealEls.forEach(function(el) { el.classList.add('vfx-reveal'); });
                    var revealObserver = new IntersectionObserver(function(entries) {
                        entries.forEach(function(entry) {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('vfx-visible');
                                revealObserver.unobserve(entry.target);
                            }
                        });
                    }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
                    revealEls.forEach(function(el) { revealObserver.observe(el); });

                    // Content parallax for the artist container
                    // Disabled: translateY on the container causes phantom scroll
                    // space at the bottom since document flow height is unchanged.

                    // No longer need MutationObserver — the vfx theme is determined
                    // once from accent colors and does not change with user dark-mode toggle.
                }
                
                // Extract and apply colors from the latest release thumbnail
                const colorSourceImage = latestReleaseThumbnail || thumbnail;
                if (colorSourceImage) {
                    try {
                        const colors = await extractColorsFromImage(colorSourceImage);
                        if (colors) {
                            applyDynamicColors(colors);
                        }
                    } catch (e) {
                        console.warn('Could not extract colors from image:', e);
                    }
                }
                
                // Build chart history and unified timeline
                let chartHistory = null;
                let timelineArticles = [];
                let timelineEvents = [];

                // Pre-load releases.json for trackArtists and fresh youtube data
                let relOverlay = null;
                try {
                    const relResp = await fetch('/releases.json?_=' + Date.now());
                    const relData = await relResp.json();
                    const draft = (window.MMMDrafts) ? MMMDrafts.load('releases.json') : null;
                    const relSrc = draft || relData;
                    relOverlay = {};
                    (relSrc.releases || []).forEach(r => { relOverlay[r.releaseId] = r; });
                } catch (_) {}

                try {
                    // Inject trackArtists into site-master releases before building history
                    if (relOverlay && siteMaster?.chartData?.releases) {
                        siteMaster.chartData.releases.forEach(r => {
                            const src = relOverlay[r.releaseId];
                            if (src?.trackArtists) r.trackArtists = src.trackArtists;
                        });
                    }
                    chartHistory = buildArtistHistoryFromSiteMaster(artist.name, siteMaster, artist.spotifyName);
                    renderPopularityGraph(chartHistory, siteMaster, artist.name);
                    // Overlay fresh youtube data from releases.json
                    if (relOverlay) {
                        chartHistory.releases.forEach(rel => {
                            const src = relOverlay[rel.releaseId];
                            if (src?.youtubeTracks) rel.youtubeTracks = src.youtubeTracks;
                        });
                    }
                    renderArtistCertificationStack(chartHistory, artist.name, artist.spotifyName);
                } catch (e) {
                    console.warn('Could not build chart history:', e);
                    chartHistory = { releases: new Map() };
                    renderArtistCertificationStack(chartHistory, artist.name, artist.spotifyName);
                }

                // Load articles
                try {
                    timelineArticles = getArtistArticles(siteMaster, artist.name);
                } catch (e) {
                    console.warn('Could not load articles:', e);
                }

                // Load events
                try {
                    const evResp = await fetch('events.json');
                    const evJson = await evResp.json();
                    const events = evJson.events || [];
                    const artistSlugEv = generateSlug(artist.name);
                    const artistNameLowerEv = artist.name.toLowerCase();
                    const artistTranslitEv = transliterate(artist.name).toLowerCase();
                    timelineEvents = events.filter(e => {
                        const artists = (e.artists || e.bands || []);
                        return artists.some(a => {
                            if (generateSlug(a) === artistSlugEv) return true;
                            if (a.toLowerCase() === artistNameLowerEv) return true;
                            if (transliterate(a).toLowerCase() === artistTranslitEv) return true;
                            return false;
                        });
                    });
                } catch (e) {
                    console.warn('Could not load events:', e);
                }

                // Render unified timeline
                renderTimeline(chartHistory, artist.links, siteMaster, timelineArticles, timelineEvents, artist.name, artist.spotifyName);
                
            } catch (error) {
                console.error('Error loading artist:', error);
                renderError();
            }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    recordingChunks = [];
                    
                    // Prefer webm, fallback to other formats
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
