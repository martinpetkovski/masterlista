    <script>
        // Dark mode initialization
        (function() {
            const toggle = document.getElementById('dark-mode-toggle');
            const body = document.body;
            const icon = toggle ? toggle.querySelector('i') : null;

            function setDarkMode(enabled) {
                body.classList.toggle('dark-mode', enabled);
                if (icon) icon.className = enabled ? 'fas fa-sun' : 'fas fa-moon';
                localStorage.setItem('mmm-dark-mode', enabled ? 'true' : 'false');
                localStorage.setItem('darkMode', enabled ? 'true' : 'false');
            }

            const saved = localStorage.getItem('mmm-dark-mode') || localStorage.getItem('darkMode');
            if (saved === 'true' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setDarkMode(true);
            }
            if (toggle) toggle.addEventListener('click', () => setDarkMode(!body.classList.contains('dark-mode')));
        })();

        // Nav menu
        (function() {
            const trigger = document.querySelector('.site-nav-trigger');
            const menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            trigger.addEventListener('click', (e) => {
                if (window.innerWidth <= 600) {

                if (!menu.contains(e.target) && !trigger.contains(e.target)) menu.classList.remove('open');
            });
        })();
        
        // Extract dominant colors from an image
        async function extractColorsFromImage(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 50; // Small sample size for performance
                    canvas.width = size;
                    canvas.height = size;
                    
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    try {
                        const imageData = ctx.getImageData(0, 0, size, size);
                        const pixels = imageData.data;
                        
                        // Collect color samples from different regions
                        const colorBuckets = {};
                        
                        for (let i = 0; i < pixels.length; i += 4) {
                            const r = pixels[i];
                            const g = pixels[i + 1];
                            const b = pixels[i + 2];
                            
                            // Skip very dark or very light pixels
                            const brightness = (r + g + b) / 3;
                            if (brightness < 30 || brightness > 225) continue;
                            
                            // Skip very desaturated pixels
                            const max = Math.max(r, g, b);
                            const min = Math.min(r, g, b);
                            const saturation = max === 0 ? 0 : (max - min) / max;
                            if (saturation < 0.15) continue;
                            
                            // Quantize colors to reduce unique values
                            const qr = Math.round(r / 32) * 32;
                            const qg = Math.round(g / 32) * 32;
                            const qb = Math.round(b / 32) * 32;
                            const key = `${qr},${qg},${qb}`;
                            
                            if (!colorBuckets[key]) {
                                colorBuckets[key] = { r: qr, g: qg, b: qb, count: 0 };
                            }
                            colorBuckets[key].count++;
                        }
                        
                        // Sort by frequency and get top colors
                        const sortedColors = Object.values(colorBuckets)
                            .sort((a, b) => b.count - a.count)
                            .slice(0, 5);
                        
                        if (sortedColors.length >= 1) {
                            // Get primary and secondary colors
                            const primary = sortedColors[0];
                            const secondary = sortedColors[1] || primary;
                            const tertiary = sortedColors[2] || secondary;
                            
                            resolve({
                                primary: { r: primary.r, g: primary.g, b: primary.b },
                                secondary: { r: secondary.r, g: secondary.g, b: secondary.b },
                                tertiary: { r: tertiary.r, g: tertiary.g, b: tertiary.b }
                            });
                        } else {
                            resolve(null);
                        }
                    } catch (e) {
                        console.warn('Could not extract colors:', e);
                        resolve(null);
                    }
                };
                
                img.onerror = () => {
                    resolve(null);
                };
                
                img.src = imageUrl;
            });
        }
        
        // Apply extracted colors to the page
        function applyDynamicColors(colors) {
            if (!colors) return;
            
            const { primary, secondary, tertiary } = colors;
            const root = document.documentElement;
            const isDark = document.body.classList.contains('dark-mode');
            
            // Light mode colors (more transparent)
            root.style.setProperty('--artist-color-1', `rgba(${primary.r}, ${primary.g}, ${primary.b}, 0.18)`);
            root.style.setProperty('--artist-color-2', `rgba(${secondary.r}, ${secondary.g}, ${secondary.b}, 0.12)`);
            root.style.setProperty('--artist-color-3', `rgba(${tertiary.r}, ${tertiary.g}, ${tertiary.b}, 0.10)`);
            
            // Dark mode colors (slightly less transparent)
            root.style.setProperty('--artist-color-1-dark', `rgba(${primary.r}, ${primary.g}, ${primary.b}, 0.15)`);
            root.style.setProperty('--artist-color-2-dark', `rgba(${secondary.r}, ${secondary.g}, ${secondary.b}, 0.10)`);
            root.style.setProperty('--artist-color-3-dark', `rgba(${tertiary.r}, ${tertiary.g}, ${tertiary.b}, 0.08)`);
            
            // Set accent color (used for avatar fallback, etc.)
            root.style.setProperty('--artist-accent', `rgb(${primary.r}, ${primary.g}, ${primary.b})`);
            
            // Apply tinted styles to page elements
            const avatarEl = document.querySelector('.artist-avatar');
            if (avatarEl) {
                avatarEl.style.boxShadow = `0 8px 32px rgba(${primary.r}, ${primary.g}, ${primary.b}, 0.3)`;
            }
            
            // Tint section titles with primary color
            document.querySelectorAll('.section-title i').forEach(el => {
                el.style.color = `rgb(${primary.r}, ${primary.g}, ${primary.b})`;
            });
            
            // Tint link cards on hover border
            const linkHoverColor = `rgba(${primary.r}, ${primary.g}, ${primary.b}, 0.4)`;
            const styleEl = document.createElement('style');
            styleEl.textContent = `

                .artist-label { background: rgb(${primary.r}, ${primary.g}, ${primary.b}) !important; }
            `;
            document.head.appendChild(styleEl);
        }
        
        // Platform configurations
        const platformConfig = {
            spotify: { name: 'Spotify', icon: 'fab fa-spotify', priority: 1 },
            youtube: { name: 'YouTube', icon: 'fab fa-youtube', priority: 2 },
            youtube_music: { name: 'YouTube Music', icon: 'fab fa-youtube', priority: 3 },
            instagram: { name: 'Instagram', icon: 'fab fa-instagram', priority: 4 },
            facebook: { name: 'Facebook', icon: 'fab fa-facebook', priority: 5 },
            twitter: { name: 'Twitter / X', icon: 'fab fa-twitter', priority: 6 },
            tiktok: { name: 'TikTok', icon: 'fab fa-tiktok', priority: 7 },
            bandcamp: { name: 'Bandcamp', icon: 'fab fa-bandcamp', priority: 8 },
            soundcloud: { name: 'SoundCloud', icon: 'fab fa-soundcloud', priority: 9 },
            itunes: { name: 'Apple Music', icon: 'fab fa-itunes-note', priority: 10 },
            apple_music: { name: 'Apple Music', icon: 'fab fa-itunes-note', priority: 10 },
            deezer: { name: 'Deezer', icon: 'fab fa-deezer', priority: 11 },
            tidal: { name: 'Tidal', icon: 'fas fa-water', priority: 12 },
            amazon_music: { name: 'Amazon Music', icon: 'fab fa-amazon', priority: 13 },
            napster: { name: 'Napster', icon: 'fab fa-napster', priority: 14 },
            audiomack: { name: 'Audiomack', icon: 'fas fa-headphones', priority: 15 },
            website: { name: 'Веб страница', icon: 'fas fa-globe', priority: 16 },
            linktree: { name: 'Linktree', icon: 'fas fa-tree', priority: 17 },
            discord: { name: 'Discord', icon: 'fab fa-discord', priority: 18 },
            patreon: { name: 'Patreon', icon: 'fab fa-patreon', priority: 19 },

        };
        
        const mediaPlatforms = {
            interview: { name: 'Интервју', icon: 'fas fa-microphone', priority: 2 },
            review: { name: 'Рецензија', icon: 'fas fa-star', priority: 3 },
            article: { name: 'Натпис', icon: 'fas fa-newspaper', priority: 4 },
            generic: { name: 'Линк', icon: 'fas fa-link', priority: 99 }
        };
        
        // Transliteration maps
        const cyrillicToLatinMap = {
            'А': 'A', 'а': 'a', 'Б': 'B', 'б': 'b', 'В': 'V', 'в': 'v', 'Г': 'G', 'г': 'g',
            'Д': 'D', 'д': 'd', 'Ѓ': 'Gj', 'ѓ': 'gj', 'Е': 'E', 'е': 'e', 'Ж': 'Zh', 'ж': 'zh',
            'З': 'Z', 'з': 'z', 'Ѕ': 'Dz', 'ѕ': 'dz', 'И': 'I', 'и': 'i', 'Ј': 'J', 'ј': 'j',
            'К': 'K', 'к': 'k', 'Л': 'L', 'л': 'l', 'Љ': 'Lj', 'љ': 'lj', 'М': 'M', 'м': 'm',
            'Н': 'N', 'н': 'n', 'Њ': 'Nj', 'њ': 'nj', 'О': 'O', 'о': 'o', 'П': 'P', 'п': 'p',
            'Р': 'R', 'р': 'r', 'С': 'S', 'с': 's', 'Т': 'T', 'т': 't', 'Ќ': 'Kj', 'ќ': 'kj',
            'У': 'U', 'у': 'u', 'Ф': 'F', 'ф': 'f', 'Х': 'H', 'х': 'h', 'Ц': 'C', 'ц': 'c',
            'Ч': 'Ch', 'ч': 'ch', 'Џ': 'Dz', 'џ': 'dz', 'Ш': 'Sh', 'ш': 'sh'
        };
        
        function transliterate(text) {
            return text.split('').map(char => cyrillicToLatinMap[char] || char).join('');
        }
        
        // Generate URL-safe slug from artist name
        function generateSlug(name) {
            return transliterate(name)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }
        
        /**
         * Compute activity status from latest release date.
         * active  - published work in the past 2 years
         * inactive - no published work in the past 3 years
         * maybe   - published work in the 2-3 years range
         * unknown - no data available
         */
        function computeActivityStatus(latestReleaseDate) {
            if (!latestReleaseDate) return 'unknown';
            const now = new Date();
            const parts = latestReleaseDate.split('-');
            const rd = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const diffYears = (now - rd) / (365.25 * 24 * 60 * 60 * 1000);
            if (diffYears <= 2) return 'active';
            if (diffYears <= 3) return 'maybe';
            return 'inactive';
        }
        
        // Find artist by slug or exact name
        function findArtist(bandsData, searchParam) {
            // Try exact name match first
            let artist = bandsData.find(b => b.name === searchParam);
            if (artist) return artist;
            
            // Try slug match
            artist = bandsData.find(b => generateSlug(b.name) === searchParam);
            if (artist) return artist;
            
            // Try case-insensitive match
            const searchLower = searchParam.toLowerCase();
            artist = bandsData.find(b => b.name.toLowerCase() === searchLower);
            if (artist) return artist;
            
            // Try transliterated match
            artist = bandsData.find(b => transliterate(b.name).toLowerCase() === searchLower);
            if (artist) return artist;
            
            return null;
        }
        
        // Render artist page
        function renderArtist(artist, thumbnail) {
            const contentEl = document.getElementById('artist-content');
            
            // Update page metadata
            document.getElementById('page-title').textContent = `${artist.name} | Македонска Музичка Мастер Листа`;
            document.getElementById('meta-title').content = `${artist.name} | Македонска Музичка Мастер Листа`;
            document.getElementById('meta-description').content = `${artist.name} - ${artist.genre || 'Македонски артист'}. Сите линкови и информации на едно место.`;
            
            const artistUrl = `https://toplista.mk/${encodeURIComponent(generateSlug(artist.name))}`;
            document.getElementById('canonical-url').href = artistUrl;
            document.getElementById('og-url').content = artistUrl;
            document.getElementById('og-title').content = `${artist.name} | MMM`;
            document.getElementById('og-description').content = `${artist.name} - ${artist.genre || 'Македонски артист'}`;
            document.getElementById('twitter-url').content = artistUrl;
            document.getElementById('twitter-title').content = `${artist.name} | MMM`;
            document.getElementById('twitter-description').content = `${artist.name} - ${artist.genre || 'Македонски артист'}`;
            
            // Update browser URL to clean URL (if not already clean) - only in production
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (!isLocalhost) {
                const cleanPath = '/' + encodeURIComponent(generateSlug(artist.name));
                if (window.location.pathname !== cleanPath && !window.location.pathname.includes(generateSlug(artist.name))) {
                    window.history.replaceState({}, '', cleanPath);
                }
            }
            
            if (thumbnail) {
                document.getElementById('og-image').content = thumbnail;
                document.getElementById('twitter-image').content = thumbnail;
            }
            
            // Build avatar HTML
            const avatarHtml = thumbnail 
                ? `<img src="${thumbnail}" alt="${artist.name}">`
                : `<i class="fas fa-music artist-avatar-placeholder"></i>`;
            
            // Build status class and text from computed activity status
            const statusMap = {
                'active': { cls: 'active', text: 'Активен' },
                'inactive': { cls: 'inactive', text: 'Неактивен' },
                'maybe': { cls: 'maybe', text: 'Можеби' },
                'unknown': { cls: 'unknown', text: 'Непознат статус' }
            };
            const computedStatus = artist._activityStatus || 'unknown';
            const { cls: statusClass, text: statusText } = statusMap[computedStatus] || statusMap['unknown'];
            
            // Build meta badges
            let metaHtml = '';
            if (artist.city && artist.city !== 'недостигаат податоци') {
                const cities = artist.city.split(',').map(c => c.trim()).slice(0, 2);
                metaHtml += cities.map(city => `<span class="artist-city"><i class="fas fa-map-marker-alt"></i> ${city}</span>`).join('');
            }
            if (artist.genre && artist.genre !== 'недостигаат податоци') {
                const genres = artist.genre.split(',').map(g => g.trim()).slice(0, 2);
                metaHtml += genres.map(genre => `<span class="artist-genre"><i class="fas fa-music"></i> ${genre}</span>`).join('');
            }
            
            // Build sounds like section
            let soundsLikeHtml = '';
            if (artist.soundsLike && artist.soundsLike !== 'недостигаат податоци') {
                soundsLikeHtml = `<p class="artist-sounds-like"><strong>Звучи како:</strong> ${artist.soundsLike}</p>`;
            }
            
            // Build labels
            let labelsHtml = '';
            if (artist.label && artist.label !== 'недостигаат податоци') {
                const labels = String(artist.label).split(',').map(l => l.trim()).filter(Boolean);
                if (labels.length > 0) {
                    labelsHtml = `<div class="artist-labels">${labels.map(l => `<span class="artist-label">${l}</span>`).join('')}</div>`;
                }
            }
            
            // Build streaming links
            const streamingLinks = [];
            const mediaLinks = [];
            
            if (artist.links && typeof artist.links === 'object') {
                Object.entries(artist.links).forEach(([platform, urlOrUrls]) => {
                    if (platform === 'none' || !urlOrUrls || urlOrUrls === 'недостигаат податоци') return;
                    
                    const urls = Array.isArray(urlOrUrls) ? urlOrUrls : [urlOrUrls];
                    
                    urls.forEach((url, idx) => {
                        if (mediaPlatforms[platform]) {
                            const config = mediaPlatforms[platform];
                            const label = urls.length > 1 ? `${config.name} ${idx + 1}` : config.name;
                            mediaLinks.push({
                                platform,
                                url,
                                name: label,
                                icon: config.icon,
                                priority: config.priority
                            });
                        } else if (platformConfig[platform]) {
                            const config = platformConfig[platform];
                            streamingLinks.push({
                                platform,
                                url,
                                name: config.name,
                                icon: config.icon,
                                priority: config.priority
                            });
                        } else {
                            // Unknown platform, add to streaming
                            streamingLinks.push({
                                platform: 'generic',
                                url,
                                name: platform.charAt(0).toUpperCase() + platform.slice(1),
                                icon: 'fas fa-link',
                                priority: 100
                            });
                        }
                    });
                });
            }
            
            // Add contact email if available
            if (artist.contact && artist.contact !== 'недостигаат податоци') {
                streamingLinks.push({
                    platform: 'email',
                    url: `mailto:${artist.contact}`,
                    name: 'Контакт е-пошта',
                    icon: 'fas fa-envelope',
                    priority: 50
                });
            }
            
            // Sort links by priority
            streamingLinks.sort((a, b) => a.priority - b.priority);
            mediaLinks.sort((a, b) => a.priority - b.priority);
            
            // Build links HTML
            let linksHtml = '';
            
            if (streamingLinks.length > 0) {
                linksHtml += streamingLinks.map(link => `
                    <a href="${link.url}" target="_blank" rel="noopener" class="artist-link ${link.platform}">
                        <i class="${link.icon}"></i>
                        <span class="artist-link-text">${link.name}</span>
                        <i class="fas fa-chevron-right artist-link-arrow"></i>
                    </a>
                `).join('');
            }
            
            if (mediaLinks.length > 0) {
                linksHtml += `<h3 class="link-section-title">Медиуми</h3>`;
                linksHtml += mediaLinks.map(link => `
                    <a href="${link.url}" target="_blank" rel="noopener" class="artist-link ${link.platform}">
                        <i class="${link.icon}"></i>
                        <span class="artist-link-text">${link.name}</span>
                        <i class="fas fa-chevron-right artist-link-arrow"></i>
                    </a>
                `).join('');
            }
            
            if (streamingLinks.length === 0 && mediaLinks.length === 0) {
                linksHtml = `<p style="text-align: center; color: var(--text-muted); padding: 1rem;">Нема достапни линкови</p>`;
            }
            
            // Build edit URL
            const artistSlug = generateSlug(artist.name);
            const editUrl = `list.html?edit=${encodeURIComponent(artistSlug)}`;
            
            // Render content (chart history will be added after loading)
            contentEl.innerHTML = `

        // Load and process chart history for an artist
        async function loadChartHistory(artistName) {
            const chartFiles = [
                'chart-history/chart-2026-W03.json',
                'chart-history/chart-2026-W04.json',
                'chart-history/chart-2026-W05.json',
                'chart-history/chart-2026-W06.json'
            ];
            
            const artistHistory = {
                releases: new Map(), // releaseId -> release data with chart history
                weeklyPopularity: new Map(), // weekId -> cumulative popularity
                totalWeeksOnChart: 0,
                peakPopularity: 0,
                followers: 0
            };
            
            const artistNameLower = artistName.toLowerCase();
            
            for (const chartFile of chartFiles) {
                try {
                    const response = await fetch(chartFile);
                    if (!response.ok) continue;
                    
                    const chartData = await response.json();
                    const weekMatch = chartFile.match(/chart-(\d{4}-W\d{2})\.json/);
                    const weekId = weekMatch ? weekMatch[1] : chartFile;
                    
                    // Parse generatedAt for display
                    const generatedAt = chartData.generatedAt ? new Date(chartData.generatedAt) : null;
                    
                    const releases = chartData.releases || [];
                    
                    // Calculate cumulative popularity for this week
                    let weekCumulativePopularity = 0;
                    const newReleasesThisWeek = [];
                    
                    // Parse week ID to get start/end dates (ISO week: Monday-Sunday)
                    // e.g., 2026-W06 = week 6 of 2026
                    function getWeekDateRange(weekId) {
                        const match = weekId.match(/(\d{4})-W(\d{2})/);
                        if (!match) return null;
                        const year = parseInt(match[1]);
                        const week = parseInt(match[2]);
                        
                        // Simple approach: use a known reference point
                        // 2026-01-05 is Monday of W02 in 2026
                        // So W01 starts 2025-12-29, W02 starts 2026-01-05, etc.
                        const w02Start = new Date(2026, 0, 5); // Jan 5, 2026 (Monday of W02)
                        const weekStart = new Date(w02Start);
                        weekStart.setDate(w02Start.getDate() + (week - 2) * 7);
                        
                        // End of week (Sunday)
                        const weekEnd = new Date(weekStart);
                        weekEnd.setDate(weekStart.getDate() + 6);
                        
                        return { start: weekStart, end: weekEnd };
                    }
                    
                    const weekRange = getWeekDateRange(weekId);
                    
                    // Find all releases for this artist
                    releases.forEach((release, index) => {
                        if (release.bandName && release.bandName.toLowerCase() === artistNameLower) {
                            const releaseId = release.releaseId;
                            
                            // Add to cumulative popularity for this week
                            weekCumulativePopularity += (release.popularity || 0);
                            
                            // Check if this release was published within this chart week
                            let isNewThisWeek = false;
                            if (weekRange && release.releaseDate) {
                                // Parse release date as local date (YYYY-MM-DD format)
                                const parts = release.releaseDate.split('-');
                                const releaseDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                                
                                // Compare dates (ignoring time)
                                const releaseDateOnly = new Date(releaseDate.getFullYear(), releaseDate.getMonth(), releaseDate.getDate());
                                const weekStartOnly = new Date(weekRange.start.getFullYear(), weekRange.start.getMonth(), weekRange.start.getDate());
                                const weekEndOnly = new Date(weekRange.end.getFullYear(), weekRange.end.getMonth(), weekRange.end.getDate());
                                
                                isNewThisWeek = releaseDateOnly >= weekStartOnly && releaseDateOnly <= weekEndOnly;
                            }
                            
                            // Update artist followers (use most recent)
                            if (release.followers) {
                                artistHistory.followers = release.followers;
                            }
                            
                            if (!artistHistory.releases.has(releaseId)) {
                                artistHistory.releases.set(releaseId, {
                                    ...release,
                                    chartWeeks: [],
                                    firstSeenWeek: weekId
                                });
                            }
                            
                            // Track new releases for this specific week
                            if (isNewThisWeek) {
                                newReleasesThisWeek.push(release.releaseTitle);
                            }
                            
                            const releaseData = artistHistory.releases.get(releaseId);
                            
                            releaseData.chartWeeks.push({
                                week: weekId,
                                popularity: release.popularity || 0,
                                date: generatedAt
                            });
                            
                            if ((release.popularity || 0) > artistHistory.peakPopularity) {
                                artistHistory.peakPopularity = release.popularity || 0;
                            }
                        }
                    });
                    
                    // Store cumulative popularity for this week
                    if (weekCumulativePopularity > 0) {
                        artistHistory.weeklyPopularity.set(weekId, {
                            week: weekId,
                            popularity: weekCumulativePopularity,
                            date: generatedAt,
                            newReleases: newReleasesThisWeek
                        });
                    }
                } catch (e) {
                    console.warn(`Could not load ${chartFile}:`, e);
                }
            }
            
            // Calculate total weeks on chart
            artistHistory.releases.forEach(release => {
                artistHistory.totalWeeksOnChart += release.chartWeeks.length;
            });
            
            return artistHistory;
        }
        
        // Render popularity graph
        function renderPopularityGraph(artistHistory) {
            const container = document.getElementById('popularity-graph-container');
            if (!container) return;
            
            // Convert weekly popularity to sorted array
            const weeklyData = Array.from(artistHistory.weeklyPopularity.values())
                .sort((a, b) => a.week.localeCompare(b.week));
            
            if (weeklyData.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            const maxPopularity = Math.max(...weeklyData.map(d => d.popularity));
            const minPopularity = Math.min(...weeklyData.map(d => d.popularity));
            const avgPopularity = Math.round(weeklyData.reduce((sum, d) => sum + d.popularity, 0) / weeklyData.length);
            
            // Generate SVG path
            const width = 340;
            const height = 100;
            const padding = 10;
            const leftPadding = 35; // Extra space for Y-axis labels
            const graphWidth = width - leftPadding - padding;
            const graphHeight = height - padding * 2;
            
            const points = weeklyData.map((d, i) => {
                const x = leftPadding + (i / (weeklyData.length - 1 || 1)) * graphWidth;
                const normalizedY = maxPopularity === minPopularity ? 0.5 : 
                    (d.popularity - minPopularity) / (maxPopularity - minPopularity);
                const y = height - padding - (normalizedY * graphHeight);
                return { x, y, popularity: d.popularity, week: d.week, newReleases: d.newReleases || [] };
            });
            
            // Create smooth path
            let pathD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                pathD += ` L ${points[i].x} ${points[i].y}`;
            }
            
            // Create area fill path
            let areaD = pathD + ` L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z`;
            
            // Week labels
            const firstWeek = weeklyData[0].week.replace('2026-', '');
            const lastWeek = weeklyData[weeklyData.length - 1].week.replace('2026-', '');
            
            // Create dots for each data point - highlight new releases with green
            const dotsHtml = points.map(p => {
                if (p.newReleases.length > 0) {

                    return `

                        <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" fill="#22c55e" font-size="7" font-weight="bold">НОВО</text>
                    `;
                }
                return `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent-orange)" stroke="var(--bg-primary)" stroke-width="2"/>`;
            }).join('');
            
            // Y-axis labels (min and max)
            const yAxisLabels = `
                <text x="${leftPadding - 5}" y="${padding + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-weight="600">${maxPopularity}</text>
                <text x="${leftPadding - 5}" y="${height - padding + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-weight="600">${minPopularity}</text>
                <line x1="${leftPadding - 2}" y1="${padding}" x2="${leftPadding + 3}" y2="${padding}" stroke="var(--text-muted)" stroke-width="1"/>
                <line x1="${leftPadding - 2}" y1="${height - padding}" x2="${leftPadding + 3}" y2="${height - padding}" stroke="var(--text-muted)" stroke-width="1"/>
            `;
            
            // Find new releases to show below graph
            const allNewReleases = weeklyData
                .filter(d => d.newReleases && d.newReleases.length > 0)
                .map(d => ({ week: d.week.replace('2026-', ''), titles: d.newReleases }));
            
            const newReleasesHtml = allNewReleases.length > 0 
                ? `<div class="graph-new-releases">
                    ${allNewReleases.map(r => 
                        `<span class="new-release-tag"><i class="fas fa-plus-circle"></i> ${r.titles.join(', ')} <small>(${r.week})</small></span>`
                    ).join('')}
                   </div>`
                : '';
            
            container.innerHTML = `
                <div class="popularity-graph-section">
                    <h3 class="section-title">
                        <i class="fas fa-chart-area"></i>
                        Кумулативна Популарност
                    </h3>
                    <div class="popularity-graph-container">
                        <svg class="popularity-graph" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
                            <defs>
                                <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:var(--accent-orange);stop-opacity:0.3" />
                                    <stop offset="100%" style="stop-color:var(--accent-orange);stop-opacity:0.05" />
                                </linearGradient>
                            </defs>
                            ${yAxisLabels}
                            <path d="${areaD}" fill="url(#areaGradient)" />
                            <path d="${pathD}" fill="none" stroke="var(--accent-orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            ${dotsHtml}

                        <div class="graph-labels">
                            <span style="margin-left: 25px;">${firstWeek}</span>
                            <span>${lastWeek}</span>
                        </div>
                        ${newReleasesHtml}

        }

        // Songlink API cache and resolver - gets correct track URLs for all platforms
        const songlinkCache = {};
        const songlinkPlatformMap = {
            spotify: 'spotify',
            appleMusic: 'itunes',
            youtubeMusic: 'youtube_music',
            youtube: 'youtube',
            amazonMusic: 'amazon_music',

        async function fetchSonglinkData(spotifyId, type) {
            const spotifyUrl = `https://open.spotify.com/${type}/${spotifyId}`;
            if (songlinkCache[spotifyUrl]) return songlinkCache[spotifyUrl];
            
            try {
                const response = await fetch(`https://api.song.link/v1-alpha.1/links?url=${encodeURIComponent(spotifyUrl)}`);
                if (!response.ok) return null;
                const data = await response.json();
                
                const trackLinks = {};
                if (data.linksByPlatform) {
                    for (const [platform, linkData] of Object.entries(data.linksByPlatform)) {
                        const ourKey = songlinkPlatformMap[platform];
                        if (ourKey && linkData.url) {
                            trackLinks[ourKey] = linkData.url;
                        }
                    }
                }
                
                songlinkCache[spotifyUrl] = trackLinks;
                return trackLinks;
            } catch (err) {
                console.warn('Songlink API error:', err);
                return null;
            }
        }

        // Helper function to check if a URL can be embedded
        function canEmbed(serviceId, url) {
            if (!url) return false;
            switch (serviceId) {
                case 'youtube':
                    return /(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/.test(url);
                case 'soundcloud':
                    return /soundcloud\.com\/[^\/]+\/[^\/]+/.test(url); // Must be a track, not just artist
                case 'apple':
                case 'itunes':
                    return /music\.apple\.com\/[a-z]{2}\/(?:album|playlist)\//.test(url);
                case 'deezer':
                    return /deezer\.com\/(?:[a-z]{2}\/)?(track|album|artist)\/\d+/.test(url);
                case 'tidal':
                    return /tidal\.com\/(?:browse\/)?(album|track|video)\/\d+/.test(url);
                case 'bandcamp':
                    return /bandcamp\.com\/(track|album)\//.test(url);
                default:
                    return false;
            }
        }

            const tabsContainer = player.querySelector('.music-player-tabs');

            const effectiveLinks = { ...artistLinks };
            if (trackLinks) {
                Object.entries(trackLinks).forEach(([key, url]) => {
                    if (url) effectiveLinks[key] = url;
                });
            }
            
            // Build available services - separate embeddable from external
            const embeddableServices = [];
            const externalServices = [];
            
            // Spotify is always embeddable if we have spotifyId (with correct song)
            if (currentTrackData.spotifyId) {
                embeddableServices.push({ id: 'spotify', ...serviceDefinitions.spotify, url: null, hasEmbed: true, hasCorrectSong: true });
            }
            
            // Add services - only track-specific URLs can be embedded, artist profile URLs are always external
            Object.entries(effectiveLinks).forEach(([key, url]) => {
                if (key !== 'spotify' && serviceDefinitions[key]) {
                    const hasTrackUrl = trackLinks && trackLinks[key];
                    const service = { id: key, ...serviceDefinitions[key], url, hasCorrectSong: !!hasTrackUrl };
                    if (hasTrackUrl && canEmbed(key, url)) {
                        embeddableServices.push(service);
                    } else {
                        externalServices.push(service);
                    }
                }
            });
            
            if (embeddableServices.length === 0 && externalServices.length === 0) {
                tabsContainer.innerHTML = '';
                return;
            }
            
            // Build HTML with separator between embeddable and external
            let html = '';
            
            // Embeddable services
            if (embeddableServices.length > 0) {
                html += embeddableServices.map(service => `
                    <button class="music-player-tab embeddable" 
                            data-service="${service.id}" 
                            data-url="${service.url || ''}"
                            data-has-embed="true"
                            title="${service.name} (плеер)">
                        <i class="${service.icon}"></i>
                    </button>
                `).join('');
            }
            
            // Separator and external services (non-embeddable links)
            if (externalServices.length > 0) {
                if (embeddableServices.length > 0) {
                    html += '<span class="music-player-separator"></span>';
                }
                html += externalServices.map(service => `
                    <a class="music-player-tab external" 
                       href="${service.url}"
                       target="_blank"
                       rel="noopener noreferrer"
                       data-service="${service.id}" 
                       title="${service.name} (профил)">
                        <i class="${service.icon}"></i>
                        <i class="fas fa-external-link-alt external-icon"></i>
                    </a>
                `).join('');
            }
            
            tabsContainer.innerHTML = html;
            
            // Add click handlers only for embeddable tabs
            tabsContainer.querySelectorAll('.music-player-tab.embeddable').forEach(tab => {
                tab.addEventListener('click', () => {
                    const serviceId = tab.dataset.service;
                    activateService(serviceId);
                });
            });
        }
        
        function activateService(serviceId) {
            const player = document.getElementById('music-player');
            if (!player || !currentTrackData) return;
            
            // Clean up previous Spotify embed controller
            if (spotifyEmbedController) {
                spotifyEmbedController.destroy();
                spotifyEmbedController = null;
            }
            
            const tabsContainer = player.querySelector('.music-player-tabs');
            const embedContainer = player.querySelector('.music-player-embed');
            const { spotifyId, type, artistLinks, trackLinks } = currentTrackData;
            const url = (trackLinks && trackLinks[serviceId]) || artistLinks[serviceId];
            
            // Update active tab
            tabsContainer.querySelectorAll('.music-player-tab').forEach(t => t.classList.remove('active'));
            const activeTab = tabsContainer.querySelector(`[data-service="${serviceId}"]`);
            if (activeTab) activeTab.classList.add('active');
            
            // Use Spotify IFrame API for autoplay
            if (serviceId === 'spotify' && spotifyId && spotifyIframeAPI) {
                const target = document.createElement('div');
                embedContainer.innerHTML = '';
                embedContainer.appendChild(target);
                embedContainer.classList.add('expanded');
                spotifyIframeAPI.createController(target, {
                    uri: `spotify:${type}:${spotifyId}`,
                    autoplay: true
                }, (controller) => {
                    spotifyEmbedController = controller;
                });
                return;
            }
            
            // Generate embed HTML based on service
            let embedHtml = '';
            
            if (serviceId === 'spotify' && spotifyId) {
                // Fallback when IFrame API not loaded yet
                embedHtml = `<iframe class="spotify-embed" src="https://open.spotify.com/embed/${type}/${spotifyId}?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
            } else if (serviceId === 'youtube' && url) {
                const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                if (ytMatch) {
                    embedHtml = `<iframe class="youtube-embed" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                }
            } else if (serviceId === 'soundcloud' && url) {
                const encodedUrl = encodeURIComponent(url);
                embedHtml = `<iframe class="soundcloud-embed" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=${encodedUrl}&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false" allow="autoplay" loading="lazy"></iframe>`;
            } else if ((serviceId === 'apple' || serviceId === 'itunes') && url) {
                const appleMatch = url.match(/music\.apple\.com\/([a-z]{2})\/(?:album|playlist)\/[^\/]+\/([0-9]+)/);
                if (appleMatch) {
                    const country = appleMatch[1];
                    const albumId = appleMatch[2];
                    embedHtml = `<iframe class="apple-embed" src="https://embed.music.apple.com/${country}/album/${albumId}?theme=dark" allow="autoplay *; encrypted-media *; fullscreen *" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" loading="lazy"></iframe>`;
                }
            } else if (serviceId === 'deezer' && url) {
                const deezerMatch = url.match(/deezer\.com\/(?:[a-z]{2}\/)?(track|album|artist)\/(\d+)/);
                if (deezerMatch) {
                    const deezerType = deezerMatch[1];
                    const deezerId = deezerMatch[2];
                    embedHtml = `<iframe class="deezer-embed" scrolling="no" frameborder="0" src="https://widget.deezer.com/widget/dark/${deezerType}/${deezerId}" allow="encrypted-media; clipboard-write" loading="lazy"></iframe>`;
                }
            } else if (serviceId === 'tidal' && url) {
                const tidalMatch = url.match(/tidal\.com\/(?:browse\/)?(album|track|video)\/(\d+)/);
                if (tidalMatch) {
                    const tidalType = tidalMatch[1];
                    const tidalId = tidalMatch[2];
                    embedHtml = `<iframe class="tidal-embed" src="https://embed.tidal.com/${tidalType}s/${tidalId}?layout=gridify" allow="encrypted-media" loading="lazy"></iframe>`;
                }
            } else if (serviceId === 'bandcamp' && url) {
                // Bandcamp requires fetching the page to get embed code, use oEmbed
                embedHtml = `<iframe class="bandcamp-embed" src="https://bandcamp.com/EmbeddedPlayer/size=large/bgcol=333333/linkcol=e99708/tracklist=false/artwork=small/transparent=true/" seamless loading="lazy"><a href="${url}">Open on Bandcamp</a></iframe>`;
            }
            
            // Update embed
            if (embedHtml) {
                embedContainer.innerHTML = embedHtml;
                embedContainer.classList.add('expanded');
            } else {
                embedContainer.innerHTML = `<div class="music-player-no-embed">Нема достапен плеер за оваа услуга</div>`;
                embedContainer.classList.add('expanded');
            }
        }
        
        function closeMusicPlayer() {
            const player = document.getElementById('music-player');
            
            // Clean up Spotify embed controller
            if (spotifyEmbedController) {
                spotifyEmbedController.destroy();
                spotifyEmbedController = null;
            }
            
            if (player) {
                player.classList.remove('active');
                // Stop playback by clearing embed
                const embedContainer = player.querySelector('.music-player-embed');
                if (embedContainer) {
                    embedContainer.innerHTML = '';
                    embedContainer.classList.remove('expanded');
                }
                currentTrackData = null;
            }
        }
        
        // Wrapper function called from release play buttons
        function openMusicPlayer(release) {
            // Extract Spotify ID from release URL
            let spotifyId = null;
            let type = 'album';
            if (release.releaseUrl && release.releaseUrl.includes('spotify.com')) {
                const albumMatch = release.releaseUrl.match(/spotify\.com\/album\/([a-zA-Z0-9]+)/);
                const trackMatch = release.releaseUrl.match(/spotify\.com\/track\/([a-zA-Z0-9]+)/);
                if (albumMatch) {
                    spotifyId = albumMatch[1];
                    type = 'album';
                } else if (trackMatch) {
                    spotifyId = trackMatch[1];
                    type = 'track';
                }
            }
            
            showMusicPlayer(spotifyId, type, release.releaseTitle, release.bandName, release.thumbnail);
        }
        
        // Render error state
        function renderError() {
            document.getElementById('artist-content').innerHTML = `
                <div class="artist-error">
                    <i class="fas fa-question-circle"></i>
                    <h2>Артистот не е пронајден</h2>
                    <p>Не можевме да го пронајдеме бараниот артист.</p>
                    <a href="list.html">
                        <i class="fas fa-list"></i>
                        Прегледај ја листата
                    </a>
                </div>
            `;
        }
        
        // Main initialization
        // ==================== RSS FEED LOADING & MATCHING ====================
        const RSS_PROXY = 'https://muzichka-master-lista.deeeeelay.workers.dev/rss-proxy';
        
        async function loadRssFeeds() {
            try {
                const feedsResp = await fetch('rss-feeds.json');
                const feeds = await feedsResp.json();
                const allArticles = [];
                
                const feedPromises = feeds.map(async (feed) => {
                    try {
                        const proxyUrl = `${RSS_PROXY}?url=${encodeURIComponent(feed.feedUrl)}`;
                        const resp = await fetch(proxyUrl);
                        if (!resp.ok) throw new Error(`Proxy returned ${resp.status}`);
                        const text = await resp.text();
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(text, 'text/xml');
                        const items = xml.querySelectorAll('item');
                        
                        items.forEach(item => {
                            const title = item.querySelector('title')?.textContent || '';
                            const link = item.querySelector('link')?.textContent || '';
                            const description = item.querySelector('description')?.textContent || '';
                            const content = item.querySelector('content\\:encoded, encoded')?.textContent || '';
                            const pubDateStr = item.querySelector('pubDate')?.textContent || '';
                            const pubDate = pubDateStr ? new Date(pubDateStr) : new Date(0);
                            
                            allArticles.push({
                                title,
                                link,
                                description: description.replace(/<[^>]*>/g, '').trim(),
                                content: content.replace(/<[^>]*>/g, '').trim(),
                                pubDate,
                                source: feed.name,
                                sourceIcon: feed.iconUrl,
                                siteUrl: feed.siteUrl
                            });
                        });
                    } catch (err) {
                        console.warn(`Failed to fetch RSS feed ${feed.name}:`, err);
                    }
                });
                
                await Promise.all(feedPromises);
                allArticles.sort((a, b) => b.pubDate - a.pubDate);
                return allArticles;
            } catch (err) {
                console.warn('Failed to load RSS feeds:', err);
                return [];
            }
        }
        
        function findMatchingArticles(articles, bandName) {
            if (!articles || articles.length === 0 || !bandName) return [];
            
            // Capitalize helper: first letter uppercase unless starts with digit
            function capitalize(s) {
                if (!s || /^\d/.test(s)) return s;
                return s.charAt(0).toUpperCase() + s.slice(1);
            }
            
            const searchTerms = new Set();
            const name = bandName.trim();
            if (name.length >= 3) searchTerms.add(capitalize(name));
            
            const latinName = transliterate(bandName).trim();
            if (latinName.length >= 3 && latinName !== name) searchTerms.add(capitalize(latinName));
            
            if (searchTerms.size === 0) return [];
            
            // Word boundaries: start/end of string, whitespace, or common punctuation.
            // Case-sensitive matching with exact word boundaries.
            const B = '[\\s,;:.!?\\-\u2013\u2014\\/\\(\\)\\[\\]"\'\\|\u00ab\u00bb\u201e\u201c\\u2018\\u2019\\u201c\\u201d]';
            const termRegexes = [...searchTerms].map(term => {
                const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                return new RegExp('(?:^|' + B + ')' + escaped + '(?:$|' + B + ')');
            });
            
            return articles.filter(article => {
                const searchIn = article.title + ' ' + article.description + ' ' + article.content;
                for (const regex of termRegexes) {
                    if (regex.test(searchIn)) return true;
                }
                return false;
            });
        }
        
        // Start loading RSS feeds early (non-blocking)
        const rssLoadPromise = loadRssFeeds();
        
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let artistParam = urlParams.get('a') || urlParams.get('artist') || urlParams.get('name');
            
            // Check if we came from a clean URL (via 404.html redirect)
            const cleanUrl = sessionStorage.getItem('cleanUrl');
            if (cleanUrl) {
                sessionStorage.removeItem('cleanUrl');
                sessionStorage.removeItem('artistSlug');
            }
            
            if (!artistParam) {
                renderError();
                return;
            }
            
            try {
                // Load bands data
                const response = await fetch('bands.json');
                const data = await response.json();
                const bandsData = data.muzickaMasterLista;
                
                // Find artist
                const artist = findArtist(bandsData, decodeURIComponent(artistParam));
                
                if (!artist) {
                    renderError();
                    return;
                }
                
                // Try to get artist thumbnail and activity status from chart-data.json
                let thumbnail = null;
                let latestReleaseDate = null;
                let latestReleaseThumbnail = null;
                try {
                    const chartResponse = await fetch('chart-data.json');
                    const chartData = await chartResponse.json();
                    const releases = chartData.releases || [];
                    const artistNameLower = artist.name.toLowerCase();
                    
                    let artistImage = null;
                    releases.forEach(r => {
                        if (r.bandName && r.bandName.toLowerCase() === artistNameLower) {
                            if (!artistImage && r.artistImage) artistImage = r.artistImage;
                            if (!thumbnail && r.thumbnail) thumbnail = r.thumbnail;
                            if (r.releaseDate && (!latestReleaseDate || r.releaseDate > latestReleaseDate)) {
                                latestReleaseDate = r.releaseDate;
                                if (r.thumbnail) latestReleaseThumbnail = r.thumbnail;
                            }
                        }
                    });
                    // Prefer artist profile image, fall back to latest release thumbnail
                    if (artistImage) thumbnail = artistImage;
                    else if (latestReleaseThumbnail) thumbnail = latestReleaseThumbnail;
                } catch (e) {
                    console.warn('Could not load chart data:', e);
                }
                
                // Compute activity status from release dates
                artist._activityStatus = computeActivityStatus(latestReleaseDate);
                
                // Render artist page
                renderArtist(artist, thumbnail);
                
                // Store artist links globally for the music player
                window.artistLinks = artist.links || {};
                
                // Apply accent colors only for confirmed artists
                if (artist.confirmed && artist.accentColors && (artist.accentColors[0] || artist.accentColors[1])) {
                    const c1 = artist.accentColors[0] || artist.accentColors[1];
                    const c2 = artist.accentColors[1] || artist.accentColors[0];
                    document.documentElement.style.setProperty('--artist-accent-1', c1);
                    document.documentElement.style.setProperty('--artist-accent-2', c2);
                    // Apply accent color to avatar border
                    const avatar = document.querySelector('.artist-avatar');
                    if (avatar) {
                        avatar.style.borderColor = c1;
                    }
                    // Tint the artist name
                    const nameEl = document.querySelector('.artist-name');
                    if (nameEl) nameEl.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
                    if (nameEl) { nameEl.style.webkitBackgroundClip = 'text'; nameEl.style.webkitTextFillColor = 'transparent'; nameEl.style.backgroundClip = 'text'; }
                    // Add subtle accent to link cards on hover via CSS variable
                    document.querySelectorAll('.artist-link').forEach(link => {
                        link.style.setProperty('--link-accent', c1);
                    });
                }
                
                // Extract and apply colors from the latest release thumbnail
                const colorSourceImage = latestReleaseThumbnail || thumbnail;
                if (colorSourceImage) {
                    try {
                        const colors = await extractColorsFromImage(colorSourceImage);
                        if (colors) {
                            applyDynamicColors(colors);
                        }
                    } catch (e) {
                        console.warn('Could not extract colors from image:', e);
                    }
                }
                
                // Load and render chart history
                try {
                    const chartHistory = await loadChartHistory(artist.name);
                    renderPopularityGraph(chartHistory);
                    renderReleases(chartHistory, artist.links);
                } catch (e) {
                    console.warn('Could not load chart history:', e);
                }
                
                // Load and render RSS media articles
                try {
                    const allArticles = await rssLoadPromise;
                    const matched = findMatchingArticles(allArticles, artist.name);
                    if (matched.length > 0) {
                        const linksContainer = document.querySelector('.artist-links');
                        if (linksContainer) {
                            // Check if Медиуми section already exists
                            let mediaTitle = linksContainer.querySelector('.link-section-title');
                            if (!mediaTitle) {
                                mediaTitle = document.createElement('h3');
                                mediaTitle.className = 'link-section-title';
                                mediaTitle.textContent = 'Медиуми';
                                linksContainer.appendChild(mediaTitle);
                            }
                            
                            matched.forEach(article => {
                                const dateStr = article.pubDate.getTime() > 0 
                                    ? article.pubDate.toLocaleDateString('mk-MK', { day: 'numeric', month: 'short', year: 'numeric' })
                                    : '';
                                const a = document.createElement('a');
                                a.href = article.link;
                                a.target = '_blank';
                                a.rel = 'noopener';
                                a.className = 'artist-link rss-article';
                                a.innerHTML = `
                                    <img src="${article.sourceIcon}" alt="${article.source}" style="width:24px;height:24px;border-radius:3px;flex-shrink:0">
                                    <span class="artist-link-text">${article.title}${dateStr ? `<span style="display:block;font-size:0.7rem;font-weight:400;color:var(--text-muted);margin-top:0.15rem">${article.source} &middot; ${dateStr}</span>` : ''}</span>
                                    <i class="fas fa-chevron-right artist-link-arrow"></i>
                                `;
                                linksContainer.appendChild(a);
                            });
                        }
                    }
                } catch (e) {
                    console.warn('Could not load RSS articles:', e);
                }
                
            } catch (error) {
                console.error('Error loading artist:', error);
                renderError();
            }
        }
        
        init();
    </script>
</body>
