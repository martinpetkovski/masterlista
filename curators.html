    <script>
        // ==================== DARK MODE ====================
        function initDarkMode() {
            const toggle = document.getElementById('dark-mode-toggle');
            if (!toggle) return;
            const savedMode = localStorage.getItem('mmm-dark-mode') || localStorage.getItem('darkMode');
            if (savedMode === 'true') {
                document.body.classList.add('dark-mode');
                toggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
            toggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('mmm-dark-mode', isDark);
                toggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });
        }
        initDarkMode();

        // ==================== NAV MENU ====================
        function initNavMenu() {
            const trigger = document.querySelector('.site-nav-trigger');
            const menu = document.getElementById('site-nav-menu');
            if (!trigger || !menu) return;
            
            trigger.addEventListener('click', (e) => {
                if (window.innerWidth <= 600) {
                    e.preventDefault();
                    e.stopPropagation();
                    menu.classList.toggle('open');
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                    menu.classList.remove('open');
                }
            });
        }
        initNavMenu();

        // ==================== AUTO-DETECT HELPERS ====================

        /** Detect social/link service from URL and return icon class + label */
        function detectLinkInfo(url) {
            const u = url.toLowerCase();
            if (u.includes('instagram.com'))   return { icon: 'fab fa-instagram',    label: 'Instagram' };
            if (u.includes('twitter.com') || u.includes('x.com'))
                                               return { icon: 'fab fa-x-twitter',    label: 'X / Twitter' };
            if (u.includes('facebook.com'))     return { icon: 'fab fa-facebook-f',   label: 'Facebook' };
            if (u.includes('tiktok.com'))       return { icon: 'fab fa-tiktok',       label: 'TikTok' };
            if (u.includes('music.youtube.com'))return { icon: 'fab fa-youtube',      label: 'YouTube Music' };
            if (u.includes('youtube.com') || u.includes('youtu.be'))
                                               return { icon: 'fab fa-youtube',       label: 'YouTube' };
            if (u.includes('open.spotify.com')) return { icon: 'fab fa-spotify',      label: 'Spotify' };
            if (u.includes('bandcamp.com'))     return { icon: 'fab fa-bandcamp',     label: 'Bandcamp' };
            if (u.includes('soundcloud.com'))   return { icon: 'fab fa-soundcloud',   label: 'SoundCloud' };
            if (u.includes('music.apple.com'))  return { icon: 'fab fa-apple',        label: 'Apple Music' };
            if (u.includes('tidal.com'))        return { icon: 'fas fa-water',        label: 'Tidal' };
            if (u.includes('deezer.com'))       return { icon: 'fab fa-deezer',       label: 'Deezer' };
            if (u.includes('discord.gg') || u.includes('discord.com'))
                                               return { icon: 'fab fa-discord',       label: 'Discord' };
            if (u.includes('linkedin.com'))     return { icon: 'fab fa-linkedin-in',  label: 'LinkedIn' };
            if (u.includes('linktr.ee'))        return { icon: 'fas fa-link',         label: 'Linktree' };
            return { icon: 'fas fa-globe', label: 'Линк' };
        }

        /** Build an embed for a playlist URL. Returns HTML string or null. */
        function buildPlaylistEmbed(url) {
            if (!url) return null;
            const u = url.toLowerCase();

            // Spotify: playlist, album, track
            const spotifyMatch = url.match(/open\.spotify\.com\/(playlist|album|track)\/([a-zA-Z0-9]+)/);
            if (spotifyMatch) {
                const [, type, id] = spotifyMatch;
                const h = type === 'track' ? 152 : 500;
                return `<div class="custos-embed"><iframe src="https://open.spotify.com/embed/${type}/${id}?utm_source=generator&theme=0" height="${h}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>`;
            }

            // YouTube Music playlist
            const ytMusicPl = url.match(/music\.youtube\.com\/playlist\?list=([a-zA-Z0-9_-]+)/);
            if (ytMusicPl) {
                return `<div class="custos-embed"><iframe src="https://www.youtube.com/embed/videoseries?list=${ytMusicPl[1]}" height="380" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe></div>`;
            }

            // YouTube playlist
            const ytPl = url.match(/youtube\.com\/playlist\?list=([a-zA-Z0-9_-]+)/);
            if (ytPl) {
                return `<div class="custos-embed"><iframe src="https://www.youtube.com/embed/videoseries?list=${ytPl[1]}" height="380" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe></div>`;
            }

            // YouTube single video
            const ytVideo = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (ytVideo) {
                return `<div class="custos-embed"><iframe src="https://www.youtube.com/embed/${ytVideo[1]}" height="200" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe></div>`;
            }

            // Apple Music (embed via embed.music.apple.com)
            const appleMatch = url.match(/music\.apple\.com\/([a-z]{2})\/(playlist|album)\/[^/]+\/([a-z]{2}\.[a-zA-Z0-9.-]+)/);
            if (appleMatch) {
                const [, country, type, id] = appleMatch;
                return `<div class="custos-embed"><iframe src="https://embed.music.apple.com/${country}/${type}/${id}" height="380" allow="autoplay *; encrypted-media *;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" loading="lazy" style="background: transparent;"></iframe></div>`;
            }

            // SoundCloud
            if (u.includes('soundcloud.com')) {
                const encoded = encodeURIComponent(url);
                return `<div class="custos-embed"><iframe src="https://w.soundcloud.com/player/?url=${encoded}&color=%235b8fb9&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false" height="380" allow="autoplay" loading="lazy"></iframe></div>`;
            }

            // Deezer: playlist, album, track
            const deezerMatch = url.match(/deezer\.com\/(playlist|album|track)\/([a-zA-Z0-9]+)/);
            if (deezerMatch) {
                const [, type, id] = deezerMatch;
                const h = type === 'track' ? 150 : 400;
                const darkTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
                return `<div class="custos-embed"><iframe src="https://widget.deezer.com/widget/${darkTheme}/${type}/${id}" height="${h}" allow="encrypted-media; clipboard-write" loading="lazy"></iframe></div>`;
            }

            // Tidal: playlist, album, track, video
            const tidalMatch = url.match(/tidal\.com\/(?:browse\/)?(playlist|album|track|video)\/([a-zA-Z0-9-]+)/);
            if (tidalMatch) {
                const [, type, id] = tidalMatch;
                const typeMap = { playlist: 'playlists', album: 'albums', track: 'tracks', video: 'videos' };
                const embedType = typeMap[type] || type;
                const h = type === 'track' ? 150 : 400;
                return `<div class="custos-embed"><iframe src="https://embed.tidal.com/${embedType}/${id}" height="${h}" allow="encrypted-media" loading="lazy"></iframe></div>`;
            }

            // No embeddable service detected
            return null;
        }

        /** Build a fallback link for a playlist URL */
        function buildPlaylistLink(url) {
            const info = detectLinkInfo(url);
            const cls = info.label.toLowerCase().replace(/[\s\/]/g, '-');
            return `<a href="${url}" target="_blank" rel="noopener" class="custos-playlist-link">
                <span class="pl-icon ${cls}"><i class="${info.icon}"></i></span>
                <span class="pl-text">${info.label} — Отвори плејлиста</span>
                <span class="pl-arrow"><i class="fas fa-arrow-up-right-from-square"></i></span>
            </a>`;
        }

        // ==================== BAND NAME LOOKUP ====================
        let bandNameSet = new Set(); // lowercase → original name

        async function loadBandNames() {
            try {
                const resp = await fetch('bands.json');
                const data = await resp.json();
                const bands = data.muzickaMasterLista || [];
                bands.forEach(b => {
                    if (b.name) bandNameSet.add(b.name);
                });
            } catch (err) {
                console.warn('Failed to load bands.json for relevance linking:', err);
            }
        }

        function renderRelevance(items) {
            if (!items || items.length === 0) return '';
            const parts = items.map(item => {
                // Strip text in parentheses for band name matching
                const nameOnly = item.replace(/\s*\([^)]*\)/g, '').trim();
                const extra = item.slice(nameOnly.length).trim(); // e.g. "(гитара)"
                // Check if the name part matches a band name (case-insensitive)
                const match = [...bandNameSet].find(n => n.toLowerCase() === nameOnly.toLowerCase());
                if (match) {
                    const href = 'artist.html?name=' + encodeURIComponent(match);
                    return `<a href="${href}">${match}</a>${extra ? ' <span style="opacity:.65">' + extra + '</span>' : ''}`;
                }
                return item;
            });
            return parts.join('<span class="sep">·</span>');
        }

        // ==================== RENDER ====================
        async function loadCurators() {
            const loadingEl   = document.getElementById('curators-loading');
            const gridEl      = document.getElementById('curators-grid');
            const emptyEl     = document.getElementById('curators-empty');
            const noResultsEl = document.getElementById('curators-no-results');

            await loadBandNames();

            try {
                const resp = await fetch('curators.json');
                const data = await resp.json();
                const curators = data.curators || [];

                loadingEl.style.display = 'none';

                if (curators.length === 0) {
                    emptyEl.style.display = 'block';
                    return;
                }

                gridEl.style.display = '';
                gridEl.innerHTML = curators.map(c => renderCard(c)).join('');

                // Tab switching for multi-playlist cards
                initPlaylistTabs(gridEl);

                // Search
                initSearch(curators);
            } catch (err) {
                console.error('Failed to load curators.json:', err);
                loadingEl.style.display = 'none';
                emptyEl.style.display = 'block';
            }
        }

        const WORKER_BASE = 'https://muzichka-master-lista.martinpetkovski.workers.dev';

        /** Get Instagram profile pic URL via Cloudflare Worker proxy */
        function getInstagramPic(links) {
            if (!links) return null;
            for (const url of links) {
                const m = url.match(/instagram\.com\/([a-zA-Z0-9_.]+)/);
                if (m && m[1]) {
                    return `${WORKER_BASE}/ig-pic/${m[1]}`;
                }
            }
            return null;
        }

        function renderCard(c) {
            // Avatar: prefer Instagram profile pic (via worker proxy), then provided image, then fallback icon
            const igPic = getInstagramPic(c.links);
            const fallbackImg = c.image || null;
            const primarySrc = igPic || fallbackImg;

            let avatarInner;
            if (primarySrc) {
                let onerror;
                if (igPic && fallbackImg) {
                    // IG fails → try provided image → fails → icon
                    const escaped = fallbackImg.replace(/'/g, "\\'");
                    onerror = "this.onerror=function(){this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';};this.src='" + escaped + "';";
                } else {
                    onerror = "this.onerror=null;this.parentElement.innerHTML='<i class=&quot;fas fa-user&quot;></i>';";
                }
                avatarInner = `<img src="${primarySrc}" alt="${c.name}" loading="lazy" referrerpolicy="no-referrer" onerror="${onerror}">`;
            } else {
                avatarInner = `<i class="fas fa-user"></i>`;
            }

            // Relevance
            const relevanceHtml = renderRelevance(c.relevance);

            // Social links (auto-detected from URLs)
            const links = c.links || [];
            const socialLinks = links
                .map(url => {
                    const info = detectLinkInfo(url);
                    return `<a href="${url}" target="_blank" rel="noopener" title="${info.label}"><i class="${info.icon}"></i></a>`;
                })
                .join('');

            // Playlists: support array (playlists) or legacy single string (playlist)
            const playlistUrls = c.playlists || (c.playlist ? [c.playlist] : []);
            let playlistHtml = '';
            if (playlistUrls.length === 1) {
                // Single playlist – no tabs needed
                const url = playlistUrls[0];
                const embed = buildPlaylistEmbed(url);
                if (embed) {
                    playlistHtml = `<div class="custos-playlist-body">${embed}${buildPlaylistLink(url)}</div>`;
                } else {
                    playlistHtml = buildPlaylistLink(url);
                }
            } else if (playlistUrls.length > 1) {
                // Multiple playlists – tabbed interface
                const cardId = 'pl-' + Math.random().toString(36).slice(2, 8);
                let tabs = '<div class="custos-playlist-tabs">';
                let panels = '';
                playlistUrls.forEach((url, i) => {
                    const info = detectLinkInfo(url);
                    const cls = info.label.toLowerCase().replace(/[\s\/]/g, '-');
                    const activeClass = i === 0 ? ' active' : '';
                    tabs += `<button class="custos-playlist-tab ${cls}${activeClass}" data-tab-group="${cardId}" data-tab-index="${i}"><i class="${info.icon}"></i> ${info.label}</button>`;
                    const embed = buildPlaylistEmbed(url);
                    const link = buildPlaylistLink(url);
                    panels += `<div class="custos-playlist-panel${activeClass}" data-tab-group="${cardId}" data-panel-index="${i}">${embed || ''}${link}</div>`;
                });
                tabs += '</div>';
                playlistHtml = `<div class="custos-playlist-body">${tabs}${panels}</div>`;
            }

            // searchable data attribute
            const searchText = [c.name, ...(c.relevance || [])].join(' ').toLowerCase();

            return `
                <div class="custos-card" data-search="${searchText.replace(/"/g, '&quot;')}">
                    <div class="custos-header">
                        <div class="custos-avatar">${avatarInner}</div>
                        <div class="custos-info">
                            <div class="custos-name-row">
                                <div class="custos-name">${c.name}</div>
                                ${socialLinks ? `<div class="custos-socials">${socialLinks}</div>` : ''}
                            </div>
                            ${relevanceHtml ? `<div class="custos-relevance">${relevanceHtml}</div>` : ''}
                        </div>
                    </div>
                    ${playlistHtml}
                </div>`;
        }

        // ==================== PLAYLIST TABS ====================
        function initPlaylistTabs(container) {
            container.addEventListener('click', (e) => {
                const tab = e.target.closest('.custos-playlist-tab');
                if (!tab) return;
                const group = tab.dataset.tabGroup;
                const index = tab.dataset.tabIndex;

                // Deactivate all tabs & panels in this group
                container.querySelectorAll(`.custos-playlist-tab[data-tab-group="${group}"]`).forEach(t => t.classList.remove('active'));
                container.querySelectorAll(`.custos-playlist-panel[data-tab-group="${group}"]`).forEach(p => p.classList.remove('active'));

                // Activate selected
                tab.classList.add('active');
                const panel = container.querySelector(`.custos-playlist-panel[data-tab-group="${group}"][data-panel-index="${index}"]`);
                if (panel) panel.classList.add('active');
            });
        }

        // ==================== SEARCH ====================
        function initSearch() {
            const searchInput = document.getElementById('curators-search');
            const gridEl      = document.getElementById('curators-grid');
            const noResultsEl = document.getElementById('curators-no-results');
            if (!searchInput) return;

            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim().toLowerCase();
                const cards = gridEl.querySelectorAll('.custos-card');
                let visible = 0;

                cards.forEach(card => {
                    const text = card.getAttribute('data-search') || '';
                    const match = !q || text.includes(q);
                    card.classList.toggle('hidden', !match);
                    if (match) visible++;
                });

                noResultsEl.style.display = (visible === 0 && q) ? 'block' : 'none';
            });
        }

        // ==================== INIT ====================
        loadCurators();
    </script>
</body>
</html>
